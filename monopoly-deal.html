<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Monopoly Deal 双人对战</title>
<style>
/* ── 设计令牌：现代豪华赌场配色。整个界面只用 3 个重点色（酒红、香槟金、祖母绿）+ 2 个辅助色（曜石黑、象牙白）；
 *    其它颜色一律是这五种的深浅、透明度，或重点色和辅助色的混合（淡底、灰字）。
 *    不受限的只有游戏数据本身：地产 10 种组色（--c / COLOR）和卡牌、表情图片 ── */
:root {
  color-scheme: light;
  /* 辅助 1 · 曜石黑：文字、描边、阴影。灰色都是它和纯白混出来的 */
  --onyx: #17140f;
  --onyx-rgb: 23 20 15;                          /* 半透明用：rgb(var(--onyx-rgb) / .08) */
  /* 辅助 2 · 纯白：底色、面板、按钮上的字（变量名沿用 ivory） */
  --ivory: #ffffff;
  --ivory-rgb: 255 255 255;
  --paper: var(--ivory);
  --mist: #f6f6f6;                               /* 纯白 96% + 曜石黑 4% */
  --mist-2: #e8e8e7;                             /* 纯白 90% + 曜石黑 10% */
  --ink: var(--onyx);
  --ink-2: #6f6d6a;                              /* 曜石黑 62% + 纯白 38%（小字在浅底上也够 4.5:1） */
  --ink-3: #aeadab;                              /* 曜石黑 35% + 纯白 65% */
  --hair: rgb(var(--onyx-rgb) / .08);
  --line: #f3f3f3;                               /* 仅保留的几条分割线：接近背景色，几乎看不出来 */
  /* 重点 1 · 勃艮第酒红：主按钮、对方、警示 */
  --wine: #7d1431;
  --wine-hi: #a51d43;
  --wine-down: #5e0d24;
  --wine-rgb: 125 20 49;
  --wine-hi-rgb: 165 29 67;
  /* 重点 2 · 香槟金：钱、押注 / 倍率、出牌次数、高亮 */
  --gold: #c49a3a;
  --gold-hi: #ecd28e;
  --gold-deep: #8a6a22;
  --gold-rgb: 196 154 58;
  --gold-hi-rgb: 236 210 142;
  /* 重点 3 · 祖母绿（赌桌绒面）：成功 / 好结果、确认、牌桌的点缀 */
  --emerald: #0f5c46;
  --emerald-hi: #1e7d60;
  --emerald-down: #0a3f30;
  --emerald-rgb: 15 92 70;
  --emerald-hi-rgb: 30 125 96;
  --wine-grad: linear-gradient(135deg, #a51d43, #7d1431 58%, #5e0d24);
  --gold-grad: linear-gradient(135deg, #e3c477, #c49a3a 55%, #8a6a22);
  --emerald-grad: linear-gradient(135deg, #1e7d60, #0f5c46 58%, #0a3f30);
  --gold-face: linear-gradient(135deg, #ecd28e, #d8b867 45%, #c49a3a); /* 金底上要写字时用的浅香槟金：配曜石黑字（7:1 以上）。深的 --gold-grad 只做进度条、圆点这类不写字的填色 */
  --on-gold: 0 1px 0 rgb(var(--gold-hi-rgb) / .5); /* 金底黑字：一道浅金高光，字像压印上去的 */
  --accent: var(--wine);
  --accent-down: var(--wine-down);
  --red: var(--wine-hi);
  --green: var(--emerald);
  --out: cubic-bezier(.23, 1, .32, 1);          /* 进场与按压反馈：强 ease-out */
  --move: cubic-bezier(.645, .045, .355, 1);    /* 屏幕内移动：ease-in-out */
  --sheet-ease: cubic-bezier(.32, .72, 0, 1);   /* iOS 底部面板 */
  --spring: cubic-bezier(.34, 1.56, .64, 1);    /* 带一点回弹：弹出、勾选。支持 linear() 的浏览器启动时换成真正的阻尼弹簧曲线（见 spring()） */
  --sheet-spring: var(--sheet-ease);            /* 面板打开：同上，换成阻尼 0.86 的弹簧 */
  --ease-move: cubic-bezier(.65, 0, .25, 1);    /* 屏幕上飞来飞去：强 ease-in-out，起步干脆、落点柔和 */
  --ratio: .6437;
  --tw: clamp(46px, min(13.4vw, 8.8svh), 76px);   /* 桌面卡宽（不支持容器查询时的兜底）：手机按屏宽、矮屏按高度收缩。
                                                    高度一律用 svh（最小视口）：Safari 地址栏伸缩时 dvh 会变，所有卡跟着变大变小，画面会抖 */
  --twmax: min(14.6vw, 80px);                     /* 桌面卡宽上限：按所在分块的高度自动缩放，但不超过这个 */
  --hw: clamp(56px, min(20.5vw, 10.5svh), 100px);  /* 手牌卡宽 */
  --mh: clamp(60px, 9svh, 88px);                  /* 中间一排（中央指示器、两边的银行 / 张数 / 颜色格）的高度 */
  --oppx: calc(clamp(60px, 10svh, 112px) + 10px);
  --oup: 0px;                                      /* 对方地产区整体往上挪多少（上沿藏到顶栏下面），挪出来的高度给中间一排。由 oppLift 按屏幕算 */ /* 对方地产区比自己的高出多少（原来牌堆、弃牌区那一排腾出来的地方） */
  --card-shadow: 0 1px 2px rgb(var(--onyx-rgb) / .06), 0 4px 12px rgb(var(--onyx-rgb) / .07); /* 无描边：只靠柔和投影和底色区分 */
  /* 安全区（Apple HIG · Layout / Designing for iPhone Duo）：能点的、要看清的东西都放在安全区里，背景和装饰可以铺到屏幕边。
   * 四边各自不一样，要分开处理：iPhone Duo 合起来的外屏，状态栏、灵动岛竖着排在右边（右边一整条），刘海机横屏在左右，Home 条在下面 */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-w: calc(100vw - var(--safe-l) - var(--safe-r));             /* 安全区的宽 */
  --safe-mid: calc(50vw + (var(--safe-l) - var(--safe-r)) / 2);       /* 安全区正中的横坐标：居中的浮层、印章按它摆，不按屏幕正中 */
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--paper); }
html { overscroll-behavior: none; } /* 根滚动层上才生效：iOS Safari 不再下拉刷新、不再整页回弹（对局中下拉会把页面刷掉） */
body {
  color: var(--ink); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overscroll-behavior: none; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
input { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; }
:focus-visible { outline: 2px solid rgb(var(--onyx-rgb) / .7); outline-offset: 3px; }
/* 触屏：按钮和卡牌禁用双击缩放（touch-action 不继承，滚动区里的元素要单独声明），点按立刻响应 */
button, a, input, .card { touch-action: manipulation; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── 按钮：按下缩一点，松手回弹（只动 transform） ── */
.btn {
  height: 52px; padding: 0 24px; border-radius: 999px;
  font-size: 17px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 160ms var(--out), background-color 160ms var(--out), opacity 160ms var(--out);
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--ivory); }
.btn.primary:active { background: var(--accent-down); }
.btn.red { background: var(--wine-grad); color: var(--ivory); } /* 认输、吸血这类重的选择：同一个酒红色系（不再和主按钮两种红挨着） */
.btn.plain { background: var(--mist); color: var(--ink); }
.btn.plain:active { background: var(--mist-2); }
.btn.alert { background: var(--wine-grad); color: var(--ivory); }
.btn.block { width: 100%; }
.btn[disabled], .btn.wait { opacity: .4; pointer-events: none; }
.link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--gold); font-size: 16px; padding: 12px 14px; border-radius: 12px; }
.link:active { opacity: .5; }
.round {
  flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  background: var(--mist); color: var(--ink); transition: transform 160ms var(--out), background-color 160ms var(--out);
}
.round:active { transform: scale(.92); background: var(--mist-2); }
.round svg { width: 22px; height: 22px; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .3; } }

/* ── 首页 / 加入 / 等待 ── */
.page {
  max-width: 440px; margin: 0 auto; min-height: 100vh; min-height: 100svh;
  padding: calc(var(--safe-t) + 40px) max(20px, calc(var(--safe-r) + 12px)) calc(var(--safe-b) + 28px) max(20px, calc(var(--safe-l) + 12px));
  display: flex; flex-direction: column; gap: 18px;
}
/* 换页：各块依次上浮进场。--enter-t 是"进场已经过了多久"（负数），同一页里重绘时动画接着播，不会从头再来。
 * 用 backwards 不用 both：终点就是本来的样子，播完不留填充——一直挂着的动画会让每一块各自成一层，
 * 中间一排的提示、名字被后画的自己地产区盖住（层级在 .midrow / .handbox 上定死） */
.enter > * { animation: rise 380ms var(--out) backwards; animation-delay: calc(var(--enter-t, 0ms) + var(--k, 0) * 40ms); }
.enter > :nth-child(2) { --k: 1; } .enter > :nth-child(3) { --k: 2; } .enter > :nth-child(4) { --k: 3; }
.enter > :nth-child(5) { --k: 4; } .enter > :nth-child(6) { --k: 5; } .enter > :nth-child(7) { --k: 6; } .enter > :nth-child(n+8) { --k: 7; }
@keyframes rise { from { opacity: 0; translate: 0 14px; } }
.hero { height: 188px; position: relative; margin: 0 0 6px; }
@media (max-height: 700px) { .page { padding-top: calc(var(--safe-t) + 20px); gap: 14px; } .hero { height: 112px; } .hero .card { --w: 64px; } } /* 矮屏：首页两个主按钮都在第一屏 */
@media (max-height: 600px) { .hero { display: none; } }
.hero .card {
  position: absolute; left: 50%; bottom: 6px; --w: 104px; transform-origin: 50% 120%; box-shadow: 0 18px 40px rgb(var(--onyx-rgb) / .14);
  animation: heroIn 640ms var(--spring) both;
  animation-delay: calc(var(--enter-t, 0ms) + var(--d, 0ms));
}
.hero .card:nth-child(2) { --d: 70ms; }
.hero .card:nth-child(3) { --d: 140ms; }
@keyframes heroIn { from { opacity: 0; translate: 0 36px; scale: .9; } }
.hero { cursor: pointer; }
.hero .card { transition: transform 520ms var(--spring); }
.hero .card:nth-child(1) { transform: translateX(-50%) rotate(-13deg) translateX(-38px); }
.hero .card:nth-child(2) { transform: translateX(-50%) translateY(-12px); z-index: 1; }
.hero .card:nth-child(3) { transform: translateX(-50%) rotate(13deg) translateX(38px); }
h1 { font-size: 40px; line-height: 1.05; letter-spacing: -.03em; font-weight: 700; margin: 0; text-align: center; text-wrap: balance; }
h2 { font-size: 28px; line-height: 1.15; letter-spacing: -.02em; font-weight: 700; margin: 0; text-align: center; text-wrap: balance; }
.lede { color: var(--ink-2); text-align: center; margin: 0 auto; max-width: 26em; font-size: 17px; line-height: 1.5; text-wrap: balance; }
.panel { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font-size: 13px; color: var(--ink-2); padding-left: 4px; }
.field input {
  width: 100%; min-width: 0; height: 52px; border-radius: 14px; border: 0; padding: 0 16px;
  font: inherit; font-size: 17px; color: var(--ink); background: var(--mist); outline: none;
  transition: background-color 160ms var(--out), box-shadow 160ms var(--out);
}
.field input::placeholder { color: var(--ink-2); }
.field input:focus { background: #f7f1f3; } /* 聚焦：淡淡一层酒红 */
.field input:focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }
.joinrow { display: flex; gap: 10px; align-items: flex-end; }
.joinrow .field { flex: 1; min-width: 0; }
.joinrow .btn { flex: none; }
.joinrow input:not(:placeholder-shown) { text-transform: uppercase; letter-spacing: .2em; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 12px; background: var(--mist); }
.seg button { position: relative; z-index: 1; height: 44px; border-radius: 9px; font-size: 15px; font-weight: 600; color: var(--ink-2); transition: color 200ms var(--out); }
.seg button[aria-checked="true"] { color: var(--ink); }
.seg .thumb { position: absolute; top: 3px; left: 3px; width: calc(50% - 3px); height: 44px; border-radius: 9px; background: var(--ivory); box-shadow: 0 3px 8px rgb(var(--onyx-rgb) / .1); transition: transform 280ms var(--out); }
.seg[data-v="official"] .thumb { transform: translateX(100%); }
.hint { margin: -2px 4px 0; font-size: 13px; color: var(--ink-2); }
.divider { height: 1px; background: var(--line); margin: 8px 0; }
.resume { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 14px 18px; border-radius: 18px; background: var(--mist); text-align: left; transition: transform 160ms var(--out), background-color 160ms var(--out); }
.resume:active { transform: scale(.98); background: var(--mist-2); }
.resume .r1 { font-size: 17px; font-weight: 700; color: var(--ink); }
.resume .r2 { font-size: 13px; color: var(--ink-2); }
.foot { display: flex; justify-content: center; }
.qrbox { padding: 8px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.qr { width: min(62vw, 228px); aspect-ratio: 1; border-radius: 18px; overflow: hidden; }
.qr svg { display: block; width: 100%; height: 100%; }
.roomcode { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 30px; font-weight: 700; letter-spacing: .28em; padding-left: .28em; }
.url { font-size: 13px; color: var(--ink-2); word-break: break-all; text-align: center; -webkit-user-select: text; user-select: text; }
.btnrow { display: flex; gap: 10px; }
.btnrow .btn { flex: 1; }
.waiting { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink-2); margin: 0; }
.waiting i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
.note { font-size: 14px; color: var(--ivory); background: var(--wine); padding: 6px 12px; border-radius: 10px; text-align: center; margin: 0; }
.panel .note.left { text-align: left; padding-left: 4px; }

/* ── 卡牌：白卡 + 细边 + 轻投影，在白底上靠阴影分层 ── */
.card {
  --w: var(--tw);
  position: relative; display: block; flex: none; width: var(--w); height: calc(var(--w) / var(--ratio));
  border-radius: calc(var(--w) * .075); background: var(--ivory); overflow: hidden; color: var(--ink);
  box-shadow: var(--card-shadow);
}
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-touch-callout: none; }
.card.flip img, .card.flip .fb { transform: rotate(180deg); }
.card .fb {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: 26% 8% 14%; font-size: calc(var(--w) * .125); font-weight: 600; text-align: center; line-height: 1.2;
}
.card.noimg .fb { display: flex; }
.card .fb i { position: absolute; left: 6%; right: 6%; top: 5%; height: 21%; border-radius: calc(var(--w) * .04); }
.card .fb em { position: absolute; left: 8%; bottom: 5%; font-style: normal; font-size: calc(var(--w) * .11); color: var(--ink-2); }
.card .fb.money { background: #f8f3e7; padding: 8%; }
.card .fb.money b { font-size: calc(var(--w) * .3); color: var(--gold-deep); }
.card .fb.act { background: #eff1e9; padding: 8%; }
.card.back { background: var(--wine); }
.card.back .fb { padding: 0; background: radial-gradient(120% 90% at 30% 10%, var(--wine-hi), var(--wine) 70%); }
.card.back .fb::before { content: ""; position: absolute; inset: 7%; border-radius: calc(var(--w) * .05); box-shadow: inset 0 0 0 max(1px, calc(var(--w) * .022)) rgb(var(--ivory-rgb) / .9); }
.card.back .fb::after { content: "Deal"; color: var(--ivory); font-style: italic; font-weight: 800; font-size: calc(var(--w) * .2); letter-spacing: -.02em; transform: rotate(-14deg); }
.card.fresh { animation: pop 260ms var(--out) both; }
@keyframes pop { from { opacity: 0; scale: .92; } }
.card.pick { z-index: 3; box-shadow: 0 8px 22px rgb(var(--wine-rgb) / .5); }
/* 可选目标：不描边，用一圈会呼吸的酒红光晕托起来。呼吸只动伪元素的透明度（合成层完成），不逐帧重绘阴影 */
@keyframes glowPulse { 50% { opacity: .3; } }
.dim { opacity: .3; transition: opacity 240ms var(--out); } /* 只动透明度：filter 过渡在 Safari 上每帧重绘，很多张牌一起变会卡 */
/* 飞行替身：固定定位、以中心为原点缩放，飞的时候投影更深，像被拿起来 */
.ghost { position: fixed; z-index: 30; margin: 0; pointer-events: none; transform-origin: 50% 50%; will-change: transform; }
.ghost.card, .ghost .card { box-shadow: 0 14px 30px rgb(var(--onyx-rgb) / .22); }
.flip3d { perspective: 900px; }
.flip3d .flipper { position: absolute; inset: 0; transform-style: preserve-3d; }
.flip3d .flipper > .card { position: absolute; inset: 0; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.flip3d .flipper > .card.back { transform: rotateY(180deg); }

/* ── 对局：按参考图分块布局。上面对手、中间「牌堆 / 回合台 / 弃牌堆」、下面自己、手牌，最底下一排操作按钮 ──
 * 分块只用来定位，不画底色、不描边：各块之间靠间距和留白自然分开。
 * 整页撑满一屏；屏幕太矮时各块保留最小高度，页面可以上下滚，操作按钮始终贴在底部。 */
.game {
  --gap: 12px;
  max-width: 760px; margin: 0 auto; min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; gap: var(--gap);
  padding: calc(var(--safe-t) + 14px) var(--gpr) 0 var(--gpl);
}
.zone { position: relative; flex: 1 1 0; min-height: 150px; touch-action: pan-y; }
.zone.open { z-index: 3; }
.game.zopen .zstake { visibility: hidden; } /* 哪块展开都先藏起加注牌子（挂在对方外弧外面）：不压到展开那块的说明 */
.game.zopen .midrow { opacity: calc(1 - var(--zf, 1)); filter: blur(calc(var(--zf, 1) * 8px)); } /* 拉得越开，中间一排越淡（--zf 0–1，跟着手指走） */
.game.zopen .midrow * { pointer-events: none !important; }
/* 小拉把：每块外弧正中外面（挨着中间一排）的一道小横条，点它展开 / 收起这块地产区 */
.zgrip { position: absolute; left: 0; top: 0; z-index: 31; width: 40px; height: 5px; border-radius: 3px; cursor: ns-resize; background: rgb(var(--onyx-rgb) / .3); touch-action: none; -webkit-tap-highlight-color: transparent; }
.zgrip::before { content: ''; position: absolute; inset: -14px -16px; }
.zone.me > .zgrip { z-index: 1; } /* 小屏上拉把的点击范围伸到指示器底下：重叠的地方让给指示器（拉把那道横条本身不被盖住） */
.game.zopen .zone:not(.open) > .zgrip { visibility: hidden; pointer-events: none; } /* 展开着：另一块的拉把藏起来（不然点展开那块的拉把会点到它） */
.zgrip.idle { visibility: hidden; pointer-events: none; }
.zgrip:active, .zone.open > .zgrip { background: rgb(var(--onyx-rgb) / .45); } /* 横着划交给弧形轨道（放不下时左右滑），竖着划还是页面滚动 */
.zone.scrolls { cursor: grab; }
.zone.sliding { cursor: grabbing; }
/* 拖牌时：能松手的地方亮起来（弧形框线变实、变色；银行和地产组抬一下、套一圈光） */
.zone.drop > .arc path { stroke: var(--accent); stroke-dasharray: none; stroke-width: 2.5; }
.bank.drop .pile, .set.drop .stack { translate: 0 -4px; }
.bank.drop .pile .card:last-child, .bank.drop .pile.none, .set.drop .stack { box-shadow: 0 0 0 3px rgb(var(--wine-rgb) / .45), var(--card-shadow); border-radius: calc(var(--tw) * .075); }
body.dragging, body.dragging * { cursor: grabbing; }
.ghost.drag { z-index: 46; box-shadow: 0 24px 48px rgb(var(--onyx-rgb) / .26); }
/* 当前行动方：那一方的名字压在酒红牌子上 */
.who .nm { padding: 0 8px; border-radius: 999px; transition: color 300ms var(--out), background-color 300ms var(--out); }
.turn-me .zname.me .bend .b-nm, .turn-opp .zname.opp .bend .b-nm { fill: url(#bdWine); stroke: var(--gold-hi); stroke-width: 4px; } /* 轮到谁：名字压在酒红牌子上 */
.turn-me .zname.me .bend .tx, .turn-opp .zname.opp .bend .tx { fill: var(--ivory); }
.who { flex: none; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 8px 0 6px; }
.nm { font-size: 16px; font-weight: 600; letter-spacing: -.01em; max-width: 8.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.off { flex: none; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.slots { display: inline-flex; gap: 4px; }
.slots i { width: 18px; height: 8px; border-radius: 4px; background: var(--mist-2); transition: background-color 300ms var(--out); }
.who .grow { flex: 1; }
.minis { display: inline-flex; align-items: center; }
.minis .card { --w: 16px; border-radius: 2px; box-shadow: -1px 0 3px rgb(var(--onyx-rgb) / .18); }
.cnt { font-size: 13px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hc { display: inline-flex; align-items: center; gap: 6px; }
.row { flex: 1 1 0; min-height: 0; display: flex; gap: 10px; align-items: flex-start; overflow: auto; padding: 6px 6px 4px; scroll-snap-type: x proximity; scrollbar-width: none; overscroll-behavior: contain; }
.row::-webkit-scrollbar, .hand::-webkit-scrollbar, .bigcards::-webkit-scrollbar { display: none; }
.empty { align-self: center; max-width: 15em; color: var(--ink-2); font-size: 14px; line-height: 1.45; padding: 0 8px; text-wrap: balance; }
.set, .bank { flex: none; min-width: 44px; display: flex; flex-direction: column; align-items: center; gap: 6px; scroll-snap-align: start; border-radius: 12px; padding: 2px; }
.set { position: relative; --th: calc(var(--tw) / var(--ratio)); --step: calc(var(--th) * .21); } /* 抵押印章等绝对定位的标记以这一组为准 */
/* 支持容器查询时：卡宽跟着分块高度走（大屏卡更大、矮屏自动缩），一组叠得太高就把每张露出的部分压小一点 */
@supports (container-type: size) {
  .row { container-type: size; --rh: calc(100cqh - 32px); --tw: clamp(34px, calc(var(--rh) / 1.3 * var(--ratio)), var(--twmax)); }
  .set { --step: max(calc(var(--th) * .12), min(calc(var(--th) * .21), calc((var(--rh) - var(--th)) / max(1, var(--n) - 1)))); }
}
.set .stack, .bank .pile { transition: transform 160ms var(--out), translate 200ms var(--out), box-shadow 200ms var(--out); }
.set:active .stack, .bank:active .pile { transform: scale(.96); }
.stack { position: relative; width: var(--tw); height: calc(var(--th) + (var(--n) - 1) * var(--step)); }
.stack > .card { position: absolute; left: 0; top: calc(var(--i) * var(--step)); }
/* 叠起来的地产（设计图：透视，叠得越多 Z 轴越高）：一叠里越上面的牌离人越近（大一点、影子更重），整叠越厚 */
.zone .arow .stack { perspective: 520px; perspective-origin: 50% 0; transform-style: preserve-3d; }
.zone .arow > .set, .zone .arow > .bank { transition: scale 140ms var(--out); }
.zone:not(.sliding) .arow > .set:active, .zone:not(.sliding) .arow > .bank:active { scale: .96; } /* 按下一组：轻轻一缩 */
.arow .cap { transition: opacity 180ms var(--out); }
.game.reflow .arow .cap { opacity: 0; transition: none; } /* 组变多 / 变少：牌飞到新位置的时候说明先藏起来，落定再淡出来 */
.zone .arow .stack, .zone .arow .pile { transition: translate 200ms var(--out), box-shadow 200ms var(--out); } /* 透视形变每次排版都重写：不做 transform 过渡（不然每次重画对方的牌都转一下） */
.zone .arow .stack > .card { translate: 0 0 calc(var(--i) * (6px + var(--n) * 1.5px)); box-shadow: 0 calc(1px + var(--i) * 1.5px) calc(3px + var(--i) * 2.5px) rgb(var(--onyx-rgb) / calc(.1 + var(--i) * .03)); }
.set.full .cap { padding: 0 8px; border-radius: 999px; background: var(--c); color: var(--ct, var(--ivory)); line-height: 18px; }
.set.full .cap b { color: inherit; }
.set.boost .stack { border-radius: calc(var(--tw) * .075); box-shadow: 0 6px 22px rgb(var(--gold-rgb) / .55); }
.x4 { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 6px; background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); font-size: 11px; font-weight: 800; line-height: 16px; vertical-align: 1px; }
.boostnote { margin-top: 10px; padding: 8px 12px; border-radius: 12px; background: var(--wine-grad); color: var(--ivory); }
.set.pick .stack { border-radius: calc(var(--tw) * .075); translate: 0 -3px; box-shadow: 0 6px 16px rgb(var(--wine-rgb) / .32); }
.set.pick .stack::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 8px 26px rgb(var(--wine-rgb) / .6); animation: glowPulse 1.3s ease-in-out infinite; pointer-events: none; }
.cap { font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cap b { color: var(--ink); font-weight: 600; }
.set .cap.near { padding: 0 7px; border-radius: 999px; background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); font-weight: 700; } /* 差一张就成套：期待感，也让双方都看清威胁 */
.zone.opp .set .cap.near { background: var(--wine-grad); text-shadow: none; }
/* 筹码：中央指示器旁边一条进度条（满格 = 上限）；满格加成时整条发光、旁边写收租倍数；捉鬼套装罚到下回合只摸 1M 时多一个小标。点开看说明 */
.pw { position: relative; flex: none; display: inline-flex; align-items: center; gap: 1px; min-height: 30px; margin: 0 -2px; padding: 0 2px; border-radius: 10px; transition: transform 160ms var(--out); }
.pw::before { content: ''; position: absolute; inset: -7px -6px; } /* 点按区域扩到 44px 高（图标本身不变大） */
.pw:active { transform: scale(.93); }
.pwbar { position: relative; flex: none; display: flex; gap: 2px; width: 56px; height: 8px; margin: 0 3px; }
.pwbar > b { position: relative; flex: 1; overflow: hidden; border-radius: 3px; box-shadow: inset 0 0 0 1px rgb(var(--onyx-rgb) / .25); }
.pwbar > b > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold-grad); transition: width 420ms var(--out); }
.pw.on .pwbar > b { box-shadow: 0 0 6px rgb(var(--gold-rgb) / .9); animation: pwGlow 1.4s ease-in-out infinite; } /* 满格加成：整条一亮一暗 */
@keyframes pwGlow { 50% { box-shadow: 0 0 10px 1px rgb(var(--gold-hi-rgb) / .95), 0 0 0 1px rgb(var(--gold-hi-rgb) / .85); } }
.pw.on .bend .pb-f { filter: drop-shadow(0 0 3px rgb(var(--gold-rgb) / .9)); animation: pwGlowB 1.4s ease-in-out infinite; }
@keyframes pwGlowB { 50% { filter: drop-shadow(0 0 5px rgb(var(--gold-hi-rgb) / .95)); } }
.pw.near .pwcap { animation: pwNear 1.6s ease-in-out infinite; } /* 有东西快触发了：筹码条那块轻轻发光 */
@keyframes pwNear { 50% { box-shadow: 0 0 0 3px rgb(var(--gold-rgb) / .35); background: #fbf5e7; } }
.pw .surge { margin-left: 3px; padding: 0 5px; border-radius: 6px; background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); font-size: 11px; font-weight: 800; line-height: 16px; }
.pw .gk { display: inline-flex; align-items: center; gap: 2px; margin-left: 4px; padding: 0 6px 0 3px; border-radius: 8px; background: var(--wine-grad); color: var(--ivory); font-size: 11px; font-weight: 800; line-height: 18px; white-space: nowrap; }
.pw .gk img { width: 16px; height: 16px; object-fit: contain; }
.pw .vb { margin-left: 4px; padding: 0 6px; border-radius: 8px; background: var(--wine-grad); color: var(--ivory); font-size: 11px; font-weight: 800; line-height: 18px; white-space: nowrap; } /* 贪婪大亨选了吸血 */
.sheet .tyopt { display: grid; gap: 10px; margin-top: 12px; }
.sheet .tyopt .btn { height: auto; min-height: 52px; padding: 10px 18px; flex-direction: column; gap: 2px; white-space: normal; text-align: center; }
.sheet .tyopt .btn small { font-size: 13px; font-weight: 500; opacity: .85; line-height: 1.35; }
.sheet .tyopt .btn.gold small { opacity: 1; }
.pwbig { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 6px 0 12px; }
.pwbig .pwbar.big { width: min(220px, 64%); height: 14px; gap: 3px; }
.pwbig .pwbar.big > b { border-radius: 5px; }
.pwbig b { font-size: 15px; font-variant-numeric: tabular-nums; }
.pwrows { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; font-size: 15px; line-height: 1.5; color: var(--ink); }
.pwrows li::marker { color: var(--ink-3); }
.pwrows .bar { display: block; height: 6px; margin-top: 6px; border-radius: 3px; background: var(--mist-2); overflow: hidden; }
.pwrows .bar i { display: block; height: 100%; border-radius: inherit; background: var(--gold-grad); }
.pwpop { position: fixed; z-index: 46; width: 72px; height: 72px; object-fit: contain; pointer-events: none; filter: drop-shadow(0 6px 14px rgb(var(--onyx-rgb) / .25)); }
.mp { flex: none; padding: 0 7px; border-radius: 7px; background: var(--red); color: var(--ivory); font-size: 11px; font-weight: 800; letter-spacing: .04em; line-height: 17px; }
.bank .pile { position: relative; height: calc(var(--tw) / var(--ratio)); width: calc(var(--tw) + var(--k) * 4px); }
.bank .pile .card { position: absolute; top: 0; left: calc(var(--i) * 4px); }
.bank.empty:not(.reveal) { display: none; } /* 银行 0M：不显示（拖着能存进银行的牌时才出来当落点） */
.bank .pile.none { width: var(--tw); border-radius: calc(var(--tw) * .075); background: transparent; border: 1.5px dashed #e3c477; } /* 银行空着：一圈和弧线同色的虚线空位，不是一块灰牌 */
.zone.opp .bank .pile.none { border-color: #d1d0cf; }
.bank.drop .pile.none { border-style: solid; border-color: var(--wine-hi); }

/* 中间一排：牌堆 | 回合台 | 弃牌堆。两堆牌横着放（像桌上横摆的牌），回合台留够放字的宽度，剩下的都给两堆牌 */
.midrow { position: relative; flex: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(136px, 1.25fr) minmax(0, 1fr); gap: var(--gap); height: var(--mh); }
/* 回合台：中间一个圆弧仪表。出牌不限时：中间是 ↑ / ↓，指向该出牌的一方，换人时弹进来、弧条重新画满；
   回应 / 弃牌有倒计时：酒红弧条顺时针走掉，中间是剩下的秒数。下面一排点是这回合还能出几张（金色）。最下面一行字是状态和临时提示。点一下看对局记录 */
.stage {
  position: relative; overflow: hidden; min-width: 0; border-radius: 22px; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px 6px; text-align: center;
  transition: transform 160ms var(--out);
  --clock: var(--wine-hi);  /* 倒计时：酒红 */
  --plays: var(--gold);     /* 出牌次数：金色 */
}
.stage:active { transform: scale(.97); }
.gauge { --D: clamp(44px, calc(var(--mh) - 34px), 96px); position: relative; flex: none; width: var(--D); height: var(--D); }
.g-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.g-svg path { fill: none; stroke-width: 7; stroke-linecap: round; }
.g-track { stroke: rgb(var(--onyx-rgb) / .07); }
.g-fill { stroke: var(--clock); stroke-dasharray: 100 100; }
.stage[data-who="opp"] .g-fill { stroke: rgb(var(--wine-hi-rgb) / .3); }  /* 对方的倒计时：同一个酒红，淡一点 */
.stage[data-who="opp"] .g-arrow { color: var(--ink-2); }            /* 轮到对方：箭头也安静一点 */
.stage[data-mode="win"] .g-fill { stroke: var(--gold); }
.gauge.over:not(.win) .g-fill { stroke: rgb(var(--onyx-rgb) / .16); }
.g-num, .g-arrow { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.g-num { padding-bottom: 6%; font-size: calc(var(--D) * .34); font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.g-num b { display: inline-block; font-weight: inherit; transition: color 200ms var(--out); }
.g-num small { align-self: flex-end; margin: 0 0 calc(var(--D) * .3) .05em; font-size: .4em; font-weight: 700; color: var(--ink-2); }
.gauge.over .g-num { font-size: calc(var(--D) * .3); }
.stage[data-mode="win"] .g-num b { color: var(--ink); }
.g-arrow { opacity: 0; padding-bottom: 6%; color: var(--ink); }
.g-arrow svg { width: 40%; height: 40%; }
.g-arrow[data-dir="down"] svg { transform: rotate(180deg); }
.stage[data-who="me"] .g-arrow { color: var(--accent); }
.gauge.noclock .g-arrow { opacity: 1; } /* 这一步不限时（出牌阶段，或旧后端）：中间常驻箭头，指向该出牌的一方 */
.gauge.noclock .g-num { opacity: 0; }
.gauge.hurry .g-num b { color: var(--ink); } /* 最后 5 秒：弧条变酒红、呼吸 */
.gauge.hurry .g-fill { animation: g-breathe 1s ease-in-out infinite; }
@keyframes g-breathe { 50% { opacity: .5; } }
.g-dot {
  position: absolute; width: calc(var(--D) * .09); height: calc(var(--D) * .09); margin: calc(var(--D) * -.045) 0 0 calc(var(--D) * -.045);
  border-radius: 50%; background: rgb(var(--onyx-rgb) / .12); transition: background-color 260ms var(--out), box-shadow 260ms var(--out);
}
.g-dot.on { background: var(--plays); box-shadow: 0 0 0 calc(var(--D) * .022) rgb(var(--gold-rgb) / .22); }
.stage[data-who="opp"] .g-dot.on { background: var(--gold-hi); box-shadow: none; }
.g-dot.bonus.on { background: var(--gold-hi); box-shadow: inset 0 0 0 calc(var(--D) * .018) var(--gold-deep), 0 0 0 calc(var(--D) * .022) rgb(var(--gold-rgb) / .3); }
.g-dot.lapsed { background: rgb(var(--wine-hi-rgb) / .3); } /* 超时作废的那次 */
/* 对方在想下一步：他下一次要用掉的那颗点慢慢呼吸，中间的箭头轻轻上下浮——"在等他"和"卡住了"一眼分得开。
   延迟 ~1 秒才动：等他刚打出的牌落定；每次更新回合台都是新节点，动画自动从头等起。动 svg 不动 .g-arrow，不和换人时箭头的动画抢 transform */
.stage[data-who="opp"] .g-dot.next { animation: g-think 1.3s ease-in-out .9s infinite; }
@keyframes g-think { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.5); background-color: var(--gold); } }
.stage[data-who="opp"] .gauge.noclock .g-arrow[data-dir="up"] svg { animation: g-bob 1.6s ease-in-out 1s infinite; }
@keyframes g-bob { 50% { transform: translateY(-6%); } }
@media (prefers-reduced-motion: reduce) { .stage[data-who="opp"] .g-dot.next, .stage[data-who="opp"] .gauge.noclock .g-arrow[data-dir="up"] svg { animation: none !important; } }
.g-ring { position: absolute; border-radius: 50%; border: 2px solid var(--plays); pointer-events: none; }
.st-sub { max-width: 100%; min-height: 16px; margin-top: 9px; font-size: 12px; line-height: 16px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; transition: color 200ms var(--out); }
.stage[data-mode="me"] .st-sub.base, .stage[data-mode="alert"] .st-sub.base, .st-sub.err, .st-sub.ok { display: inline-block; width: fit-content; max-width: 100%; margin: 9px auto 0; padding: 0 8px; border-radius: 999px; color: var(--ivory); background: var(--wine-grad); font-weight: 600; } /* 重点提示：酒红 / 金色小牌子上的白字 */
/* 提示：浮在中间那一行下沿，可以比回合台宽、最多两行，字大一号——回合台那一行太窄，长一点的提示会被截断 */
.toast { position: absolute; left: 50%; top: calc(100% + 4px); z-index: 6; width: max-content; max-width: min(calc(100% - 12px), 360px); padding: 6px 13px; border-radius: 14px; color: var(--ivory); background: var(--wine-grad); box-shadow: 0 6px 18px rgb(94 13 36 / 0.22), 0 0 0 1.5px rgb(var(--ivory-rgb) / .7); font-size: 13px; line-height: 18px; font-weight: 600; text-align: center; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; pointer-events: none; transform: translateX(-50%); transition: opacity 200ms var(--out), transform 260ms var(--spring); }
.toast.err { background: var(--red); }
.toast[hidden] { display: -webkit-box; opacity: 0; transform: translate(-50%, 6px) scale(.96); visibility: hidden; transition: opacity 160ms var(--out), transform 160ms var(--out), visibility 0s 160ms; }
.stage[data-mode="win"] .st-sub.base, .st-sub.warn { display: inline-block; width: fit-content; max-width: 100%; margin: 9px auto 0; padding: 0 8px; border-radius: 999px; color: var(--onyx); background: var(--gold-face); text-shadow: var(--on-gold); font-weight: 600; }

/* 手牌：单独一块，像握在手里一样沿圆弧扇形展开；太多放不下就叠起来横向滑。
   底下多留的空白给两边往下沉的牌（转了角、又沿弧线下沉），上面的空白给选中时抬起的牌 */
.handbox { flex: none; position: relative; }
.hand {
  display: flex; align-items: flex-end; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain;
  --hb: calc(8px + var(--hw) * .26); /* 底下的留白：牌越大，转了角往下沉得越多 */
  height: calc(var(--hw) / var(--ratio) + 26px + var(--hb)); padding: 26px 14px var(--hb);
}
.hand .card {
  --w: var(--hw); transform-origin: 50% 100%;
  transform: translateY(var(--y, 0px)) rotate(var(--r, 0deg));
  transition: transform 260ms var(--out), translate 200ms var(--out), opacity 200ms var(--out), box-shadow 260ms var(--out);
}
.hand .card { touch-action: pan-x; } /* 横向滑交给浏览器滚动手牌，往上拖交给拖牌出牌 */
.hand .card:first-child { margin-left: var(--edge-l, var(--edge, auto)); }
.hand .card:last-child { margin-right: var(--edge-r, var(--edge, auto)); }
.hand .card + .card { margin-left: var(--ov, 8px); }
.hand.nofx .card { transition: none; }
.hand .card:active { transform: translateY(var(--y, 0px)) rotate(var(--r, 0deg)) scale(.97); }
.hand .card.sel { transform: translateY(calc(var(--y, 0px) - 18px)) rotate(0deg) scale(1.03); z-index: 2; box-shadow: 0 14px 28px rgb(var(--onyx-rgb) / .18); }
.hand .card:focus-visible { z-index: 3; } /* 键盘焦点那张提到最上面：焦点框不被下一张盖住 */
.hand .card.muted { opacity: .55; } /* 自己回合里打不出、也存不进银行的牌（比如单独的「反对行动」）：淡一点，点开会说明原因 */
.hcount { position: absolute; top: 5px; right: 16px; font-size: 11px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; pointer-events: none; }
.hcount.over { padding: 0 6px; border-radius: 999px; background: var(--wine); color: var(--ivory); }

/* 底部操作：左菜单、中主按钮、右表情。这一排本身不画底，只在页面滚动时用一层和页面同色的渐隐垫着 */
.dock {
  flex: none; position: sticky; bottom: 0; z-index: 5; margin: 0 calc(var(--safe-r) - var(--gpr)) 0 calc(var(--safe-l) - var(--gpl));
  display: flex; align-items: center; gap: 10px; padding: 8px 10px calc(var(--safe-b) + 10px);
  background: linear-gradient(to top, var(--paper) 70%, rgb(var(--ivory-rgb) / 0));
}

/* ── 底部面板：iOS 曲线弹出，可以下拉关闭 ── */

.bigcards { display: flex; gap: 12px; overflow-x: auto; padding: 8px 20px 12px; margin: 0 -20px; scroll-padding-inline: 20px; scrollbar-width: none; } /* 伸到面板两边：牌在屏幕边滑出去，不在内边距那里被切一刀 */

.float { position: fixed; transform: translate(-50%, 0); padding: 2px 12px 3px; border-radius: 999px; font-size: 20px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; color: var(--onyx); background: var(--gold-face); text-shadow: var(--on-gold); box-shadow: 0 0 0 2px rgb(var(--ivory-rgb) / .85), 0 8px 20px rgb(138 106 34 / .35), 0 0 24px rgb(var(--gold-hi-rgb) / .55); font-variant-numeric: tabular-nums; }
.float.minus { background: var(--wine-grad); text-shadow: none; box-shadow: 0 0 0 2px rgb(var(--ivory-rgb) / .85), 0 8px 20px rgba(94, 13, 36, .35); }
.float.gold { font-size: 24px; }
.stamp { position: fixed; z-index: 48; left: var(--safe-mid); top: 40%; padding: 14px 34px 16px; border-radius: 24px; font-size: 44px; font-weight: 900; letter-spacing: .04em; white-space: nowrap; color: var(--ivory); background: var(--wine-grad); box-shadow: 0 0 0 3px var(--gold-hi), 0 0 0 6px var(--wine-down), 0 22px 54px rgba(94, 13, 36, .45), 0 0 50px rgb(var(--gold-hi-rgb) / .35); }
.stamp.good { background: var(--emerald-grad); font-size: 46px; text-shadow: 0 1px 1px rgb(var(--onyx-rgb) / .4), 0 0 18px rgb(var(--gold-hi-rgb) / .45); box-shadow: 0 0 0 3px #f4e6c0, 0 0 0 6px var(--gold-deep), 0 22px 54px rgb(138 106 34 / .45), 0 0 70px rgb(var(--gold-hi-rgb) / .7); } /* 对自己有利：金色，和吃亏的酒红一眼分开 */
.stamp.gold { background: var(--gold-face); color: var(--onyx); font-size: 54px; text-shadow: var(--on-gold), 0 0 18px rgb(var(--gold-hi-rgb) / .8); box-shadow: 0 0 0 3px #f4e6c0, 0 0 0 6px var(--gold-deep), 0 22px 54px rgb(138 106 34 / .45), 0 0 70px rgb(var(--gold-hi-rgb) / .7); }
.shine { position: absolute; inset: 0; overflow: hidden; border-radius: calc(var(--tw) * .075); pointer-events: none; z-index: 6; }
.shine i { position: absolute; top: -10%; bottom: -10%; left: -70%; width: 60%; background: linear-gradient(100deg, rgb(var(--ivory-rgb) / 0), rgb(var(--ivory-rgb) / .9), rgb(var(--ivory-rgb) / 0)); }
/* 表情气泡：从头像旁边弹出来的对话泡，带几颗小表情往上飘 */
.emo {
  position: fixed; left: 0; top: 0; z-index: 2; padding: 7px 11px 8px; border-radius: 20px 20px 20px 6px;
  background: var(--ivory); box-shadow: 0 10px 28px rgb(var(--onyx-rgb) / .16);
  font-size: 34px; line-height: 1; transform-origin: 0 100%;
}
.emo.down { border-radius: 6px 20px 20px 20px; transform-origin: 0 0; }
.emo span { display: block; }
.emo-p { position: fixed; left: 0; top: 0; font-size: 18px; line-height: 1; margin: -9px 0 0 -9px; }
.emo-coin { position: fixed; left: 0; top: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f4e6c0, var(--gold-hi) 45%, var(--gold)); box-shadow: inset 0 0 0 1.5px rgb(138 106 34 / .35); }
.peek-dim { position: fixed; inset: 0; background: rgb(var(--onyx-rgb) / .38); }
.card.peek { position: fixed; margin: 0; transform-origin: 0 0; box-shadow: 0 30px 60px rgb(var(--onyx-rgb) / .28); }
/* 表情面板：黑色毛玻璃胶囊，从表情按钮上方弹出 */
.pop {
  position: fixed; z-index: 50; display: grid; grid-template-columns: repeat(6, 48px); gap: 2px; padding: 6px; border-radius: 28px;
  background: rgb(var(--onyx-rgb) / .97); /* 不用 backdrop-filter：毛玻璃层在 Safari 上一边缩放一边模糊会闪 */
  box-shadow: 0 18px 44px rgb(var(--onyx-rgb) / .3); transform-origin: calc(100% - 28px) 100%;
}
.pop button { width: 48px; height: 48px; border-radius: 50%; font-size: 28px; line-height: 1; display: grid; place-items: center; color: var(--ivory); transition: transform 200ms var(--spring), background-color 160ms var(--out); }
/* 表情一律用彩色表情字体：系统字体列表里有的字体自带单色表情，会被画成深色、在深色面板上看不见 */
.pop button, .emo, .emo-p { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", sans-serif; }
.pop button:active { transform: scale(.8); background: rgb(var(--ivory-rgb) / .14); }
/* 检查资源里的表情包清单 */
.pkhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.pkhead .sub { margin: 0; }
.sheet .pkcopy { flex: none; width: auto; height: 44px; padding: 0 12px; font-size: 13px; }
.pkgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px 4px; margin: 8px 0 14px; }
.pk { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.pk-img { position: relative; width: 44px; height: 44px; }
.pk-img .stk { display: block; width: 100%; height: 100%; object-fit: contain; }
.pk small { font-size: 11px; line-height: 14px; color: var(--ink-2); white-space: nowrap; }
/* 中央指示器里对方的表情（Telegram HandDrawnEmoji）：盖在箭头 / 读秒的位置 */
.g-face { position: absolute; left: 50%; top: 50%; z-index: 2; width: 56%; aspect-ratio: 1; transform: translate(-50%, -54%); pointer-events: none; }
.g-face .stk { display: block; width: 100%; height: 100%; object-fit: contain; }
.g-face .stk-fb { font-size: calc(var(--D) * .36); }
.stage.face .g-arrow, .stage.face .g-num { opacity: 0 !important; transition: opacity 160ms var(--out); }
/* 自定义表情包（Telegram GameEmoji）：每格放会动的表情，多于两排时面板里上下滑 */
.pop.pack { max-height: calc(5 * 50px + 10px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.stk-fb { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 26px; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.stk.lot.on > .stk-fb { visibility: hidden; }
.emo.pack .stk-fb { font-size: 40px; }
.pop.pack::-webkit-scrollbar { display: none; }
.pop.pack button .stk { display: block; width: 40px; height: 40px; object-fit: contain; }
.emo.pack { padding: 6px 8px; }
.emo.pack .stk { display: block; width: 64px; height: 64px; object-fit: contain; }
/* 被对方针对时屏幕四周闪一圈红 */
/* 付款时的金币 */
.coin {
  position: fixed; left: 0; top: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #f6eacb 0 12%, var(--gold-hi) 34%, var(--gold) 72%, var(--gold-deep));
  box-shadow: 0 2px 5px rgb(var(--onyx-rgb) / .22), inset 0 0 0 1.5px rgb(var(--ivory-rgb) / .35);
}
/* 行动卡登场：从出牌人那里飞到屏幕中央亮个相，再落进弃牌堆 */
.reveal-dim { position: fixed; inset: 0; background: radial-gradient(circle at 50% 44%, rgb(var(--onyx-rgb) / .06), rgb(var(--onyx-rgb) / .3)); }
.reveal-cap {
  position: fixed; left: var(--safe-mid); transform: translateX(-50%); max-width: calc(var(--safe-w) - 40px); padding: 9px 16px; border-radius: 999px;
  background: var(--onyx); color: var(--ivory); font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 10px 26px rgb(var(--onyx-rgb) / .25);
}
.reveal-cap.alert { background: var(--red); }
.ghost.reveal .card { box-shadow: 0 30px 60px rgb(var(--onyx-rgb) / .32); }
/* 凑齐一套时向外扩散的彩圈 */
.ring { position: fixed; left: 0; top: 0; border-radius: 50%; border: 4px solid var(--c); box-shadow: 0 0 18px var(--c), inset 0 0 12px var(--c); }
/* 底部面板刚打开时：内容依次上浮，卡牌一张张弹出来 */
.sheet.stagger .sbody > *, .sheet.stagger > .acts { animation: rise 320ms var(--out) both; animation-delay: calc(40ms + var(--k, 0) * 30ms); }
.sheet.stagger .sbody > :nth-child(2) { --k: 1; } .sheet.stagger .sbody > :nth-child(3) { --k: 2; } .sheet.stagger .sbody > :nth-child(4) { --k: 3; }
.sheet.stagger .sbody > :nth-child(n+5) { --k: 4; } .sheet.stagger > .acts { --k: 5; }
.sheet.stagger .cards > .tile, .sheet.stagger .bigcards > .tile, .sheet.stagger .cards > .card { animation: tileIn 300ms var(--spring) both; animation-delay: calc(80ms + var(--j, 0) * 24ms); }
.sheet.stagger :is(.cards, .bigcards) > :nth-child(2) { --j: 1; } .sheet.stagger :is(.cards, .bigcards) > :nth-child(3) { --j: 2; }
.sheet.stagger :is(.cards, .bigcards) > :nth-child(4) { --j: 3; } .sheet.stagger :is(.cards, .bigcards) > :nth-child(5) { --j: 4; }
.sheet.stagger :is(.cards, .bigcards) > :nth-child(6) { --j: 5; } .sheet.stagger :is(.cards, .bigcards) > :nth-child(7) { --j: 6; }
.sheet.stagger :is(.cards, .bigcards) > :nth-child(n+8) { --j: 7; }
@keyframes tileIn { from { opacity: 0; translate: 0 8px; scale: .92; } }
.scoreline { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 14px 0 8px; font-size: 15px; color: var(--ink-2); }
.scoreline b { font-size: 32px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.scoreline .nm { font-size: 15px; font-weight: 600; color: var(--ink); max-width: 6em; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
.badge { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 14px 0 10px; border-radius: 17px; background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); font-size: 14px; font-weight: 700; }
.badge svg, .badge .ico { width: 18px; height: 18px; object-fit: contain; }
.badge.cool { background: var(--emerald-grad); color: var(--ivory); text-shadow: none; }
.badge.hot { background: var(--onyx); color: var(--gold-hi); text-shadow: none; box-shadow: inset 0 0 0 1.5px var(--gold); }
.endnote { margin: 6px 0 0; font-size: 15px; color: var(--ink-2); }
/* 对方已经点了再来一局：按钮轻轻"呼吸"，提醒一下 */
.btn.nudge { animation: nudge 1.8s ease-out infinite; }
@keyframes nudge { 0% { box-shadow: 0 0 0 0 rgb(var(--wine-rgb) / .45); } 70%, 100% { box-shadow: 0 0 0 10px rgb(var(--wine-rgb) / 0); } }
.rules { margin: 0; padding-left: 1.2em; display: grid; gap: 10px; font-size: 16px; line-height: 1.5; color: var(--ink); }
ul.rules { padding-left: 0; list-style: none; }
.rules b { margin-right: 8px; font-weight: 700; }
.rgroup { margin: 20px 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--ink-2); }
.rgroup:first-of-type { margin-top: 4px; }
/* 赌一把：押注筹码和按钮用金色，一眼看出"这是在冒险" */
.chip.gold[aria-checked="true"] { background: var(--onyx); color: var(--gold-hi); text-shadow: none; box-shadow: inset 0 0 0 1.5px var(--gold); }
.chip.gold[aria-checked="true"] em { opacity: 1; }
.btn.gold { background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); }
.betnote { margin: 8px 0 0; font-size: 13px; }
.stamp.gray { background: var(--ink-2); box-shadow: 0 18px 44px rgb(var(--onyx-rgb) / .2); }
/* 老虎机（赌一把、捉鬼套装）：老虎机.png 做机身，三个竖向转轮嵌在图上的三个白色窗口里；没有图时用 CSS 画一台。
 * 窗口位置按 1254×1254 的原图量：上沿 35.4%、高 31.8%，三格左沿 16.4% / 38.6% / 61.4%、宽约 20.4%；
 * 圆顶紫色区放标题，底下出币口是金币喷出来的地方。格子是正方形（和 7.png、8.png 这些 1254×1254 的图一样），
 * 窗口里正好露出一整格 + 上下各小半格，"差一格"看得见。 */
.slot { position: fixed; z-index: 47; left: var(--safe-mid); top: 0; --sw: min(330px, calc(var(--safe-w) - 48px), 58vh); width: var(--sw); transform: translateX(-50%); text-align: center; }
.slot .sm { position: relative; width: var(--sw); height: var(--sw); }
/* 投影只加在机身图本身：滤镜加在包着转轮的整台机器上，iOS Safari 会把整层（连机身图）画丢 */
.slot .sm-art { position: absolute; inset: 0; width: 100%; height: 100%; -webkit-user-drag: none; filter: drop-shadow(0 20px 36px rgb(var(--onyx-rgb) / .38)); }
.slot .sm-fb { position: absolute; inset: 0; filter: drop-shadow(0 20px 36px rgb(var(--onyx-rgb) / .38)); }
.slot .sm-fb i { position: absolute; display: block; }
.slot .sm-fb .dome { left: 22%; right: 22%; top: 6%; height: 26%; border-radius: 48% 48% 10% 10% / 70% 70% 10% 10%; background: linear-gradient(180deg, var(--emerald-hi), var(--emerald)); box-shadow: inset 0 0 0 calc(var(--sw) * .028) var(--gold); }
.slot .sm-fb .body { left: 9%; right: 9%; top: 27%; height: 54%; border-radius: 9%; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); box-shadow: inset 0 0 0 calc(var(--sw) * .012) var(--gold-deep); }
.slot .sm-fb .face { left: 14%; right: 14%; top: 33%; height: 36%; border-radius: 4%; background: var(--emerald); }
.slot .sm-fb .base { left: 5%; right: 5%; top: 77%; height: 17%; border-radius: 6% 6% 14% 14%; background: linear-gradient(180deg, var(--emerald-hi), var(--emerald-down)); box-shadow: inset 0 calc(var(--sw) * -.03) 0 var(--gold); }
.slot .sm-fb .tray { left: 28%; right: 28%; top: 79%; height: 8%; border-radius: 12%; background: linear-gradient(180deg, var(--gold-deep), var(--gold)); box-shadow: 0 0 0 calc(var(--sw) * .014) var(--gold-hi); }
.slot .sm-fb .lever { right: 1.5%; top: 34%; width: 3%; height: 30%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--gold-hi)); }
.slot .sm-fb .knob { right: -1%; top: 25%; width: 10%; height: 10%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #cd8092, var(--wine-hi) 60%, var(--wine)); }
.slot .sm-title { position: absolute; left: 24%; right: 24%; top: 12.5%; height: 13%; display: grid; place-items: center; padding: 0 4px; color: var(--ivory); font-size: calc(var(--sw) * .056); font-weight: 800; line-height: 1.1; letter-spacing: .02em; text-shadow: 0 2px 0 rgb(var(--onyx-rgb) / .7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .sm-title.near { color: var(--ivory); text-shadow: 0 2px 0 rgb(var(--onyx-rgb) / .7), 0 0 14px rgb(var(--gold-hi-rgb) / .95); }
.slot .sm-reels { position: absolute; inset: 0; }
.slot .sm-win { position: absolute; top: 35.6%; height: 31.4%; overflow: hidden; } /* 直角裁切：Safari 的圆角 + overflow:hidden 裁不住正在动的转轮条，直角一直裁得住；圆角由机身图上的玻璃窗自己画 */
.slot .sm-win:nth-child(1) { left: 16.6%; width: 19.8%; }
.slot .sm-win:nth-child(2) { left: 38.8%; width: 20.2%; }
.slot .sm-win:nth-child(3) { left: 61.6%; width: 19.9%; }
.slot .sm-fb ~ .sm-reels .sm-win { background: linear-gradient(180deg, var(--ivory), var(--mist-2)); }
.slot .sm-win::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgb(var(--onyx-rgb) / .34), rgb(var(--onyx-rgb) / 0) 30%, rgb(var(--onyx-rgb) / 0) 70%, rgb(var(--onyx-rgb) / .34)); } /* 滚筒的弧面：上下两头暗一点 */
.slot .sm-strip { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
.slot .sm-strip.blur { filter: blur(1.3px); }
.slot .sym { position: relative; width: 100%; height: var(--cell, 60px); display: grid; place-items: center; overflow: visible; } /* 格子是正方形：边长由 JS 按窗口宽度写进 --cell（不依赖 aspect-ratio，老 iOS 也一样） */
.slot .sym img { position: absolute; left: 5%; top: 5%; width: 90%; height: 90%; object-fit: contain; -webkit-user-drag: none; } /* 图案缩在格子里：有的图几乎铺满画布，放大会挤出格子 */
.slot .sym .e { font-size: calc(var(--sw) * .118); line-height: 1; }
.slot .sym .g { font: 900 calc(var(--sw) * .15) / 1 'Arial Black', 'Helvetica Neue', system-ui, sans-serif; color: var(--gold); -webkit-text-stroke: calc(var(--sw) * .007) var(--emerald); paint-order: stroke fill; text-shadow: 0 calc(var(--sw) * .008) 0 var(--emerald-down); }
.slot .sm-line { position: absolute; left: 14.5%; right: 16%; top: calc(51.3% - 1px); height: 2px; border-radius: 2px; background: rgb(var(--wine-hi-rgb) / .55); opacity: 0; pointer-events: none; }
.slot.won .sm-line { opacity: 1; background: var(--gold-hi); box-shadow: 0 0 12px 3px rgb(var(--gold-rgb) / .85); }
.slot.tease .sm-win:nth-child(3) { box-shadow: inset 0 0 0 calc(var(--sw) * .01) var(--gold-hi), inset 0 0 calc(var(--sw) * .06) rgb(var(--gold-rgb) / .75); } /* 第三个转轮慢下来时：金框发光 */
.slot.lost .sm-art, .slot.lost .sm-fb { filter: drop-shadow(0 20px 36px rgb(var(--onyx-rgb) / .38)) saturate(.75) brightness(.92); transition: filter 300ms var(--out); }
.slot .sm-res { display: inline-block; max-width: 100%; margin-top: 6px; padding: 8px 18px; border-radius: 999px; background: var(--wine-grad); box-shadow: 0 0 0 2px var(--gold-hi); color: var(--ivory); font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; }
.slot.won .sm-res { background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); box-shadow: 0 0 0 2px #f4e6c0, 0 0 28px rgb(var(--gold-rgb) / .7); font-size: 16px; }
/* 正在进入房间：洗牌动画 + 房间码。连接很快时不闪（晚 250ms 才出现） */
.page.connecting { justify-content: center; animation: fadeIn 220ms var(--out) 250ms both; }
@keyframes fadeIn { from { opacity: 0; } }
.shuffle { position: relative; height: 150px; }
.shuffle .card { position: absolute; left: 50%; top: 8px; --w: 84px; margin-left: -42px; box-shadow: 0 14px 30px rgb(var(--onyx-rgb) / .16); animation: riffle 1.5s var(--move) infinite; }
.shuffle .card:nth-child(1) { --dx: -44px; --rr: -12deg; }
.shuffle .card:nth-child(2) { --dx: 0px; --rr: 0deg; animation-delay: .1s; }
.shuffle .card:nth-child(3) { --dx: 44px; --rr: 12deg; animation-delay: .2s; }
@keyframes riffle { 0%, 100% { transform: none; } 35% { transform: translate(var(--dx), -8px) rotate(var(--rr)); } 65% { transform: translateY(-2px); } }
.roomcode.sm { font-size: 22px; }
/* 加注：底栏里一枚金色筹码（只在自己回合开始、能加注时出现）；回合台右上角显示这局的倍数，左上角显示奖池 */
.round.raise { background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); font-size: 16px; font-weight: 800; letter-spacing: -.02em; box-shadow: 0 6px 16px rgb(var(--gold-rgb) / .35); }
.round.raise:active { background: linear-gradient(135deg, var(--gold), var(--gold-deep)); }
.stage .corner { position: absolute; top: 4px; display: inline-flex; align-items: center; gap: 2px; height: 18px; padding: 0 6px; border-radius: 9px; font-size: 10.5px; font-weight: 800; letter-spacing: .01em; font-variant-numeric: tabular-nums; pointer-events: none; }
.stage .corner.pot { left: 4px; background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); }
.stage .corner svg { width: 11px; height: 11px; }
/* 网络信号：右下角三格，好的时候不抢眼，慢了变金 / 酒红 */
/* 点出去的牌：服务器确认前先亮一下 */
.card.sending { filter: brightness(1.06) saturate(1.1); box-shadow: 0 0 0 2px var(--gold), 0 10px 22px rgb(var(--wine-rgb) / .28); }
.chip em { font-style: normal; font-size: 12px; font-weight: 700; opacity: .8; }
/* 菜单里的开关项：右边写当前状态 */
.menu button.sw, .menu button.kv { display: flex; align-items: center; justify-content: space-between; }
.menu button.danger { color: var(--wine-hi); } /* 认输：危险操作用酒红字 */
.menu button.sw span, .menu button.kv span { font-size: 15px; color: var(--ink-2); }
.menu button.sw[aria-checked="true"] span { color: var(--accent); }
/* 银行图标：桌面上「银行」两个字前面一个小图标 */
.cap .ico { width: 14px; height: 14px; object-fit: contain; vertical-align: -2px; margin-right: 3px; }
/* 屏幕中央的大场面：成就 / 大乐透。只动 transform 和 opacity，光效都是渐变层 */
.spot { position: fixed; inset: 0; z-index: 49; pointer-events: none; overflow: hidden; }
.spot .dim { position: absolute; inset: 0; background: radial-gradient(circle at 50% 44%, rgb(var(--onyx-rgb) / .5), rgb(var(--onyx-rgb) / .78)); } /* 够暗，桌面上的字不会透过来和大字打架 */

  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 4px 14px rgb(var(--onyx-rgb) / .1), 0 0 0 1px rgb(var(--onyx-rgb) / .05); transition: background-color 200ms var(--out), color 200ms var(--out), translate 160ms var(--out); }

.tbi-main:active { background: rgb(var(--onyx-rgb) / .05); }

/* 顶部下拉面板（信息条往下拉 / 点开）：左上更多设置、右上快捷表情；表情包名一排、表情一排（各 4 个，左右滑，› 翻下一页，

.drawer[hidden] { display: none; }

  background: rgb(var(--ivory-rgb) / .97); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 14px 36px rgb(var(--onyx-rgb) / .18), 0 0 0 1px rgb(var(--onyx-rgb) / .05); transform-origin: 50% 0; }

.dr-packs::-webkit-scrollbar, .dr-row::-webkit-scrollbar { display: none; }

.chatq { position: relative; flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-radius: 22px; background: var(--mist); color: var(--ink-2); font-size: 15px; text-align: left; transition: transform 160ms var(--out), background-color 160ms var(--out); }

.chatq .ph { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chatq.has { color: var(--ink); background: #f7f1f3; box-shadow: inset 0 0 0 1.5px rgb(var(--wine-hi-rgb) / .25); }

.chatq:active { transform: scale(.94); background: var(--mist-2); }
.pop.down { transform-origin: calc(100% - 28px) 0; }
/* 弧形分块：框线是一段圆环（SVG），里面的银行、地产组由 layoutArcs 按弧摆好 */
.zone > .arc, .handbox > .arc { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.arc path { fill: rgb(var(--ivory-rgb) / .42); stroke: #dab968; stroke-width: 1.5; stroke-dasharray: 7 5; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: stroke 160ms var(--out); }
.zone.opp > .arc path { stroke: #d1d0cf; }

.zone.opp { flex-basis: max(0px, calc(var(--oppx) - var(--zcut, 0px))); margin-top: calc(-1 * var(--oup)); transform: rotate(180deg); } /* 对方坐在对面：整块倒过来，和自己这块互为镜像（外弧往下弯、挨着中央指示器） */
.arow { position: absolute; inset: 0; z-index: 1; }
.arow > .bank, .arow > .set { position: absolute; transform: rotate(var(--ar, 0deg)); transform-origin: 50% 0; padding: 0; gap: 4px; } /* 每叠牌（.stack / .pile）再由 warpRow 投影成它那一格扇形 */
.arow > .set::before { content: ''; position: absolute; inset: -4px -5px; } /* 牌缩小时点按区域往外扩一点（组距至少 10px，不会叠） */
.arow > .set { width: var(--tw); min-width: 0; } /* 每组宽度就是牌宽：说明文字比牌宽时往两边伸（说明在外弧那一侧，那里牌距本来就更宽），不把整组撑宽 */
.zone .arow > .bank, .zone .arow > .set { flex-direction: column-reverse; } /* 说明文字挨着外弧：自己这块在牌上方，对方那块（整块转了 180°）在牌下方、挨着中央指示器 */
/* 对方那块的牌面、说明文字、加注倍率牌子原地转 180°：看起来是正的；位置不变（说明还在外弧那一侧） */
.zone.opp .arow .stack, .zone.opp .arow .pile, .zone.opp .arow .cap, .zone.opp > .zstake { rotate: 180deg; }
.zone.opp .set .lockmark { transform: translate(-50%, -50%) rotate(168deg); }
.zone .set { --step: var(--zstep, calc(var(--th) * .16)); }
.arow .cap { font-size: 11.5px; line-height: 18px; }
.arow .set .cap.near { padding: 0 6px; }
/* 挤不下：说明收成短的（layoutArcs 按这一项和左右邻居的间距加 .tight）——「差1→4M」→「差1」、「银行 37M」→「37M」；
 * 抵押的只留牌上的「抵押」章（visibility 不改高度，量好的位置不变）。完整信息都在 aria-label 里 */
.arow > .tight .cap .na, .arow > .bank.tight .cap .ico { display: none; }
.arow > .set.mortgaged.tight .cap { visibility: hidden; }
/* 名字胶囊：在各自地产区里、内弧那一侧靠屏幕边（我的左下、对方的右上），位置由 layoutArcs 算 */
.zname { position: absolute; left: 0; top: 0; z-index: 30; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; transform-origin: 50% 50%; pointer-events: none; }
.zone.opp > .zname { rotate: 180deg; }
.zname .nm { font-size: 14px; max-width: 7.5em; line-height: 26px; padding: 0 11px; color: transparent; } /* 底和字都画在 .bend 上（沿弧弯），这里只占位 */
/* 加注倍率：对方地产区外弧最低点（中央指示器正上方）里面的金色小牌子（只在加过注时出现）。位置由 layoutArcs 算 */
.zstake { position: absolute; left: 0; top: 0; z-index: 30; padding: 0 10px; color: var(--onyx); text-shadow: var(--on-gold); font-size: 13px; font-weight: 800; line-height: 22px; letter-spacing: .02em; white-space: nowrap; pointer-events: none; }
.zstake small { margin-right: 3px; font-size: 11px; font-weight: 700; }
/* 中间一排：中央指示器摆在两块地产区外弧之间最窄的地方（对方的往下弯、自己的往上拱，在正中最近）；
 * 两边张开的地方放银行、张数，颜色格和筹码沿两条外弧排（对方在左上、自己在右下）。位置由 layoutMid 算 */
.midrow { position: relative; z-index: 2; display: block; height: calc(var(--mh) + var(--oup) + var(--zcut, 0px) + var(--mfl, 0px)); pointer-events: none; } /* 压在两块地产区上面（提示、名字、指示器不被弧形底色和说明文字盖住），在底栏 5、顶栏 6 下面 */
.midrow .stage { pointer-events: auto; } /* 这一排只有指示器、银行、筹码能点：别的地方不挡住上下的地产区 */
/* 沿弧弯（bend）：胶囊底画在元素自己里面的 SVG 上，跟着所在那条弧弯；字和小图标一个个顺着弧转（layoutArcs / layoutPick 摆好后调 bend） */
.bend { position: absolute; left: 0; top: 0; z-index: -1; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.bend-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.bent { isolation: isolate; }
.bent .bu { display: inline-block; }
.bend .bg { fill: rgb(var(--ivory-rgb) / .9); stroke: rgb(var(--onyx-rgb) / .06); stroke-width: 2px; paint-order: stroke; transition: fill 300ms var(--out); }
.bend .b-nm { fill: rgb(var(--ivory-rgb) / .94); stroke: rgb(var(--onyx-rgb) / .08); filter: drop-shadow(0 2px 3px rgb(var(--onyx-rgb) / .06)); }
.bend .b-hc.b-over { fill: url(#bdWine); }
.bend .b-zstake { fill: url(#bdGold); stroke: #f5e8c6; stroke-width: 3px; filter: drop-shadow(0 3px 4px rgb(138 106 34 / .3)); }
.bend .tx { fill: currentColor; }
/* 手牌张数：在各自地产区里、内弧那一侧和名字相对的另一头（位置由 layoutArcs 算），对方的原地转回来看着是正的 */
.zcount { position: absolute; left: 0; top: 0; z-index: 30; white-space: nowrap; transform-origin: 50% 50%; pointer-events: none; }
.zone.opp > .zcount { rotate: 180deg; }
.zcount .hc { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px 0 4px; }
.zcount .minis .card { --w: 11px; }
.zcount .hc .cnt { font-size: 11px; font-weight: 700; color: var(--ink); }
.zcount .hc.over .cnt { color: var(--ivory); }
.side { position: absolute; inset: 0; }
.side > * { position: absolute; left: 0; top: 0; }
/* 中间一排两边：两行两列的网格（对齐参考线）——上面一行「对手 / 我方」+ 颜色格，下面一行倍率 + 筹码条；
 * 文字和倍率同一列（同宽），颜色格和筹码条同一列（颜色格平分筹码条的宽度）；自己那边左右镜像（文字、倍率在靠屏幕边那头） */
.sgrid { --c1: 28px; --c2: 92px; display: grid; grid-template-columns: var(--c1) var(--c2); gap: 8px 6px; align-items: center; pointer-events: none; }
.side.me .sgrid { grid-template-columns: var(--c2) var(--c1); }
.slab { grid-row: 1; height: 12px; border-radius: 6px; background: rgb(var(--ivory-rgb) / .92); box-shadow: 0 0 0 1px rgb(var(--onyx-rgb) / .06); color: var(--ink-2); font-size: 9px; font-weight: 700; line-height: 12px; text-align: center; white-space: nowrap; }
.side .slots { grid-row: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.side .slots i { width: auto; height: 12px; border-radius: 6px; background: rgb(var(--onyx-rgb) / .06); box-shadow: inset 0 0 0 1px rgb(var(--onyx-rgb) / .05); }
.side .slots i.on { box-shadow: 0 0 0 1px rgb(var(--onyx-rgb) / .1), 0 1px 3px rgb(var(--onyx-rgb) / .1); }
.side.opp .slab { grid-column: 1; }
.side.opp .slots { grid-column: 2; }
.side.me .slab { grid-column: 2; }
.side.me .slots { grid-column: 1; }
.side .pw { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: inherit; column-gap: 6px; min-height: 0; padding: 0; margin: 0; border-radius: 14px; pointer-events: auto; }
.side .pw::before { inset: -8px -6px; }
.pwcap { grid-row: 1; display: flex; align-items: center; gap: 2px; height: 28px; padding: 0 7px; border-radius: 14px; background: rgb(var(--ivory-rgb) / .88); box-shadow: 0 0 0 1px rgb(var(--onyx-rgb) / .06); }
.pwcap .pwbar { flex: 1; width: auto; margin: 0; }
.pwx { grid-row: 1; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: rgb(var(--ivory-rgb) / .92); box-shadow: 0 0 0 1px rgb(var(--onyx-rgb) / .06); color: var(--ink-2); font-size: 12px; font-weight: 800; letter-spacing: -.02em; }
.pwx.on { background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); box-shadow: 0 0 8px rgb(var(--gold-rgb) / .6); }
.side.opp .pwx { grid-column: 1; }
.side.opp .pwcap { grid-column: 2; }
.side.me .pwx { grid-column: 2; }
.side.me .pwcap { grid-column: 1; }
.midrow .stage { position: absolute; left: 50%; top: 0; width: var(--gd, 64px); height: var(--gd, 64px); margin-left: calc(var(--gd, 64px) / -2); padding: 0; border-radius: 50%; overflow: visible; }
.midrow .gauge { --D: var(--gd, 64px); }
.midrow .stage .st-sub { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } /* 状态那一行只给读屏；看的人看主按钮和浮动提示 */
.midrow .stage .corner { top: -4px; }
.midrow .stage .corner.pot { top: auto; bottom: -4px; left: -20px; }
.midrow .stage .corner.stake { display: none; top: -6px; right: -6px; left: auto; background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); }
.game.stakein .midrow .stage .corner.stake { display: inline-flex; }
.game.stakein .zone.opp > .zstake { visibility: hidden; } /* 指示器左上挨着对方的筹码：奖池角标放到左下 */
/* 出牌区：手牌的扇形外面也描一段圆环。这一块左右铺满屏幕，扇形两头的牌可以伸出屏幕两成 */
.handbox { position: relative; z-index: 1; margin: -14px calc(var(--safe-r) - var(--gpr)) 0 calc(var(--safe-l) - var(--gpl)); } /* 往上收一点：自己地产区内弧中间拱起来，底下本来就空着。

.hand.fan { overflow: hidden; overflow: clip; } /* 扇形放得下：不能横向滑（伸出去的那点直接裁掉）；放不下才叠起来横向滑 */
/* 主按钮：整排 */
.dock { flex-direction: column; align-items: stretch; gap: 0; padding-top: 0; padding-bottom: calc(var(--safe-b) + 6px); }
/* 底部两页：左右滑（停在整页），第一页主按钮、第二页发消息框 */
.dpager { display: flex; margin: -10px -10px -6px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.dpager::-webkit-scrollbar { display: none; }
.dpg { flex: 0 0 100%; min-width: 0; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px; scroll-snap-align: start; scroll-snap-stop: always; }
.dpg .chatq { height: 52px; border-radius: 26px; font-size: 16px; padding-left: 18px; }
.dock .round.raise { width: 52px; height: 52px; }

@media (min-width: 700px) {
  :root { --tw: 70px; --twmax: 92px; --hw: clamp(66px, 12svh, 108px); }
  .game { --gap: 16px; padding-top: calc(var(--safe-t) + 22px); }
}
@media (min-width: 900px) { /* 电脑：对局区域两边是空白，扇形两头的牌渐隐出去，不在 760px 的边上被一刀切断。
  只给牌那一层：出牌区的圆环拱在这一块上沿外面，遮罩会把它裁掉；地产区也不加（名字会被一起淡掉） */
  .hand { -webkit-mask-image: linear-gradient(90deg, transparent, var(--onyx) 32px, var(--onyx) calc(100% - 32px), transparent); mask-image: linear-gradient(90deg, transparent, var(--onyx) 32px, var(--onyx) calc(100% - 32px), transparent); }
}
/* 偏矮的屏幕（iPhone SE、Safari 带地址栏时）：各块收紧一点，尽量一屏放下不用滚 */
@media (max-height: 720px) {
  :root { --mh: 64px; --oppx: calc(clamp(54px, 9svh, 80px) + 10px); --hw: clamp(48px, min(16vw, 9svh), 72px); } /* 中间一排两边要竖着放银行和张数：不收矮 */
  .game { padding-top: 0; }
  .dock .btn, .dpg .chatq { height: 48px; }
  .dock .round.raise { width: 48px; height: 48px; }
  .zone { min-height: 129px; }
  .zone.me { min-height: 125px; }
  .who { min-height: 30px; }
}
/* 手机横屏这种特别矮的屏幕：本来就要上下滚，桌面区宁可高一点，也别把牌下面的说明裁掉 */
@media (max-height: 480px) {
  .zone { min-height: 146px; }
  .zone.me { min-height: 142px; }
  .dock:not(.picking) { position: relative; } /* 横屏本来就要上下滚：底栏跟在手牌后面，不再一直压在自己的地产区和指示器上；选牌时照旧贴底（倍率面板在底栏里，要看得见） */
}
/* 有鼠标的设备才有悬停效果：牌微微抬起，按钮底色略深（触屏点一下不会卡在"悬停"状态） */
@media (hover: hover) and (pointer: fine) {
  .hand .card:not(.sel):not(.dim):hover { translate: 0 -8px; }
  .set:not(.dim):hover .stack, .bank:hover .pile { translate: 0 -3px; }
  .btn.primary:not([disabled]):hover { background: var(--wine-hi); }
  .btn.cpick:not(.done):hover { background: var(--mist-2); }
  .btn.plain:not([disabled]):hover, .round:hover, .chip:not([aria-checked="true"]):hover, .resume:hover { background: var(--mist-2); }
  .menu button:hover { background: var(--mist); }
  .btn, .round, .chip, .resume, .menu button { transition-property: transform, background-color, opacity; }
}
/* 很矮的屏幕（横屏手机等）：中间一排和手牌再收一点，放不下就上下滚 */
@media (max-height: 620px) {
  :root { --mh: 56px; --hw: clamp(52px, min(18vw, 13svh), 76px); }
}
/* 全球匹配：首页按钮、雷达等待页、对手的对话气泡 */
.btn.matchbtn { gap: 8px; }
.btn.matchbtn svg { width: 20px; height: 20px; }
.panel .btn.matchbtn + .btn { margin-top: 10px; }
.page.matching { text-align: center; }
.radar { position: relative; width: 168px; height: 168px; margin: 28px auto 18px; }
.radar i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--gold); opacity: 0; animation: radar 2.4s ease-out infinite; }
.radar i:nth-child(2) { animation-delay: .8s; }
.radar i:nth-child(3) { animation-delay: 1.6s; }
.radar b { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; display: grid; place-items: center; border-radius: 50%; background: var(--wine-grad); color: var(--ivory); box-shadow: 0 0 0 3px var(--gold-hi), 0 12px 30px rgba(94, 13, 36, .4); }
.radar b svg { width: 40px; height: 40px; animation: spinGlobe 6s linear infinite; }
@keyframes radar { 0% { transform: scale(.35); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
@keyframes spinGlobe { to { transform: rotate(360deg); } }
.page.matching .lede b { display: inline-block; min-width: 1.4em; padding: 0 6px; border-radius: 999px; background: var(--wine); color: var(--ivory); font-variant-numeric: tabular-nums; }
.say { position: fixed; z-index: 3; max-width: min(260px, 70vw); padding: 8px 12px; border-radius: 16px 16px 16px 6px; background: var(--wine-grad); color: var(--ivory); font-size: 14px; font-weight: 600; line-height: 1.35; box-shadow: 0 10px 26px rgba(94, 13, 36, .35); pointer-events: none; }
.say.down { border-radius: 6px 16px 16px 16px; }
.sub.mrec { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); font-weight: 700; }
/* 收益预期：手牌上的"最高 32M"、牌桌上奖池发光 */
.hand .card .gain { position: absolute; left: 4%; top: 4%; z-index: 4; /* 扇形里每张牌只露出左边：标签放左上角才看得全 */ padding: 1px 7px; border-radius: 999px; background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); font-size: calc(var(--w) * .13); font-weight: 800; line-height: 1.5; white-space: nowrap; box-shadow: 0 0 0 1.5px #f5e8c6, 0 3px 8px rgb(138 106 34 / .45); pointer-events: none; animation: gainPulse 1.8s ease-in-out infinite; }
.hand .card .gain i { font-style: normal; }
.hand.tight .card .gain { padding: 1px 5px; } /* 扇形挤（牌距 < 62px）：只留「52M」，不让下一张牌盖掉数字 */
.hand.tight .card .gain i { display: none; }
@keyframes gainPulse { 50% { box-shadow: 0 0 0 1.5px var(--gold-hi), 0 3px 8px rgb(138 106 34 / 0.45), 0 0 14px 2px rgb(var(--gold-rgb) / .8); } }
.stage .corner.pot { animation: potGlow 1.6s ease-in-out infinite; }
@keyframes potGlow { 50% { box-shadow: 0 0 0 2px rgb(var(--gold-hi-rgb) / .6), 0 0 16px rgb(var(--gold-rgb) / .85); } }
.sub.teaser { display: inline-block; margin-top: 10px; padding: 6px 12px; border-radius: 12px; background: var(--gold-face); color: var(--onyx); text-shadow: var(--on-gold); font-weight: 700; }
/* 集齐一整套：史诗级大场面 */
.epic { position: fixed; inset: 0; z-index: 48; pointer-events: none; --fan: min(15vw, 74px); }
.epic .ep-dim { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgb(var(--wine-rgb) / .55), rgb(var(--onyx-rgb) / .9) 70%); }
.epic.opp .ep-dim { background: radial-gradient(circle at 50% 45%, rgb(94 13 36 / 0.5), rgb(var(--onyx-rgb) / .82) 70%); }
.epic .ep-rays { position: absolute; left: 50%; top: 44%; width: 170vmax; height: 170vmax; transform: translate(-50%, -50%); border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgb(var(--gold-hi-rgb) / .38) 0deg 7deg, rgb(var(--gold-hi-rgb) / 0) 7deg 20deg);
  -webkit-mask-image: radial-gradient(circle, var(--onyx) 8%, transparent 52%); mask-image: radial-gradient(circle, var(--onyx) 8%, transparent 52%); }
.epic .ep-ring { position: absolute; left: 50%; top: 44%; width: 46vmin; height: 46vmin; border-radius: 50%; border: 6px solid var(--gold-hi); box-shadow: 0 0 40px 10px rgb(var(--gold-rgb) / .6), inset 0 0 30px rgb(var(--gold-rgb) / .5); transform: translate(-50%, -50%); opacity: 0; }
.epic .ep-cards { position: absolute; left: 50%; top: 40%; width: 0; height: 0; }
.epic .ep-card { position: absolute; left: 0; top: 0; transform-origin: 50% 120%; margin-top: calc(min(26vw, 120px) / var(--ratio) * -.5); filter: drop-shadow(0 14px 22px rgb(var(--onyx-rgb) / .5)) drop-shadow(0 0 16px var(--c)); }
.epic .ep-card .card { --w: min(26vw, 120px); border-radius: calc(var(--w) * .08); }
.epic .ep-ribbon { position: absolute; left: 50%; top: calc(40% + min(26vw, 120px) / var(--ratio) * .5 + 26px); transform: translate(-50%, -50%); padding: 10px 34px 12px; border-radius: 16px;
  background: var(--wine-grad); box-shadow: 0 0 0 3px var(--gold-hi), 0 0 0 6px var(--wine-down), 0 18px 40px rgb(var(--onyx-rgb) / .5), 0 0 60px rgb(var(--gold-rgb) / .55);
  color: var(--ivory); text-align: center; white-space: nowrap; }
.epic .ep-ribbon small { display: block; font-size: 13px; font-weight: 700; letter-spacing: .3em; opacity: .9; }
.epic .ep-ribbon b { display: block; font-size: 40px; line-height: 1.05; font-weight: 900; letter-spacing: .08em; text-shadow: 0 2px 0 rgb(var(--onyx-rgb) / .35), 0 0 22px var(--c); }
.epic .ep-rent { position: absolute; left: 50%; top: calc(40% + min(26vw, 120px) / var(--ratio) * .5 + 100px); transform: translate(-50%, 0); padding: 6px 18px; border-radius: 999px; background: var(--gold-face); color: var(--onyx); font-size: 16px; font-weight: 800; text-shadow: var(--on-gold); white-space: nowrap; }
.epic .ep-rent b { font-size: 22px; font-variant-numeric: tabular-nums; }
/* 赢下整局的收尾：金色的暗场和绶带；牌绕自己的中心转（从桌上原位起飞时位置才对得上） */
.epic.win .ep-dim { background: radial-gradient(circle at 50% 42%, rgb(var(--gold-rgb) / .5), rgb(var(--onyx-rgb) / .9) 70%); }
.epic.win .ep-card { transform-origin: 50% 50%; }
.epic.win .ep-ribbon { padding: 10px 40px 14px; background: var(--gold-face); color: var(--onyx); box-shadow: 0 0 0 3px var(--gold-hi), 0 0 0 6px var(--gold-deep), 0 18px 40px rgb(var(--onyx-rgb) / .5), 0 0 80px rgb(var(--gold-rgb) / .75); }
.epic.win .ep-ribbon b { font-size: 52px; text-shadow: var(--on-gold), 0 0 22px rgb(var(--gold-hi-rgb) / .9); }
/* 输了：自己这边褪色（对方点"再来一局"时整页重画也保持着） */
.game.lost .zone.me, .game.lost .side.me, .game.lost .handbox { filter: saturate(.3) brightness(.97); transition: filter .9s ease; }
/* 按钮上扫一道光：光带跟着按钮的圆角裁掉 */
.btn:has(> .shine) { position: relative; overflow: hidden; }
.btn > .shine { border-radius: inherit; }
.epic.still .ep-card { transform: translate(calc(-50% + var(--k) * var(--fan))) rotate(calc(var(--k) * 9deg)); }
.epic.still .ep-ring { display: none; }
.epic.still .ep-ribbon { transform: translate(-50%, -50%) rotate(-3deg); }
.ep-flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 44%, var(--ivory), rgb(var(--gold-hi-rgb) / .6) 40%, rgb(var(--gold-rgb) / 0) 75%); pointer-events: none; }
.ep-flash.gold { position: fixed; z-index: 49; background: radial-gradient(circle at 50% 45%, rgb(var(--ivory-rgb) / .95), rgb(var(--gold-rgb) / .45) 45%, rgb(var(--gold-rgb) / 0) 80%); }
/* 金币雨 */
#fx canvas.rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 49; }
.rain-amt { position: fixed; z-index: 50; left: var(--safe-mid); top: 42%; transform: translate(-50%, -50%); padding: 10px 30px 14px; border-radius: 20px; text-align: center; white-space: nowrap;
  background: var(--wine-grad); box-shadow: 0 0 0 3px var(--gold-hi), 0 0 0 6px var(--wine-down), 0 20px 50px rgb(var(--onyx-rgb) / .45), 0 0 70px rgb(var(--gold-rgb) / .6); color: var(--ivory); pointer-events: none; }
.rain-amt small { display: block; font-size: 14px; font-weight: 700; letter-spacing: .2em; }
.rain-amt b { display: block; font-size: 52px; line-height: 1; font-weight: 900; letter-spacing: -.01em; font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 rgb(var(--onyx-rgb) / .3), 0 0 26px rgb(var(--gold-hi-rgb) / .9); }
.rain-amt.huge b { font-size: 68px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  .sheet, .scrim { transition-duration: 120ms !important; }
  .sheet { transform: translate(-50%, 0); opacity: 0; transition-property: opacity; }
  #sheet-root.open .sheet { opacity: 1; }
}
/* 线框风格（设计要求）：桌上除了按钮，元素默认只描边不填色——弧形区域、胶囊、标签、空的颜色格、筹码条的槽、倍率圈、成套说明。
 * 必要的照旧填色：表示状态 / 数据的（凑齐的颜色格、筹码进度、加成中的倍率、剩下的出牌次数、本局倍率、奖池、捉鬼 / 吸血）、
 * 要提醒的（超手牌上限、差一张成套），和压在牌面图案上的（手牌上的收益标签） */
.arc path, .handbox > .arc path { fill: none; }
.bend .bg { fill: none; stroke: rgb(var(--onyx-rgb) / .22); stroke-width: 1.2px; filter: none; }
.bend .bg.b-zstake { fill: url(#bdGold); filter: none; }
.bend .bg.b-pkm { fill: url(#bdWine); stroke: rgb(var(--onyx-rgb) / .08); } /* 倍率按钮是按钮：照旧填色（×1 白字要有底色才看得见） */
.bend .bg.b-pkm.b-bet { fill: url(#bdGold); stroke: rgb(138 106 34 / 0.25); }
.bend .bg.b-pkm.b-off { fill: rgb(var(--onyx-rgb) / .04); stroke: none; }
.zstake:has(.mg) .bend .bg.b-zstake { fill: url(#bdWine); }
.slab { background: none; box-shadow: inset 0 0 0 1px rgb(var(--onyx-rgb) / .22); }
.slab.mp { background: var(--wine-grad); color: var(--ivory); box-shadow: none; } /* 赛点 / 离线：要提醒的，填色 */
.slab.off { background: var(--ink-2); color: var(--ivory); box-shadow: none; }
.side .slots i { background: none; box-shadow: inset 0 0 0 1px rgb(var(--onyx-rgb) / .22); }
.side .slots i.on { background: var(--c); box-shadow: 0 0 0 1px rgb(var(--onyx-rgb) / .1); }
.pwcap { background: none; box-shadow: inset 0 0 0 1px rgb(var(--onyx-rgb) / .22); }
.pwx { background: none; box-shadow: inset 0 0 0 1px rgb(var(--onyx-rgb) / .22); }
.set.full .cap { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--c); }
.set.mortgaged .cap { background: none; color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.g-dot:not(.on) { background: none; box-shadow: inset 0 0 0 1.5px rgb(var(--onyx-rgb) / .2); }
.g-dot.lapsed:not(.on) { box-shadow: inset 0 0 0 2px rgb(var(--wine-hi-rgb) / .45); }
/* 既没描边也没填色的（普通说明：「1/3」、银行金额、散落建筑）：统一浅灰底胶囊 */
.arow .set:not(.full):not(.mortgaged) .cap:not(.near), .arow .bank .cap { padding: 0 7px; border-radius: 999px; background: var(--mist-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--ink); }
/* 标签统一（设计要求）：地产区里每组、银行下面的说明一样宽、一样高，文字居中；
 * 地产区和手牌上的填色都用淡色：淡底 + 同色描边 + 深一号的字（按钮除外）。中间那一排（指示器、两边、本局倍率）照原来的颜色 */
.arow .cap, .arow .set .cap.near, .arow .set.full .cap, .arow .set.mortgaged .cap { box-sizing: border-box; display: inline-block; width: 60px; height: 18px; padding: 0 4px; border-radius: 9px; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: none; }
.arow .cap, .arow .set .cap.near, .arow .set.full .cap, .arow .set.mortgaged .cap { width: auto; min-width: 60px; } /* 短的一样宽；长的（银行 13M、加成的租金）跟着字变宽，不被截成「银行 1…」 */
.zone .arow > .tight .cap.cap { min-width: 0; } /* 挤的地方（.tight）收成短的那一版就按字宽，不再叠在邻居上 */
.arow .cap * { font-size: inherit; line-height: inherit; }
.arow .bank .cap .ico { display: none; }
.arow .set.full .cap { background: color-mix(in srgb, var(--c) 16%, var(--ivory)); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--c); }
.arow .set .cap.near { background: #f7f1e4; color: #795d1f; box-shadow: inset 0 0 0 1.5px var(--gold); }
.zone.opp .arow .set .cap.near { background: #f2e8eb; color: var(--wine); box-shadow: inset 0 0 0 1.5px var(--wine-hi); }
.arow .set.mortgaged .cap { background: var(--mist); color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.bend .b-hc.b-over { fill: #f2e8eb; stroke: var(--wine-hi); }
.zcount .hc.over .cnt { color: var(--wine); }
.hand .card .gain { background: #f7f1e4; color: #795d1f; text-shadow: none; box-shadow: inset 0 0 0 1.5px var(--gold); }

/* ── 展开的 iPhone Duo（内屏横着约 890×626，折痕在正中）和别的横屏宽屏：分成左右两栏，中间空出一道折痕宽的缝，不把按钮、牌放在折痕上。
 *    左栏是整张牌桌（顶栏、对方地产区、中间一排、自己地产区），和手机竖屏差不多大，弧形照旧；
 *    右栏是自己的手：上面实时对局记录，下面弧形手牌和主按钮，牌比手机上大一号。底部面板、下拉面板也各放进对应的那一栏 ──
 *    手机（含合起来的外屏 466×678）不受影响：两栏的外壳是 display: contents */
.pane { display: contents; }
.livelog { display: none; }
@media (min-width: 820px) and (min-aspect-ratio: 5/4) and (min-height: 500px) {
  :root { --fold: 28px; }
  .game { max-width: none; height: 100vh; height: 100svh; min-height: 0; box-sizing: border-box; overflow: hidden;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: var(--fold); padding-bottom: 0; }
  .pane { position: relative; display: flex; flex-direction: column; gap: var(--gap); min-width: 0; min-height: 0; }
  .pane.ph { --hw: clamp(56px, 11svh, 84px); justify-content: flex-end; gap: 0; }
  .handbox { margin: 0 calc(var(--safe-r) - var(--gpr)) 0 0; }
  .dock { margin: 0 calc(var(--safe-r) - var(--gpr)) 0 0; }
  .hand { -webkit-mask-image: none; mask-image: none; }
  .pane.ph .handbox > .arc { overflow: hidden; } /* 手牌的圆环两头不伸过折痕 */
  .pane.pt { padding-bottom: calc(var(--safe-b) + 14px); } /* 左栏底下没有手牌压着：地产区下沿和角上的牌堆不贴屏幕边 */
  .livelog { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; margin: calc(var(--safe-t) + 12px) 0 6px; border-radius: 22px; background: var(--mist); overflow: hidden; }
  .ll-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 16px; font-size: 13px; font-weight: 800; letter-spacing: .04em; color: var(--ink-2); text-align: left; }
  .ll-head span { font-size: 20px; line-height: 1; color: var(--ink-3); }
  .ll-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 12px; scrollbar-width: none; -webkit-mask-image: linear-gradient(to bottom, transparent, var(--onyx) 18px); mask-image: linear-gradient(to bottom, transparent, var(--onyx) 18px); }
  .ll-list::-webkit-scrollbar { display: none; }
  .ll-list p { margin: 0; padding: 3px 0; font-size: 13.5px; line-height: 1.45; color: var(--ink); }
  .ll-list p.turn { margin-top: 8px; font-size: 12px; font-weight: 800; color: var(--ink-2); }
  .ll-list p.empty { color: var(--ink-2); }
  .ll-list p:last-child { font-weight: 700; }
  .sheet { left: 75%; width: min(560px, calc(50% - var(--fold) / 2 - 12px)); }
  .dr-panel { left: 25%; width: min(440px, calc(50% - var(--fold) / 2 - 20px)); }
}
</style>

<body>
