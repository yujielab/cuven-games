        else pick(e.amount >= 10 ? 'boo' : 'eyeroll', e.amount >= 10 ? 7 : 6);
        break;
      // 秘密竞价
      case 'auctionStart': pick('suspicious', 5); break;
      case 'auctionBid': if (e.player === o) pick('sealed', 4); break;
      case 'auctionResult': pick(e.winner == null ? 'phew' : e.winner === o ? 'nerd' : 'cry', e.winner == null ? 8 : 9); break;
      // 拍卖
      case 'saleStart': if (P[o].bankTotal >= 1) pick('drool', 4); break;
      case 'saleBid': pick(e.player === o ? 'smirk' : P[o].bankTotal > e.amount ? 'heated' : 'sad', 3); break;
      case 'saleEnd': if (!e.sold) pick('meh', 3); else pick(e.player === o ? 'deal' : 'sad', 6); break;
      // 恶意收购 / 轮盘赌
      case 'takeoverStart': pick(e.player === o ? 'crazy' : 'shaken', 10); break;
      case 'rouletteSkip': if (e.player === o) pick('sad', 5); break;
      case 'rouletteSpin':
        if (e.player === o) pick({ hit: 'starstruck', win: 'grin', lose: 'sad', zero: 'dead' }[e.outcome], { hit: 9, win: 6, lose: 5, zero: 9 }[e.outcome] || 0);
        else pick({ hit: 'mindblown', win: 'eyeroll', lose: 'smirk', zero: 'lol' }[e.outcome], { hit: 9, win: 5, lose: 5, zero: 8 }[e.outcome] || 0);
        break;
      case 'roulettePrize': pick(e.player === o ? 'starstruck' : 'mindblown', 9); break;
      case 'rouletteCashOut': {
        if (e.reason === 'hit') break; // 押中号码离场：上面的奖品已经表现过了
        const start = (pp && pp.action === 'takeover' && pp.start) || (takeover && takeover.chips);
        if (!start || start[e.player] == null) break;
        const gain = e.chips - start[e.player]; // 比上桌时多了 / 少了多少筹码
        if (e.player === o) pick(gain >= 10 ? 'rich' : gain > 0 ? 'nerd' : gain === 0 ? 'meh' : 'brave', gain >= 10 ? 7 : gain === 0 ? 5 : 6);
        else pick(gain >= 10 ? 'boo' : gain > 0 ? 'eyeroll' : 'smirk', gain >= 10 ? 6 : 5);
        break;
      }
      case 'rouletteBust':
        if (e.player === o) pick(e.reason === 'zero' ? 'dead' : 'melt', 9);
        else pick(e.reason === 'zero' ? 'lol' : 'tease', 8);
        break;
      default: break;
    }
  }
  // 凑齐一套 / 到了赛点 / 一套没了（和这次更新之前的局面比）；恶意收购那次整个桌面都换了，不算
  const need = v.rules.setsToWin;
  const was = prevSnap && prevSnap.view ? [0, 1].map((p) => prevSnap.view.players[p].fullColors.length) : null;
  if (was && !takeover) {
    const full = [0, 1].map((p) => P[p].fullColors.length);
    const mp = (p) => need > 1 && full[p] >= need - 1;
    if (full[o] > was[o]) pick(mp(o) ? 'devil' : 'party', mp(o) ? 8 : 7);
    if (full[i] > was[i]) pick(mp(i) ? 'panic' : 'worried', mp(i) ? 8 : 6);
    const moved = (p) => events.some((e) => e.type === 'move' && e.player === p); // 自己挪牌拆开的整套不算"没了"
    if (full[o] < was[o] && !moved(o)) pick('cry', 9); // 他的一套没了（被抢 / 被毁 / 付掉了）
    if (full[i] < was[i] && !moved(i)) pick('grin', 5); // 我的一套没了
  }
  if (best) { oppFace.wait = Date.now() + 500; setTimeout(() => faceShow(best, 2800), 450); } // 等牌落下再变脸；这半秒里 faceTick 别抢先换成新局面的脸
}
// 换上一个表情；ms = 0 表示持续的状态（局面变了才换）
function faceShow(mood, ms) {
  if (!S.snap || S.screen !== 'game') return;
  if (oppFace.el && oppFace.mood === mood) { if (ms) oppFace.until = Date.now() + ms; return; } // 已经是这个心情：反应就多留一会儿
  const st = facePick(mood);
  if (!st) { if (!ms && oppFace.el) faceDrop(false); return; }
  faceDrop(true);
  const el = document.createElement('span');
  el.className = 'g-face';
  el.innerHTML = stickers.html(st, 'msg');
  Object.assign(oppFace, { el, mood, until: ms ? Date.now() + ms : 0 });
  faceSync();
  stickers.mount(el);
  if (motionOK()) el.animate([{ transform: 'translate(-50%, -54%) scale(.3)', opacity: 0 }, { transform: 'translate(-50%, -54%) scale(1.12)', opacity: 1, offset: 0.6 }, { transform: 'translate(-50%, -54%) scale(1)', opacity: 1 }], { duration: 360, easing: EASE_OUT });
}
function faceDrop(instant) {
  const el = oppFace.el;
  Object.assign(oppFace, { el: null, mood: '', until: 0 });
  const st = $('#screen .stage');
  if (st) st.classList.remove('face');
  if (!el) return;
  const gone = () => { stickers.unmount(el); el.remove(); };
  if (instant || !motionOK() || !el.isConnected) { gone(); return; }
  el.animate([{ opacity: 1, transform: 'translate(-50%, -54%) scale(1)' }, { opacity: 0, transform: 'translate(-50%, -54%) scale(.5)' }], { duration: 200, easing: EASE_OUT }).onfinish = gone;
}
// 每次重绘后：把表情挪进新画的指示器里；我自己在读秒时先藏起来，不挡倒计时
function faceSync() {
  const el = oppFace.el;
  const st = $('#screen .stage');
  const g = st && $('.gauge', st);
  if (!el || !g) return;
  const mine = !!S.clock && V().phase !== 'gameOver' && (actorSeat() === me() || !!(O() && O().respond && O().respond.action === 'auction')); // 秘密竞价两人同一个倒计时：我还没出价也算我在读秒
  el.hidden = mine;
  st.classList.toggle('face', !mine);
  if (el.parentNode !== g) g.appendChild(el);
}
// 每秒看一次：反应演完了就换回局面心情；局面心情变了就换脸
function faceTick() {
  if (S.screen !== 'game' || !S.snap) { if (oppFace.el) faceDrop(true); return; }
  if (Date.now() < (oppFace.wait || 0)) return; // 反应马上要出来
  if (oppFace.el && oppFace.until && Date.now() < oppFace.until) return; // 反应还在演
  const m = faceMood();
  if (oppFace.el && oppFace.until) { if (m === oppFace.mood) { oppFace.until = 0; return; } faceDrop(false); } // 反应演完：心情没变就留着
  if (m) { if (oppFace.mood !== m) faceShow(m, 0); } else if (oppFace.el) faceDrop(false);
}
setInterval(faceTick, 1000);
// 对方发来的表情：面板没开时，从他名字旁边弹出一张大的
function stickerPop(seat, st) {
  if (!S.room || !S.snap || S.screen !== 'game') return;
  const mine = seat === me();
  const av = nameEl(seat);
  if (!av) return;
  const r = av.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'stkpop' + (mine ? '' : ' down');
  el.innerHTML = stickers.html(st, 'big');
  fxLayer.appendChild(el);
  stickers.mount(el);
  el.style.left = Math.max(8, Math.min(innerWidth - 140, r.left)) + 'px';
  el.style.top = Math.max(4, mine ? r.top - 140 : r.bottom + 6) + 'px';
  speak(`${nameOf(seat)} 发了一个表情 ${st.emoji || ''}`);
  sound.play('pop');
  const out = () => { stickers.unmount(el); el.remove(); };
  if (!motionOK()) { setTimeout(out, 3200); return; }
  el.animate([{ opacity: 0, transform: 'scale(.4) rotate(-8deg)' }, { opacity: 1, transform: 'scale(1.08) rotate(3deg)', offset: 0.12 }, { transform: 'scale(1) rotate(0)', offset: 0.2 }, { opacity: 1, offset: 0.88 }, { opacity: 0, transform: 'scale(.9)' }], { duration: 3200, easing: EASE_OUT }).onfinish = out;
}
const chat = {
  list: [],
  unread: 0,
  mute: false,
  reset() { this.list = []; this.unread = 0; this.mute = false; },
  load(list) {
    const pend = this.list.filter((x) => x.pending);
    this.list = (list || []).concat(pend);
    this.paint();
  },
  add(m, cid) {
    const k = cid ? this.list.findIndex((x) => x.cid === cid) : -1;
    if (k >= 0) this.list[k] = Object.assign({}, m, { cid }); // 留着 cid：聊天记录里这一行原地变成"已送达"，不用整列重画
    else if (!this.list.some((x) => x.id === m.id)) this.list.push(m);
    else return;
    if (this.list.length > 80) this.list.splice(0, this.list.length - 80);
    const mine = S.room && m.seat === S.room.seat;
    if (!mine && !this.mute) {
      if (S.sheet && S.sheet.type === 'chat') sound.play('pop');
      else { this.unread++; this.badge(); if (m.sticker) stickerPop(m.seat, m.sticker); else sayBubble(m.seat, m.text); haptic('light'); }
    }
    this.paint();
  },
  reject(cid, why) {
    const x = this.list.find((y) => y.cid === cid);
    if (x) { x.pending = false; x.failed = true; }
    notice(why || '没发出去', 'err');
    this.paint();
  },
  send(text) {
    const t = String(text || '').replace(/\s+/g, ' ').trim();
    if (!t || !S.room) return false;
    if (!S.ws || S.ws.readyState !== 1) { notice('还没连上，连上后再发', 'err'); return false; }
    const cid = randomHex(6);
    const body = Array.from(t).slice(0, 120).join('');
    this.list.push({ cid, seat: S.room.seat, text: body, at: Date.now(), pending: true });
    try { S.ws.send(JSON.stringify({ t: 'chat', text: body, cid })); } catch { this.reject(cid, '没发出去，稍后再试'); return false; }
    sound.play('pop');
    this.paint();
    return true;
  },
  sendSticker(st) {
    if (!S.room) return false;
    if (!S.ws || S.ws.readyState !== 1) { notice('还没连上，连上后再发', 'err'); return false; }
    const cid = randomHex(6);
    this.list.push({ cid, seat: S.room.seat, text: '', sticker: st, at: Date.now(), pending: true });
    try { S.ws.send(JSON.stringify({ t: 'chat', sticker: st.id, cid })); } catch { this.reject(cid, '没发出去，稍后再试'); return false; }
    sound.play('pop');
    this.paint();
    return true;
  },
  badge() {
    const b = $('#screen [data-do="chat"]');
    if (b) { b.outerHTML = chatBtnHTML(); sectionHtml.delete('dpager'); } // 原地换了：同 renderDock
    if (S.screen === 'game' && S.snap) render(); // 顶栏上的未读数
  },
  // 聊天记录：能接着画就只补新的那几行（已经在播的表情不会被打断重来），对不上再整列重画
  paint() {
    const box = $('#chatlist');
    if (!box) return;
    const me0 = S.room ? S.room.seat : 0;
    const rows = this.list.filter((m) => !(this.mute && m.seat !== me0));
    const hid = this.list.length - rows.length;
    const key = (m) => (m.cid ? 'c' + m.cid : 'i' + m.id);
    const cls = (m) => `msg${m.seat === me0 ? ' me' : ''}${m.sticker ? ' sticker' : ''}${m.pending ? ' pending' : ''}${m.failed ? ' failed' : ''}`;
    const row = (m) => `<div class="${cls(m)}" data-k="${esc(key(m))}">${m.sticker ? stickers.html(m.sticker, 'msg') : esc(m.text)}${m.failed ? '<small>没发出去</small>' : ''}</div>`;
    box.querySelectorAll(':scope > p.empty').forEach((e) => e.remove());
    const kids = [...box.children];
    if (rows.length && kids.length <= rows.length && kids.every((e, j) => e.dataset.k === key(rows[j]))) {
      kids.forEach((e, j) => {
        const m = rows[j];
        if (e.className !== cls(m)) e.className = cls(m);
        const sm = e.querySelector(':scope > small');
        if (m.failed && !sm) e.insertAdjacentHTML('beforeend', '<small>没发出去</small>');
        else if (!m.failed && sm) sm.remove();
      });
      if (rows.length > kids.length) box.insertAdjacentHTML('beforeend', rows.slice(kids.length).map(row).join(''));
    } else box.innerHTML = rows.length ? rows.map(row).join('') : '<p class="empty">打个招呼吧</p>';
    if (hid) box.insertAdjacentHTML('beforeend', `<p class="empty">已屏蔽对方的 ${hid} 条消息</p>`);
    box.scrollTop = box.scrollHeight;
    stickers.mount(box);
  },
};
// 填聊天面板：消息列表 + 表情包面板（有表情包就直接摆出来）
function chatFill() {
  chat.paint();
  stickers.paint();
}
// 聊天框（底部第二页）：看起来就是一个输入框——没新消息时是"发消息…"，有新消息时显示最近一条和未读数；点开就是聊天面板，直接打字
function chatBtnHTML() {
  const n = chat.unread;
  const me0 = S.room ? S.room.seat : 0;
  const last = n ? chat.list.filter((m) => m.seat !== me0).pop() : null;
  const peek = last ? `${nameOf(last.seat)}：${last.sticker ? `[表情 ${last.sticker.emoji || ''}]` : last.text}` : '';
  return `<button class="chatq${n ? ' has' : ''}" data-do="chat" aria-label="聊天${n ? `，${n} 条新消息` : ''}">${ICON.chat}<span class="ph">${peek ? esc(peek) : '发消息…'}</span>${n ? `<b class="badge">${n > 9 ? '9+' : n}</b>` : ''}</button>`;
}
// 输入框里按回车发送（中文输入法选字时的回车不算）
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'chatin' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); DO['chat-send'](); }
  if (e.key === 'Enter' && e.target && e.target.id === 'drin' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); DO['dr-send'](); }
});

function goHome() {
  // 还在排队就从排队处撤下：否则十几秒内别人可能被配进这个没人的房间
  if (S.match) { clearTimeout(S.match.timer); api('/api/match/cancel', { roomId: S.match.roomId }).catch(() => {}); store.dropSeat(S.match.roomId); S.match = null; } // 撤下的排队：首页不再给「回到上一个房间」
  closeEmotes();
  closeDrawer();
  held.clear();
  if (S.pending) S.pending.done({ ok: false }, true);
  disconnect();
  wake.off();
  S.room = null;
  S.snap = null;
  S.info = null;
  S.netBody = null;
  S.netN = 0;
  S.netRoom = null;
  S.resyncing = false;
  chat.reset();
  S.target = null;
  S.sel = null;
  S.pick = null;
  S.pickShown = null;
  S.zoneOpen = null;
  S.arcScroll = {};
  S.log = [];
  S.lastIds = null;
  closeSheet();
  history.replaceState(null, '', location.pathname + location.search);
  S.screen = 'home';
  render();
}

function readCode() {
  const raw = (location.hash.replace(/^#\/?/, '') || params.get('room') || '').trim().toUpperCase();
  return ROOM_RE.test(raw) ? raw : null;
}

// 打开某个房间：本机有座位凭证就直接回座位，否则走加入流程
async function openRoom(code) {
  history.replaceState(null, '', location.href.split('#')[0] + '#' + code);
  const saved = store.seat(code);
  if (saved) {
    S.room = { id: code, seat: saved.seat, token: saved.token };
    S.screen = 'connecting';
    preloadFaces();
    connect();
    render();
    return;
  }
  S.join = { code, host: null, error: null, full: false, seats: null };
  S.screen = 'join';
  render();
  await loadJoinInfo();
}

// 加入页：看房间现在的样子（等人 / 已开局、谁在线）
async function loadJoinInfo() {
  const j = S.join;
  if (!j) return;
  try {
    const info = await api(`/api/rooms/${j.code}`);
    if (S.join !== j) return;
    j.full = !!info.players[1];
    j.seats = info.players;
    j.host = info.players[0] && info.players[0].name;
  } catch (e) {
    if (S.join !== j) return;
    j.full = false;
    j.error = e.message;
  }
  if (S.screen === 'join') render();
}

// 检查资源：后端读到的每套 Telegram 表情包，逐个列出序号和它对应的系统表情（Telegram 里给这张图标的那个），可以一键复制成文字
const PACK_TEXT = [];
function packsHTML(sh) {
  if (!sh.packs) return '<p class="sub">正在读取 Telegram 表情包清单…</p>';
  const r = stickers.raw || {};
  const packs = [['对方表情（中央指示器）', r.faces], ['表情面板', r.emotes && r.emotes.stickers, r.emotes && r.emotes.title], ['筹码图标（满 / 半 / 空）', r.chips]]
    .concat((r.sets || []).map((x) => ['聊天贴纸', x.stickers, x.title]))
    .filter(([, l]) => Array.isArray(l) && l.length);
  if (!packs.length) return '<p class="sub">Telegram 表情包：后端一套都没读到，详见 /api/health。</p>';
  PACK_TEXT.length = 0;
  return packs.map(([name, list, title], k) => {
    PACK_TEXT[k] = `${name}${title ? ` · ${title}` : ''}（${list.length} 个）\n` + list.map((x, j) => `${j + 1}\t${x.emoji || '-'}\t${x.kind}${x.nt ? '\t无缩略图' : ''}`).join('\n');
    return `<div class="pkhead"><p class="sub">${esc(name)}${title ? ` · ${esc(title)}` : ''}：${list.length} 个</p><button class="btn plain pkcopy" data-do="copy-pack" data-k="${k}">复制清单</button></div>
      <div class="pkgrid">${list.map((x, j) => `<div class="pk"><span class="pk-img">${stickers.html(x, 'grid')}</span><small>${j + 1} ${esc(x.emoji || '-')}</small></div>`).join('')}</div>`;
  }).join('');
}
async function checkCards() {
  const sh = { type: 'check', done: 0, bad: [], art: null, packs: false };
  openSheet(sh);
  stickers.load().then(() => { sh.packs = true; if (S.sheet === sh) renderSheet(); }); // Telegram 表情包清单
  // 成就 / 大乐透 / 银行图：每张都重新试一遍所有候选网址，列出结果
  Promise.all(Object.keys(CONFIG.ART).map((k) => resolveArt(k, true).then((ok) => [k, ok]))).then((res) => {
    sh.art = res;
    if (S.sheet === sh) renderSheet();
  });
  const faces = S.meta.faces.filter((f) => fileOf(f.face) != null);
  let i = 0;
  const worker = async () => {
    while (i < faces.length) {
      const f = faces[i++];
      const ok = await new Promise((resolve) => {
        const im = new Image();
        const t = setTimeout(() => resolve(false), 8000);
        im.onload = () => { clearTimeout(t); useRatio(im.naturalWidth / im.naturalHeight); resolve(true); };
        im.onerror = () => { clearTimeout(t); resolve(false); };
        im.src = rawImgUrl(f.face) + '?check=' + Date.now();
      });
      if (!ok) { sh.bad.push(f.face); S.missing.add(f.face); } else S.missing.delete(f.face);
      sh.done++;
      if (S.sheet === sh) renderSheet();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  if (S.screen === 'game') render();
}

/* ═══════════ 启动 ═══════════ */
const META_CARDS = 109; // 当前牌组张数（标准 106 + 自定义 3）；本机缓存的牌面数据张数不对就重新拉
// 启动：先用本机缓存的牌面数据立刻出界面，再在后台刷新；没有缓存就联网拉取，失败自动重试
async function boot() {
  probeTransform();
  render();
  const cached = store.get('meta', null);
  if (cached && Array.isArray(cached.cards) && cached.cards.length === META_CARDS) {
    S.meta = cached;
    route();
    api('/api/meta', null, 2).then((fresh) => {
      if (fresh.engine === S.meta.engine && fresh.service === S.meta.service) return;
      S.meta = fresh;
      store.set('meta', fresh);
      render();
    }).catch(() => { /* 用缓存继续 */ });
    return;
  }
  try {
    S.meta = await api('/api/meta', null, 3);
    store.set('meta', S.meta);
  } catch (e) {
    S.fatal = { title: '连不上对战服务', text: !navigator.onLine ? '网络断开，连上后自动重试。' : DEBUG ? `请确认 Worker 已部署，并把页面里的 CONFIG.API 改成它的地址（现在是 ${API}）。` : '服务器暂时连不上，稍后自动重试。' };
    S.screen = 'fatal';
    S.meta = null;
    $('#screen').innerHTML = fatalHTML().replace('data-do="go-home"', 'onclick="location.reload()"').replace('回到首页', '重新连接');
    addEventListener('online', () => location.reload(), { once: true });
    if (navigator.onLine) setTimeout(() => location.reload(), 15000); // 服务器那头的问题：过一会儿自己再试
    return;
  }
  route();
}

function route() {
  const code = readCode();
  if (code) openRoom(code);
  else { S.screen = 'home'; render(); }
}

if (DEBUG) window.__md = { S, act, send, render, cardHTML, motionOK, NET, probe, connect, notice, face: () => oppFace.mood };
boot();
})();
