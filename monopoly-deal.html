/* 二维码：字节模式、纠错等级 M、版本 1–40 自动选择、8 种掩码按惩罚分取最优（算法参照 ISO/IEC 18004，思路同 Nayuki 实现） */
const QR = (() => {
  const ECC_PER_BLOCK = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
  const NUM_BLOCKS = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];

  const bit = (x, i) => ((x >>> i) & 1) !== 0;

  function rawModules(ver) {
    let r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  const dataCodewords = (ver) => Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ver] * NUM_BLOCKS[ver];

  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 0xff;
  }
  function rsDivisor(degree) {
    const r = new Array(degree).fill(0);
    r[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < r.length; j++) {
        r[j] = gfMul(r[j], root);
        if (j + 1 < r.length) r[j] ^= r[j + 1];
      }
      root = gfMul(root, 2);
    }
    return r;
  }
  function rsRemainder(data, div) {
    const r = div.map(() => 0);
    for (const b of data) {
      const f = b ^ r.shift();
      r.push(0);
      div.forEach((c, i) => { r[i] ^= gfMul(c, f); });
    }
    return r;
  }

  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 1;
    for (; ver <= 40; ver++) {
      const ccBits = ver <= 9 ? 8 : 16;
      if (4 + ccBits + bytes.length * 8 <= dataCodewords(ver) * 8) break;
    }
    if (ver > 40) throw new Error('内容太长，二维码放不下');
    const ccBits = ver <= 9 ? 8 : 16;
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(4, 4); // 字节模式 0100
    push(bytes.length, ccBits);
    bytes.forEach((b) => push(b, 8));
    const cap = dataCodewords(ver) * 8;
    push(0, Math.min(4, cap - bits.length));
    push(0, (8 - (bits.length % 8)) % 8);
    for (let pad = 0xec; bits.length < cap; pad ^= 0xec ^ 0x11) push(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));

    // 分块加纠错码并交织
    const nb = NUM_BLOCKS[ver];
    const eccLen = ECC_PER_BLOCK[ver];
    const raw = Math.floor(rawModules(ver) / 8);
    const nShort = nb - (raw % nb);
    const shortLen = Math.floor(raw / nb);
    const div = rsDivisor(eccLen);
    const blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const codewords = [];
    for (let i = 0; i < blocks[0].length; i++) {
      blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= nShort) codewords.push(b[i]); });
    }

    // 画功能图形
    const size = ver * 4 + 17;
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setFn = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy));
        const x = cx + dx;
        const y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setFn(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3);
    finder(size - 4, 3);
    finder(3, size - 4);
    if (ver > 1) {
      const n = Math.floor(ver / 7) + 2;
      const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
      const pos = [6];
      for (let p = size - 7; pos.length < n; p -= step) pos.splice(1, 0, p);
      pos.forEach((y, i) => pos.forEach((x, j) => {
        if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) return;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setFn(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }));
    }
    const drawFormat = (mask) => {
      const d = (0 << 3) | mask; // 纠错等级 M 的格式位是 00
      let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((d << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setFn(8, i, bit(b, i));
      setFn(8, 7, bit(b, 6));
      setFn(8, 8, bit(b, 7));
      setFn(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(b, i));
      setFn(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
      const b = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const a = size - 11 + (i % 3);
        const c = Math.floor(i / 3);
        setFn(a, c, bit(b, i));
        setFn(c, a, bit(b, i));
      }
    }

    // 放数据（之字形）
    let k = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let v = 0; v < size; v++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const up = ((right + 1) & 2) === 0;
          const y = up ? size - 1 - v : v;
          if (!fn[y][x] && k < codewords.length * 8) {
            mod[y][x] = bit(codewords[k >>> 3], 7 - (k & 7));
            k++;
          }
        }
      }
    }

    const MASKS = [
      (x, y) => (x + y) % 2 === 0,
      (x, y) => y % 2 === 0,
      (x) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
      (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
      (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
    ];
    const applyMask = (m) => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && MASKS[m](x, y)) mod[y][x] = !mod[y][x];
    };
    const penalty = () => {
      let score = 0;
      const addHist = (len, h) => { if (h[0] === 0) len += size; h.pop(); h.unshift(len); };
      const countPat = (h) => {
        const n = h[1];
        const core = n > 0 && h[2] === n && h[3] === n * 3 && h[4] === n && h[5] === n;
        return (core && h[0] >= n * 4 && h[6] >= n ? 1 : 0) + (core && h[6] >= n * 4 && h[0] >= n ? 1 : 0);
      };
      const line = (get) => {
        let runColor = false;
        let run = 0;
        const h = [0, 0, 0, 0, 0, 0, 0];
        for (let i = 0; i < size; i++) {
          if (get(i) === runColor) {
            run++;
            if (run === 5) score += 3;
            else if (run > 5) score++;
          } else {
            addHist(run, h);
            if (!runColor) score += countPat(h) * 40;
            runColor = get(i);
            run = 1;
          }
        }
        if (runColor) { addHist(run, h); run = 0; }
        run += size;
        addHist(run, h);
        score += countPat(h) * 40;
      };
      for (let y = 0; y < size; y++) line((x) => mod[y][x]);
      for (let x = 0; x < size; x++) line((y) => mod[y][x]);
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
        const c = mod[y][x];
        if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) score += 3;
      }
      let dark = 0;
      for (const row of mod) for (const m of row) if (m) dark++;
      const total = size * size;
      score += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
      return score;
    };
    let best = 0;
    let bestScore = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m);
      drawFormat(m);
      const p = penalty();
      if (p < bestScore) { bestScore = p; best = m; }
      applyMask(m); // 异或两次 = 还原
    }
    const forced = encode.forceMask;
    if (forced != null) best = forced;
    applyMask(best);
    drawFormat(best);
    return { size, modules: mod, version: ver, mask: best };
  }

  // 输出 SVG：同一行连续的深色模块合并成一段，四周留 4 格静区
  function svg(text, opts) {
    const o = opts || {};
    const q = encode(text);
    const pad = 4;
    const n = q.size + pad * 2;
    let d = '';
    for (let y = 0; y < q.size; y++) {
      for (let x = 0; x < q.size;) {
        if (!q.modules[y][x]) { x++; continue; }
        let w = 1;
        while (x + w < q.size && q.modules[y][x + w]) w++;
        d += `M${x + pad} ${y + pad}h${w}v1h-${w}z`;
        x += w;
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"${o.label ? ` role="img" aria-label="${o.label}"` : ''}><rect width="${n}" height="${n}" fill="${o.bg || '#ffffff'}"/><path d="${d}" fill="${o.fg || '#17140f'}"/></svg>`;
  }

  return { encode, svg };
})();

      announce(m.events, m.lines);

    case 'room': {

      return;

    case 'error':

    case 'fatal':

/* ═══════════ 牌的飞行动画 ═══════════

  if (Math.abs(py) < 0.25) px = Math.abs(px) * (Math.sign(innerWidth / 2 - (from.cx + to.cx) / 2) || 1); // 几乎竖直地飞：往屏幕中间那侧鼓
  const lift = (o.lift == null ? 1 : o.lift) * Math.min(80, 18 + dist * 0.16);
  const cx = (x0 + x1) / 2 + px * lift;
  const cy = (y0 + y1) / 2 + py * lift;
  const rot = (o.rot == null ? 1 : o.rot) * Math.max(-9, Math.min(9, dx / 30));
  const rz0 = from.rz || 0; // 从横放的牌堆飞出 / 飞进横放的弃牌堆：途中顺势转正 / 转横
  const rz1 = to.rz || 0;
  const pop = o.pop == null ? 0.1 : o.pop;
  const ease = o.ease || ((t) => t);
  const frames = [];
  for (let k = 0; k <= 10; k++) {
    const t = ease(k / 10);
    const u = 1 - t;
    const x = u * u * x0 + 2 * u * t * cx + t * t * x1;
    const y = u * u * y0 + 2 * u * t * cy + t * t * y1;
    const sc = (s0 + (s1 - s0) * t) * (1 + pop * Math.sin(Math.PI * t));
    const f = { offset: k / 10, transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(rz0 + (rz1 - rz0) * t + rot * Math.sin(Math.PI * t)).toFixed(2)}deg) scale(${sc.toFixed(4)})` };
    if (o.fade) f.opacity = k === 10 ? 0.2 : 1;
    frames.push(f);
  }
  return frames;
}

function cleanClone(el) {
  const c = el.cloneNode(true);
  c.classList.remove('fresh', 'sel', 'pick', 'dim', 'can', 'ghost');
  ['data-card', 'data-do', 'id', 'aria-label'].forEach((k) => c.removeAttribute(k));
  ['--r', '--y', 'opacity', 'transform'].forEach((k) => c.style.removeProperty(k));
  return c;
}
function backEl() {
  const t = document.createElement('div');
  t.innerHTML = backHTML();
  return t.firstElementChild;
}
// 替身：flip 时里面是正反两面，先露牌背再翻到正面
function makeGhost(face, at, flip, cls, parent) {
  let g = face;
  if (flip) {
    g = document.createElement('div');
    g.className = 'flip3d';
    const fl = document.createElement('div');
    fl.className = 'flipper';
    fl.append(face, backEl());
    g.appendChild(fl);
  }
  g.classList.add('ghost');
  if (cls) g.classList.add(cls);
  Object.assign(g.style, { left: at.cx - at.w / 2 + 'px', top: at.cy - at.h / 2 + 'px', width: at.w + 'px', height: at.h + 'px' });
  g.style.setProperty('--w', at.w + 'px');
  if (flip) $$('.card', g).forEach((c) => c.style.setProperty('--w', at.w + 'px')); // .card 自己会把 --w 设回桌面卡宽，这里要压住
  (parent || document.body).appendChild(g);
  return g;
}

// 落地：轻轻一弹（用独立的 scale 属性，不打扰元素本身的 transform，比如扇形手牌）
function land(el, k) {
  if (!el || !el.isConnected || !motionOK()) return;
  el.animate([{ scale: String(k || 1.07) }, { scale: '1' }], { duration: 320, easing: EASE_OUT });
}

// 牌落在桌上"啪"一声。一次挪很多张（破产、清算、被抢走一整套）时限流：两声至少隔 70ms，400ms 里最多 4 声，不噼里啪啦
const slapAt = [];
function slap() {
  const now = performance.now();
  while (slapAt.length && now - slapAt[0] > 400) slapAt.shift();
  if (slapAt.length >= 4 || (slapAt.length && now - slapAt[slapAt.length - 1] < 70)) return;
  slapAt.push(now);
  sound.play('slap');
}
const softCoin = new Set(); // 自己刚存进银行的牌：落地时再轻轻响一声金币

function fly(el, from, to, o) {
  o = o || {};
  const id = el.dataset.card;
  const g = makeGhost(cleanClone(el), to, o.flip);
  hold(id);
  const dist = Math.hypot(from.cx - to.cx, from.cy - to.cy);
  const timing = { duration: o.dur || Math.round(Math.min(560, 340 + dist * 0.35)), delay: o.delay || 0, easing: EASE_MOVE, fill: 'backwards' };
  const a = track(g.animate(arcFrames(from, to, o), timing));
  if (o.flip) track(g.firstChild.animate([{ transform: 'rotateY(180deg)' }, { transform: 'rotateY(180deg)', offset: 0.12 }, { transform: 'rotateY(0deg)', offset: 0.85 }, { transform: 'rotateY(0deg)' }], timing));
  const due = performance.now() + timing.delay + timing.duration - 40; // 新的更新会把还在飞的牌直接跳到终点：那不算"落地"，不出声
  const done = () => {
    if (!g.isConnected) return;
    g.remove();
    const cur = release(id);
    if (o.land) land(cur);
    if (o.land && performance.now() >= due) slap();
    if (softCoin.delete(id)) sound.play('coin', 0, 0.55);
  };
  a.onfinish = done;
  a.oncancel = done;
  return a;
}

function playFlights(prev, skip) {
  if (!prev) return;
  let n = 0;
  let draws = 0;
  let oppIn = 0;
  let shifted = false;
  $$('#screen [data-card]').forEach((el) => {
    if (n >= 24 || (skip && skip.has(el.dataset.card))) return;
    const to = boxOf(el);
    if (!to || to.bottom < 0 || to.top > innerHeight) return;
    let from = prev.m.get(el.dataset.card);
    const o = {};
    const dr = dragDrops.get(el.dataset.card);
    if (dr) { // 拖出去 / 从面板点出去的牌：从停着的位置飞到真正的落点；还在手里（排着等揭晓放完）就别动，替身照旧停着
      if (!el.closest('.hand')) { fly(el, dr.box, to, { lift: 0.25, rot: 0.4, pop: 0.02, dur: 300, land: true }); n++; }
      return;
    }
    if (!from) { // 新出现的牌：自己手里的从牌堆翻着飞来；对方桌上 / 弃牌堆里的从对方手牌翻开飞来
      const inHand = !!el.closest('.hand');
      const src = inHand ? prev.deck : el.closest('.zone.opp, .side.opp') ? prev.opp : null;
      if (!src) return;
      from = src;
      o.flip = true;
      o.delay = inHand ? (S.handoff || 0) + 90 * draws++ : 70 * oppIn++; // 交接时我摸的牌等对方那张先落地
      o.land = !inHand;
    } else if (Math.abs(from.cx - to.cx) < 1 && Math.abs(from.cy - to.cy) < 1 && Math.abs(from.w - to.w) < 1) {
      return;
    } else if ((Math.abs(from.cy - to.cy) < 10 || (from.inHand && to.inHand) || (from.grp && from.grp === to.grp)) && Math.abs(from.w - to.w) < 2) {
      Object.assign(o, { lift: 0.12, rot: 0, pop: 0, dur: 300 }); // 同一排里挪个位置（手牌重排、银行往后推、弧形里同一组跟着挪）：平移过去就好，扇形角度顺带转过去
      if (el.closest('.arow')) shifted = true;
    } else {
      o.land = !el.closest('.hand');
      if (el.closest('.arow')) shifted = true;
    }
    fly(el, from, to, o);
    n++;
  });
  if (shifted) { const gm = $('#screen .game'); if (gm) { gm.classList.add('reflow'); clearTimeout(playFlights.t); playFlights.t = setTimeout(() => gm.classList.remove('reflow'), 420); } }
}

// 开局发牌：自己的手牌一张张从牌堆翻开飞来，对方那边飞几张牌背
function dealIn() {
  if (!motionOK()) return;
  const ids = $$('#screen .hand .card').map((el) => el.dataset.card);
  ids.forEach(hold);
  const wait = Math.max(0, 560 - (performance.now() - (S.enterAt || 0))); // 等各块进场站稳再量位置
  setTimeout(() => {
    const deck = S.screen === 'game' ? deckBox() : null;
    ids.forEach((id, k) => {
      const el = cardNode(id);
      const to = deck && boxOf(el);
      if (to) {
        fly(el, deck, to, { flip: true, delay: k * 120, lift: 0.8 });
        sound.play('card', 0.05 + k * 0.12);
      }
      release(id);
    });
    if (deck) flyBacks(Math.min(5, V().players[opp()].handCount), 60);
  }, wait);
}

// 进了弃牌堆、桌面上已经看不到的牌（被清算 / Huge Win 清掉的地产、被弃的手牌）：从原来的位置一张张飞进弃牌堆
function vanishToDiscard(prev, skip) {
  if (!prev || !prev.els || !S.snap) return;
  const dest = discardBox();
  if (!dest) return;
  const inDiscard = new Set(V().discard.map(String));
  let k = 0;
  prev.els.forEach((el, id) => {
    if (k >= 16 || (skip && skip.has(id)) || cardNode(id) || !inDiscard.has(id)) return;
    const from = prev.m.get(id);
    const g = makeGhost(cleanClone(el), dest, false);
    const fr = arcFrames(from, dest, { lift: 0.7, pop: 0.06 });
    fr[10].opacity = 0.4;
    const a = track(g.animate(fr, { duration: 560, delay: 120 + k * 55, easing: EASE_MOVE, fill: 'backwards' }));
    a.onfinish = () => { g.remove(); if (!--vanishing) land(cardNode(V().discardTop), 1.08); };
    a.oncancel = () => { g.remove(); vanishing = Math.max(0, vanishing - 1); };
    vanishing++;
    k++;
  });
}
let vanishing = 0;

// 对方手牌被弃：几张牌背从他手里飞进弃牌堆
function backsToDiscard(n, delay0) {
  if (!motionOK()) return;
  const from = oppHandBox();
  const to = discardBox();
  if (!from || !to) return;
  for (let k = 0; k < Math.min(n, 6); k++) {
    const g = makeGhost(backEl(), to, false);
    const a = track(g.animate(arcFrames(from, to, { lift: 0.6, pop: 0.05 }), { duration: 520, delay: (delay0 || 0) + k * 80, easing: EASE_MOVE, fill: 'backwards' }));
    a.onfinish = () => g.remove();
    a.oncancel = () => g.remove();
  }
}

// 对方摸牌：几张牌背从牌堆飞进他的手牌
function flyBacks(n, delay0) {
  if (!motionOK()) return;
  const from = deckBox();
  const to = oppHandBox();
  if (!from || !to) return;
  for (let k = 0; k < Math.min(n, 5); k++) {
    const g = makeGhost(backEl(), from, false);
    const a = track(g.animate(arcFrames(from, to, { lift: 0.5, pop: 0.05, fade: true }, from), { duration: 500, delay: (delay0 || 0) + k * 110, easing: EASE_MOVE, fill: 'backwards' }));
    a.onfinish = () => g.remove();
    a.oncancel = () => g.remove();
  }
}

    alert: (t) => { tone(880, t, 0.1, 'square', 0.05); tone(698.5, t + 0.12, 0.16, 'square', 0.05); },
    // 印章：低音的"咚"（外放靠 300Hz 那层和一下咔哒听出分量）；d 是"反将一军"的层数，每多一层高两个半音
    stamp: (t, d) => { const k = Math.pow(2, (d || 0) * 2 / 12); tone(150 * k, t, 0.24, 'sine', 0.5, 52 * k); tone(300 * k, t, 0.12, 'triangle', 0.22, 130 * k); noise(t, 0.09, 0.22, 800, 0.6, 'lowpass'); noise(t, 0.012, 0.22, 2600, 0.9, 'bandpass'); },
    sour: (t) => tone(233.1, t, 0.3, 'triangle', 0.12, 185), // 坏消息印章后面拖的一声往下沉
    error: (t) => { tone(233.1, t, 0.11, 'triangle', 0.18); tone(185, t + 0.1, 0.18, 'triangle', 0.18); },
    pop: (t) => tone(660, t, 0.09, 'sine', 0.14, 990),
    swoosh: (t) => noise(t, 0.26, 0.11, 500, 0.9, 'bandpass', 3200),
    tick: (t) => tone(1760, t, 0.05, 'sine', 0.08),
    win: (t) => {
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, t + i * 0.09, i === 4 ? 0.9 : 0.26, 'triangle', 0.2));
      [1046.5, 1318.5, 1568].forEach((f) => tone(f, t + 0.5, 0.9, 'sine', 0.08));
      noise(t + 0.45, 0.6, 0.05, 7000, 0.5, 'highpass');
    },
    // 赢下整局：三连音的号角起头 → 一记重击 → 1 秒处 C 大调和弦落下，上面撒一串高音闪光（和收尾大场面的高潮对齐）
    victory: (t) => {
      [0, 0.13, 0.26].forEach((d) => brass(392, t + d, 0.11, 0.08));
      brass(523.25, t + 0.4, 0.55, 0.07);
      brass(659.25, t + 0.4, 0.55, 0.06);
      tone(110, t + 0.4, 0.5, 'sine', 0.4, 55);
      tone(220, t + 0.4, 0.25, 'triangle', 0.18, 110);
      [523.25, 659.25, 783.99, 1046.5].forEach((f) => brass(f, t + 1, 1.4, 0.045));
      [2093, 2637, 3136, 4186, 3136, 4186].forEach((f, i) => tone(f, t + 1 + i * 0.06, 0.4, 'sine', 0.04));
      noise(t + 0.95, 1.4, 0.05, 6000, 0.5, 'highpass');
    },
    // 输掉：一记手机也听得见的闷响，然后两个柔和的音 G4 → E♭4（后一个带一点颤音），不嘲讽
    defeat: (t) => {
      tone(98, t, 0.4, 'sine', 0.4, 70);
      tone(196, t, 0.18, 'triangle', 0.16, 140);
      soft(392, t + 0.16, 0.35, 0.11);
      soft(311.13, t + 0.5, 0.8, 0.11, 8);
    },
    // 赌一把：转轮的棘轮声、筹码声、翻倍、头奖、落空
    reel: (t) => { noise(t, 0.02, 0.14, 4600, 2.2, 'bandpass'); tone(2900, t, 0.018, 'triangle', 0.025); },
    // 老虎机：拉杆、每个转轮停下的一声闷响、第三个转轮吊悬念时一路上扬的提示音
    lever: (t) => { noise(t, 0.14, 0.22, 700, 0.8, 'lowpass', 180); tone(220, t + 0.04, 0.14, 'triangle', 0.12, 130); },
    reelStop: (t) => { tone(170, t, 0.1, 'sine', 0.32, 85); tone(340, t, 0.06, 'triangle', 0.12, 200); noise(t, 0.05, 0.16, 1500, 1, 'bandpass'); },
    tease: (t) => { tone(392, t, 1.25, 'triangle', 0.05, 1175); tone(587.3, t + 0.05, 1.2, 'sine', 0.035, 1760); },
    chips: (t) => { for (let k = 0; k < 4; k++) noise(t + k * 0.042 + Math.random() * 0.01, 0.028, 0.16, 3000 + k * 420, 3, 'bandpass'); },
    // 翻倍：n 是翻了几次（×2 → 1、×4 → 2、×8 → 3），每多翻一次高四个半音
    double: (t, n) => { const k = Math.pow(2, Math.max(0, (n || 1) - 1) * 4 / 12); [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(f * k, t + i * 0.06, i === 3 ? 0.4 : 0.2, 'triangle', 0.16)); },
    // 头奖：lvl 和"凑齐一套"的 set 用同一个移调，两个一起响时在同一个调上
    jackpot: (t, lvl) => {
      const k = Math.pow(2, ((lvl || 1) - 1) * 2 / 12);
      [1568, 1975.5, 2349.3, 3136, 2349.3, 3136].forEach((f, i) => tone(f * k, t + i * 0.065, 0.42, 'sine', 0.11));
      [523.25, 659.25, 783.99, 1046.5].forEach((f) => tone(f * k, t + 0.36, 0.9, 'triangle', 0.07));
      noise(t + 0.3, 0.6, 0.045, 8000, 0.5, 'highpass');
    },
    bust: (t) => { tone(392, t, 0.16, 'triangle', 0.14, 349.2); tone(311.1, t + 0.15, 0.4, 'triangle', 0.13, 233.1); },
    // 成就：一段上扬的号角；大乐透落定：低频重击 + 噪声尾巴（配合镜头震动）
    achieve: (t) => {
      [523.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, i) => tone(f, t + i * 0.07, i === 4 ? 0.7 : 0.22, 'triangle', 0.15));
      [1046.5, 1568, 2093].forEach((f) => tone(f, t + 0.36, 0.8, 'sine', 0.06));
    },
    boom: (t) => { tone(110, t, 0.5, 'sine', 0.55, 40); tone(220, t, 0.3, 'triangle', 0.24, 80); noise(t, 0.015, 0.2, 1800, 0.8, 'bandpass'); noise(t, 0.5, 0.2, 900, 0.5, 'lowpass', 120); noise(t + 0.02, 0.35, 0.06, 6000, 0.6, 'highpass'); },
  };
  return {
    play(name, delay, arg) {
      const c = ensure();
      if (!c || !SFX[name]) return;
      jit = HUMAN.has(name) ? { cents: (Math.random() - 0.5) * 70, gain: 0.88 + Math.random() * 0.24 } : GAIN_ONLY.has(name) ? { cents: 0, gain: 0.85 + Math.random() * 0.3 } : null;
      wet = WET[name] || 0;
      try { SFX[name](c.currentTime + 0.01 + (delay || 0), arg); } catch (e) { /* 忽略 */ }
      jit = null;
      wet = 0;
    },
    unlock() { if (on) ensure(); },
    get on() { return on; },
    toggle() { on = !on; store.set('sound', on); if (on) this.play('pop'); },
  };
})();

/* ═══════════ 触感：安卓用震动；iPhone（iOS 18+）借系统开关控件触发轻触感 ═══════════ */
const haptic = (() => {
  const PATTERN = { light: 8, medium: 15, success: [10, 50, 20], warn: [20, 60, 20], error: [26, 40, 26, 40, 26], heavy: [20, 40, 30, 40, 60] };
  // iPhone 只能"轻点一下"：用几下之间的间隔做出节奏——成功两下、警告隔久一点的两下、出错三连、重击四下，摸得出是好事还是坏事
  const IOS = { light: [0], medium: [0], success: [0, 110], warn: [0, 150], error: [0, 90, 180], heavy: [0, 90, 180, 320] };
  let label = null;
  let lastTick = 0;
  const tick = () => {
    const now = performance.now();
    if (now - lastTick < 45) return; // 挨得太近的两下会糊成一下、或者嗡嗡响：丢掉后一下
    lastTick = now;
    try { label.click(); } catch (e) { /* 不支持就算了 */ }
  };
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && !navigator.vibrate) {
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.setAttribute('switch', '');
    box.id = 'md-haptic';
    box.tabIndex = -1;
    box.setAttribute('aria-hidden', 'true');
    label = document.createElement('label');
    label.htmlFor = 'md-haptic';
    label.setAttribute('aria-hidden', 'true');
    for (const el of [box, label]) {
      el.style.cssText = 'position:fixed;left:-20px;top:-20px;width:1px;height:1px;opacity:0;pointer-events:none';
      // 这里的 click 是程序触发的，不能冒泡到页面：否则会被当成"点了外面"，刚弹出的表情面板会被立刻关掉
      el.addEventListener('click', (e) => e.stopPropagation());
    }
    document.body.append(box, label);
  }
  return (kind) => {
    try {
      if (navigator.vibrate) navigator.vibrate(PATTERN[kind] || 8);
      else if (label) (IOS[kind] || IOS.light).forEach((d) => { if (d) setTimeout(tick, d); else tick(); });
    } catch (e) { /* 不支持就算了 */ }
  };
})();

/* ═══════════ 特效 ═══════════ */
const fxLayer = $('#fx');
// 所有特效统一放大：彩纸更多更猛、震屏更狠、印章和飘字更大更久（赌场式的夸张）
const FX_AMP = 1.6;
const EASE_OUT = 'cubic-bezier(.23, 1, .32, 1)';

// 飘字：big（一次进账很多）放大 1.25 倍、停得久一点。左右夹在屏幕里（银行贴着屏幕边、或者整排滚出去了也看得到）
function floatText(text, rect, cls, html) {
  if (!rect) return;
  const el = document.createElement('div');
  el.className = 'float' + (cls ? ' ' + cls : '');
  if (html) el.innerHTML = html; // 带倍率图（已经转义好）
  else el.textContent = text;
  el.style.left = rect.left + rect.width / 2 + 'px';
  el.style.top = Math.max(8, rect.top - 6) + 'px';
  fxLayer.appendChild(el);
  const big = / big\b/.test(el.className);
  const s = big ? 1.25 : 1;
  const hw = el.offsetWidth * 0.65 * s + 8; // 0.65 = 最大放大 1.3 倍时的一半宽
  const si = safeInsets();
  el.style.left = Math.max(si.l + hw, Math.min(innerWidth - si.r - hw, rect.left + rect.width / 2)) + 'px';
  if (!motionOK()) { setTimeout(() => el.remove(), big ? 1700 : 1200); return; }
  el.animate([
    { transform: `translate(-50%, 10px) scale(${0.6 * s})`, opacity: 0 },
    { transform: `translate(-50%, -20px) scale(${1.3 * s})`, opacity: 1, offset: 0.2 },
    { transform: `translate(-50%, -26px) scale(${1.05 * s})`, opacity: 1, offset: 0.34 },
    { transform: `translate(-50%, -32px) scale(${s})`, opacity: 1, offset: big ? 0.8 : 0.66 },
    { transform: `translate(-50%, -60px) scale(${0.96 * s})`, opacity: 0 },
  ], { duration: big ? 1900 : 1500, easing: EASE_OUT }).onfinish = () => el.remove();
}

// 盖章：从天而降砸在屏幕中间，四周的桌面跟着震一下。好事（good / gold）是金色、带一声上扬的"叮"，good 还撒一小把彩纸；
// 坏事（red）是酒红、后面拖一声往下沉。o.depth：反将一军的层数（2 起），每多一层转向反过来、印得更大、声音更高，一层压一层；
// o.lvl：gold 章那声"叮"的翻倍级；o.ding = false：不要那声"叮"（同一刻已经有头奖和弦，叠上去会打架）；o.hap：换一种触感
function stamp(text, tone, quiet, html, o) {
  o = o || {};
  tone = tone || 'red';
  const d = Math.max(0, (o.depth || 1) - 1);
  const el = document.createElement('div');
  el.className = 'stamp ' + tone;
  if (html) el.innerHTML = html; // 带倍率图（已经转义好）
  else el.textContent = text;
  fxLayer.appendChild(el);
  const good = tone === 'good' || tone === 'gold';
  if (!quiet) {
    sound.play('stamp', 0, d);
    if (good && o.ding !== false) sound.play('double', 0.07, o.lvl);
    else if (tone === 'red') sound.play('sour', 0.05);
  }
  haptic(o.hap || (tone === 'good' ? 'success' : tone === 'red' ? 'warn' : 'medium'));
  const end = 1 + 0.08 * d;
  const rot = d % 2 ? 8 : -8;
  const si = safeInsets();
  const fit = Math.min(1, (innerWidth - si.l - si.r - 28) / ((el.offsetWidth || 1) * 1.08 * end)); // 落定后整个章都在安全区里，左右各留 14px
  const k = (sc, r, op, off) => ({ transform: `translate(-50%, -50%) scale(${(sc * fit).toFixed(3)}) rotate(${r}deg)`, opacity: op, offset: off });
  el.animate(motionOK()
    ? [k(2.8, rot * 2, 0, 0), k(0.9 * end, rot, 1, 0.22), k(1.06 * end, rot, 1, 0.3), k(end, rot, 1, 0.38), k(end, rot, 1, 0.84), k(1.08 * end, rot, 0, 1)]
    : [k(end, rot, 0, 0), k(end, rot, 1, 0.1), k(end, rot, 1, 0.85), k(end, rot, 0, 1)], { duration: 1700, easing: EASE_OUT }).onfinish = () => el.remove();
  const game = $('#screen .game');
  if (game && motionOK()) game.animate([{ translate: '0 0' }, { translate: '0 0', offset: 0.2 }, { translate: '0 9px', offset: 0.24 }, { translate: '0 -4px', offset: 0.3 }, { translate: '0 2px', offset: 0.35 }, { translate: '0 0', offset: 0.4 }, { translate: '0 0' }], { duration: 1700 });
  if (tone === 'good' && !quiet) setTimeout(() => { if (el.isConnected) confetti({ x: innerWidth / 2, y: innerHeight * 0.4, count: 26, angle: -90, spread: 120, speed: 8 }); }, 90); // 章砸下去那一下（整段缓动很陡，砸到底大约在 80ms）
}

// 五彩纸屑：一张全屏画布，粒子自带重力、空气阻力和翻转
const confetti = (() => {
  let canvas = null;
  let g = null;
  let parts = [];
  let raf = 0;
  let last = null;
  function size() {
    if (!canvas || !parts.length) return; // 空闲时保持画布已释放，旋转屏幕也不用重新分配
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.round(innerWidth * dpr);
    const h = Math.round(innerHeight * dpr);
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function frame(now) {
    const dt = last == null ? 0 : Math.max(0, Math.min(3, (now - last) / (1000 / 60)));
    last = now;
    const drag = Math.pow(0.985, dt);
    g.clearRect(0, 0, innerWidth, innerHeight);
    for (const q of parts) {
      q.life += dt; // 按 60 Hz 的时间步进：ProMotion 上速度、重力和寿命一致
      q.vx *= drag;
      q.vy = q.vy * drag + 0.32 * dt;
      q.x += (q.vx + Math.sin(q.life * q.wob) * 0.6) * dt;
      q.y += q.vy * dt;
      q.r += q.vr * dt;
      g.save();
      g.globalAlpha = Math.max(0, Math.min(1, (q.max - q.life) / 25));
      g.translate(q.x, q.y);
      g.rotate(q.r);
      g.scale(1, Math.cos(q.life * q.flip));
      g.fillStyle = q.c;
      g.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
      g.restore();
    }
    parts = parts.filter((q) => q.life + 0.000001 < q.max && q.y < innerHeight + 40);
    if (parts.length) raf = requestAnimationFrame(frame);
    else { raf = 0; last = null; canvas.width = 0; canvas.height = 0; } // 不放纸屑时释放整屏画布的内存（iOS 内存紧时会直接把页面重新加载）
  }
  return (o) => {
    if (!motionOK()) return;
    if (!canvas) {
      canvas = document.createElement('canvas');
      fxLayer.appendChild(canvas);
      g = canvas.getContext('2d');
      addEventListener('resize', size);
    }
    const colors = o.colors || ['#ecd28e', '#c49a3a', '#e3c477', '#ffffff', '#1e7d60', '#a51d43']; // 默认彩带也只用色板里的颜色
    const count = Math.round(o.count * FX_AMP);
    for (let i = 0; i < count; i++) {
      const a = ((o.angle == null ? -90 : o.angle) + (Math.random() - 0.5) * (o.spread || 60) * 1.1) * Math.PI / 180;
      const v = (o.speed || 12) * 1.15 * (0.55 + Math.random() * 0.6);
      parts.push({
        x: o.x, y: o.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        w: 7 + Math.random() * 7, h: 9 + Math.random() * 10, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.36,
        flip: 0.08 + Math.random() * 0.12, wob: 0.05 + Math.random() * 0.1,
        c: colors[(Math.random() * colors.length) | 0], life: 0, max: 100 + Math.random() * 70,
      });
    }
    size(); // 连发只在尺寸变化时调整位图，避免每一束都清空并重新分配整屏画布
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  };
})();

function countUp(el, a, b, dur) {
  if (!el || !motionOK()) return;
  dur = Math.max(120, dur || 650);
  el.textContent = a + 'M'; // 先回到起点：重绘已经写成终点了，不然会先闪一下终点再从头滚
  const t0 = performance.now();
  const step = (now) => {
    if (!el.isConnected) return;
    const k = Math.max(0, Math.min(1, (now - t0) / dur)); // 这一帧的时间戳可能比 t0 还早：别算出负数，滚到起点以下
    el.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - k, 3))) + 'M';
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  el.animate([{ scale: '1' }, { scale: '1.25', offset: 0.3 }, { scale: '1' }], { duration: 520, easing: EASE_OUT });
}

// 轮到自己：手牌依次轻跳一下（用 translate 属性，和扇形的 transform 叠加）
function rippleHand() {
  if (!motionOK()) return;
  $$('#screen .hand .card').forEach((el, i) => el.animate([
    { translate: '0 0' },
    { translate: '0 -12px', offset: 0.4 },
    { translate: '0 0' },
  ], { duration: 420, delay: 60 * i, easing: EASE_OUT }));
}

// 一道光从左往右扫过去
function shineOn(el, delay) {
  if (!el || !motionOK()) return;
  const s = document.createElement('span');
  s.className = 'shine';
  s.innerHTML = '<i></i>';
  el.appendChild(s);
  s.firstChild.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(330%)' }], { duration: 820, delay: delay || 0, easing: EASE_OUT, fill: 'backwards' }).onfinish = () => s.remove();
}

function ringBurst(b, color) {
  if (!b || !motionOK()) return;
  const d = Math.max(b.w, b.h) * 1.3;
  for (let k = 0; k < 3; k++) {
    const r = document.createElement('div');
    r.className = 'ring';
    Object.assign(r.style, { width: d + 'px', height: d + 'px', left: b.cx - d / 2 + 'px', top: b.cy - d / 2 + 'px' });
    r.style.setProperty('--c', color);
    fxLayer.appendChild(r);
    r.animate([{ transform: 'scale(.4)', opacity: 1 }, { transform: 'scale(2.3)', opacity: 0 }], { duration: 900, delay: k * 150, easing: EASE_OUT, fill: 'backwards' }).onfinish = () => r.remove();
  }
}

// 吃亏的时候分块抖一下
function shakeEl(el) {
  if (!el || !motionOK()) return;
  el.animate([{ translate: '0 0' }, { translate: '-7px 0' }, { translate: '6px 0' }, { translate: '-4px 0' }, { translate: '2px 0' }, { translate: '0 0' }], { duration: 420, easing: 'ease-out' });
}

// 付款：一串金币从付款人的银行划弧线飞进收款人的银行。进我的银行时每枚落下都"叮"一声、一枚比一枚高，
// 最后一枚落定再响金币声、钱堆弹一下、轻震一下。返回第一枚 / 最后一枚落地的时刻（ms），银行数字照这个节奏滚
function coinRain(fromP, toP, amount, delay0) {
  if (!motionOK()) return null;
  const a = boxOf($(`#screen .bank[data-p="${fromP}"] .pile`)) || boxOf(bankSpot(fromP)); // 银行付空了（不显示）：从银行那一列飞出来
  const b = boxOf($(`#screen .bank[data-p="${toP}"] .pile`)) || boxOf(bankSpot(toP));
  if (!a || !b) return null;
  delay0 = delay0 || 0;
  const mine = toP === me();
  const n = Math.max(3, Math.min(9, Math.round(amount)));
  const anchor = { cx: b.cx, cy: b.cy, w: 18 };
  const lands = [];
  for (let k = 0; k < n; k++) {
    const c = document.createElement('div');
    c.className = 'coin';
    c.style.left = b.cx + 'px';
    c.style.top = b.cy + 'px';

  const drawCoin3d = (im, c) => {
    const r = c.s / 2;
    const cs = Math.cos(c.ph);
    const sn = Math.sin(c.ph);
    const fw = Math.max(0.04, Math.abs(cs)) * r; // 正面压扁后的半宽
    const th = c.s * 0.14 * Math.abs(sn);         // 这一刻看得到的厚度
    const side = cs * sn >= 0 ? 1 : -1;           // 金边露在哪一侧
    if (th > 0.6) {
      const g = ctx.createLinearGradient(0, -r, 0, r);
      g.addColorStop(0, '#8a6a22'); g.addColorStop(0.3, '#c49a3a'); g.addColorStop(0.5, '#ecd28e'); g.addColorStop(0.7, '#c49a3a'); g.addColorStop(1, '#8a6a22');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(-side * th, 0, fw, r, 0, 0, Math.PI * 2); // 背面那一圈
      ctx.fill();
      ctx.fillRect(Math.min(0, -side * th), -r, th, r * 2);  // 侧面
      if (th > 3) { // 齿纹
        ctx.fillStyle = 'rgba(23, 20, 15, .28)';
        for (let y = -r + 2; y < r - 1; y += 3.2) ctx.fillRect(Math.min(0, -side * th), y, th, 1.1);
      }
    }
    ctx.save();
    ctx.scale(fw / r, 1);
    ctx.drawImage(im, -r, -r, c.s, c.s);
    if (cs < 0) { ctx.fillStyle = 'rgba(23, 20, 15, .18)'; ctx.beginPath(); ctx.arc(0, 0, r * 0.98, 0, Math.PI * 2); ctx.fill(); } // 翻到背面：暗一点
    ctx.restore();
  };
  let last = 0;
  const frame = (now) => {
    const dt = Math.min(0.05, (now - (last || now)) / 1000);
    last = now;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    const im = sprite();
    coins = coins.filter((c) => c.alpha > 0.02 && c.x > -c.s * 2 && c.x < innerWidth + c.s * 2);
    for (const c of coins) {
      if (now < c.at) continue;
      c.life += dt;
      c.vy = Math.min(c.max, c.vy + 1100 * dt);
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.ph += c.w * dt;
      c.rot += c.vr * dt;
      // 落到底下散开：弹两下、往两边滚，转速慢下来，然后淡掉
      if (c.y > c.floor) {
        c.y = c.floor;
        if (c.vy > 140 && c.hits < 2) { c.vy = -c.vy * (0.34 + Math.random() * 0.12); c.vx = c.vx * 0.6 + (Math.random() - 0.5) * 260; c.w *= 0.55; c.vr *= 0.5; c.hits++; }
        else { c.vy = 0; c.vx *= 0.9; c.w *= 0.9; c.rest = true; }
      }
      if (c.rest || c.life > 4.5) c.alpha -= dt * 1.6;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, c.alpha));
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      drawCoin3d(im, c);
      ctx.restore();
    }
    if (coins.length) raf = requestAnimationFrame(frame);
    else { raf = 0; last = 0; cv.remove(); cv = null; }
  };
  // o.quiet：只下金币（赢下整局的收尾里用）——不出进账横幅、不响头奖、不另外闪光震屏和震动，那一刻的声音和触感归收尾大场面
  return (p, amount, o) => {
    const quiet = !!(o && o.quiet);
    const mine = p === me();
    const k = Math.max(0, Math.min(1, (amount - 10) / 40)); // 10M → 0，50M 以上 → 1
    if (quiet && !motionOK()) return;
    const banner = quiet ? null : document.createElement('div');
    const show = (1400 + k * 1200) * (mine ? 1 : 0.7);
    if (banner) {
      banner.className = 'rain-amt' + (k > 0.35 ? ' huge' : '');
      banner.innerHTML = `<small>${esc(mine ? '金币雨！进账' : `${V().players[p].name} 进账`)}</small><b>+0M</b>`;
      fxLayer.appendChild(banner);
    }
    const num = banner && $('b', banner);
    if (!motionOK()) { num.textContent = `+${amount}M`; setTimeout(() => banner.remove(), show); return; }
    if (!cv) {
      cv = document.createElement('canvas');
      cv.className = 'rain';
      ctx = cv.getContext('2d');
      fxLayer.appendChild(cv);
      fit();
    }
    const now = performance.now();
    const n = Math.round((40 + k * 260) * (mine ? 1 : 0.35)); // 对方进账：轻一点，不喧宾夺主
    const span = 700 + k * 1600;
    const big = 40 + k * 34;
    for (let j = 0; j < n; j++) {
      const s = 24 + Math.random() * (big - 24);
      coins.push({ x: Math.random() * innerWidth, y: -s - Math.random() * 120, vx: (Math.random() - 0.5) * 60, vy: 160 + Math.random() * 240, max: 520 + s * 9, s, ph: Math.random() * 6.3, w: 5 + Math.random() * 9, rot: (Math.random() - 0.5) * 0.6, vr: (Math.random() - 0.5) * 2, at: now + Math.random() * span, life: 0, floor: innerHeight - s * 0.4 - Math.random() * innerHeight * 0.12, hits: 0, alpha: 1 });
    }
    if (amount >= 25 && mine) { // 中间炸开一圈
      const m = Math.round(24 + k * 60);
      for (let j = 0; j < m; j++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.6;
        const sp = 500 + Math.random() * 700;
        const s = 30 + Math.random() * (big - 20);
        coins.push({ x: innerWidth / 2, y: innerHeight * 0.45, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, max: 900, s, ph: Math.random() * 6.3, w: 8 + Math.random() * 10, rot: (Math.random() - 0.5) * 1.2, vr: (Math.random() - 0.5) * 4, at: now + 120, life: 0, floor: innerHeight - s * 0.4 - Math.random() * innerHeight * 0.12, hits: 0, alpha: 1 });
      }
      if (!quiet) { // 收尾大场面自己有闪光和震屏：不再叠一层
        const flash = document.createElement('div');
        flash.className = 'ep-flash gold';
        fxLayer.appendChild(flash);
        flash.animate([{ opacity: 0.45 }, { opacity: 0 }], { duration: 560, easing: 'ease-out', fill: 'forwards' }).onfinish = () => flash.remove();
        cameraShake(8 + k * 12, 700);
      }
    }
    if (!raf) raf = requestAnimationFrame(frame);
    // 声音：一阵金币声，进账越多越密
    if (!quiet) sound.play(mine ? 'jackpot' : 'chips');
    for (let j = 0; j < 4 + Math.round(k * 10); j++) sound.play(j % 3 || quiet ? 'chips' : 'coin', 0.12 + j * (0.16 - k * 0.05)); // 收尾里只要筹码声：金币那声的 B 和号角的 C 和弦撞在一起
    if (mine && !quiet) haptic('success');
    if (!banner) return;
    banner.animate([{ opacity: 0, transform: 'translate(-50%, -50%) scale(2.2)' }, { opacity: 1, transform: 'translate(-50%, -50%) scale(.94)', offset: 0.55 }, { opacity: 1, transform: 'translate(-50%, -50%) scale(1)' }], { duration: 380, easing: EASE_OUT, fill: 'both' });
    banner.animate([{ opacity: 1 }, { opacity: 0, transform: 'translate(-50%, -50%) translateY(-24px) scale(.96)' }], { duration: 320, delay: show - 320, easing: EASE_OUT, fill: 'forwards' }).onfinish = () => banner.remove();
    const t0 = performance.now();
    const dur = 600 + k * 700;
    const tick = (t) => { const u = Math.min(1, (t - t0) / dur); num.textContent = `+${Math.round(amount * (1 - Math.pow(1 - u, 3)))}M`; if (u < 1 && banner.isConnected) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };
})();

// 一局结束。赢了：排一个比集齐一套更大的收尾（victoryFx），结算面板等它放完；减少动态效果时照旧：号角 + "胜利！"印章。
// 输了：先让人看清是哪一套赢的你——对方那一套落定时鼓一下、酒红光圈扩散两次，自己这边慢慢褪色（之后一直保持），一声低沉但不嘲讽的收尾
function celebrateEnd(e, fresh, wait) {
  disarmIdle();

  if (e.winner === me()) {

        const b = boxOf(st);
        ringBurst(b, '#a51d43');
        setTimeout(() => ringBurst(b, '#a51d43'), 250);
      });

  }
}
// 赢下整局的收尾（排队播，约 3 秒）：暗场、金光，自己凑齐的每一套各抽一张牌，从桌上原位飞起来扇形排开，金色绶带砸下"胜利！"；
// 1 秒处号角和弦落下——震屏、两门礼炮、一阵金币雨（不带横幅）。放完自己那几套再扫一道光，结算面板随后弹出
function victoryFx() {
  if (!S.snap) return;
  const i = me();
  const sets = V().players[i].sets.filter((x) => x.full).slice(0, 4);

  $('.ep-dim', box).animate([{ opacity: 0 }, { opacity: 1, offset: 0.08 }, { opacity: 1, offset: 0.9 }, { opacity: 0 }], { duration: total, fill: 'forwards' });
  $('.ep-rays', box).animate([{ opacity: 0, transform: 'translate(-50%, -50%) scale(.3) rotate(0deg)' }, { opacity: 1, transform: 'translate(-50%, -50%) scale(1) rotate(60deg)', offset: 0.3 }, { opacity: 1, transform: 'translate(-50%, -50%) scale(1.15) rotate(170deg)', offset: 0.88 }, { opacity: 0, transform: 'translate(-50%, -50%) scale(1.2) rotate(190deg)' }], { duration: total, easing: 'linear', fill: 'forwards' });
  $('.ep-ring', box).animate([{ opacity: 0.95, transform: 'translate(-50%, -50%) scale(.2)' }, { opacity: 0, transform: 'translate(-50%, -50%) scale(3.6)' }], { duration: 1000, delay: climax, easing: EASE_OUT, fill: 'both' });
  $$('.ep-card', box).forEach((c, j) => {
    const kk = j - (n - 1) / 2;

    const r0 = c.getBoundingClientRect(); // 还没变换时的位置：中心横向在 left 处（变换里先 -50%）
    const st = $(`#screen .zone.me .set.full[data-color="${sets[j].color}"]`);
    const from = st && boxOf($(`[data-card="${sets[j].cards[0]}"]`, st) || $('.stack', st));
    const on = from && from.bottom > 0 && from.top < innerHeight && r0.width;
    const first = on
      ? { opacity: 1, transform: `translate(calc(-50% + ${(from.cx - r0.left).toFixed(1)}px), ${(from.cy - (r0.top + r0.height / 2)).toFixed(1)}px) rotate(${from.rz || 0}deg) scale(${(from.w / r0.width).toFixed(3)})` }
      : { opacity: 0, transform: `translate(-50%) translateY(60vh) rotate(${kk * 40}deg) scale(.5)` };
    c.animate([first, { opacity: 1, transform: `${end} scale(1.12)`, offset: 0.7 }, { opacity: 1, transform: `${end} scale(1)` }], { duration: 620, delay: 120 + j * 130, easing: EASE_OUT, fill: 'both' });
    c.animate([{ opacity: 1 }, { opacity: 0, transform: `${end} translateY(-30px) scale(.9)` }], fade);
    sound.play('card', (120 + j * 130) / 1000);
  });
  const rib = $('.ep-ribbon', box);
  rib.animate([{ opacity: 0, transform: 'translate(-50%, -50%) scale(2.8) rotate(-8deg)' }, { opacity: 1, transform: 'translate(-50%, -50%) scale(.92) rotate(-3deg)', offset: 0.6 }, { opacity: 1, transform: 'translate(-50%, -50%) scale(1) rotate(-3deg)' }], { duration: 420, delay: climax - 180, easing: EASE_OUT, fill: 'both' });

    box.appendChild(flash);
    flash.animate([{ opacity: 0.55 }, { opacity: 0 }], { duration: 520, easing: 'ease-out', fill: 'forwards' });
    confetti({ x: innerWidth * 0.12, y: innerHeight * 0.92, count: 80, angle: -62, spread: 32, speed: 19 });

    const dx = (Math.random() - 0.5) * (P.rise ? 46 : P.fall ? 60 : 110);

    p.animate([

// 回合台的动效（每次重绘后跑；回合台每次都是新节点，所以动画都按"从某个时刻开始"重建，重绘不会让它们从头再来）：
// 换人 → 中间先出现 ↑ / ↓（从反方向滑进来、往回蓄一下力、朝轮到的那一方射出去），秒数再弹出来，弧条同时扫回满格；
// 弧条按到期时间匀速走完；新回合出牌次数的点依次蹦出，用掉一次那颗点闪一下（超时作废的闪红）
const ARROW_MS = 1500;
function stageFx() {
  const s = S.stageNow;
  const gauge = $('#screen .stage .gauge');
  if (!s || !gauge) return;
  const now = performance.now();
  const motion = motionOK();

  }
  S.gSeat = seat;
  const at = S.arrow && seat != null ? now - S.arrow.t0 : Infinity;
  if (at < ARROW_MS && S.clock && motion) {
    const arrow = $('.g-arrow', gauge);
    const num = $('.g-num', gauge);
    const k = S.arrow.dir === 'up' ? -1 : 1;
    arrow.dataset.dir = S.arrow.dir;
    const t = { duration: ARROW_MS, fill: 'both' };

      { opacity: 0, transform: `translateY(${-k * 42}%) scale(.7)`, easing: 'cubic-bezier(.2, .9, .3, 1.2)' },
      { opacity: 1, transform: 'translateY(0) scale(1)', offset: 0.24, easing: 'ease-in-out' },
      { opacity: 1, transform: `translateY(${-k * 7}%) scale(.96)`, offset: 0.42, easing: 'cubic-bezier(.55, 0, .75, .2)' },
      { opacity: 0, transform: `translateY(${k * 75}%) scale(.9)`, offset: 0.66 },
      { opacity: 0, transform: `translateY(${k * 75}%) scale(.9)` },
    ], t);
    const a2 = num.animate([
      { opacity: 0, transform: 'scale(.5)' },
      { opacity: 0, transform: 'scale(.5)', offset: 0.6, easing: 'cubic-bezier(.2, .9, .3, 1.3)' },
      { opacity: 1, transform: 'scale(1)', offset: 0.82 },

    ], t);

    a2.currentTime = at;

// 弧条：从这个决定点第一次出现的时刻起，匀速走到到期；换了决定点先用 0.5 秒从刚才的位置扫回满格（像重新上满发条）
function gaugeDrain(gauge, now, motion) {
  const fill = $('.g-fill', gauge);
  const c = V().phase === 'gameOver' ? null : S.clock;
  if (!fill) return;
  if (!c) { S.gDrain = null; return; }
  const prev = S.gDrain;
  if (!prev || prev.key !== c.key) {
    const fromE = prev && motion ? Math.min(1, Math.max(0, 1 - (prev.end - now) / prev.total)) : null;
    S.gDrain = { key: c.key, t0: now, fromE };
  }
  const G = S.gDrain;
  G.end = c.end;
  G.total = c.total;
  const dur = Math.max(1, c.end - G.t0);
  const e0 = Math.max(0, 1 - dur / c.total);
  const kf = [];
  if (G.fromE != null && G.fromE > e0 + 0.03 && dur > 1200) {
    const rf = 520 / dur;
    kf.push({ offset: 0, strokeDashoffset: String(G.fromE * 100), easing: 'cubic-bezier(.2, .8, .2, 1)' });
    kf.push({ offset: rf, strokeDashoffset: String((e0 + (1 - e0) * rf) * 100) });
  } else {
    kf.push({ offset: 0, strokeDashoffset: String(e0 * 100) });
  }
  kf.push({ offset: 1, strokeDashoffset: '100' });

// 秒数：每 0.2 秒看一眼，变了才改字（往上翻一下）；最后 5 秒变红、每秒一跳，轮到自己时滴答响、最后 3 秒轻震
function tickClock() {
  if (S.screen !== 'game' || !S.snap) return;
  const c = V().phase === 'gameOver' ? null : S.clock;
  const b = $('#g-sec');
  if (!c || !b) return;
  const left = clockLeft(c);
  const sec = Math.ceil(left / 1000);
  const hurry = left <= 5000;
  const sl = $('#sh-left');
  if (sl && c.total) { // 面板里那条倒计时（回应 / 弃牌）
    sl.textContent = `${sec} 秒后${sl.dataset.what}`;
    const bar = $('#sh-bar');
    if (bar) bar.style.transform = `scaleX(${Math.min(1, left / c.total).toFixed(3)})`;
    sl.parentElement.classList.toggle('hot', hurry);
  }
  const gauge = b.closest('.gauge');
  if (gauge.classList.contains('hurry') !== hurry) gauge.classList.toggle('hurry', hurry);
  const was = Number(b.textContent);
  if (was === sec) return;
  b.textContent = String(sec);
  if (!(was > sec)) return;
  if (motionOK()) {
    b.animate(hurry
      ? [{ transform: 'scale(1.4)', opacity: 0.5 }, { transform: 'none', opacity: 1 }]
      : [{ transform: 'translateY(32%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: hurry ? 380 : 240, easing: EASE_OUT });

  }
}

const gamblePlan = (e) => slotPlan(e, e.won, e.jackpot ? 'diamond' : e.mult >= 4 ? 'sym7' : pickOf(SLOT_LOW), ['sym7', 'sym7', 'diamond', 'sym8']);
const ghostPlan = (e) => slotPlan(e, e.good, 'moneybag', ['moneybag']);
// 这次更新里赌一把的老虎机从出现到看清结果要多久（出牌亮相、回应面板、奖池数字都等它）

// 一个转轮的走法（单位：格）：拉杆后先往回顿一下再加速，匀速转，减速停下时带一点回弹；

function reelPath(r, antic) {

// 转轮上的格子：第 1 格停在中线；"差一点"时第 0 格（中线上面那格）就是前两个转出来的图案；吊悬念时第 4 格先慢慢从中线晃过去

/* 屏幕中央的大场面（成就、大乐透）：排队一个接一个放，不叠在一起，也不和印章抢位置 */
const spotlight = (() => {
  const q = [];
  let busy = false;
  let waiting = 0; // 已经排了期、还没进队的
  let idlers = [];
  let settling = false;
  const settle = () => {
    if (busy || q.length || waiting || settling) return;
    const cbs = idlers;
    idlers = [];
    settling = true;
    try { cbs.forEach((cb) => cb()); } finally { settling = false; }
    // 回调里又登记的（比如提示在等揭晓的闸门，而开闸的回调排在同一批后面）：下一拍再看，不在这里递归
    if (idlers.length) setTimeout(settle, 0);
  };
  const next = () => {
    if (busy) return;
    if (!q.length) { settle(); return; }
    busy = true;
    const it = q.shift();
    let t = 0;
    const end = () => { if (it.over) return; it.over = true; clearTimeout(t); busy = false; next(); }; // fn 拿到 end：要人点的大场面点完就能提前收尾
    t = setTimeout(end, it.ms);
    try { it.fn(end); } catch (err) { console.error(err); }
  };
  const add = (fn, ms, delay) => { waiting++; setTimeout(() => { waiting--; q.push({ fn, ms }); next(); }, delay || 0); };
  add.idle = (cb) => { if (!idlers.includes(cb)) idlers.push(cb); settle(); }; // 队里的大场面全部放完时回调
  add.busy = () => busy || q.length > 0 || waiting > 0;
  return add;
})();
// 模拟镜头震动：整张牌桌抖几下，越抖越轻，带一点点旋转和推近

  // 舒适度：幅度封顶、转角很小、更快收住——震一下表达力度就够了，持续大幅晃动容易让人头晕
  const k = Math.min(10, (px || 10) * 0.75);
  const frames = [];
  const n = 14;
  for (let i = 0; i <= n; i++) {
    const a = Math.pow(1 - i / n, 2.4);
    frames.push({ transform: i === n ? 'none' : `translate(${((Math.random() * 2 - 1) * k * a).toFixed(1)}px, ${((Math.random() * 2 - 1) * k * a).toFixed(1)}px) rotate(${((Math.random() * 2 - 1) * 0.5 * a).toFixed(2)}deg)` });
  }
  el.animate(frames, { duration: Math.min(ms || 600, 560), easing: 'linear' });
}
// 一层大场面的骨架：暗角、两层反向旋转的光芒、泛光、横扫的光带、几颗闪烁的星
function spotShell(gold) {

  fxLayer.appendChild(box);

}
function artHTML(k, label, wide) {
  return artOK(k) ? `<img class="art${wide ? ' wide' : ''}" src="${artUrl(k)}" alt="" decoding="sync" draggable="false" data-art="${k}" data-fb="">` : `<div class="artfb">${esc(label)}</div>`;

// 倍率图里字形实际占的范围 [左, 右, 上, 下]（相对 1254×1254 原图，按原图实测，含描边和投影）：显示时用负边距裁掉四周的透明边
const MULT_BOX = { X: [0.142, 0.839, 0.170, 0.851], 2: [0.217, 0.789, 0.141, 0.862], 4: [0.170, 0.846, 0.189, 0.862], 8: [0.181, 0.819, 0.121, 0.885] };
// 倍率 ×n：X 和每一位数字都有图就拼成图，缺任何一张就用文字 ×n（比如 ×5、×16）。某张图后来读不到：那一张换回文字 × 或数字
function multHTML(n) {
  const t = String(n);
  const keys = /^\d+$/.test(t) ? ['multX'].concat(t.split('').map((d) => 'mult' + d)) : [];
  if (!keys.length || !keys.every((k) => CONFIG.ART[k] && artOK(k))) return `×${esc(t)}`;
  const g = (k) => {
    const c = k.slice(4);
    const b = MULT_BOX[c] || [0, 1, 0, 1];
    return `<img class="mg${c === 'X' ? ' x' : ''}" src="${artUrl(k)}" alt="" decoding="sync" draggable="false" data-art="${k}" data-fb="${c === 'X' ? '×' : c}" style="--x0:${b[0]};--x1:${b[1]};--y0:${b[2]};--y1:${b[3]}">`;
  };
  return `<span class="mult" role="img" aria-label="×${t}">${keys.map(g).join('')}</span>`;
}
function spotLights(box, ms, strong) {
  const m = motionOK();
  const fx = $('.fx', box);
  $$('.rays', box).forEach((r, k) => {
    r.animate([{ opacity: 0, transform: 'scale(.6) rotate(0deg)' }, { opacity: 1, transform: `scale(1) rotate(${k ? -30 : 40}deg)`, offset: 0.25 }, { opacity: 1, transform: `scale(1.05) rotate(${k ? -70 : 90}deg)`, offset: 0.85 }, { opacity: 0, transform: `scale(1.1) rotate(${k ? -80 : 110}deg)` }], { duration: m ? ms : 1, easing: 'linear', fill: 'both' });
  });

  if (m) $('.flare', box).animate([{ opacity: 0, transform: 'scaleX(.1)' }, { opacity: 1, transform: 'scaleX(1)', offset: 0.12 }, { opacity: 0, transform: 'scaleX(1.2)', offset: 0.3 }, { opacity: 0 }], { duration: ms, easing: 'ease-out', fill: 'both' });
  if (!m) return;
  for (let k = 0; k < (strong ? 14 : 8); k++) {

    st.animate([{ opacity: 0, transform: 'scale(0.2)' }, { opacity: 1, transform: `scale(${sc})`, offset: 0.4 }, { opacity: 0, transform: 'scale(0.3)' }], { duration: 700 + Math.random() * 500, delay: 200 + Math.random() * (ms * 0.5), easing: 'ease-in-out', fill: 'both' });
  }
}

        c.style.top = bb.cy + 'px';

        const fr = arcFrames({ cx: ab.cx + (Math.random() - 0.5) * 80, cy: ab.cy, w: 16 }, { cx: bb.cx + (Math.random() - 0.5) * 14, cy: bb.cy, w: 16 }, { lift: 1.2, rot: 0, pop: 0.5 }, { cx: bb.cx, cy: bb.cy, w: 18 });
        fr[0].opacity = 0; fr[1].opacity = 1; fr[10].opacity = 0.3;
        const an = c.animate(fr, { duration: 700 + Math.random() * 160, delay: 240 + k * 45, easing: 'cubic-bezier(.4, 0, .25, 1)', fill: 'backwards' });
        an.onfinish = () => c.remove();
        an.oncancel = () => c.remove();
        if (k % 3 === 0) sound.play('tick', (300 + k * 45 + 600) / 1000);
      }
    }
    if (early) return;
    const from = ab ? { cx: ab.cx, cy: ab.cy, w: 60, h: 60 / CONFIG.RATIO } : null;
    e.cardIds.forEach((id, k) => {
      const el = cardNode(id);
      const to = el && boxOf(el);
      if (from && to && m) fly(el, from, to, { delay: 420 + k * 90, land: true, lift: 0.6 });
      release(String(id));
    });
    const el = $(`#screen [data-bank="${e.player}"]`);
    if (el) setTimeout(() => { countUp(el, Math.max(0, V().players[e.player].bankTotal - e.amount), V().players[e.player].bankTotal); floatText(`+${e.amount}M`, el.getBoundingClientRect(), 'gold'); }, m ? 900 : 0);
  }, climax);
  const out = () => box.remove();
  if (m) card.animate([{ opacity: 1 }, { opacity: 0, transform: 'translate(-50%, -38%) scale(.96)' }], { duration: 300, delay: MS - 300, easing: EASE_OUT, fill: 'forwards' }).onfinish = out;
  else setTimeout(out, MS);
}

// 赌输的牌（连同叠的租金翻倍）：等转轮停下再从出牌人那里落进弃牌堆
function bustToDiscard(gb, prev) {
  const mine = gb.player === me();
  const ids = [gb.cardId].concat(gb.doubles || []).map(String);
  ids.forEach(hold);
  setTimeout(() => {
    const to = discardBox();
    ids.forEach((id, k) => {
      const src = mine ? (dragDrops.get(id) || {}).box || (prev && prev.m.get(id)) || (prev && prev.hand) : prev && prev.opp;
      if (!src || !to || !motionOK()) { release(id); return; }
      const holder = document.createElement('div');
      holder.innerHTML = cardHTML(+id);
      const g = makeGhost(cleanClone(holder.firstElementChild), to, !mine);
      const timing = { duration: 480, delay: k * 80, easing: EASE_MOVE, fill: 'backwards' };
      const a = track(g.animate(arcFrames(src, to, { lift: 0.6, pop: 0.04 }), timing));
      if (!mine) track(g.firstChild.animate([{ transform: 'rotateY(180deg)' }, { transform: 'rotateY(0deg)', offset: 0.7 }, { transform: 'rotateY(0deg)' }], timing));
      const done = () => { if (!g.isConnected) return; g.remove(); land(release(id), 1.06); };
      a.onfinish = done;
      a.oncancel = done;
    });
  }, motionOK() ? gamblePlan(gb).stopMs : 0);
}

// 根据这次更新里发生的事：放声音、震动、飘字、亮相和庆祝
// 交接：对方最后一张牌（出完自动结束回合）、我的回合开始、我摸的两张在同一次更新里。先让他那张落地（是行动卡就等它亮完相），
// 再发我的牌、响"轮到你"——一件事接一件事，不糊成一团。返回要晚多少 ms
function handoffMs(job, reveal) {
  if (!motionOK() || !job.prev || !S.snap) return 0;
  const i = me();
  if (job.prev.view.turn.player === i || !job.events.some((e) => e.type === 'turnStart' && e.player === i)) return 0;
  if (reveal && reveal.e && reveal.e.player !== i) {
    const gb = job.pre ? null : job.events.find((e) => e.type === 'gamble');
    return (gb ? gamblePlan(gb).ms : 0) + REVEAL.oppIn + (reveal.e.target === i ? REVEAL.holdHit : REVEAL.hold) + REVEAL.out - 150;
  }
  return job.events.some((e) => (e.type === 'property' || e.type === 'bank' || e.type === 'actionPlayed') && e.player !== i) ? 380 : 0;
}

function runEffects(job, rects, reveal) {
  const prev = job.prev;
  softCoin.clear();
  if (!prev || !S.snap) return;
  const v = V();
  const i = me();
  const o = opp();
  const P0 = prev.view.players;
  const P1 = v.players;
  let t = 0;
  const at = () => { t += 0.06; return t - 0.06; };
  let stamped = false;
  const pre = !!job.pre; // 结果揭晓的大场面已经在旧桌面上播过了：这里只管把钱和牌落到位
  const gb = job.events.find((e) => e.type === 'gamble');
  if (gb && !pre) gambleFx(gb);
  if (reveal && rects && reveal.bust) bustToDiscard(reveal.bust, rects);
  const gms = gb && !pre ? gamblePlan(gb).ms : 0;
  if (reveal && rects) revealCard(reveal, rects, gms);
  const after = gb && motionOK() ? gms / 1000 : 0; // 被针对的提示音等老虎机停了再响
  const ins = [0, 0];
  let insFull = false;
  const lead = S.handoff || 0; // 交接：对方的牌先落地，我摸的牌、"轮到你"再来（playFlights 的摸牌也晚这么多）
  const rain = [null, null]; // 金币雨每一方第一枚 / 最后一枚落地的时刻：银行数字照这个节奏滚
  const addRain = (p, r) => { if (r) rain[p] = rain[p] ? { first: Math.min(rain[p].first, r.first), last: Math.max(rain[p].last, r.last) } : r; };
  for (const e of job.events) {
    switch (e.type) {
      case 'draw':
        if (reveal && reveal.jkDraw === e) { // 奖池开奖摸的牌：等转轮
          if (e.player === i) deferDraw(e.cardIds || [], gms + 500);
          else setTimeout(() => flyBacks(e.count), motionOK() ? gms + 500 : 0);
          break;
        }
        if (e.count && e.player === i) {
          for (let k = 0; k < Math.min(e.count, 5); k++) sound.play('card', at() + lead / 1000 + k * 0.03);
          (e.cardIds || []).forEach((id, k) => { if (isPremium(id)) setTimeout(() => sparkleCard(id), lead + 620 + k * 90); });
        } else if (e.count) flyBacks(e.count);
        break;
      case 'property': case 'steal': case 'swap':
        sound.play('card', at());
        if (e.type === 'property' && e.player === i) { // 离成套近了一步（还没成套）：牌落地时拨一下弦，张数越多音越高；成套那一张交给大场面的和弦
          const set = P1[i].sets.find((x) => x.id === e.setId);
          if (set && !set.full) {
            const f = [523.25, 659.25, 783.99, 987.77][Math.max(0, Math.min(3, set.cards.length - 1))] * Math.pow(2, P1[i].fullColors.length * 2 / 12);
            sound.play('pluck', 0.42, f);
            setTimeout(() => bumpEl($(`#screen .set[data-set="${e.setId}"][data-p="${i}"] .cap`), 1.3), 420);
          }
        }
        break;
      case 'bank':
        if (e.player === o) sound.play('card', at());
        else if (motionOK() && held.has(String(e.cardId))) softCoin.add(String(e.cardId)); // 自己存钱：金币声挪到牌落进银行那一下（那张牌真的在飞才挪）
        break;
      case 'building':
        sound.play('set', at());
        setTimeout(() => { const st = $(`#screen .set[data-set="${e.setId}"][data-p="${e.player}"] .stack`); if (st) { shineOn(st, 0); ringBurst(boxOf(st), '#c49a3a'); } }, 420);
        break;
      case 'actionPlayed':
        if (e.player === o && e.target === i) { sound.play('alert', at() + after); setTimeout(() => haptic('warn'), after * 1000); } else sound.play('card', at() + after);
        break;
      case 'payment':
        if (e.from !== e.to && (e.paid || e.amount)) addRain(e.to, coinRain(e.from, e.to, e.paid || e.amount, 120));
        break;
      case 'justSayNo': // 自己挡下的是好事（金色）、被挡是坏事（酒红）；反将一军时一层压一层
        if (!stamped) { stamp(`${NM('justSayNo')}！`, e.player === i ? 'good' : 'red', false, null, { depth: e.depth }); stamped = true; }
        break;
      case 'setStolen':
        if (!stamped) { stamp(e.to === i ? '抢到一整套！' : '整套被抢走了', e.to === i ? 'good' : 'red', false, null, { hap: e.from === i ? 'heavy' : '' }); stamped = true; }
        if (e.from === i) setTimeout(() => shakeEl($('#screen .zone.me')), 200);
        break;
      case 'canceled':
        sound.play('pop', at());
        break;
      case 'bankrupt':
        if (!stamped) { stamp(e.to === i ? '破产！' : '银行被搬空', e.to === i ? 'good' : 'red'); stamped = true; }
        if (e.amount) addRain(e.to, coinRain(e.from, e.to, Math.min(12, e.amount), 200));
        if (e.from === i) setTimeout(() => shakeEl($(`#screen .bank[data-p="${i}"]:not(.empty)`) || bankSpot(i)), 300); // 银行被搬空：晃的是中间那一排右边的银行
        break;
      case 'liquidated':
        if (!stamped) { stamp('清算！', e.by === i ? 'good' : 'red'); stamped = true; }
        if (e.from === o && e.handCount) backsToDiscard(e.handCount, 260);
        if (e.from === i) { setTimeout(() => shakeEl($('#screen .zone.me')), 300); setTimeout(() => shakeEl($('#screen .handbox')), 380); }
        break;
      case 'hugeWin':
        if (!stamped) { stamp('HUGE WIN', e.by === i ? 'gold' : 'red'); stamped = true; }
        if (e.by === i) {
          haptic('success');
          setTimeout(() => confetti({ x: innerWidth / 2, y: innerHeight * 0.4, count: 70, angle: -90, spread: 150, speed: 12 }), 260);
          setTimeout(() => e.boostColors.forEach((c, n) => { const st = $(`#screen .zone.me .set.full[data-color="${c}"] .stack`); if (st) { setTimeout(() => { ringBurst(boxOf(st), '#c49a3a'); shineOn(st); }, n * 140); } }), 700);
        } else if (e.from === i) {
          setTimeout(() => shakeEl($('#screen .zone.me')), 300);
        }
        break;
      case 'autoEndTurn':
        if (e.player === i && !e.lapsed) notice(`出满 ${e.plays} 张，自动结束回合`, 'ok'); // 超时用完次数的由 timeoutNote 说
        break;
      case 'insurance': // 一次付款可能触发好几格：合起来说一次
        if (e.gained) ins[e.player] += e.gained;
        else if (e.player === i) insFull = true;
        break;
      case 'surgeEnd':
        powerFx(e.player, '筹码清零', 'minus');
        notice(`${e.player === i ? '你的' : `${P1[e.player].name} 的`}满格加成结束，筹码清零`, 'ok', 2600);
        break;
      case 'tycoonOffered':
        if (e.player !== i) notice(`${P1[e.player].name} 触发贪婪大亨，在选吸血或套现`, 'warn', 3200);
        break;
      case 'vampire': {
        const el = $(`#screen [data-bank="${e.player}"]`);
        if (el && e.amount) floatText(`🩸 +${e.amount}M`, el.getBoundingClientRect(), 'gold');
        if (e.player === i && e.amount) sound.play('coin', at());
        if (e.player !== i) notice(`${P1[e.player].name} 在吸血：你存钱，他白拿 ${e.amount}M`, 'warn', 2400);
        break;
      }
      case 'ghostCurse':
        if (e.player === i) notice(`捉鬼套装：这回合摸的 ${e.count} 张都是 1M`, 'warn', 3200);
        else notice(`${P1[e.player].name} 这回合摸的 ${e.count} 张都是 1M`, 'ok', 2600);
        break;
      default:
        break;
    }
    if (e.type === 'steal' && e.from === i) setTimeout(() => shakeEl($('#screen .zone.me')), 260);
  }
  // 奖池：数字等转轮停下再变
  if (gb && !pre && v.rules.jackpot && (prev.view.pot || 0) !== (v.pot || 0)) {
    S.potShown = prev.view.pot || 0;
    refreshPot(false);
    setTimeout(() => {
      S.potShown = null;
      refreshPot(true);
      if (S.snap && (V().pot || 0) > (prev.view.pot || 0)) sound.play('chips');
    }, motionOK() ? gamblePlan(gb).stopMs : 0);
  }
  // 加注 / 跟注 / 弃牌
  for (const e of job.events) {
    if (e.type === 'raiseOffered') {
      sound.play('chips');
      if (e.target === i) setTimeout(() => stamp(`加注 ×${e.stake}`, 'gold', false, `加注 ${multHTML(e.stake)}`, { hap: 'warn' }), 80);
      else { const st = $('#screen .stage'); if (st) floatText(`加注 ×${e.stake}`, st.getBoundingClientRect(), 'gold', `加注 ${multHTML(e.stake)}`); }
    } else if (e.type === 'raiseTaken') { // 越加越大：翻倍声每次高四个半音、震得更狠、桌上的倍率牌翻个面
      const lv = Math.max(1, Math.log2(e.stake || 2));
      sound.play('chips');
      cameraShake(4 + 3 * lv, 420);
      setTimeout(() => {
        const z = $('#screen .zstake');
        bumpEl(z, 1.5);
        if (z && motionOK()) z.animate([{ transform: 'perspective(240px) rotateX(0deg)' }, { transform: 'perspective(240px) rotateX(360deg)' }], { duration: 500, easing: EASE_OUT });
      }, 120);
      if (e.player === i) { notice(`跟注，这局 ×${e.stake}`, 'ok', 2400); sound.play('double', 0.1, lv); }
      else { notice(`${P1[e.player].name} 跟注了，这局 ×${e.stake}`, 'ok', 2600); stamp('跟注！', 'gold', false, null, { lvl: lv }); }
    } else if (e.type === 'folded' && e.player !== i) {
      notice(`${P1[e.player].name} 弃牌了`, 'ok', 2600);
    }
  }
  // 对方手牌数变了：数字轻轻跳一下
  if (P0[o].handCount !== P1[o].handCount) bumpEl($('#screen .zcount.opp .cnt'), 1.3);
  // 轮到对方：对方那圈灰色虚线也亮一下（和自己回合时的蓝色对应）
  if (v.phase !== 'gameOver' && job.events.some((e) => e.type === 'turnStart' && e.player === o)) {
    const z = $('#screen .zone.opp');
    const zp = z && $('.arc path', z);
    if (zp && motionOK()) zp.animate([{ stroke: 'rgba(23, 20, 15, .18)' }, { stroke: 'rgba(23, 20, 15, .48)', offset: 0.25 }, { stroke: 'rgba(23, 20, 15, .18)' }], { duration: 1100, easing: 'ease-out' });
  }
  // ③ 结算之后的大场面：按这个顺序排队（delay 只决定进队先后）——金币雨跟着钱一起下 → 集齐一套（epicSet 自己排 250）→ 捉鬼套装 → 成就 → 触发的机制
  const g0 = gb && !pre && motionOK() ? gms : 0; // 没有提前揭晓（减少动态效果时）：排在老虎机后面
  const lot = pre ? null : job.events.find((e) => e.type === 'lottery');
  if (lot) { // 大乐透没有提前开奖：中的钱先藏起来，开奖的数字停下再飞进银行
    lot.cardIds.forEach((id) => hold(String(id)));
    spotlight(() => lotteryFx(lot), 3300, g0 + 100);
  }
  gainsOf(job.events).forEach((amt, p) => { if (amt > 10) spotlight(() => goldRain(p, amt), p === i ? 1500 : 900, g0 + (lot ? 1000 : 150)); });
  job.events.filter((e) => e.type === 'ghost').forEach((e) => ghostLater(e, rects, g0 + 350));
  const aw = job.events.filter((e) => e.type === 'award');
  aw.forEach((e) => { const ms = e.player !== i ? 1300 : aw.length > 1 ? 1900 : 2300; spotlight(() => awardFx(e.player, e.award, ms), ms, g0 + 450); });
  ins.forEach((n, p) => { if (n) setTimeout(() => powerFx(p, `筹码保险 +${n / 2}`, 'gold', 'insurance'), 520); });
  if (insFull) notice('筹码已满，溢出的不算', 'ok', 2200);
  // 触发的机制：登场大场面同样排队。对方自己触发的（筹码满格、赌场礼赠、贪婪大亨）短一点：1.5 秒
  const MECH = g0 + 550;
  const intro = (e) => (e.player === i ? 2400 : 1500);
  job.events.forEach((e) => {
    if (e.type === 'auctionStart') spotlight(() => mechFx('auction', '秘密竞价', `双方都有完整的${COLOR(e.color).zh}`, '暗标出价：高者拿走双方出价并毁掉对方那套'), 2400, MECH);
    else if (e.type === 'auctionResult') { if (!pre) spotlight(() => auctionResultFx(e), 3400, g0 + 300); }
    else if (e.type === 'giftEarned') spotlight(() => mechFx('gift', '赌场礼赠', `${e.player === i ? '你' : v.players[e.player].name} 连续 ${e.streak} 次押 ×4 以上`, '下回合可自己打开或送给对方', intro(e)), intro(e), MECH);
    else if (e.type === 'giftOpened') { if (!pre) spotlight(() => giftOpenFx(e), 3200, g0 + 300); }
    else if (e.type === 'takeoverStart') { if (!pre) spotlight(() => takeoverFx(e), 3400, g0 + 300); }
    else if (e.type === 'saleStart') spotlight(() => saleFx(e), 2400, MECH);
    else if (e.type === 'saleEnd') { if (!pre) spotlight(() => saleFx(e), e.sold ? 2600 : 2000, g0 + 200); }
    else if (e.type === 'saleBid') {
      sound.play('chips');
      const st = $('#screen .stage');
      if (e.player !== i) { haptic('warn'); if (st) floatText(`${v.players[e.player].name} 出价 ${e.amount}M`, st.getBoundingClientRect(), 'gold'); }
      requestAnimationFrame(() => { const pr = $('.sheet .sale-price b'); if (pr) bumpEl(pr, 1.3); }); // 面板这一拍才换成新价钱
    }
    else if (e.type === 'rouletteSpin') { if (!pre) spotlight(() => rlSpinFx(e), rlSpinMs(), g0 + 300); }
    else if (e.type === 'surge') spotlight(() => mechFx('power', '筹码满格', `${e.player === i ? '你' : v.players[e.player].name} 攒满了 ${v.rules.powerCap} 点筹码`, `收租 ×${e.mult}，不成套也算，再持续 ${e.turns} 个自己的回合，然后筹码清零`, intro(e)), intro(e), MECH);
    else if (e.type === 'tycoon') spotlight(() => mechFx('tycoon', '贪婪大亨', `${e.player === i ? '你' : v.players[e.player].name} 从对方拿到的地产累计 ${e.grab}M`, e.player === i ? '每局一次：吸血还是套现？' : '每局一次：对方在选吸血或套现', intro(e)), intro(e), MECH);
    else if (e.type === 'tycoonChosen') {
      if (pre) return;
      const who = e.player === i ? '你' : v.players[e.player].name;
      spotlight(() => mechFx('tycoon', e.mode === 'vampire' ? '🩸 吸血' : '💰 套现', `${who} 选了${e.mode === 'vampire' ? '吸血' : '套现'}`, e.mode === 'vampire' ? `本局内：对方每存 ${e.step}M，${who}白拿 1M；对方向${who}收钱只算一半` : `${e.rentCount} 张全色租金 + 存进银行 ${e.amount}M`), 2400, g0 + 300);
    }
    else if (e.type === 'auctionBid' && e.player === o && v.phase === 'respond') notice(`${v.players[o].name} 已经出价了`, 'ok', 1800);
    else if (e.type === 'giftOffered' && e.player === o) notice(`${v.players[o].name} 得到赌场礼赠，在选打开或送你`, 'warn', 2600);
    else if (e.type === 'redeemed') {
      notice(`${e.player === i ? '你' : v.players[e.player].name} 付 ${e.paid}M 赎回了${COLOR(e.color).zh}`, 'ok', 2200);
      setTimeout(() => { const st = $(`#screen .set[data-set="${e.setId}"][data-p="${e.player}"] .stack`); if (st) { shineOn(st, 0); ringBurst(boxOf(st), '#c49a3a'); } }, 300);
    }
  });
  // 银行金额变化：飘字 + 数字滚动（大乐透那部分等开奖时再加）。轮盘赌的筹码换钱由浮层自己说，不在浮层上面飘字。
  // 收到的钱有金币飞过来时：数字先停在原来的数，第一枚金币落进来才开始滚、最后一枚落定时滚到，"+NM"也这时才冒出来（声音由金币自己响）。
  // 一次进账很多（大丰收）：就是这个"+NM"放大成金色，同一刻收银机"咔嚓"一声——一次得手只出一个数字
  const overNow = v.phase === 'gameOver';
  const big = job.events.find((e) => (e.type === 'payment' && e.to === i && e.paid >= 8) || (e.type === 'bankrupt' && e.to === i && e.amount >= 8));
  const bigAmt = big && !overNow && gainsOf(job.events)[i] <= 10 ? big.paid || big.amount : 0; // 超过 10M 有金币雨，就不再重复庆祝
  const cashed = job.events.some((e) => e.type === 'rouletteCashOut');
  [i, o].forEach((p) => {
    const a = P0[p].bankTotal;
    const b = P1[p].bankTotal - (lot && lot.player === p ? lot.amount : 0);
    if (lot && lot.player === p) { const el = $(`#screen [data-bank="${p}"]`); if (el) el.textContent = b + 'M'; } // 开奖前先显示不含奖金的数
    if (a === b) return;
    const el = $(`#screen [data-bank="${p}"]`);
    if (!el) return;
    if (!motionOK()) el.textContent = b + 'M';
    const fl = b > a && p === i && bigAmt ? 'gold big' : b > a ? '' : 'minus';
    const show = (node) => {
      const nr = node.getBoundingClientRect();
      if (!cashed) floatText(`${b > a ? '+' : '−'}${Math.abs(b - a)}M`, nr.width ? nr : (bankSpot(p) || node).getBoundingClientRect(), fl); // 付到 0M、银行藏起来了：在银行那一列飘
      if (fl === 'gold big') bigHit();
    };
    const r = b > a ? rain[p] : null;

function fallback(c) {

// o: { btn, cls, color（所在组颜色，决定双色多功能地产正放还是倒放）, data, style }
function cardHTML(id, o) {
  o = o || {};
  const c = CARD(id);
  const flip = o.color && c.type === 'wild' && !c.any && o.color !== (upOf(c.face) || c.colors[0]);
  const miss = !hasImg(c.face);
  const cls = ['card', flip && 'flip', miss && 'noimg', o.cls].filter(Boolean).join(' '); // 「刚出现」的 fresh 类在渲染后再加，不写进 HTML：否则下一次重绘 HTML 必变，整块没法沿用
  const tag = o.btn ? 'button' : 'div';
  const extra = (o.btn ? ' type="button"' : '') + (o.show ? '' : ` data-card="${id}"`) + (o.data || '') + (o.style ? ` style="${o.style}"` : ''); // show：只是展示（弃牌堆里往下的历史），不参与飞牌
  const img = miss ? '' : `<img src="${imgUrl(c.face)}" alt="" decoding="sync" draggable="false">`; // 同步解码：Safari 异步解码新插入的图会先空白一帧
  return `<${tag} class="${cls}" data-face="${c.face}"${extra} aria-label="${esc(o.label || c.zh)}">${img}${fallback(c)}${o.inner || ''}</${tag}>`;
}

function backHTML(o) {

// 卡图加载失败时改用兜底牌面，并记住这张缺图
document.addEventListener('error', (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement)) return;
  if (img.dataset.chip) { // 筹码图读不到：R2 上的先整套改走后端（后端也从 R2 读）；后端也不行就整套换回原来的图 / 内置图标，不留一半
    const src = img.getAttribute('src') || '';
    if (CHIPS && STK_BASE && src.startsWith(STK_BASE)) CHIPS = CHIPS.map((u) => { const m = u.startsWith(STK_BASE) && u.slice(STK_BASE.length).match(/\/([A-Za-z0-9_-]{4,64})(\.thumb)?\.\w+$/); if (!m) return u; stickers.r2bad.add(m[1]); return stickers.api(m[1], !!m[2]); });
    else CHIPS = null;
    if (S.screen === 'game' && S.snap) render();
    return;
  }
  if (img.dataset.art) { // 成就 / 银行图读不到：先换成文字，后台换别的候选网址再试（试到了会重绘换回图片）
    const k = img.dataset.art;
    if (artSrc[k] && img.src === artSrc[k]) delete artSrc[k]; // 原来能读的这会儿读不到了：重新找
    resolveArt(k, true);
    if (img.classList.contains('bolt')) { // 筹码格：换成内置闪电，满 / 半 / 空照样分得清
      const ic = document.createElement('i');
      ic.className = img.className;
      ic.innerHTML = ICON.volt;
      img.replaceWith(ic);
      return;
    }
    const mu = img.closest('.mult'); // 倍率图里有一张读不到：整个 ×N 换回文字，不留半图半字
    if (mu) { mu.replaceWith(document.createTextNode(mu.getAttribute('aria-label') || '')); return; }
    if (img.dataset.fb != null) img.replaceWith(document.createTextNode(img.dataset.fb));
    else img.remove();
    return;
  }
  const card = img.closest('.card');
  if (!card) return;
  const raw = rawOf(img.getAttribute('src'));
  if (raw) { img.src = raw; return; } // 转换后的图读不到：换原图再试一次
  S.missing.add(card.dataset.face);
  card.classList.add('noimg');
  img.remove();
}, true);

let preloaded = false;
let ratioFixed = false;
function useRatio(r) {
  if (ratioFixed || !(r > 0.45 && r < 0.95)) return;
  ratioFixed = true;
  store.set('ratio', r);
  if (Math.abs(r - CONFIG.RATIO) < 0.003) return;
  CONFIG.RATIO = r;
  document.documentElement.style.setProperty('--ratio', String(r));
  layoutHand();
}
function preloadFaces() {
  if (preloaded || !S.meta) return;
  preloaded = true;
  // 成就和大乐透的图也先拉下来、解码好：弹出来的那一刻不能是空白
  Object.keys(CONFIG.ART).forEach((k) => resolveArt(k));
  S.meta.faces.forEach((f) => {
    if (fileOf(f.face) == null) return;
    const im = new Image();
    im.decoding = 'async';
    im.onload = () => useRatio(im.naturalWidth / im.naturalHeight);
    im.onerror = () => { const raw = rawOf(im.src); if (raw) im.src = raw; else S.missing.add(f.face); };
    im.src = imgUrl(f.face);
  });
}

/* ═══════════ 渲染 ═══════════ */
// 整页重绘时沿用旧的 <img>：同一张图的节点直接挪进新 DOM，已经解码好的位图不用重新解码（Safari 重新解码时会白一帧，看起来就是闪）
function collectImgs(root) {
  const m = new Map();
  $$('img', root).forEach((img) => { const k = img.getAttribute('src'); if (!m.has(k)) m.set(k, []); m.get(k).push(img); });
  return m;
}
function reuseImgs(root, m) {
  if (!m.size) return;
  const old = new Set();
  m.forEach((list) => list.forEach((img) => old.add(img)));
  $$('img', root).forEach((img) => {
    if (old.has(img)) return; // 本来就是沿用下来的旧节点
    const list = m.get(img.getAttribute('src'));
    if (!list) return;
    while (list.length && list[list.length - 1].isConnected) list.pop();
    if (!list.length) return;
    // 同一张图在不同位置样式可能不同（比如筹码格的满 / 空用同一张图）：旧节点换上新节点的属性，只是不重新解码
    const keep = list.pop();
    for (const at of [...keep.attributes]) if (!img.hasAttribute(at.name)) keep.removeAttribute(at.name);
    for (const at of [...img.attributes]) if (keep.getAttribute(at.name) !== at.value) keep.setAttribute(at.name, at.value);
    img.replaceWith(keep);
  });
}
const sectionHtml = new Map(); // data-key → 上次生成的 HTML：没变的分块整块沿用旧节点

function render() {
  const root = $('#screen');
  const scroll = {};
  const oldKeyed = new Map();
  $$('[data-key]', root).forEach((el) => { scroll[el.dataset.key] = el.scrollLeft; oldKeyed.set(el.dataset.key, el); });
  const oldImgs = collectImgs(root);
  let html = '';
  switch (S.screen) {
    case 'boot': html = ''; break;
    case 'connecting': html = connectingHTML(); break;
    case 'home': html = homeHTML(); break;
    case 'join': html = joinHTML(); break;
    case 'lobby': html = lobbyHTML(); break;
    case 'matching': html = matchingHTML(); break;
    case 'game': html = S.snap ? gameHTML() : ''; break;
    case 'fatal': html = fatalHTML(); break;
    default: html = '';
  }
  const focus = saveUIFocus(root);
  const keepInputs = {};
  $$('input[id]', root).forEach((el) => { keepInputs[el.id] = el.value; });
  root.innerHTML = html;
  // 手牌、双方桌面这几块内容没变就沿用旧节点：不打断正在惯性滚动的手牌、不重置滚动位置、不重新解码卡图
  const reused = new Set();
  $$('[data-key]', root).forEach((el) => {
    const k = el.dataset.key;
    const h = el.outerHTML;
    const old = oldKeyed.get(k);
    if (old && sectionHtml.get(k) === h) { el.replaceWith(old); reused.add(k); }
    sectionHtml.set(k, h);
  });
  reuseImgs(root, oldImgs);
  // 换页时各块依次上浮进场；同一页里重绘时把"已经过了多久"带上，动画接着播而不是重来
  if (S.screen !== S.lastScreen) { S.lastScreen = S.screen; S.enterAt = performance.now(); if (scrollY) scrollTo(0, 0); } // 换页从顶上开始：不带着上一页的滚动位置
  const first = root.firstElementChild;
  if (first && motionOK()) {
    first.classList.add('enter');
    first.style.setProperty('--enter-t', Math.round(S.enterAt - performance.now()) + 'ms');
  }
  Object.keys(keepInputs).forEach((k) => { const el = $('#' + k); if (el && document.activeElement !== el) el.value = keepInputs[k]; });
  if (!restoreUIFocus(focus, root) && focus && S.screen === 'game' && !activeDialog()) { const t = $('.hand .card', root) || $('.dock .main:not([disabled])', root); if (t) t.focus({ preventScroll: true }); } // 有焦点的牌打出去了：焦点留在手牌里，不掉回页面开头
  $$('[data-key]', root).forEach((el) => { if (!reused.has(el.dataset.key) && scroll[el.dataset.key] != null) el.scrollLeft = scroll[el.dataset.key]; });
  const ll = !reused.has('livelog') && $('#screen .livelog .ll-list');
  if (ll && ll.clientHeight) ll.scrollTop = ll.scrollHeight; // 实时记录有新的一行：滚到最下面
  if (S.screen === 'game' && S.snap) {
    S.fresh.forEach((id) => { const el = cardNode(id); if (el) el.classList.add('fresh'); });
    hideHeld();
    layoutHand();
    layoutArcs();
    selFx();
    stageFx();
    faceSync();
    morphMain();
    nudgeEnd();
    if (S.dealIn) { S.dealIn = false; dealIn(); }
  }
  if (S.screen === 'game' || S.screen === 'lobby') wake.on();
  const job = S.fxJob;
  const prev = S.flip;
  S.fxJob = null;
  S.flip = null;
  const reveal = job && prev ? pickReveal(job) : null; // 行动卡由"亮相"动画负责，不走普通飞行
  S.handoff = job && prev ? handoffMs(job, reveal) : 0;
  if (prev) { playFlights(prev, reveal && reveal.skip); vanishToDiscard(prev, reveal && reveal.skip); }
  if (job) runEffects(job, prev, reveal);
  if (job && S.screen === 'game' && S.snap) faceReact(job.events, job.prev);
  S.handoff = 0;
  rouletteSync(job);
  settleDropped();
  document.title = (S.snap && S.screen === 'game' && V().phase !== 'gameOver' && V().activePlayer === me() ? '轮到你了 - ' : '') + 'Monopoly Deal 双人对战';
  renderSheet();
}
