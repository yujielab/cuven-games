}
function notePong() {
  if (!S.pingAt) return;
  const rtt = Date.now() - S.pingAt;
  noteRtt(rtt);
  S.pingAt = 0;
  S.slow = rtt > 1200 ? (S.slow || 0) + 1 : 0;
  if (S.slow === 2) notice('网络有点慢，操作会晚一点生效', 'warn');
}

function send(msg) {
  if (S.ws && S.ws.readyState === 1) {
    try { S.ws.send(JSON.stringify(msg)); return true; } catch (e) { return false; }
  }
  notice(S.net === 'offline' ? '网络断开了，连上后再试' : '正在重新连接，稍等一下', 'err');
  return false;
}

const ANSWERS = new Set(['PAY', 'ACCEPT', 'JUST_SAY_NO', 'BID', 'GIFT', 'TYCOON', 'DISCARD']);
const ANSWER_SHEETS = new Set(['respond', 'auction', 'gift', 'tycoon', 'discard']);
// 发一个动作，等服务器确认。断线时不丢：连接恢复后用同一个编号重发，服务器保证只执行一次
function act(action) {
  if (S.busy) return Promise.resolve(false);
  if (S.gate) return queueAct(action); // 桌面还没落到最新局面：先记下这一下，揭晓放完再发（以前是悄悄丢掉，点了没反应）
  if (!S.wsOpen && S.net !== 'reconnecting') { notice('还没连上，稍等一下', 'err'); return Promise.resolve(false); }
  S.busy = true;
  document.body.classList.add('busy');
  renderDock();
  const p = { aid: randomHex(10), action, t0: Date.now(), sent: false };
  const answering = ANSWERS.has(action.type) ? S.autoKey : null; // 回应 / 出价 / 弃牌：答的是哪个决定点
  S.pending = p;
  // 立刻给手感：点出去的那张牌马上亮一下（服务器确认后再正常飞到位）
  const sentId = action.cardId != null ? action.cardId : null;
  if (sentId != null) { const el = cardNode(sentId); if (el) el.classList.add('sending'); }
  return new Promise((resolve) => {
    p.timer = setTimeout(() => p.done({ ok: false, error: { message: '这一步没收到确认。如果桌面上已经生效就不用再点' } }), 15000);
    p.slowTimer = setTimeout(() => tickStage(), 2600);
    p.done = (m, quiet) => {
      if (S.pending !== p) return;
      clearTimeout(p.timer);
      clearTimeout(p.slowTimer);
      S.pending = null;
      S.busy = false;
      document.body.classList.remove('busy');
      $$('.card.sending').forEach((el) => el.classList.remove('sending'));
      if (quiet) { resolve(false); return; }
      if (!m.ok) {
        notice(m.error && m.error.message ? m.error.message : '操作失败', 'err', 3000);
        sound.play('error');
        haptic('error');
      } else {
        haptic('light');
        armIdle();
        // 答完了：面板马上收起（结果可能还要等前面的动画放完才落到桌上，旧面板不该一直挂着、还能再点）
        if (answering) { S.answered = answering; if (S.sheet && ANSWER_SHEETS.has(S.sheet.type)) S.sheet = null; }
      }
      render();
      resolve(!!m.ok);
    };
    sendPending();
  });
}
// 揭晓（老虎机、开奖、亮价……）还在放时点的出牌 / 回应：只排一个。排在开闸的回调后面，轮到它时揭晓的结果已经落到桌上；
// 再核对一遍还能不能这么做，能就照常发出去，不能就悄悄作废（拖出去 / 从面板点出去的牌弹回手里），不拿过时的操作去碰服务器报错
function queueAct(action) {
  if (S.queued) {
    if (S.queued.gate === S.gate) return Promise.resolve(false); // 已经排了一个：再点的不算
    dropQueued(); // 排在早就开过的闸门上、没被放出去（开闸时出了意外）：作废，别一直挡着
  }
  return new Promise((resolve) => {
    const q = { action, resolve, key: S.autoKey, gate: S.gate };
    S.queued = q;
    sinkDrops();
    render(); // 选目标模式这类界面状态已经在调用方清掉了：现在就画出来，不等揭晓放完
    const id = action.cardId != null ? String(action.cardId) : null;
    if (id != null) { const el = cardNode(id); if (el) el.classList.add('sending'); }
    if (id == null || !dragDrops.has(id)) haptic('light'); // 拖出去 / 从面板点出去的牌松手时已经震过
    const flush = () => {
      if (S.queued !== q) return;
      if (S.gate) { q.gate = S.gate; spotlight.idle(flush); return; } // 排着的消息里又有揭晓：接着等
      if (!queuedValid(q)) { dropQueued(); return; }
      S.queued = null;
      act(action).then(resolve);

}
// 揭晓放完后排着的那一下还作数吗：出牌要那张牌还在手里、还能这么出、还有次数；回应要还是同一个决定点；其余的交给服务器判断
function queuedValid(q) {
  if (!S.snap || S.screen !== 'game') return false;
  const o = O();
  const a = q.action;
  if (ANSWERS.has(a.type) || a.type === 'FOLD') return S.autoKey === q.key && !!(o.respond || o.discard);
  if (a.type === 'END_TURN') return o.canEndTurn;
  if (/^PLAY_/.test(a.type)) { const h = o.hand.find((x) => x.cardId === a.cardId); return !!(h && (a.type === 'PLAY_BANK' ? h.bank : h.play) && o.playsLeft > 0); }

// 排着的那一下作废：拿到完整局面（重连、切回前台）、闸门超时、离开这一局
function dropQueued() {
  const q = S.queued;
  if (!q) return;
  S.queued = null;
  $$('.card.sending').forEach((el) => el.classList.remove('sending'));
  q.resolve(false);

function sendPending() {
  const p = S.pending;
  if (!p || p.sent || !S.ws || S.ws.readyState !== 1) return;
  try {
    S.ws.send(JSON.stringify({ t: 'act', id: p.aid, aid: p.aid, action: p.action }));
    p.sent = true;
    p.sentAt = Date.now();
  } catch (e) { /* 等重连后再发 */ }
}

// 屏幕常亮：对局中手机不自动锁屏（锁屏会断开连接）
const wake = (() => {
  let lock = null;
  return {
    async on() {
      if (lock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      try {
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { lock = null; });
      } catch (e) { lock = null; }
    },
    off() { try { if (lock) lock.release(); } catch (e) { /* 忽略 */ } lock = null; },
  };
})();

/* 一次更新怎么"演"：三段，一段放完再下一段
 *   ① 揭晓：决定结果的悬念（老虎机、大乐透开奖、竞价亮价、开礼盒、套现）——在旧桌面上先放，结果出来之前钱和牌不动
 *   ② 结算：牌飞到位、付款、银行数字滚动、印章；进账很多时金币雨跟着钱一起下
 *   ③ 后续：这次结算引出来的大场面排队一个个放——集齐一套、捉鬼套装（转轮停了牌才落）、成就、触发的机制
 * 要自己操作的面板（付款、出价、二选一……）和回合台的提示，都等这些放完再出。①放的时候后面来的消息按顺序排队，不插进来 */
const SUSPENSE = new Set(['gamble', 'lottery', 'giftOpened', 'auctionResult', 'tycoonChosen', 'takeoverStart', 'rouletteSpin']);

function onMessage(m) {
  if (S.gate && m.t === 'welcome') { S.gate = null; clearTimeout(S.gateTimer); dropQueued(); } // 完整局面（重连、切回前台、新的一局）：直接以它为准，排着的旧消息、排着的那一下都作废
  if (S.gate && GATED.has(m.t)) { S.gate.push(m); return; }
  if (m.t === 'update' && S.screen === 'game' && S.snap && motionOK() && m.events.some((e) => SUSPENSE.has(e.type))) {
    const gate = [];
    S.gate = gate;
    sinkDrops();
    if (S.sheet && S.sheet.type === 'sale' && m.events.some((e) => e.type === 'saleEnd')) closeSheet(); // 落槌和后面的大场面一起来：拍卖面板先收起来
    const go = () => {
      if (S.gate !== gate) return;
      const q = gate;
      S.gate = null;
      clearTimeout(S.gateTimer);
      handleMessage(Object.assign({}, m, { pre: true }));
      while (q.length) { // 排队的消息依次处理；其中又有要先播大场面的，剩下的接着排在它后面
        onMessage(q.shift());
        if (S.gate) { S.gate.push(...q); return; }
      }
    };
    const start = () => { if (S.gate !== gate) return; playReveals(m.events); spotlight.idle(go); };
    const lead = landDrops(m.events); // 自己刚出的那张先落到桌上，再开始揭晓
    if (lead) setTimeout(start, lead); else start();
    S.gateTimer = setTimeout(() => { if (S.gate === gate) dropQueued(); go(); }, 20000); // 保险：大场面出了意外也不会卡住（卡了这么久，排着的那一下也不作数了）
    return;
  }
  handleMessage(m);
}

    else if (e.type === 'saleEnd') spotlight(() => saleFx(e), e.sold ? 2600 : 2000); // 落槌在前、恶意收购在后（拍到的那张凑齐了收购色）
    else if (e.type === 'takeoverStart') spotlight(() => takeoverFx(e), 3400);
    else if (e.type === 'rouletteSpin') spotlight(() => rlSpinFx(e), rlSpinMs());
    else if (e.type === 'tycoonChosen') {
      const who = e.player === i ? '你' : V().players[e.player].name;
      spotlight(() => mechFx('tycoon', e.mode === 'vampire' ? '🩸 吸血' : '💰 套现', `${who} 选了${e.mode === 'vampire' ? '吸血' : '套现'}`, e.mode === 'vampire' ? `直到这局结束：对方每存 ${e.step}M，${who}白拿 1M；对方向${who}收钱只算一半` : `${e.rentCount} 张全色租金 + 存进银行 ${e.amount}M`), 2400);
    }

}

function handleMessage(m) {
  switch (m.t) {
    case 'welcome':
      S.room.seat = m.seat;
      S.info = m.room;
      syncPresence();
      if (m.view) {
        if (S.screen === 'game' && S.snap && S.round === m.room.round) S.flip = snapshotRects(); // 重连：牌从原位过渡到最新位置
        // 刚开局（从等待页进来，或者再来一局）：播一段发牌动画
        const newRound = !!S.snap && S.round !== m.room.round;
        if ((newRound || S.screen === 'lobby' || S.screen === 'connecting' || S.screen === 'matching') && m.view.turn.number <= 1 && m.view.turn.plays === 0 && m.view.phase === 'play') {
          S.dealIn = true;
          const tk = m.view.takeover;
          if (tk && tk.player == null && S.meta.colors[tk.color]) setTimeout(() => notice(`恶意收购：这局是${S.meta.colors[tk.color].zh}，先集齐一整套的人触发轮盘赌`, 'warn', 4200), 2400);
        }
        const fresh = !S.snap || S.snap.view.seq > m.view.seq || (S.info && S.round !== m.room.round);
        if (S.snap && S.round !== m.room.round) { sound.play('riffle'); disarmIdle(); } // 新的一局：洗牌声
        if (m.view.activePlayer === m.seat && m.view.phase === 'play') armIdle();
        if (S.round !== m.room.round || fresh) S.combo = 0;
        S.round = m.room.round;
        S.potShown = null;
        setSnap(m, fresh);
        S.log = (m.log || []).slice();
        S.screen = 'game';
        if (S.match) { clearTimeout(S.match.timer); S.match = null; }
        guardHistory();
      } else {
        S.snap = null;
        S.screen = m.room && m.room.mode === 'match' ? 'matching' : 'lobby';
        if (S.screen === 'matching' && !S.match) S.match = { start: Date.now(), roomId: m.room.id, bot: false }; // 刷新页面回来：接着等
        preloadFaces();
      }
      rememberSeat();
      if (S.justReconnected) { S.justReconnected = false; notice('已重新连接', 'ok', 1800); }
      sendPending(); // 断线前没确认的动作：用同一个编号重发，服务器只会执行一次
      break;
    case 'update':
      if (m.rec && S.room) store.set('mrec', Object.assign({}, m.rec, { last: `${S.room.id}#${m.room.round}` })); // 对 AI 的局：战绩以服务器算的为准（recordMatch 看到 last 就不再重复记）
      S.flip = snapshotRects();
      S.fxJob = m.quiet ? null : { prev: S.snap, events: m.events, pre: !!m.pre }; // pre：结果揭晓的大场面已经先播过了；quiet：断线太久补的一大串，只飞牌不放特效
      S.holdUntil = S.flip ? Date.now() + revealHold(m.pre ? m.events.filter((e) => e.type !== 'gamble') : m.events) : 0; // 对方的牌正在亮相：回应面板等它落下再弹
      S.info = m.room;
      syncPresence();
      setSnap(m, false);
      if (m.timeout) timeoutNote(m.timeout, m.events);
      S.log.push(...m.lines);
      if (S.log.length > 400) S.log.splice(0, S.log.length - 400);
      announce(m.events, m.lines);
      break;
    case 'room': {
      const before = S.info && S.info.players;
      S.info = m.room;
      syncPresence();
      presenceChanged(before, m.room.players);
      break;
    }
    case 'replaced': // 同一个座位在别的窗口 / 设备上连上了：这边停下，不自动重连（否则两边互相挤）
      if (S.pending) S.pending.done({ ok: false }, true);
      disconnect();
      S.fatal = { title: '这一局在别的窗口打开了', text: '同一个座位同时只能在一个地方玩。要换回这里继续吗？', action: { label: '在这里继续', do: 'take-over' } };
      S.screen = 'fatal';
      closeSheet();
      break;
    case 'say':
      sayBubble(m.seat, m.text);
      return;
    case 'emote':
      emoteBubble(m.seat, m.e);
      if (S.info && m.count) { S.info.emotes = (S.info.emotes || [0, 0]).slice(); S.info.emotes[m.seat] = m.count; }
      return;
    case 'award':
      if (S.info && m.award === 'emoteMaster') { S.info.emoteAward = (S.info.emoteAward || [false, false]).slice(); S.info.emoteAward[m.seat] = true; }
      if (S.screen === 'game' && S.snap) spotlight(() => awardFx(m.seat, m.award), m.seat === me() ? 2500 : 1300, 900); // 对方的成就是短版
      return;
    case 'ack':
      if (S.pending && m.id === S.pending.aid) { if (!m.dup && S.pending.sent) noteRtt(Date.now() - S.pending.sentAt); S.pending.done(m); }
      return;
    case 'error':
      notice(m.message, 'err');
      break;
    case 'fatal':
      if (S.pending) S.pending.done({ ok: false, error: { message: m.message } }, true);
      if (S.room) store.dropSeat(S.room.id);
      disconnect();
      S.room = null;
      S.fatal = { title: m.code === 'BAD_TOKEN' ? '座位凭证失效了' : '房间不存在或已过期', text: m.code === 'BAD_TOKEN' ? '这个座位在别的设备或浏览器上重新加入过。要回到这一局，在那台设备上继续；或者重新打开邀请链接，点自己的名字拿回座位。' : '房间超过 24 小时没人连接就会被清理。回到首页重新开一局吧。' };
      S.screen = 'fatal';
      closeSheet();
      break;
    default:
      return;
  }
  render();
}

// iOS 从屏幕左边缘往右滑 = 后退：对局中一不小心就离开了页面，再回来就是整页重新加载。
// 进对局时垫一条同地址的历史记录：后退只退到这条记录上，并问一句"离开这一局？"，由玩家自己决定

  if (history.state && history.state.md) return;

addEventListener('popstate', () => {

});

function rememberSeat() {
  if (!S.room || !S.info) return;
  const o = S.info.players[1 - S.room.seat];
  store.saveSeat(S.room.id, S.room.seat, S.room.token, { vs: o ? o.name : '', over: !!(S.snap && V().phase === 'gameOver') });

// 对手掉线 / 回来：回合台那一行提示一下
function presenceChanged(before, after) {
  if (!S.room || S.screen !== 'game' || !before || !after) return;
  const o = 1 - S.room.seat;
  const was = before[o] && before[o].online;
  const now = after[o] && after[o].online;
  const name = after[o] ? after[o].name : '对手';
  if (was && !now) notice(`${name} 掉线了，等他回来${S.info.claimAfter ? `（离线满 ${fmtDur(S.info.claimAfter)}可以判你获胜）` : ''}`, 'warn', 3200);
  else if (!was && now) {
    const justStarted = S.snap && V().turn.number <= 1 && V().turn.plays === 0; // 刚开局时对方是第一次连上，不是"回来"
    notice(justStarted ? `${name} 加入了，开局！` : `${name} 回来了`, 'ok', 2000);
    sound.play('pop');
  }
}

/* ═══════════ 快照同步：自动弹出 / 收起面板 ═══════════ */

  const end = performance.now() + c.left;

  if (m.clock !== undefined) setClock(m.clock); // 旧后端不发 clock：没有倒计时
  if (reset || !prev) { S.lastIds = null; S.autoKey = ''; }
  const v = m.view;
  const o = m.options;
  // 选目标模式失效就退出
  if (S.target && (!o.canEndTurn || !o.hand.some((h) => h.cardId === S.target.cardId && h.play))) S.target = null;
  if (S.sel != null && (!v.players[me()].hand || !v.players[me()].hand.includes(S.sel))) S.sel = null;
  const sale = salePd();
  if (sale) {
    // 拍卖：双方都看着同一个面板（领先的一方没有可做的，也照样看着倒计时）。只在开拍时自动弹一次，关掉了从主按钮回去
    const key = `s${sale.id}`;
    if (S.autoKey !== key) {
      S.autoKey = key;
      afterCalm(() => {
        if (S.autoKey !== key || !salePd() || (S.sheet && S.sheet.type === 'sale')) return;
        openSheet({ type: 'sale', key });
        haptic('warn');
      }, (S.holdUntil || 0) - Date.now());
    }
  } else if (o.respond && o.respond.action === 'takeover') {

    if (S.autoKey !== key) {
      S.autoKey = key;

      const open = () => {

        openSheet(kind === 'respond' ? { type: 'respond', key, pay: new Set(O().respond.suggested || []) } : { type: kind, key, pick: new Set() });

      S.autoKey = key;

    }

    const round = S.info ? S.info.round : 0;
    const key = `o${round}`;
    const justEnded = !!(S.fxJob && S.fxJob.events.some((e) => e.type === 'gameOver')); // 这一下刚结束：先让赢的那一下庆祝完；重连回来看到的是早就结束的局：直接给结果
    if (justEnded) S.justOver = round; // 结算面板里赢家的比分从旧的数跳到新的数（只对刚在眼前结束的这一局）
    const lost = v.result && v.result.winner != null && v.result.winner !== me();
    // 等多久再弹：赢下整局的收尾已经排在队里（afterCalm 等它放完），放完稍停一下就弹；输了多留一拍看清是哪一套赢的你；减少动态效果时照旧
    const wait = () => (!justEnded ? 500 : S.finaleRound === round ? 250 : lost ? 1900 : 1700);
    if (S.autoKey !== key) {
      S.autoKey = key;
      afterCalm(() => setTimeout(() => {
        if (!S.snap || V().phase !== 'gameOver' || S.autoKey !== key) return;
        openSheet({ type: 'over' });
        if (lost && justEnded) setTimeout(() => { if (S.sheet && S.sheet.type === 'over') shineOn($('.sheet .acts .btn.primary:not([disabled])')); }, 700); // 邀请再来一局：主按钮上扫一道光
      }, wait()));

}

// 把对方的动作和结算结果念给读屏软件听
const QUIET_TYPES = new Set(['turnStart', 'turnEnd', 'awaiting', 'discardRequired', 'deal', 'gameStart', 'draw', 'reshuffle', 'autoEndTurn', 'comeback']);
const OUTCOME_TYPES = new Set(['payment', 'steal', 'swap', 'setStolen', 'canceled', 'justSayNo', 'resign', 'bankrupt', 'liquidated', 'hugeWin', 'gamble', 'lottery', 'award', 'ghost', 'ghostCurse', 'surge', 'tycoon', 'tycoonChosen', 'vampire', 'takeoverStart', 'rouletteSpin', 'roulettePrize', 'rouletteCashOut', 'rouletteBust', 'saleStart', 'saleBid', 'saleEnd']);
function announce(events, lines) {
  const picked = [];
  events.forEach((e, i) => {
    if (QUIET_TYPES.has(e.type) || e.type === 'gameOver') return;
    if (OUTCOME_TYPES.has(e.type) || e.player !== me()) picked.push(lines[i]);
  });
  const over = events.find((e) => e.type === 'gameOver');
  if (over) { speak(lines[events.indexOf(over)]); return; }
  if (picked.length) speak(picked.slice(-3).join('。'));
}

/* ═══════════ 提示：不用弹层，就地显示 ═══════════
 * 对局里显示在回合台最下面那一行（出错是红字，回合台轻轻晃一下）；首页的错误显示在对应输入框下面。
 * 读屏用户从一个隐藏的 live 区域听到同样的话。 */
const live = $('#live');
function speak(text) {
  if (!live || !text) return;
  live.textContent = '';
  setTimeout(() => { live.textContent = text; }, 30);
}
let noteTimer = 0;
// 状态提示不弹出来，只给读屏念一句；出错（操作没成功、断网）才在回合台下面浮一句，好知道为什么
function notice(text, tone, ms) {
  if (!text) return;
  if (tone !== 'err') { speak(text); return; }
  S.note = { text, tone, until: Date.now() + (ms || 2800) };
  speak(text);
  tickStage();
  if (S.screen === 'game') shakeEl($('#screen .stage'));
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { S.note = null; tickStage(); }, (ms || 2800) + 20);
}
// 连接、发送这类状态变了：回合台那一行和主按钮跟着更新（不重绘整页）
function refreshStatus() {
  tickStage();
  renderDock();
}

/* ═══════════ 牌的飞行动画 ═══════════
 * 每次局面更新前记下桌上每张牌的位置，更新后把移动了的牌从旧位置飞到新位置：
 * 摸牌从牌堆翻着面飞进手牌，出牌从手牌划一道弧线上桌，付款、偷牌在两人之间飞，对方打出的牌从他手里翻开飞出来。
 * 用一张固定定位的替身来飞（不会被横向滚动区裁掉），只动 transform；减少动态效果时整段跳过。 */

const motionOK = () => !(RMQ && RMQ.matches);
let flights = [];
const track = (a) => { flights.push(a); return a; };
// 正在飞的牌：真身先藏起来，等替身落地再露出。整页重绘会换掉元素，所以按牌号记，重绘后重新藏
const held = new Map();
const cardNode = (id) => $(`#screen [data-card="${id}"]`);
function hold(id) {
  held.set(id, (held.get(id) || 0) + 1);
  const el = cardNode(id);
  if (el) el.style.opacity = '0';
}
function release(id) {

  held.delete(id);

// 元素的中心点，加上不受旋转影响的宽高（扇形手牌的外接矩形会偏大）
function boxOf(el) {

  // 手牌按扇形转了 --r 度（选中的那张是正的）

  const item = !inHand && el.closest('.zone .set, .zone .bank');
  const rz = inHand && !el.classList.contains('sel') ? parseFloat(el.style.getPropertyValue('--r')) || 0

function centerBox(w) {

  const cy = r.top + r.height / 2;

const discardBox = () => centerBox(30);

function oppHandBox() {
  const el = $('#screen .zone.opp .minis') || nameEl(opp());
  const b = boxOf(el);
  if (!b) return null;
  return Object.assign({}, b, { cx: b.cx + b.w / 2 - 8, w: 16, h: 16 / CONFIG.RATIO });
}

function snapshotRects() {
  flights.forEach((a) => { try { a.finish(); } catch (e) { /* 已结束 */ } });
  flights = [];
  if (S.screen !== 'game' || !motionOK()) return null;
  const m = new Map();
  const els = new Map();
  $$('#screen [data-card]').forEach((el) => { const b = boxOf(el); if (b) { m.set(el.dataset.card, b); els.set(el.dataset.card, el); } });
  return { m, els, deck: deckBox(), opp: oppHandBox(), hand: boxOf($('#screen .hand')) };
}

// 沿一条往上鼓的二次贝塞尔曲线飞，途中稍微放大、倾斜，像被手拿起来甩过去。
// anchor 是替身实际摆放的位置（默认就是终点），返回的关键帧都相对它；o.ease 让位置按缓动采样（整段动画用线性时序）。
function arcFrames(from, to, o, anchor) {
  o = o || {};
  anchor = anchor || to;
  const x0 = from.cx - anchor.cx;
  const y0 = from.cy - anchor.cy;
  const x1 = to.cx - anchor.cx;
  const y1 = to.cy - anchor.cy;
  const s0 = from.w / anchor.w;
  const s1 = to.w / anchor.w;
  const dx = x1 - x0;
  const dy = y1 - y0;
  const dist = Math.hypot(dx, dy) || 1;
  let px = -dy / dist;
  let py = dx / dist;
  if (py > 0) { px = -px; py = -py; }
  if (Math.abs(py) < 0.25) px = Math.abs(px) * (Math.sign(innerWidth / 2 - (from.cx + to.cx) / 2) || 1); // 几乎竖直地飞：往屏幕中间那侧鼓
  const lift = (o.lift == null ? 1 : o.lift) * Math.min(80, 18 + dist * 0.16);
  const cx = (x0 + x1) / 2 + px * lift;
  const cy = (y0 + y1) / 2 + py * lift;
  const rot = (o.rot == null ? 1 : o.rot) * Math.max(-9, Math.min(9, dx / 30));
  const rz0 = from.rz || 0; // 从横放的牌堆飞出 / 飞进横放的弃牌堆：途中顺势转正 / 转横
  const rz1 = to.rz || 0;
  const pop = o.pop == null ? 0.1 : o.pop;
  const ease = o.ease || ((t) => t);
  const frames = [];
  for (let k = 0; k <= 10; k++) {
    const t = ease(k / 10);
    const u = 1 - t;
    const x = u * u * x0 + 2 * u * t * cx + t * t * x1;
    const y = u * u * y0 + 2 * u * t * cy + t * t * y1;
    const sc = (s0 + (s1 - s0) * t) * (1 + pop * Math.sin(Math.PI * t));
    const f = { offset: k / 10, transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(rz0 + (rz1 - rz0) * t + rot * Math.sin(Math.PI * t)).toFixed(2)}deg) scale(${sc.toFixed(4)})` };
    if (o.fade) f.opacity = k === 10 ? 0.2 : 1;
    frames.push(f);
  }
  return frames;
}

function cleanClone(el) {
  const c = el.cloneNode(true);
  c.classList.remove('fresh', 'sel', 'pick', 'dim', 'can', 'ghost');
  ['data-card', 'data-do', 'id', 'aria-label'].forEach((k) => c.removeAttribute(k));
  ['--r', '--y', 'opacity', 'transform'].forEach((k) => c.style.removeProperty(k));
  return c;
}
function backEl() {
  const t = document.createElement('div');
  t.innerHTML = backHTML();
  return t.firstElementChild;
}
// 替身：flip 时里面是正反两面，先露牌背再翻到正面
function makeGhost(face, at, flip, cls, parent) {
  let g = face;
  if (flip) {
    g = document.createElement('div');
    g.className = 'flip3d';
    const fl = document.createElement('div');
    fl.className = 'flipper';
    fl.append(face, backEl());
    g.appendChild(fl);
  }
  g.classList.add('ghost');
  if (cls) g.classList.add(cls);
  Object.assign(g.style, { left: at.cx - at.w / 2 + 'px', top: at.cy - at.h / 2 + 'px', width: at.w + 'px', height: at.h + 'px' });
  g.style.setProperty('--w', at.w + 'px');
  if (flip) $$('.card', g).forEach((c) => c.style.setProperty('--w', at.w + 'px')); // .card 自己会把 --w 设回桌面卡宽，这里要压住
  (parent || document.body).appendChild(g);
  return g;
}

// 落地：轻轻一弹（用独立的 scale 属性，不打扰元素本身的 transform，比如扇形手牌）
function land(el, k) {
  if (!el || !el.isConnected || !motionOK()) return;
  el.animate([{ scale: String(k || 1.07) }, { scale: '1' }], { duration: 320, easing: EASE_OUT });
}

// 牌落在桌上"啪"一声。一次挪很多张（破产、清算、被抢走一整套）时限流：两声至少隔 70ms，400ms 里最多 4 声，不噼里啪啦
const slapAt = [];
function slap() {
  const now = performance.now();
  while (slapAt.length && now - slapAt[0] > 400) slapAt.shift();
  if (slapAt.length >= 4 || (slapAt.length && now - slapAt[slapAt.length - 1] < 70)) return;
  slapAt.push(now);
  sound.play('slap');
}
const softCoin = new Set(); // 自己刚存进银行的牌：落地时再轻轻响一声金币

function fly(el, from, to, o) {
  o = o || {};
  const id = el.dataset.card;
  const g = makeGhost(cleanClone(el), to, o.flip);
  hold(id);
  const dist = Math.hypot(from.cx - to.cx, from.cy - to.cy);
  const timing = { duration: o.dur || Math.round(Math.min(560, 340 + dist * 0.35)), delay: o.delay || 0, easing: EASE_MOVE, fill: 'backwards' };
  const a = track(g.animate(arcFrames(from, to, o), timing));
  if (o.flip) track(g.firstChild.animate([{ transform: 'rotateY(180deg)' }, { transform: 'rotateY(180deg)', offset: 0.12 }, { transform: 'rotateY(0deg)', offset: 0.85 }, { transform: 'rotateY(0deg)' }], timing));
  const due = performance.now() + timing.delay + timing.duration - 40; // 新的更新会把还在飞的牌直接跳到终点：那不算"落地"，不出声
  const done = () => {
    if (!g.isConnected) return;
    g.remove();
    const cur = release(id);
    if (o.land) land(cur);
    if (o.land && performance.now() >= due) slap();
    if (softCoin.delete(id)) sound.play('coin', 0, 0.55);
  };
  a.onfinish = done;
  a.oncancel = done;
  return a;
}

function playFlights(prev, skip) {
  if (!prev) return;
  let n = 0;
  let draws = 0;
  let oppIn = 0;
  $$('#screen [data-card]').forEach((el) => {
    if (n >= 24 || (skip && skip.has(el.dataset.card))) return;
    const to = boxOf(el);
    if (!to || to.bottom < 0 || to.top > innerHeight) return;
    let from = prev.m.get(el.dataset.card);
    const o = {};
    const dr = dragDrops.get(el.dataset.card);
    if (dr) { // 拖出去 / 从面板点出去的牌：从停着的位置飞到真正的落点；还在手里（排着等揭晓放完）就别动，替身照旧停着
      if (!el.closest('.hand')) { fly(el, dr.box, to, { lift: 0.25, rot: 0.4, pop: 0.02, dur: 300, land: true }); n++; }
      return;
    }
    if (!from) { // 新出现的牌：自己手里的从牌堆翻着飞来；对方桌上 / 弃牌堆里的从对方手牌翻开飞来
      const inHand = !!el.closest('.hand');
      const src = inHand ? prev.deck : el.closest('.zone.opp') ? prev.opp : null;
      if (!src) return;
      from = src;
      o.flip = true;
      o.delay = inHand ? (S.handoff || 0) + 90 * draws++ : 70 * oppIn++; // 交接时我摸的牌等对方那张先落地
      o.land = !inHand;
    } else if (Math.abs(from.cx - to.cx) < 1 && Math.abs(from.cy - to.cy) < 1 && Math.abs(from.w - to.w) < 1) {
      return;
    } else if ((Math.abs(from.cy - to.cy) < 10 || (from.inHand && to.inHand)) && Math.abs(from.w - to.w) < 2) {
      Object.assign(o, { lift: 0.12, rot: 0, pop: 0, dur: 300 }); // 同一排里挪个位置（手牌重排、银行往后推）：平移过去就好，扇形角度顺带转过去
    } else {
      o.land = !el.closest('.hand');
    }
    fly(el, from, to, o);
    n++;
  });
}

// 开局发牌：自己的手牌一张张从牌堆翻开飞来，对方那边飞几张牌背
function dealIn() {
  if (!motionOK()) return;
  const ids = $$('#screen .hand .card').map((el) => el.dataset.card);
  ids.forEach(hold);
  const wait = Math.max(0, 560 - (performance.now() - (S.enterAt || 0))); // 等各块进场站稳再量位置
  setTimeout(() => {
    const deck = S.screen === 'game' ? deckBox() : null;
    ids.forEach((id, k) => {
      const el = cardNode(id);
      const to = deck && boxOf(el);
      if (to) {
        fly(el, deck, to, { flip: true, delay: k * 120, lift: 0.8 });
        sound.play('card', 0.05 + k * 0.12);
      }
      release(id);
    });
    if (deck) flyBacks(Math.min(5, V().players[opp()].handCount), 60);
  }, wait);
}

// 进了弃牌堆、桌面上已经看不到的牌（被清算 / Huge Win 清掉的地产、被弃的手牌）：从原来的位置一张张飞进弃牌堆
function vanishToDiscard(prev, skip) {
  if (!prev || !prev.els || !S.snap) return;
  const dest = discardBox();
  if (!dest) return;
  const inDiscard = new Set(V().discard.map(String));
  let k = 0;
  prev.els.forEach((el, id) => {
    if (k >= 16 || (skip && skip.has(id)) || cardNode(id) || !inDiscard.has(id)) return;
    const from = prev.m.get(id);
    const g = makeGhost(cleanClone(el), dest, false);
    const fr = arcFrames(from, dest, { lift: 0.7, pop: 0.06 });
    fr[10].opacity = 0.4;
    const a = track(g.animate(fr, { duration: 560, delay: 120 + k * 55, easing: EASE_MOVE, fill: 'backwards' }));
    a.onfinish = () => { g.remove(); if (!--vanishing) land(cardNode(V().discardTop), 1.08); };
    a.oncancel = () => { g.remove(); vanishing = Math.max(0, vanishing - 1); };
    vanishing++;
    k++;
  });
}
let vanishing = 0;

// 对方手牌被弃：几张牌背从他手里飞进弃牌堆
function backsToDiscard(n, delay0) {
  if (!motionOK()) return;
  const from = oppHandBox();
  const to = discardBox();
  if (!from || !to) return;
  for (let k = 0; k < Math.min(n, 6); k++) {
    const g = makeGhost(backEl(), to, false);
    const a = track(g.animate(arcFrames(from, to, { lift: 0.6, pop: 0.05 }), { duration: 520, delay: (delay0 || 0) + k * 80, easing: EASE_MOVE, fill: 'backwards' }));
    a.onfinish = () => g.remove();
    a.oncancel = () => g.remove();
  }
}

// 对方摸牌：几张牌背从牌堆飞进他的手牌
function flyBacks(n, delay0) {
  if (!motionOK()) return;
  const from = deckBox();
  const to = oppHandBox();
  if (!from || !to) return;
  for (let k = 0; k < Math.min(n, 5); k++) {
    const g = makeGhost(backEl(), from, false);
    const a = track(g.animate(arcFrames(from, to, { lift: 0.5, pop: 0.05, fade: true }, from), { duration: 500, delay: (delay0 || 0) + k * 110, easing: EASE_MOVE, fill: 'backwards' }));
    a.onfinish = () => g.remove();
    a.oncancel = () => g.remove();
  }
}

/* ═══════════ 声音：Web Audio 现场合成，不用任何音频文件 ═══════════ */
const sound = (() => {
  let ctx = null;
  let master = null;
  let noiseBuf = null;
  let jit = null; // 这一下的随机微调：同一个声音每次音高、音量差一点点，连着响也不像机关枪
  let wet = 0; // 这一下送多少进混响（0 = 干声）
  let revIn = null;
  let sends = {};
  let on = store.get('sound', true);
  // 打击类的声音才微调；和弦、旋律不动，免得走调。金币一串上行的叮当只抖音量：音高要排成音阶
  const HUMAN = new Set(['tap', 'card', 'coin', 'tick', 'spend', 'swoosh', 'pop', 'reel', 'chips', 'reelStop', 'slap']);
  const GAIN_ONLY = new Set(['clink']);
  // 混响送量：和弦、号角带一点空间感，手机外放不那么干瘪像玩具；打击声基本不送，保持干脆
  const WET = { set: 0.3, victory: 0.4, win: 0.35, jackpot: 0.25, achieve: 0.3, double: 0.2, combo: 0.2, turn: 0.15, sparkle: 0.3, coin: 0.1, clink: 0.1, stamp: 0.12, defeat: 0.3, cash: 0.15, pluck: 0.2 };
  function ensure() {
    if (!on) return null;
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.22;
        // 总线上挂一个压限：金币、和弦、印章同时响也不会爆音
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -12;
        comp.knee.value = 10;
        comp.ratio.value = 5;
        comp.attack.value = 0.003;
        comp.release.value = 0.18;
        master.connect(comp);
        comp.connect(ctx.destination);
        // 一段 1 秒的白噪声，所有噪声类音效从里面随机截一段用，不用每次重新生成
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        // 一个共用的混响：1.6 秒的立体声衰减噪声当冲激响应，回到总音量那一级（跟着总音量走），整体压得很轻
        try {
          const len = Math.round(ctx.sampleRate * 1.6);
          const ir = ctx.createBuffer(2, len, ctx.sampleRate);
          for (let ch = 0; ch < 2; ch++) { const x = ir.getChannelData(ch); for (let i = 0; i < len; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
          const conv = ctx.createConvolver();
          conv.buffer = ir;
          const back = ctx.createGain();
          back.gain.value = 0.6;
          revIn = ctx.createGain();
          revIn.connect(conv);
          conv.connect(back);
          back.connect(master);
        } catch (e) { revIn = null; } // 不支持就只出干声
      }

    } catch (e) { return null; }

  }
  // 出声：接到总音量；这一下要混响的话再按送量分一路进混响（同一个送量共用一个节点）
  function out(g) {
    g.connect(master);
    if (!wet || !revIn) return;
    let s = sends[wet];
    if (!s) { s = sends[wet] = ctx.createGain(); s.gain.value = wet; s.connect(revIn); }
    g.connect(s);
  }
  function tone(f, t, dur, type, gain, slideTo) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);

    g.gain.exponentialRampToValueAtTime((gain || 0.3) * (jit ? jit.gain : 1), t + 0.012);

    out(g);
    o.start(t);
    o.stop(t + dur + 0.03);
  }
  // 铜管：锯齿波过一个会"张嘴"的低通——起音 40ms 内滤波器打开、再慢慢合上，听起来像号角而不是蜂鸣
  function brass(f, t, dur, gain) {
    const o = ctx.createOscillator();
    const lp = ctx.createBiquadFilter();
    const g = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f, t);
    lp.type = 'lowpass';
    lp.Q.value = 1;
    lp.frequency.setValueAtTime(f * 2, t);
    lp.frequency.exponentialRampToValueAtTime(f * 7, t + 0.04);
    lp.frequency.exponentialRampToValueAtTime(f * 3, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.025);
    g.gain.exponentialRampToValueAtTime(gain * 0.7, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp);
    lp.connect(g);
    out(g);
    o.start(t);
    o.stop(t + dur + 0.03);
  }
  // 柔和的三角波过 1400Hz 低通（可带一点颤音，vib 是音分）：输掉时的收尾，闷一点、不刺耳
  function soft(f, t, dur, gain, vib) {
    const o = ctx.createOscillator();
    const lp = ctx.createBiquadFilter();
    const g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f, t);
    if (vib) {
      const l = ctx.createOscillator();
      const d = ctx.createGain();
      l.frequency.value = 5;
      d.gain.value = vib;
      l.connect(d);
      d.connect(o.detune);
      l.start(t);
      l.stop(t + dur + 0.03);
    }
    lp.type = 'lowpass';
    lp.frequency.value = 1400;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.03);
    g.gain.exponentialRampToValueAtTime(gain * 0.6, t + dur * 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp);
    lp.connect(g);
    out(g);
    o.start(t);
    o.stop(t + dur + 0.03);
  }
  function noise(t, dur, gain, freq, q, type, sweepTo) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;

    f.connect(g);
    out(g);
    src.start(t, Math.random() * Math.max(0, 0.95 - dur), dur + 0.02);
  }
  const CLINK = [1318.5, 1480, 1661.2, 1975.5, 2217.5, 2637]; // E 大调五声音阶往上爬，最后落在原来的金币声（E6→B6）上
  const SFX = {
    tap: (t) => noise(t, 0.035, 0.1, 3800, 1, 'highpass'),
    card: (t) => noise(t, 0.13, 0.2, 1100, 0.7, 'bandpass', 4200),
    // 牌落在桌上的一声轻"啪"：中频的拍击 + 一点高频的纸边 + 很短的木头声
    slap: (t) => { noise(t, 0.04, 0.24, 1700, 1.3, 'bandpass'); noise(t, 0.012, 0.16, 5200, 0.9, 'highpass'); tone(210, t, 0.05, 'triangle', 0.1, 130); },
    // 新的一局洗牌：一串越来越密的纸牌摩擦声，最后一下整理好
    riffle: (t) => {
      let at = t;
      for (let k = 0; k < 14; k++) { noise(at, 0.008, 0.12, 2500 + Math.random() * 1500, 1.6, 'bandpass'); at += (45 - 27 * k / 13) / 1000; }
      noise(at + 0.02, 0.13, 0.2, 1100, 0.7, 'bandpass', 4200);
    },
    // 地产离成套近一步：拨一下弦，音高跟着这一组的张数往上走（f 已经按下一套的调移好）
    pluck: (t, f) => { f = f || 523.25; tone(f, t, 0.14, 'triangle', 0.06); tone(f * 2, t, 0.1, 'sine', 0.03); },

    // 一枚金币落进银行：第 k 枚的音高往上爬
    clink: (t, k) => { const f = CLINK[Math.max(0, Math.min(k || 0, CLINK.length - 1))]; tone(f, t, 0.07, 'sine', 0.11); tone(f * 2.76, t, 0.04, 'sine', 0.035); },
    // 一次进账很多："咔嚓"一声收银机
    cash: (t) => { noise(t, 0.035, 0.22, 4500, 0.8, 'bandpass'); tone(1046.5, t + 0.03, 0.2, 'triangle', 0.08); tone(2093, t + 0.03, 0.35, 'sine', 0.09); tone(2637, t + 0.05, 0.4, 'sine', 0.08); },
    spend: (t) => tone(587.3, t, 0.18, 'triangle', 0.14, 493.9),
    turn: (t) => { tone(783.99, t, 0.18, 'sine', 0.2); tone(1046.5, t + 0.11, 0.32, 'sine', 0.2); },
    set: (t, lvl) => { const k = Math.pow(2, ((lvl || 1) - 1) * 2 / 12); [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f * k, t + i * 0.075, i === 3 ? 0.5 : 0.3, 'triangle', 0.17)); },
    combo: (t, lvl) => { const k = Math.pow(2, Math.min(lvl || 2, 7) * 2 / 12); tone(783.99 * k, t, 0.09, 'triangle', 0.15); tone(1174.7 * k, t + 0.06, 0.18, 'sine', 0.13); },
    // 心跳：72Hz 的低音手机外放几乎听不见，叠一层 150Hz 的三角波和一下闷响，靠泛音让耳朵"补出"低音
    heart: (t) => [[t, 1], [t + 0.24, 0.8]].forEach(([at, g], k) => { tone(72, at, k ? 0.22 : 0.16, 'sine', (k ? 0.38 : 0.5), k ? 50 : 52); tone(150, at, 0.09, 'triangle', 0.22 * g, 110); noise(at, 0.025, 0.14 * g, 380, 1.4, 'bandpass'); }),
    sparkle: (t) => [2093, 2637, 3136, 4186].forEach((f, i) => tone(f, t + i * 0.045, 0.2, 'sine', 0.05)),
    alert: (t) => { tone(880, t, 0.1, 'square', 0.05); tone(698.5, t + 0.12, 0.16, 'square', 0.05); },
    // 印章：低音的"咚"（外放靠 300Hz 那层和一下咔哒听出分量）；d 是"反将一军"的层数，每多一层高两个半音
    stamp: (t, d) => { const k = Math.pow(2, (d || 0) * 2 / 12); tone(150 * k, t, 0.24, 'sine', 0.5, 52 * k); tone(300 * k, t, 0.12, 'triangle', 0.22, 130 * k); noise(t, 0.09, 0.22, 800, 0.6, 'lowpass'); noise(t, 0.012, 0.22, 2600, 0.9, 'bandpass'); },
    sour: (t) => tone(233.1, t, 0.3, 'triangle', 0.12, 185), // 坏消息印章后面拖的一声往下沉
    error: (t) => { tone(233.1, t, 0.11, 'triangle', 0.18); tone(185, t + 0.1, 0.18, 'triangle', 0.18); },
    pop: (t) => tone(660, t, 0.09, 'sine', 0.14, 990),
    swoosh: (t) => noise(t, 0.26, 0.11, 500, 0.9, 'bandpass', 3200),
    tick: (t) => tone(1760, t, 0.05, 'sine', 0.08),
    win: (t) => {
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, t + i * 0.09, i === 4 ? 0.9 : 0.26, 'triangle', 0.2));
      [1046.5, 1318.5, 1568].forEach((f) => tone(f, t + 0.5, 0.9, 'sine', 0.08));
      noise(t + 0.45, 0.6, 0.05, 7000, 0.5, 'highpass');
    },
    // 赢下整局：三连音的号角起头 → 一记重击 → 1 秒处 C 大调和弦落下，上面撒一串高音闪光（和收尾大场面的高潮对齐）
    victory: (t) => {
      [0, 0.13, 0.26].forEach((d) => brass(392, t + d, 0.11, 0.08));
      brass(523.25, t + 0.4, 0.55, 0.07);
      brass(659.25, t + 0.4, 0.55, 0.06);
      tone(110, t + 0.4, 0.5, 'sine', 0.4, 55);
      tone(220, t + 0.4, 0.25, 'triangle', 0.18, 110);

      [2093, 2637, 3136, 4186, 3136, 4186].forEach((f, i) => tone(f, t + 1 + i * 0.06, 0.4, 'sine', 0.04));
      noise(t + 0.95, 1.4, 0.05, 6000, 0.5, 'highpass');
    },
    // 输掉：一记手机也听得见的闷响，然后两个柔和的音 G4 → E♭4（后一个带一点颤音），不嘲讽
    defeat: (t) => {
      tone(98, t, 0.4, 'sine', 0.4, 70);
      tone(196, t, 0.18, 'triangle', 0.16, 140);
      soft(392, t + 0.16, 0.35, 0.11);
      soft(311.13, t + 0.5, 0.8, 0.11, 8);
    },
    // 赌一把：转轮的棘轮声、筹码声、翻倍、头奖、落空
    reel: (t) => { noise(t, 0.02, 0.14, 4600, 2.2, 'bandpass'); tone(2900, t, 0.018, 'triangle', 0.025); },
    // 老虎机：拉杆、每个转轮停下的一声闷响、第三个转轮吊悬念时一路上扬的提示音
    lever: (t) => { noise(t, 0.14, 0.22, 700, 0.8, 'lowpass', 180); tone(220, t + 0.04, 0.14, 'triangle', 0.12, 130); },
    reelStop: (t) => { tone(170, t, 0.1, 'sine', 0.32, 85); tone(340, t, 0.06, 'triangle', 0.12, 200); noise(t, 0.05, 0.16, 1500, 1, 'bandpass'); },
    tease: (t) => { tone(392, t, 1.25, 'triangle', 0.05, 1175); tone(587.3, t + 0.05, 1.2, 'sine', 0.035, 1760); },
    chips: (t) => { for (let k = 0; k < 4; k++) noise(t + k * 0.042 + Math.random() * 0.01, 0.028, 0.16, 3000 + k * 420, 3, 'bandpass'); },
    // 翻倍：n 是翻了几次（×2 → 1、×4 → 2、×8 → 3），每多翻一次高四个半音
    double: (t, n) => { const k = Math.pow(2, Math.max(0, (n || 1) - 1) * 4 / 12); [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(f * k, t + i * 0.06, i === 3 ? 0.4 : 0.2, 'triangle', 0.16)); },
    // 头奖：lvl 和"凑齐一套"的 set 用同一个移调，两个一起响时在同一个调上
    jackpot: (t, lvl) => {
      const k = Math.pow(2, ((lvl || 1) - 1) * 2 / 12);
      [1568, 1975.5, 2349.3, 3136, 2349.3, 3136].forEach((f, i) => tone(f * k, t + i * 0.065, 0.42, 'sine', 0.11));
      [523.25, 659.25, 783.99, 1046.5].forEach((f) => tone(f * k, t + 0.36, 0.9, 'triangle', 0.07));
      noise(t + 0.3, 0.6, 0.045, 8000, 0.5, 'highpass');
    },
    bust: (t) => { tone(392, t, 0.16, 'triangle', 0.14, 349.2); tone(311.1, t + 0.15, 0.4, 'triangle', 0.13, 233.1); },
    // 成就：一段上扬的号角；大乐透落定：低频重击 + 噪声尾巴（配合镜头震动）
    achieve: (t) => {
      [523.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, i) => tone(f, t + i * 0.07, i === 4 ? 0.7 : 0.22, 'triangle', 0.15));
      [1046.5, 1568, 2093].forEach((f) => tone(f, t + 0.36, 0.8, 'sine', 0.06));
    },
    boom: (t) => { tone(110, t, 0.5, 'sine', 0.55, 40); tone(220, t, 0.3, 'triangle', 0.24, 80); noise(t, 0.015, 0.2, 1800, 0.8, 'bandpass'); noise(t, 0.5, 0.2, 900, 0.5, 'lowpass', 120); noise(t + 0.02, 0.35, 0.06, 6000, 0.6, 'highpass'); },
  };
  return {
    play(name, delay, arg) {
      const c = ensure();
      if (!c || !SFX[name]) return;
      jit = HUMAN.has(name) ? { cents: (Math.random() - 0.5) * 70, gain: 0.88 + Math.random() * 0.24 } : GAIN_ONLY.has(name) ? { cents: 0, gain: 0.85 + Math.random() * 0.3 } : null;
      wet = WET[name] || 0;
      try { SFX[name](c.currentTime + 0.01 + (delay || 0), arg); } catch (e) { /* 忽略 */ }
      jit = null;
      wet = 0;
    },
    unlock() { if (on) ensure(); },
    get on() { return on; },
    toggle() { on = !on; store.set('sound', on); if (on) this.play('pop'); },
  };
})();

/* ═══════════ 触感：安卓用震动；iPhone（iOS 18+）借系统开关控件触发轻触感 ═══════════ */
const haptic = (() => {
  const PATTERN = { light: 8, medium: 15, success: [10, 50, 20], warn: [20, 60, 20], error: [26, 40, 26, 40, 26], heavy: [20, 40, 30, 40, 60] };
  // iPhone 只能"轻点一下"：用几下之间的间隔做出节奏——成功两下、警告隔久一点的两下、出错三连、重击四下，摸得出是好事还是坏事
  const IOS = { light: [0], medium: [0], success: [0, 110], warn: [0, 150], error: [0, 90, 180], heavy: [0, 90, 180, 320] };
  let label = null;
  let lastTick = 0;
  const tick = () => {
    const now = performance.now();
    if (now - lastTick < 45) return; // 挨得太近的两下会糊成一下、或者嗡嗡响：丢掉后一下
    lastTick = now;
    try { label.click(); } catch (e) { /* 不支持就算了 */ }
  };
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && !navigator.vibrate) {
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.setAttribute('switch', '');
    box.id = 'md-haptic';
    box.tabIndex = -1;
    box.setAttribute('aria-hidden', 'true');
    label = document.createElement('label');
    label.htmlFor = 'md-haptic';
    label.setAttribute('aria-hidden', 'true');
    for (const el of [box, label]) {
      el.style.cssText = 'position:fixed;left:-20px;top:-20px;width:1px;height:1px;opacity:0;pointer-events:none';
      // 这里的 click 是程序触发的，不能冒泡到页面：否则会被当成"点了外面"，刚弹出的表情面板会被立刻关掉
      el.addEventListener('click', (e) => e.stopPropagation());
    }
    document.body.append(box, label);
  }
  return (kind) => {
    try {
      if (navigator.vibrate) navigator.vibrate(PATTERN[kind] || 8);
      else if (label) (IOS[kind] || IOS.light).forEach((d) => { if (d) setTimeout(tick, d); else tick(); });
    } catch (e) { /* 不支持就算了 */ }
  };
})();

/* ═══════════ 特效 ═══════════ */
const fxLayer = $('#fx');
// 所有特效统一放大：彩纸更多更猛、震屏更狠、印章和飘字更大更久（赌场式的夸张）
const FX_AMP = 1.6;
const EASE_OUT = 'cubic-bezier(.23, 1, .32, 1)';

// 飘字：big（一次进账很多）放大 1.25 倍、停得久一点。左右夹在屏幕里（银行贴着屏幕边、或者整排滚出去了也看得到）
function floatText(text, rect, cls, html) {
  if (!rect) return;
  const el = document.createElement('div');
  el.className = 'float' + (cls ? ' ' + cls : '');
  if (html) el.innerHTML = html; // 带倍率图（已经转义好）
  else el.textContent = text;
  el.style.left = rect.left + rect.width / 2 + 'px';
  el.style.top = Math.max(8, rect.top - 6) + 'px';
  fxLayer.appendChild(el);
  const big = / big\b/.test(el.className);
  const s = big ? 1.25 : 1;
  const hw = el.offsetWidth * 0.65 * s + 8; // 0.65 = 最大放大 1.3 倍时的一半宽
  el.style.left = Math.max(hw, Math.min(innerWidth - hw, rect.left + rect.width / 2)) + 'px';
  if (!motionOK()) { setTimeout(() => el.remove(), big ? 1700 : 1200); return; }
  el.animate([
    { transform: `translate(-50%, 10px) scale(${0.6 * s})`, opacity: 0 },
    { transform: `translate(-50%, -20px) scale(${1.3 * s})`, opacity: 1, offset: 0.2 },
    { transform: `translate(-50%, -26px) scale(${1.05 * s})`, opacity: 1, offset: 0.34 },
    { transform: `translate(-50%, -32px) scale(${s})`, opacity: 1, offset: big ? 0.8 : 0.66 },
    { transform: `translate(-50%, -60px) scale(${0.96 * s})`, opacity: 0 },
  ], { duration: big ? 1900 : 1500, easing: EASE_OUT }).onfinish = () => el.remove();
}

// 盖章：从天而降砸在屏幕中间，四周的桌面跟着震一下。好事（good / gold）是金色、带一声上扬的"叮"，good 还撒一小把彩纸；
// 坏事（red）是酒红、后面拖一声往下沉。o.depth：反将一军的层数（2 起），每多一层转向反过来、印得更大、声音更高，一层压一层；
// o.lvl：gold 章那声"叮"的翻倍级；o.ding = false：不要那声"叮"（同一刻已经有头奖和弦，叠上去会打架）；o.hap：换一种触感
function stamp(text, tone, quiet, html, o) {
  o = o || {};
  tone = tone || 'red';
  const d = Math.max(0, (o.depth || 1) - 1);
  const el = document.createElement('div');
  el.className = 'stamp ' + tone;
  if (html) el.innerHTML = html; // 带倍率图（已经转义好）
  else el.textContent = text;
  fxLayer.appendChild(el);
  const good = tone === 'good' || tone === 'gold';
  if (!quiet) {
    sound.play('stamp', 0, d);
    if (good && o.ding !== false) sound.play('double', 0.07, o.lvl);
    else if (tone === 'red') sound.play('sour', 0.05);
  }
  haptic(o.hap || (tone === 'good' ? 'success' : tone === 'red' ? 'warn' : 'medium'));
  const end = 1 + 0.08 * d;
  const rot = d % 2 ? 8 : -8;
  const fit = Math.min(1, (innerWidth - 28) / ((el.offsetWidth || 1) * 1.08 * end)); // 落定后整个章都在屏幕里，左右各留 14px
  const k = (sc, r, op, off) => ({ transform: `translate(-50%, -50%) scale(${(sc * fit).toFixed(3)}) rotate(${r}deg)`, opacity: op, offset: off });
  el.animate(motionOK()
    ? [k(2.8, rot * 2, 0, 0), k(0.9 * end, rot, 1, 0.22), k(1.06 * end, rot, 1, 0.3), k(end, rot, 1, 0.38), k(end, rot, 1, 0.84), k(1.08 * end, rot, 0, 1)]
    : [k(end, rot, 0, 0), k(end, rot, 1, 0.1), k(end, rot, 1, 0.85), k(end, rot, 0, 1)], { duration: 1700, easing: EASE_OUT }).onfinish = () => el.remove();
  const game = $('#screen .game');
  if (game && motionOK()) game.animate([{ translate: '0 0' }, { translate: '0 0', offset: 0.2 }, { translate: '0 9px', offset: 0.24 }, { translate: '0 -4px', offset: 0.3 }, { translate: '0 2px', offset: 0.35 }, { translate: '0 0', offset: 0.4 }, { translate: '0 0' }], { duration: 1700 });
  if (tone === 'good' && !quiet) setTimeout(() => { if (el.isConnected) confetti({ x: innerWidth / 2, y: innerHeight * 0.4, count: 26, angle: -90, spread: 120, speed: 8 }); }, 90); // 章砸下去那一下（整段缓动很陡，砸到底大约在 80ms）
}

// 五彩纸屑：一张全屏画布，粒子自带重力、空气阻力和翻转
const confetti = (() => {
  let canvas = null;
  let g = null;
  let parts = [];
  let raf = 0;
  function size() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function frame() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((q) => q.life < q.max && q.y < innerHeight + 40);
    for (const q of parts) {
      q.life++;
      q.vx *= 0.985;
      q.vy = q.vy * 0.985 + 0.32;
      q.x += q.vx + Math.sin(q.life * q.wob) * 0.6;
      q.y += q.vy;
      q.r += q.vr;
      g.save();
      g.globalAlpha = Math.min(1, (q.max - q.life) / 25);
      g.translate(q.x, q.y);
      g.rotate(q.r);
      g.scale(1, Math.cos(q.life * q.flip));
      g.fillStyle = q.c;
      g.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
      g.restore();
    }
    if (parts.length) raf = requestAnimationFrame(frame);
    else { raf = 0; canvas.width = 0; canvas.height = 0; } // 不放纸屑时释放整屏画布的内存（iOS 内存紧时会直接把页面重新加载）
  }
  return (o) => {
    if (!motionOK()) return;
    if (!canvas) {
      canvas = document.createElement('canvas');
      fxLayer.appendChild(canvas);
      g = canvas.getContext('2d');
      addEventListener('resize', size);
    }
    size();
    const colors = o.colors || S.meta.colorKeys.map((c) => COLOR(c).hex).concat('#ffcc00');
    const count = Math.round(o.count * FX_AMP);
    for (let i = 0; i < count; i++) {
      const a = ((o.angle == null ? -90 : o.angle) + (Math.random() - 0.5) * (o.spread || 60) * 1.1) * Math.PI / 180;
      const v = (o.speed || 12) * 1.15 * (0.55 + Math.random() * 0.6);
      parts.push({
        x: o.x, y: o.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        w: 7 + Math.random() * 7, h: 9 + Math.random() * 10, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.36,
        flip: 0.08 + Math.random() * 0.12, wob: 0.05 + Math.random() * 0.1,
        c: colors[(Math.random() * colors.length) | 0], life: 0, max: 100 + Math.random() * 70,
      });
    }
    if (!raf) raf = requestAnimationFrame(frame);
  };
})();

function countUp(el, a, b, dur) {
  if (!el || !motionOK()) return;
  dur = Math.max(120, dur || 650);
  el.textContent = a + 'M'; // 先回到起点：重绘已经写成终点了，不然会先闪一下终点再从头滚
  const t0 = performance.now();
  const step = (now) => {
    if (!el.isConnected) return;
    const k = Math.max(0, Math.min(1, (now - t0) / dur)); // 这一帧的时间戳可能比 t0 还早：别算出负数，滚到起点以下
    el.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - k, 3))) + 'M';
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  el.animate([{ scale: '1' }, { scale: '1.25', offset: 0.3 }, { scale: '1' }], { duration: 520, easing: EASE_OUT });
}

// 轮到自己：手牌依次轻跳一下（用 translate 属性，和扇形的 transform 叠加）
function rippleHand() {

function ringBurst(b, color) {
  if (!b || !motionOK()) return;
  const d = Math.max(b.w, b.h) * 1.3;
  for (let k = 0; k < 3; k++) {

    r.style.setProperty('--c', color);
    fxLayer.appendChild(r);
    r.animate([{ transform: 'scale(.4)', opacity: 1 }, { transform: 'scale(2.3)', opacity: 0 }], { duration: 900, delay: k * 150, easing: EASE_OUT, fill: 'backwards' }).onfinish = () => r.remove();
  }
}

// 吃亏的时候分块抖一下
function shakeEl(el) {
  if (!el || !motionOK()) return;

// 付款：一串金币从付款人的银行划弧线飞进收款人的银行。进我的银行时每枚落下都"叮"一声、一枚比一枚高，
// 最后一枚落定再响金币声、钱堆弹一下、轻震一下。返回第一枚 / 最后一枚落地的时刻（ms），银行数字照这个节奏滚
function coinRain(fromP, toP, amount, delay0) {
  if (!motionOK()) return null;
  const a = boxOf($(`#screen .bank[data-p="${fromP}"] .pile`));
  const b = boxOf($(`#screen .bank[data-p="${toP}"] .pile`));
  if (!a || !b) return null;
  delay0 = delay0 || 0;
  const mine = toP === me();
  const n = Math.max(3, Math.min(9, Math.round(amount)));
  const anchor = { cx: b.cx, cy: b.cy, w: 18 };
  const lands = [];
  for (let k = 0; k < n; k++) {
    const c = document.createElement('div');
    c.className = 'coin';
    c.style.left = b.cx + 'px';
    c.style.top = b.cy + 'px';
    fxLayer.appendChild(c);
    const from = { cx: a.cx + (Math.random() - 0.5) * a.w * 0.6, cy: a.cy + (Math.random() - 0.5) * a.h * 0.4, w: 14 };
    const to = { cx: b.cx + (Math.random() - 0.5) * 12, cy: b.cy + (Math.random() - 0.5) * 12, w: 16 };
    const fr = arcFrames(from, to, { lift: 1.3 + Math.random() * 0.6, rot: 0, pop: 0.45 }, anchor);
    fr[0].opacity = 0;
    fr[1].opacity = 1;

      g.addColorStop(0, '#7a4a04'); g.addColorStop(0.3, '#e0a21c'); g.addColorStop(0.5, '#ffe08a'); g.addColorStop(0.7, '#d0900e'); g.addColorStop(1, '#6a3f02');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(-side * th, 0, fw, r, 0, 0, Math.PI * 2); // 背面那一圈
      ctx.fill();
      ctx.fillRect(Math.min(0, -side * th), -r, th, r * 2);  // 侧面
      if (th > 3) { // 齿纹
        ctx.fillStyle = 'rgba(90, 50, 0, .28)';
        for (let y = -r + 2; y < r - 1; y += 3.2) ctx.fillRect(Math.min(0, -side * th), y, th, 1.1);
      }
    }
    ctx.save();
    ctx.scale(fw / r, 1);
    ctx.drawImage(im, -r, -r, c.s, c.s);
    if (cs < 0) { ctx.fillStyle = 'rgba(120, 70, 0, .18)'; ctx.beginPath(); ctx.arc(0, 0, r * 0.98, 0, Math.PI * 2); ctx.fill(); } // 翻到背面：暗一点
    ctx.restore();
  };
  let last = 0;
  const frame = (now) => {
    const dt = Math.min(0.05, (now - (last || now)) / 1000);
    last = now;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    const im = sprite();
    coins = coins.filter((c) => c.alpha > 0.02 && c.x > -c.s * 2 && c.x < innerWidth + c.s * 2);
    for (const c of coins) {
      if (now < c.at) continue;
      c.life += dt;
      c.vy = Math.min(c.max, c.vy + 1100 * dt);
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.ph += c.w * dt;
      c.rot += c.vr * dt;
      // 落到底下散开：弹两下、往两边滚，转速慢下来，然后淡掉
      if (c.y > c.floor) {
        c.y = c.floor;
        if (c.vy > 140 && c.hits < 2) { c.vy = -c.vy * (0.34 + Math.random() * 0.12); c.vx = c.vx * 0.6 + (Math.random() - 0.5) * 260; c.w *= 0.55; c.vr *= 0.5; c.hits++; }
        else { c.vy = 0; c.vx *= 0.9; c.w *= 0.9; c.rest = true; }
      }
      if (c.rest || c.life > 4.5) c.alpha -= dt * 1.6;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, c.alpha));
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      drawCoin3d(im, c);
      ctx.restore();
    }
    if (coins.length) raf = requestAnimationFrame(frame);
    else { raf = 0; last = 0; cv.remove(); cv = null; }
  };
  // o.quiet：只下金币（赢下整局的收尾里用）——不出进账横幅、不响头奖、不另外闪光震屏和震动，那一刻的声音和触感归收尾大场面
  return (p, amount, o) => {
    const quiet = !!(o && o.quiet);
    const mine = p === me();
    const k = Math.max(0, Math.min(1, (amount - 10) / 40)); // 10M → 0，50M 以上 → 1
    if (quiet && !motionOK()) return;
    const banner = quiet ? null : document.createElement('div');
    const show = (1400 + k * 1200) * (mine ? 1 : 0.7);
    if (banner) {
      banner.className = 'rain-amt' + (k > 0.35 ? ' huge' : '');
      banner.innerHTML = `<small>${esc(mine ? '金币雨！进账' : `${V().players[p].name} 进账`)}</small><b>+0M</b>`;
      fxLayer.appendChild(banner);
    }
    const num = banner && $('b', banner);
    if (!motionOK()) { num.textContent = `+${amount}M`; setTimeout(() => banner.remove(), show); return; }
    if (!cv) {
      cv = document.createElement('canvas');
      cv.className = 'rain';
      ctx = cv.getContext('2d');
      fxLayer.appendChild(cv);
      fit();
    }
    const now = performance.now();
    const n = Math.round((40 + k * 260) * (mine ? 1 : 0.35)); // 对方进账：轻一点，不喧宾夺主
    const span = 700 + k * 1600;
    const big = 40 + k * 34;
    for (let j = 0; j < n; j++) {
      const s = 24 + Math.random() * (big - 24);
      coins.push({ x: Math.random() * innerWidth, y: -s - Math.random() * 120, vx: (Math.random() - 0.5) * 60, vy: 160 + Math.random() * 240, max: 520 + s * 9, s, ph: Math.random() * 6.3, w: 5 + Math.random() * 9, rot: (Math.random() - 0.5) * 0.6, vr: (Math.random() - 0.5) * 2, at: now + Math.random() * span, life: 0, floor: innerHeight - s * 0.4 - Math.random() * innerHeight * 0.12, hits: 0, alpha: 1 });
    }
    if (amount >= 25 && mine) { // 中间炸开一圈
      const m = Math.round(24 + k * 60);
      for (let j = 0; j < m; j++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.6;
        const sp = 500 + Math.random() * 700;
        const s = 30 + Math.random() * (big - 20);
        coins.push({ x: innerWidth / 2, y: innerHeight * 0.45, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, max: 900, s, ph: Math.random() * 6.3, w: 8 + Math.random() * 10, rot: (Math.random() - 0.5) * 1.2, vr: (Math.random() - 0.5) * 4, at: now + 120, life: 0, floor: innerHeight - s * 0.4 - Math.random() * innerHeight * 0.12, hits: 0, alpha: 1 });
      }
      if (!quiet) { // 收尾大场面自己有闪光和震屏：不再叠一层
        const flash = document.createElement('div');
        flash.className = 'ep-flash gold';
        fxLayer.appendChild(flash);
        flash.animate([{ opacity: 0.45 }, { opacity: 0 }], { duration: 560, easing: 'ease-out', fill: 'forwards' }).onfinish = () => flash.remove();
        cameraShake(8 + k * 12, 700);
      }
    }
    if (!raf) raf = requestAnimationFrame(frame);
    // 声音：一阵金币声，进账越多越密
    if (!quiet) sound.play(mine ? 'jackpot' : 'chips');
    for (let j = 0; j < 4 + Math.round(k * 10); j++) sound.play(j % 3 || quiet ? 'chips' : 'coin', 0.12 + j * (0.16 - k * 0.05)); // 收尾里只要筹码声：金币那声的 B 和号角的 C 和弦撞在一起
    if (mine && !quiet) haptic('success');
    if (!banner) return;
    banner.animate([{ opacity: 0, transform: 'translate(-50%, -50%) scale(2.2)' }, { opacity: 1, transform: 'translate(-50%, -50%) scale(.94)', offset: 0.55 }, { opacity: 1, transform: 'translate(-50%, -50%) scale(1)' }], { duration: 380, easing: EASE_OUT, fill: 'both' });
    banner.animate([{ opacity: 1 }, { opacity: 0, transform: 'translate(-50%, -50%) translateY(-24px) scale(.96)' }], { duration: 320, delay: show - 320, easing: EASE_OUT, fill: 'forwards' }).onfinish = () => banner.remove();
    const t0 = performance.now();
    const dur = 600 + k * 700;
    const tick = (t) => { const u = Math.min(1, (t - t0) / dur); num.textContent = `+${Math.round(amount * (1 - Math.pow(1 - u, 3)))}M`; if (u < 1 && banner.isConnected) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };
})();

// 一局结束。赢了：排一个比集齐一套更大的收尾（victoryFx），结算面板等它放完；减少动态效果时照旧：号角 + "胜利！"印章。
// 输了：先让人看清是哪一套赢的你——对方那一套落定时鼓一下、酒红光圈扩散两次，自己这边慢慢褪色（之后一直保持），一声低沉但不嘲讽的收尾
function celebrateEnd(e, fresh, wait) {
  disarmIdle();
  recordWinner(e.winner);
  recordMatch(e.winner);
  const motion = motionOK();
  wait = motion ? wait || 0 : 0; // 这一下前面还有老虎机在转：等它停了再收尾
  if (e.winner === me()) {
    if (motion) {
      S.finaleRound = S.info ? S.info.round : 0;
      spotlight(victoryFx, 3300, wait + 400); // 等赢下来的那几张牌落到桌上，收尾的牌才从原位飞起来
    } else {
      sound.play('win', 0.12);
      haptic('success');
      setTimeout(() => stamp('胜利！', 'gold', true), 160);
    }
  } else if (e.winner != null) {
    const beat = motion ? wait + 450 : 0; // 对方最后那张牌落到桌上的时候
    sound.play('defeat', beat / 1000);
    setTimeout(() => {
      haptic('warn');
      if (!S.snap || V().phase !== 'gameOver') return;
      S.lostRound = S.round; // 之后整页重画（对方点"再来一局"）也保持褪色
      const g = $('#screen .game');
      if (g) g.classList.add('lost');
      if (!motion) return;
      (fresh || []).forEach((c) => {
        const st = $(`#screen .zone.opp .set.full[data-color="${c}"] .stack`);
        if (!st) return;
        st.animate([{ scale: '1', filter: 'none' }, { scale: '1.18', filter: 'drop-shadow(0 0 16px #a51d43)', offset: 0.3 }, { scale: '1.06', filter: 'drop-shadow(0 0 10px #a51d43)', offset: 0.7 }, { scale: '1', filter: 'none' }], { duration: 900, easing: EASE_OUT });
        const b = boxOf(st);
        ringBurst(b, '#a51d43');
        setTimeout(() => ringBurst(b, '#a51d43'), 250);
      });
    }, beat);
  }
}
// 赢下整局的收尾（排队播，约 3 秒）：暗场、金光，自己凑齐的每一套各抽一张牌，从桌上原位飞起来扇形排开，金色绶带砸下"胜利！"；
// 1 秒处号角和弦落下——震屏、两门礼炮、一阵金币雨（不带横幅）。放完自己那几套再扫一道光，结算面板随后弹出
function victoryFx() {
  if (!S.snap) return;
  const i = me();
  const sets = V().players[i].sets.filter((x) => x.full).slice(0, 4);
  const n = sets.length;
  const box = document.createElement('div');
  box.className = 'epic win';
  box.style.setProperty('--c', '#ffcc00');
  box.setAttribute('aria-hidden', 'true'); // 读屏已经念了结果
  box.innerHTML = `<div class="ep-dim"></div><div class="ep-rays"></div><div class="ep-ring"></div>
    <div class="ep-cards">${sets.map((x, j) => `<div class="ep-card" style="--k:${j - (n - 1) / 2}">${cardHTML(x.cards[0])}</div>`).join('')}</div>
    <div class="ep-ribbon"><b>胜利！</b></div>`;
  fxLayer.appendChild(box);
  const total = 3000;
  const climax = 1000;
  sound.play('victory'); // 和弦正好在 1 秒处落下
  const fade = { duration: 300, delay: total - 300, easing: EASE_OUT, fill: 'forwards' };
  $('.ep-dim', box).animate([{ opacity: 0 }, { opacity: 1, offset: 0.08 }, { opacity: 1, offset: 0.9 }, { opacity: 0 }], { duration: total, fill: 'forwards' });
  $('.ep-rays', box).animate([{ opacity: 0, transform: 'translate(-50%, -50%) scale(.3) rotate(0deg)' }, { opacity: 1, transform: 'translate(-50%, -50%) scale(1) rotate(60deg)', offset: 0.3 }, { opacity: 1, transform: 'translate(-50%, -50%) scale(1.15) rotate(170deg)', offset: 0.88 }, { opacity: 0, transform: 'translate(-50%, -50%) scale(1.2) rotate(190deg)' }], { duration: total, easing: 'linear', fill: 'forwards' });
  $('.ep-ring', box).animate([{ opacity: 0.95, transform: 'translate(-50%, -50%) scale(.2)' }, { opacity: 0, transform: 'translate(-50%, -50%) scale(3.6)' }], { duration: 1000, delay: climax, easing: EASE_OUT, fill: 'both' });
  $$('.ep-card', box).forEach((c, j) => {
    const kk = j - (n - 1) / 2;
    const end = `translate(calc(-50% + ${kk} * var(--fan))) translateY(${Math.abs(kk) * 12}px) rotate(${kk * 9}deg)`;
    const r0 = c.getBoundingClientRect(); // 还没变换时的位置：中心横向在 left 处（变换里先 -50%）
    const st = $(`#screen .zone.me .set.full[data-color="${sets[j].color}"]`);
    const from = st && boxOf($(`[data-card="${sets[j].cards[0]}"]`, st) || $('.stack', st));
    const on = from && from.bottom > 0 && from.top < innerHeight && r0.width;
    const first = on
      ? { opacity: 1, transform: `translate(calc(-50% + ${(from.cx - r0.left).toFixed(1)}px), ${(from.cy - (r0.top + r0.height / 2)).toFixed(1)}px) rotate(${from.rz || 0}deg) scale(${(from.w / r0.width).toFixed(3)})` }
      : { opacity: 0, transform: `translate(-50%) translateY(60vh) rotate(${kk * 40}deg) scale(.5)` };
    c.animate([first, { opacity: 1, transform: `${end} scale(1.12)`, offset: 0.7 }, { opacity: 1, transform: `${end} scale(1)` }], { duration: 620, delay: 120 + j * 130, easing: EASE_OUT, fill: 'both' });
    c.animate([{ opacity: 1 }, { opacity: 0, transform: `${end} translateY(-30px) scale(.9)` }], fade);
    sound.play('card', (120 + j * 130) / 1000);
  });
  const rib = $('.ep-ribbon', box);
  rib.animate([{ opacity: 0, transform: 'translate(-50%, -50%) scale(2.8) rotate(-8deg)' }, { opacity: 1, transform: 'translate(-50%, -50%) scale(.92) rotate(-3deg)', offset: 0.6 }, { opacity: 1, transform: 'translate(-50%, -50%) scale(1) rotate(-3deg)' }], { duration: 420, delay: climax - 180, easing: EASE_OUT, fill: 'both' });
  rib.animate([{ opacity: 1 }, { opacity: 0 }], fade);
  setTimeout(() => {
    if (!box.isConnected) return;
    cameraShake(14, 650);
    haptic('heavy');
    const flash = document.createElement('div');
    flash.className = 'ep-flash';
    box.appendChild(flash);
    flash.animate([{ opacity: 0.55 }, { opacity: 0 }], { duration: 520, easing: 'ease-out', fill: 'forwards' });
    confetti({ x: innerWidth * 0.12, y: innerHeight * 0.92, count: 80, angle: -62, spread: 32, speed: 19 });
    confetti({ x: innerWidth * 0.88, y: innerHeight * 0.92, count: 80, angle: -118, spread: 32, speed: 19 });
    setTimeout(() => confetti({ x: innerWidth / 2, y: -10, count: 70, angle: 90, spread: 160, speed: 6 }), 530);
    goldRain(i, 30, { quiet: true });
  }, climax);
  setTimeout(() => {
    box.remove();
    $$('#screen .zone.me .set.full .stack').forEach((el, k) => setTimeout(() => shineOn(el), k * 140));
  }, total + 60);
}

/* 表情：从发送人头像旁边弹出一个对话泡，表情自己会动，再冒几颗小的往上飘 */

  '😱': [{ transform: 'none' }, { transform: 'scale(1.4) translateX(-3px)', offset: 0.14 }, { transform: 'scale(1.34) translateX(3px)', offset: 0.28 }, { transform: 'scale(1.34) translateX(-3px)', offset: 0.42 }, { transform: 'scale(1.28) translateX(2px)', offset: 0.56 }, { transform: 'none' }],
  '🙏': [{ transform: 'none' }, { transform: 'translateY(4px) scale(.92)', offset: 0.3 }, { transform: 'translateY(-2px) scale(1.1)', offset: 0.6 }, { transform: 'none' }],

  '💰': [{ transform: 'none' }, { transform: 'translateY(-9px) scale(1.16)', offset: 0.3 }, { transform: 'translateY(0) scale(.94)', offset: 0.55 }, { transform: 'translateY(-3px)', offset: 0.75 }, { transform: 'none' }],
};
// 飘出来的小粒子：默认就是这个表情本身往上飘；有的换成别的符号、换个飘法（眼泪往下掉、火苗笔直往上窜）
const EMO_P = {
  '🤔': { glyph: '❔' }, '🙏': { glyph: '✨' }, '😎': { glyph: '✨' }, '😱': { glyph: '❗' }, '😤': { glyph: '💢' }, '🎉': { glyph: '✨' },
  '😭': { glyph: '💧', fall: true }, '🔥': { glyph: '🔥', rise: true },
};
// 💰：一把金币从气泡里喷出来，抛物线落下
function emoCoins(cx, cy) {
  for (let k = 0; k < 10; k++) {
    const c = document.createElement('div');
    c.className = 'emo-coin';
    c.style.left = cx + 'px';
    c.style.top = cy + 'px';
    fxLayer.appendChild(c);
    const vx = (Math.random() - 0.5) * 190;
    const vy = -(150 + Math.random() * 120);
    const fr = [];
    for (let n = 0; n <= 8; n++) {
      const t = n / 8;
      fr.push({ offset: t, opacity: t > 0.8 ? 1 - (t - 0.8) * 5 : 1, transform: `translate(${(vx * t).toFixed(1)}px, ${(vy * t + 330 * t * t).toFixed(1)}px) rotateY(${Math.round(t * 720)}deg) scale(${t < 0.12 ? 0.4 + t * 5 : 1})` });
    }
    c.animate(fr, { duration: 900 + Math.random() * 300, delay: 120 + k * 40, easing: 'linear', fill: 'backwards' }).onfinish = () => c.remove();
  }
  sound.play('coin', 0.15);
  sound.play('coin', 0.32);
}
function emoteBubble(seat, e) {
  if (!S.room || !S.snap || S.screen !== 'game') return;
  const mine = seat === me();
  const av = nameEl(seat);
  if (!av) return;
  const r = av.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'emo' + (mine ? '' : ' down');
  el.innerHTML = `<span>${esc(e)}</span>`;
  fxLayer.appendChild(el);
  const x = Math.max(6, Math.min(innerWidth - el.offsetWidth - 6, r.right - 4));
  const y = mine ? r.top - el.offsetHeight + 2 : r.bottom - 2;
  el.style.left = x + 'px';
  el.style.top = Math.max(4, y) + 'px';
  sound.play('pop');
  if (!mine) haptic('light');
  if (!motionOK()) { setTimeout(() => el.remove(), 1900); return; }
  el.animate([
    { transform: 'scale(.6)', opacity: 0, easing: 'cubic-bezier(.2, .9, .3, 1.2)' },
    { transform: 'scale(1.08)', opacity: 1, offset: 0.12 },
    { transform: 'scale(1)', opacity: 1, offset: 0.2 },
    { transform: 'scale(1)', opacity: 1, offset: 0.84 },
    { transform: `translateY(${mine ? -10 : 8}px) scale(.88)`, opacity: 0 },
  ], { duration: 2300 }).onfinish = () => el.remove();
  if (EMO_FX[e]) el.firstChild.animate(EMO_FX[e], { duration: 760, delay: 220, easing: 'ease-in-out' });
  const b = el.getBoundingClientRect();
  const cx = b.left + b.width / 2;
  const cy = b.top + b.height / 2;
  const P = EMO_P[e] || {};
  if (e === '💰') emoCoins(cx, cy);
  if (e === '😱') cameraShake(3, 320);
  for (let k = 0; k < (e === '💰' ? 0 : P.rise ? 7 : 5); k++) {
    const p = document.createElement('div');
    p.className = 'emo-p';
    p.textContent = P.glyph || e;
    p.style.left = cx + 'px';
    p.style.top = cy + (P.fall ? b.height / 2 : 0) + 'px';

    const dx = (Math.random() - 0.5) * (P.rise ? 46 : P.fall ? 60 : 110);
    const dy = P.fall ? 36 + Math.random() * 46 : -(46 + Math.random() * (P.rise ? 110 : 70));
    p.animate([
      { transform: 'translate(0, 0) scale(.3)', opacity: 0 },
      { transform: `translate(${dx * 0.35}px, ${dy * 0.35}px) scale(1)`, opacity: 1, offset: 0.3 },
      { transform: `translate(${dx}px, ${dy}px) scale(.7) rotate(${dx / 3}deg)`, opacity: 0 },
    ], { duration: 1100 + Math.random() * 500, delay: 160 + k * 80, easing: 'cubic-bezier(.2, .7, .3, 1)', fill: 'backwards' }).onfinish = () => p.remove();
  }
  if (e === '🎉') confetti({ x: cx, y: cy, count: 22, angle: -90, spread: 140, speed: 7 });
}

// 表情面板：贴着表情按钮弹出来（两排六个），表情依次蹦出
function toggleEmotes() {
  if ($('#pop')) { closeEmotes(); return; }
  const btn = $('#screen [data-do="emotes"]');
  if (!btn) return;
  const b = btn.getBoundingClientRect();
  const pop = document.createElement('div');

/* ═══════════ 老虎机 ═══════════

const SLOT_KEYS = SLOT_SYMS.map((x) => x.k);

const SLOT_STOP = [0.8, 1.1, 1.4]; // 三个转轮依次停下（秒，从开转算）；吊悬念时第三个拖到第二个停下后 1.3 秒
const SLOT_INTRO = 0.22;           // 机器弹出来到开转
const SLOT_STAY = [650, 900];      // 停稳后机器留多久再淡出（输 / 赢）；出牌亮相、回应面板等它淡得差不多再接上
const pickOf = (a) => a[Math.floor(Math.random() * a.length)];
function symHTML(k) {

    const t = pickOf(teases);

  } else {
    const x = pickOf(SLOT_KEYS);

// 吊悬念的第三个：第二个停下后先降到慢速、慢慢爬几格，再停。总格数取整，保证正好停在格子正中
function reelPath(r, antic) {

    <div class="sm-line"></div></div><div class="sm-res">${esc(result)}</div>`;
  fxLayer.appendChild(box);

  const strips = $$('.sm-strip', box);
  const geo = $$('.sm-win', box).map((w, r) => {
    const c = w.getBoundingClientRect().width;
    strips[r].style.setProperty('--cell', c.toFixed(2) + 'px');
    return { h: w.getBoundingClientRect().height, c };
  });
  const put = (r, p) => { strips[r].style.transform = `translate3d(0, ${(geo[r].h / 2 - (paths[r].D + 1.5 - p) * geo[r].c).toFixed(1)}px, 0)`; };
  let landed = false;
  const stopAll = () => {

    if (!won && plan.near) {

    }
    const sm = $('.sm', box).getBoundingClientRect();
    if (onStop) onStop({ rect: sm, tray: { x: sm.left + sm.width * 0.49, y: sm.top + sm.height * 0.8 } });
    const stay = SLOT_STAY[won ? 1 : 0];
    const out = () => box.remove();
    if (motion) box.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateX(-50%) translateY(-8px) scale(.96)' }], { duration: 240, delay: stay, easing: EASE_OUT, fill: 'forwards' }).onfinish = out;

  if (!motion) { [0, 1, 2].forEach((r) => put(r, paths[r].D)); setTimeout(stopAll, 300); return; }

  box.animate([{ opacity: 0, transform: 'translateX(-50%) scale(.86)' }, { opacity: 1, transform: 'translateX(-50%) scale(1.02)', offset: 0.7 }, { opacity: 1, transform: 'translateX(-50%) scale(1)' }], { duration: 260, easing: EASE_OUT });
  $('.sm', box).animate([{ translate: '0 0' }, { translate: '0 0', offset: 0.55 }, { translate: '0 4px', offset: 0.75 }, { translate: '0 0' }], { duration: SLOT_INTRO * 1000 + 160 }); // 拉杆：机身往下一沉
  sound.play('lever', SLOT_INTRO - 0.06);
  strips.forEach((st) => st.classList.add('blur'));
  const t0 = performance.now() + SLOT_INTRO * 1000;
  const blurOff = paths.map((q, r) => (r === 2 && plan.antic ? SLOT_STOP[1] + 0.3 : q.T - 0.18));
  const seen = [0, 0, 0];
  const stopped = [false, false, false];
  let lastTick = 0;
  let teased = false;
  const step = (now) => {
    if (landed || !box.isConnected) return;
    const t = (now - t0) / 1000;
    let moving = false;
    for (let r = 0; r < 3; r++) {
      const q = paths[r];
      const pos = t <= 0 ? 0 : q.at(t);

    if (moving) requestAnimationFrame(step);
  };

}

// 多拿的牌先藏在手里，丢掉的牌在原位留一个替身，停下后从原位飞进弃牌堆

function unpark(list) {

/* 屏幕中央的大场面（成就、大乐透）：排队一个接一个放，不叠在一起，也不和印章抢位置 */
const spotlight = (() => {
  const q = [];
  let busy = false;
  let waiting = 0; // 已经排了期、还没进队的
  let idlers = [];
  let settling = false;
  const settle = () => {
    if (busy || q.length || waiting || settling) return;
    const cbs = idlers;
    idlers = [];
    settling = true;
    try { cbs.forEach((cb) => cb()); } finally { settling = false; }
    // 回调里又登记的（比如提示在等揭晓的闸门，而开闸的回调排在同一批后面）：下一拍再看，不在这里递归
    if (idlers.length) setTimeout(settle, 0);
  };
  const next = () => {
    if (busy) return;
    if (!q.length) { settle(); return; }
    busy = true;
    const it = q.shift();
    try { it.fn(); } catch (err) { console.error(err); }
    setTimeout(() => { busy = false; next(); }, it.ms);
  };
  const add = (fn, ms, delay) => { waiting++; setTimeout(() => { waiting--; q.push({ fn, ms }); next(); }, delay || 0); };
  add.idle = (cb) => { if (!idlers.includes(cb)) idlers.push(cb); settle(); }; // 队里的大场面全部放完时回调
  add.busy = () => busy || q.length > 0 || waiting > 0;
  return add;
})();
// 模拟镜头震动：整张牌桌抖几下，越抖越轻，带一点点旋转和推近
function cameraShake(px, ms) {
  const el = $('#screen .game');
  if (!el || !motionOK()) return;
  // 舒适度：幅度封顶、转角很小、更快收住——震一下表达力度就够了，持续大幅晃动容易让人头晕
  const k = Math.min(10, (px || 10) * 0.75);
  const frames = [];
  const n = 14;
  for (let i = 0; i <= n; i++) {
    const a = Math.pow(1 - i / n, 2.4);
    frames.push({ transform: i === n ? 'none' : `translate(${((Math.random() * 2 - 1) * k * a).toFixed(1)}px, ${((Math.random() * 2 - 1) * k * a).toFixed(1)}px) rotate(${((Math.random() * 2 - 1) * 0.5 * a).toFixed(2)}deg)` });
  }
  el.animate(frames, { duration: Math.min(ms || 600, 560), easing: 'linear' });
}

// 倍率图里字形实际占的范围 [左, 右, 上, 下]（相对 1254×1254 原图，按原图实测，含描边和投影）：显示时用负边距裁掉四周的透明边
const MULT_BOX = { X: [0.142, 0.839, 0.170, 0.851], 2: [0.217, 0.789, 0.141, 0.862], 4: [0.170, 0.846, 0.189, 0.862], 8: [0.181, 0.819, 0.121, 0.885] };

function multHTML(n) {

// 赌输的牌（连同叠的租金翻倍）：等转轮停下再从出牌人那里落进弃牌堆
function bustToDiscard(gb, prev) {
