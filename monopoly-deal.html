// 根据这次更新里发生的事：放声音、震动、飘字、亮相和庆祝
// 交接：对方最后一张牌（出完自动结束回合）、我的回合开始、我摸的两张在同一次更新里。先让他那张落地（是行动卡就等它亮完相），
// 再发我的牌、响"轮到你"——一件事接一件事，不糊成一团。返回要晚多少 ms
function handoffMs(job, reveal) {
  if (!motionOK() || !job.prev || !S.snap) return 0;
  const i = me();
  if (job.prev.view.turn.player === i || !job.events.some((e) => e.type === 'turnStart' && e.player === i)) return 0;
  if (reveal && reveal.e && reveal.e.player !== i) {
    const gb = job.pre ? null : job.events.find((e) => e.type === 'gamble');
    return (gb ? gamblePlan(gb).ms : 0) + REVEAL.oppIn + (reveal.e.target === i ? REVEAL.holdHit : REVEAL.hold) + REVEAL.out - 150;
  }
  return job.events.some((e) => (e.type === 'property' || e.type === 'bank' || e.type === 'actionPlayed') && e.player !== i) ? 380 : 0;
}

function runEffects(job, rects, reveal) {
  const prev = job.prev;
  softCoin.clear();
  if (!prev || !S.snap) return;
  const v = V();
  const i = me();
  const o = opp();
  const P0 = prev.view.players;
  const P1 = v.players;
  let t = 0;
  const at = () => { t += 0.06; return t - 0.06; };
  let stamped = false;
  const pre = !!job.pre; // 结果揭晓的大场面已经在旧桌面上播过了：这里只管把钱和牌落到位
  const gb = job.events.find((e) => e.type === 'gamble');
  if (gb && !pre) gambleFx(gb);
  if (reveal && rects && reveal.bust) bustToDiscard(reveal.bust, rects);
  const gms = gb && !pre ? gamblePlan(gb).ms : 0;
  if (reveal && rects) revealCard(reveal, rects, gms);
  const after = gb && motionOK() ? gms / 1000 : 0; // 被针对的提示音等老虎机停了再响
  const ins = [0, 0];
  let insFull = false;
  const lead = S.handoff || 0; // 交接：对方的牌先落地，我摸的牌、"轮到你"再来（playFlights 的摸牌也晚这么多）
  const rain = [null, null]; // 金币雨每一方第一枚 / 最后一枚落地的时刻：银行数字照这个节奏滚
  const addRain = (p, r) => { if (r) rain[p] = rain[p] ? { first: Math.min(rain[p].first, r.first), last: Math.max(rain[p].last, r.last) } : r; };
  for (const e of job.events) {
    switch (e.type) {
      case 'draw':
        if (reveal && reveal.jkDraw === e) { // 奖池开奖摸的牌：等转轮
          if (e.player === i) deferDraw(e.cardIds || [], gms + 500);
          else setTimeout(() => flyBacks(e.count), motionOK() ? gms + 500 : 0);
          break;
        }
        if (e.count && e.player === i) {
          for (let k = 0; k < Math.min(e.count, 5); k++) sound.play('card', at() + lead / 1000 + k * 0.03);
          (e.cardIds || []).forEach((id, k) => { if (isPremium(id)) setTimeout(() => sparkleCard(id), lead + 620 + k * 90); });
        } else if (e.count) flyBacks(e.count);
        break;
      case 'property': case 'steal': case 'swap':
        sound.play('card', at());
        if (e.type === 'property' && e.player === i) { // 离成套近了一步（还没成套）：牌落地时拨一下弦，张数越多音越高；成套那一张交给大场面的和弦
          const set = P1[i].sets.find((x) => x.id === e.setId);
          if (set && !set.full) {
            const f = [523.25, 659.25, 783.99, 987.77][Math.max(0, Math.min(3, set.cards.length - 1))] * Math.pow(2, P1[i].fullColors.length * 2 / 12);
            sound.play('pluck', 0.42, f);
            setTimeout(() => bumpEl($(`#screen .set[data-set="${e.setId}"][data-p="${i}"] .cap`), 1.3), 420);
          }
        }
        break;
      case 'bank':
        if (e.player === o) sound.play('card', at());
        else if (motionOK() && held.has(String(e.cardId))) softCoin.add(String(e.cardId)); // 自己存钱：金币声挪到牌落进银行那一下（那张牌真的在飞才挪）
        break;
      case 'building':
        sound.play('set', at());
        setTimeout(() => { const st = $(`#screen .set[data-set="${e.setId}"][data-p="${e.player}"] .stack`); if (st) { shineOn(st, 0); ringBurst(boxOf(st), '#ffcc00'); } }, 420);
        break;
      case 'actionPlayed':
        if (e.player === o && e.target === i) { sound.play('alert', at() + after); setTimeout(() => haptic('warn'), after * 1000); } else sound.play('card', at() + after);
        break;
      case 'payment':
        if (e.from !== e.to && (e.paid || e.amount)) addRain(e.to, coinRain(e.from, e.to, e.paid || e.amount, 120));
        break;
      case 'justSayNo': // 自己挡下的是好事（金色）、被挡是坏事（酒红）；反将一军时一层压一层
        if (!stamped) { stamp(`${NM('justSayNo')}！`, e.player === i ? 'good' : 'red', false, null, { depth: e.depth }); stamped = true; }
        break;
      case 'setStolen':
        if (!stamped) { stamp(e.to === i ? '抢到一整套！' : '整套被抢走了', e.to === i ? 'good' : 'red', false, null, { hap: e.from === i ? 'heavy' : '' }); stamped = true; }
        if (e.from === i) setTimeout(() => shakeEl($('#screen .zone.me')), 200);
        break;
      case 'canceled':
        sound.play('pop', at());
        break;
      case 'bankrupt':
        if (!stamped) { stamp(e.to === i ? '破产！' : '银行被搬空', e.to === i ? 'good' : 'red'); stamped = true; }
        if (e.amount) addRain(e.to, coinRain(e.from, e.to, Math.min(12, e.amount), 200));
        if (e.from === i) setTimeout(() => shakeEl($('#screen .zone.me')), 300);
        break;
      case 'liquidated':
        if (!stamped) { stamp('清算！', e.by === i ? 'good' : 'red'); stamped = true; }
        if (e.from === o && e.handCount) backsToDiscard(e.handCount, 260);
        if (e.from === i) { setTimeout(() => shakeEl($('#screen .zone.me')), 300); setTimeout(() => shakeEl($('#screen .handbox')), 380); }
        break;
      case 'hugeWin':
        if (!stamped) { stamp('HUGE WIN', e.by === i ? 'gold' : 'red'); stamped = true; }
        if (e.by === i) {
          haptic('success');
          setTimeout(() => confetti({ x: innerWidth / 2, y: innerHeight * 0.4, count: 70, angle: -90, spread: 150, speed: 12 }), 260);
          setTimeout(() => e.boostColors.forEach((c, n) => { const st = $(`#screen .zone.me .set.full[data-color="${c}"] .stack`); if (st) { setTimeout(() => { ringBurst(boxOf(st), '#ffcc00'); shineOn(st); }, n * 140); } }), 700);
        } else if (e.from === i) {
          setTimeout(() => shakeEl($('#screen .zone.me')), 300);
        }
        break;
      case 'autoEndTurn':
        if (e.player === i && !e.lapsed) notice(`出满 ${e.plays} 张，自动结束回合`, 'ok'); // 超时用完次数的由 timeoutNote 说
        break;
      case 'insurance': // 一次付款可能触发好几格：合起来说一次
        if (e.gained) ins[e.player] += e.gained;
        else if (e.player === i) insFull = true;
        break;
      case 'surgeEnd':
        powerFx(e.player, '电力清零', 'minus');
        notice(`${e.player === i ? '你的' : `${P1[e.player].name} 的`}满格加成结束，电力清零`, 'ok', 2600);
        break;
      case 'tycoonOffered':
        if (e.player !== i) notice(`${P1[e.player].name} 触发了贪婪大亨，正在选：吸血还是套现`, 'warn', 3200);
        break;
      case 'vampire': {
        const el = $(`#screen [data-bank="${e.player}"]`);
        if (el && e.amount) floatText(`🩸 +${e.amount}M`, el.getBoundingClientRect(), 'gold');
        if (e.player === i && e.amount) sound.play('coin', at());
        if (e.player !== i) notice(`${P1[e.player].name} 在吸血：你存钱，他白拿 ${e.amount}M`, 'warn', 2400);
        break;
      }
      case 'ghostCurse':
        if (e.player === i) notice(`捉鬼套装：这回合摸的 ${e.count} 张都是 1M`, 'warn', 3200);
        else notice(`${P1[e.player].name} 这回合摸的 ${e.count} 张都是 1M`, 'ok', 2600);
        break;
      default:
        break;
    }
    if (e.type === 'steal' && e.from === i) setTimeout(() => shakeEl($('#screen .zone.me')), 260);
  }
  // 奖池：数字等转轮停下再变
  if (gb && !pre && v.rules.jackpot && (prev.view.pot || 0) !== (v.pot || 0)) {
    S.potShown = prev.view.pot || 0;
    refreshPot(false);
    setTimeout(() => {
      S.potShown = null;
      refreshPot(true);
      if (S.snap && (V().pot || 0) > (prev.view.pot || 0)) sound.play('chips');
    }, motionOK() ? gamblePlan(gb).stopMs : 0);
  }
  // 加注 / 跟注 / 弃牌
  for (const e of job.events) {
    if (e.type === 'raiseOffered') {
      sound.play('chips');
      if (e.target === i) setTimeout(() => stamp(`加注 ×${e.stake}`, 'gold', false, `加注 ${multHTML(e.stake)}`, { hap: 'warn' }), 80);
      else { const st = $('#screen .stage'); if (st) floatText(`加注 ×${e.stake}`, st.getBoundingClientRect(), 'gold', `加注 ${multHTML(e.stake)}`); }
    } else if (e.type === 'raiseTaken') { // 越加越大：翻倍声每次高四个半音、震得更狠、桌上的倍率牌翻个面
      const lv = Math.max(1, Math.log2(e.stake || 2));
      sound.play('chips');
      cameraShake(4 + 3 * lv, 420);
      setTimeout(() => {
        const z = $('#screen .zstake');
        bumpEl(z, 1.5);
        if (z && motionOK()) z.animate([{ transform: 'perspective(240px) rotateX(0deg)' }, { transform: 'perspective(240px) rotateX(360deg)' }], { duration: 500, easing: EASE_OUT });
      }, 120);
      if (e.player === i) { notice(`跟注，这局 ×${e.stake}`, 'ok', 2400); sound.play('double', 0.1, lv); }
      else { notice(`${P1[e.player].name} 跟注了，这局 ×${e.stake}`, 'ok', 2600); stamp('跟注！', 'gold', false, null, { lvl: lv }); }
    } else if (e.type === 'folded' && e.player !== i) {
      notice(`${P1[e.player].name} 弃牌了`, 'ok', 2600);
    }
  }
  // 对方手牌数变了：数字轻轻跳一下
  if (P0[o].handCount !== P1[o].handCount) bumpEl($('#screen .zone.opp .cnt'), 1.3);
  // 轮到对方：对方那圈灰色虚线也亮一下（和自己回合时的蓝色对应）
  if (v.phase !== 'gameOver' && job.events.some((e) => e.type === 'turnStart' && e.player === o)) {
    const z = $('#screen .zone.opp');
    const zp = z && $('.arc path', z);
    if (zp && motionOK()) zp.animate([{ stroke: '#d4d4d9' }, { stroke: '#8e8e93', offset: 0.25 }, { stroke: '#d4d4d9' }], { duration: 1100, easing: 'ease-out' });
  }
  // ③ 结算之后的大场面：按这个顺序排队（delay 只决定进队先后）——金币雨跟着钱一起下 → 集齐一套（epicSet 自己排 250）→ 捉鬼套装 → 成就 → 触发的机制
  const g0 = gb && !pre && motionOK() ? gms : 0; // 没有提前揭晓（减少动态效果时）：排在老虎机后面
  const lot = pre ? null : job.events.find((e) => e.type === 'lottery');
  if (lot) { // 大乐透没有提前开奖：中的钱先藏起来，开奖的数字停下再飞进银行
    lot.cardIds.forEach((id) => hold(String(id)));
    spotlight(() => lotteryFx(lot), 3300, g0 + 100);
  }
  gainsOf(job.events).forEach((amt, p) => { if (amt > 10) spotlight(() => goldRain(p, amt), p === i ? 1500 : 900, g0 + (lot ? 1000 : 150)); });
  job.events.filter((e) => e.type === 'ghost').forEach((e) => ghostLater(e, rects, g0 + 350));
  const aw = job.events.filter((e) => e.type === 'award');
  aw.forEach((e) => { const ms = e.player !== i ? 1300 : aw.length > 1 ? 1900 : 2300; spotlight(() => awardFx(e.player, e.award, ms), ms, g0 + 450); });
  ins.forEach((n, p) => { if (n) setTimeout(() => powerFx(p, `电力保险 +${n / 2}`, 'gold', 'insurance'), 520); });
  if (insFull) notice('电力已满，溢出的不算', 'ok', 2200);
  // 触发的机制：登场大场面同样排队。对方自己触发的（电力满格、赌场礼赠、贪婪大亨）短一点：1.5 秒
  const MECH = g0 + 550;
  const intro = (e) => (e.player === i ? 2400 : 1500);
  job.events.forEach((e) => {
    if (e.type === 'auctionStart') spotlight(() => mechFx('auction', '秘密竞价', `双方都有完整的${COLOR(e.color).zh}`, '暗标出价：出价高的拿走双方的钱，并毁掉对方那套'), 2400, MECH);
    else if (e.type === 'auctionResult') { if (!pre) spotlight(() => auctionResultFx(e), 3400, g0 + 300); }
    else if (e.type === 'giftEarned') spotlight(() => mechFx('gift', '赌场礼赠', `${e.player === i ? '你' : v.players[e.player].name} 连续 ${e.streak} 次押 ×4`, '下回合开始开启：自己打开，或者送给对方', intro(e)), intro(e), MECH);
    else if (e.type === 'giftOpened') { if (!pre) spotlight(() => giftOpenFx(e), 3200, g0 + 300); }
    else if (e.type === 'takeoverStart') { if (!pre) spotlight(() => takeoverFx(e), 3400, g0 + 300); }
    else if (e.type === 'saleStart') spotlight(() => saleFx(e), 2400, MECH);
    else if (e.type === 'saleEnd') { if (!pre) spotlight(() => saleFx(e), e.sold ? 2600 : 2000, g0 + 200); }
    else if (e.type === 'saleBid') {
      sound.play('chips');
      const st = $('#screen .stage');
      if (e.player !== i) { haptic('warn'); if (st) floatText(`${v.players[e.player].name} 出价 ${e.amount}M`, st.getBoundingClientRect(), 'gold'); }
      requestAnimationFrame(() => { const pr = $('.sheet .sale-price b'); if (pr) bumpEl(pr, 1.3); }); // 面板这一拍才换成新价钱
    }
    else if (e.type === 'rouletteSpin') { if (!pre) spotlight(() => rlSpinFx(e), rlSpinMs(), g0 + 300); }
    else if (e.type === 'surge') spotlight(() => mechFx('power', '电力满格', `${e.player === i ? '你' : v.players[e.player].name} 攒满了 ${v.rules.powerCap} 点电力`, `收租 ×${e.mult}（不论是否成套），持续到之后第 ${e.turns} 个自己的回合结束，然后电力清零`, intro(e)), intro(e), MECH);
    else if (e.type === 'tycoon') spotlight(() => mechFx('tycoon', '贪婪大亨', `${e.player === i ? '你' : v.players[e.player].name} 从对方那里拿到的地产累计 ${e.grab}M`, e.player === i ? '整局只有一次：吸血，还是套现？' : '整局只有一次：他在选吸血还是套现', intro(e)), intro(e), MECH);
    else if (e.type === 'tycoonChosen') {
      if (pre) return;
      const who = e.player === i ? '你' : v.players[e.player].name;
      spotlight(() => mechFx('tycoon', e.mode === 'vampire' ? '🩸 吸血' : '💰 套现', `${who} 选了${e.mode === 'vampire' ? '吸血' : '套现'}`, e.mode === 'vampire' ? `直到这局结束：对方每存 ${e.step}M，${who}白拿 1M；对方向${who}收钱只算一半` : `${e.rentCount} 张全色租金 + 存进银行 ${e.amount}M`), 2400, g0 + 300);
    }
    else if (e.type === 'auctionBid' && e.player === o && v.phase === 'respond') notice(`${v.players[o].name} 已经出价了`, 'ok', 1800);
    else if (e.type === 'giftOffered' && e.player === o) notice(`${v.players[o].name} 的赌场礼赠到了：他在决定打开还是送给你`, 'warn', 2600);
    else if (e.type === 'redeemed') {
      notice(`${e.player === i ? '你' : v.players[e.player].name} 付 ${e.paid}M 赎回了${COLOR(e.color).zh}`, 'ok', 2200);
      setTimeout(() => { const st = $(`#screen .set[data-set="${e.setId}"][data-p="${e.player}"] .stack`); if (st) { shineOn(st, 0); ringBurst(boxOf(st), '#f2bd3a'); } }, 300);
    }
  });
  // 银行金额变化：飘字 + 数字滚动（大乐透那部分等开奖时再加）。轮盘赌的筹码换钱由浮层自己说，不在浮层上面飘字。
  // 收到的钱有金币飞过来时：数字先停在原来的数，第一枚金币落进来才开始滚、最后一枚落定时滚到，"+NM"也这时才冒出来（声音由金币自己响）。
  // 一次进账很多（大丰收）：就是这个"+NM"放大成金色，同一刻收银机"咔嚓"一声——一次得手只出一个数字
  const overNow = v.phase === 'gameOver';
  const big = job.events.find((e) => (e.type === 'payment' && e.to === i && e.paid >= 8) || (e.type === 'bankrupt' && e.to === i && e.amount >= 8));
  const bigAmt = big && !overNow && gainsOf(job.events)[i] <= 10 ? big.paid || big.amount : 0; // 超过 10M 有金币雨，就不再重复庆祝
  const cashed = job.events.some((e) => e.type === 'rouletteCashOut');
  [i, o].forEach((p) => {
    const a = P0[p].bankTotal;
    const b = P1[p].bankTotal - (lot && lot.player === p ? lot.amount : 0);
    if (lot && lot.player === p) { const el = $(`#screen [data-bank="${p}"]`); if (el) el.textContent = b + 'M'; } // 开奖前先显示不含奖金的数
    if (a === b) return;
    const el = $(`#screen [data-bank="${p}"]`);
    if (!el) return;
    if (!motionOK()) el.textContent = b + 'M';
    const fl = b > a && p === i && bigAmt ? 'gold big' : b > a ? '' : 'minus';
    const show = (node) => {
      if (!cashed) floatText(`${b > a ? '+' : '−'}${Math.abs(b - a)}M`, node.getBoundingClientRect(), fl);
      if (fl === 'gold big') bigHit();
    };
    const r = b > a ? rain[p] : null;
    if (r) {
      el.textContent = a + 'M';
      setTimeout(() => {
        const cur = $(`#screen [data-bank="${p}"]`);
        if (!cur) return;
        if (cur.textContent === a + 'M') countUp(cur, a, b, r.last - r.first); // 中间整页重画过、已经是别的数了：就不倒回去滚
        show(cur);
      }, r.first);
      return;
    }
    countUp(el, a, b);
    show(el);
    if (p === i && !(b > a && softCoin.size)) sound.play(b > a ? 'coin' : 'spend', at());
  });
  // 新凑齐的颜色
  let gained = 0;
  [i, o].forEach((p) => {
    const before = new Set(P0[p].fullColors);
    P1[p].fullColors.filter((c) => !before.has(c)).forEach((c) => { celebrateSet(p, c); epicSet(p, c); if (p === i) gained++; });
  });
  const oppNew = P1[o].fullColors.filter((c) => !P0[o].fullColors.includes(c)); // 输的时候：亮出是哪一套赢的
  // 连击：自己回合里每一下"得手"（收到钱、偷到牌、凑齐一套……）都记一次，第二下起显示连击、音调一次比一次高
  // 最后一张出完会自动结束回合，所以先把这次的"得手"算进去，再在对方回合开始时清零
  const starts = job.events.filter((e) => e.type === 'turnStart');
  if (starts.some((e) => e.player === i)) S.combo = 0;
  if (prev.view.turn.player === i || v.turn.player === i) {
    const hits = job.events.filter((e) => isHit(e, i)).length + gained;
    S.combo = (S.combo || 0) + hits;
    const c = S.combo;
    if (hits && c >= 2 && !overNow) setTimeout(() => comboFx(c), 950); // 一次更新只报最后的连击数，等金额飘字过去再出
  }
  if (starts.some((e) => e.player !== i)) S.combo = 0;
  // 追赶机制触发
  const cb = job.events.filter((e) => e.type === 'comeback');
  if (cb.length) {
    const p = cb[0].player;
    const last = cb.find((e) => e.kind === 'lastStand');
    const catchUp = cb.some((e) => e.kind === 'catchUp');
    // 回合台那一行很窄：文案控制在十来个字
    const n = last ? last.plays : 0;
    if (p === i) {
      notice(last && catchUp ? `可以出 ${n} 张，还多摸了 1 张` : last ? `背水一战：可以出 ${n} 张` : '逆风补给：多摸了 1 张', 'ok', 3400);
      setTimeout(() => stamp(last ? '背水一战' : '逆风补给', 'gold'), 260);
    } else notice(`${P1[p].name} ${last && catchUp ? '背水一战 + 多摸 1 张' : last ? `背水一战：可出 ${n} 张` : '逆风补给：多摸 1 张'}`, 'warn', 3000);
  }
  // 快到了：自己的几个目标第一次进入"差一点"范围时提醒一次
  const goals = nearGoals(i);
  S.nearShown = S.nearShown || {};
  const nearNow = new Set(goals.map((g) => g.key));
  Object.keys(S.nearShown).forEach((k) => { if (!nearNow.has(k)) delete S.nearShown[k]; });
  const fresh = goals.filter((g) => !S.nearShown[g.key]);
  fresh.forEach((g) => { S.nearShown[g.key] = true; });
  if (fresh.length && v.phase !== 'gameOver') setTimeout(() => { notice(fresh[0].text, 'ok', 3200); bumpEl(pwEl(me()), 1.2); }, 1400);
  // 离胜利只差一套
  const need = v.rules.setsToWin;
  if (v.phase !== 'gameOver' && need > 1) {
    [i, o].forEach((p) => {
      if (P1[p].fullColors.length === need - 1 && P0[p].fullColors.length < need - 1) {
        notice(p === i ? '再凑一套就赢了！' : `${P1[p].name} 只差一套了，小心`, p === i ? 'ok' : 'warn', 3000);
      }
    });
  }
  // 轮到自己：提示音、触感、手牌轻跳、那圈弧线亮一下——等桌面静下来再给（对方回应后直接轮到我时，结算的大场面还在放），
  // 有交接时先等对方那张落地。等到的时候我已经出过牌了就不再提示
  if (v.phase !== 'gameOver' && job.events.some((e) => e.type === 'turnStart' && e.player === i)) {
    afterCalm(() => {
      if (!S.snap || V().phase !== 'play' || V().turn.player !== i || V().turn.plays > 0) return;
      sound.play('turn');
      if (need > 1 && V().players[o].fullColors.length === need - 1) sound.play('heart', 0.38); // 对方到了赛点：心跳两下
      haptic('medium');
      setTimeout(rippleHand, 260);
      const z = $('#screen .zone.me'); // 自己那圈浅蓝虚线亮一下：轮到你了
      const zp = z && $('.arc path', z);
      if (zp && motionOK()) zp.animate([{ stroke: '#e2c06c' }, { stroke: '#d99a14', offset: 0.25 }, { stroke: '#e2c06c' }], { duration: 1100, easing: 'ease-out' });
    }, Math.max(250, lead + 120));
    const pot = turnPotential();
    if (pot >= 4 && !job.events.some((e) => e.type === 'comeback' && e.player === i)) setTimeout(() => { if (S.snap && V().turn.player === i) notice(`最多能收 ${pot}M`, 'warn', 2800); }, 1500);
    armIdle();
  }
  const over = job.events.find((e) => e.type === 'gameOver');
  if (over) celebrateEnd(over, oppNew, g0);
}

// 长按任意一张牌：放大看清楚，松手收回（iOS 式的轻点预览）
(() => {
  let timer = 0;
  let x0 = 0;
  let y0 = 0;
  let peek = null;
  let swallow = false;
  function open(card) {
    const r = card.getBoundingClientRect();
    const W = Math.min(innerWidth * 0.72, 320);
    const H = W / CONFIG.RATIO;
    const left = (innerWidth - W) / 2;
    const top = Math.max(60, (innerHeight - H) / 2);
    const dim = document.createElement('div');
    dim.className = 'peek-dim';
    const big = card.cloneNode(true);
    big.classList.remove('sel', 'pick', 'dim', 'fresh', 'can');
    big.classList.add('peek');
    big.removeAttribute('data-do');
    big.removeAttribute('data-card');
    Object.assign(big.style, { left: left + 'px', top: top + 'px', width: W + 'px', height: H + 'px' });
    big.style.setProperty('--w', W + 'px');
    fxLayer.append(dim, big);
    const from = `translate(${r.left - left}px, ${r.top - top}px) scale(${r.width / W})`;
    if (motionOK()) {
      big.animate([{ transform: from }, { transform: 'none' }], { duration: 280, easing: EASE_OUT });
      dim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: EASE_OUT });
    }
    peek = { big, dim, from };
    haptic('medium');
    sound.play('tap');
  }
  function close() {
    const p = peek;
    peek = null;
    if (!motionOK()) { p.big.remove(); p.dim.remove(); return; }
    p.dim.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: EASE_OUT });
    p.big.animate([{ transform: 'none', opacity: 1 }, { transform: p.from, opacity: 0.3 }], { duration: 220, easing: EASE_OUT }).onfinish = () => { p.big.remove(); p.dim.remove(); };
  }
  document.addEventListener('pointerdown', (e) => {
    const card = e.target.closest('#screen .card');
    if (!card || (e.pointerType === 'mouse' && e.button !== 0)) return;
    x0 = e.clientX;
    y0 = e.clientY;
    clearTimeout(timer);
    timer = setTimeout(() => { timer = 0; swallow = true; open(card); }, 430);

    for (const [r0, r1] of [[76, 100], [55.5, 75]]) segs += `<path d="M ${P(r0, b0)} L ${P(r1, b0)} A ${r1} ${r1} 0 0 1 ${P(r1, b1)} L ${P(r0, b1)} A ${r0} ${r0} 0 0 0 ${P(r0, b0)} Z" fill="${fill}" stroke="#e8b33c" stroke-width=".8"/>`;

function fallback(c) {
  const v = c.value ? `<em>${c.value}M</em>` : '';
  if (c.type === 'money') return `<span class="fb money"><b>${c.value}M</b></span>`;

    return `<span class="fb"><i style="background:${bg}"></i>${esc(c.zh)}${v}</span>`;
  }
  return `<span class="fb act">${esc(c.zh)}${v}</span>`;
}

// o: { btn, cls, color（所在组颜色，决定双色多功能地产正放还是倒放）, data, style }
function cardHTML(id, o) {
  o = o || {};
  const c = CARD(id);
  const flip = o.color && c.type === 'wild' && !c.any && o.color !== (upOf(c.face) || c.colors[0]);
  const miss = !hasImg(c.face);
  const cls = ['card', flip && 'flip', miss && 'noimg', o.cls].filter(Boolean).join(' '); // 「刚出现」的 fresh 类在渲染后再加，不写进 HTML：否则下一次重绘 HTML 必变，整块没法沿用
  const tag = o.btn ? 'button' : 'div';
  const extra = (o.btn ? ' type="button"' : '') + (o.show ? '' : ` data-card="${id}"`) + (o.data || '') + (o.style ? ` style="${o.style}"` : ''); // show：只是展示（弃牌堆里往下的历史），不参与飞牌
  const img = miss ? '' : `<img src="${imgUrl(c.face)}" alt="" decoding="sync" draggable="false">`; // 同步解码：Safari 异步解码新插入的图会先空白一帧
  return `<${tag} class="${cls}" data-face="${c.face}"${extra} aria-label="${esc(c.zh)}">${img}${fallback(c)}${o.inner || ''}</${tag}>`;
}

function backHTML(o) {
  o = o || {};
  const miss = !hasImg('back');
  return `<div class="card back${miss ? ' noimg' : ''}${o.cls ? ' ' + o.cls : ''}" data-face="back"${o.style ? ` style="${o.style}"` : ''} aria-hidden="true">${miss ? '' : `<img src="${imgUrl('back')}" alt="" decoding="sync" draggable="false">`}<span class="fb"></span></div>`;
}

// 卡图加载失败时改用兜底牌面，并记住这张缺图
document.addEventListener('error', (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement)) return;
  if (img.dataset.art) { // 成就 / 银行图读不到：先换成文字，后台换别的候选网址再试（试到了会重绘换回图片）
    const k = img.dataset.art;
    if (artSrc[k] && img.src === artSrc[k]) delete artSrc[k]; // 原来能读的这会儿读不到了：重新找
    resolveArt(k, true);
    if (img.classList.contains('bolt')) { // 电力格：换成内置闪电，满 / 半 / 空照样分得清
      const ic = document.createElement('i');
      ic.className = img.className;
      ic.innerHTML = ICON.volt;
      img.replaceWith(ic);
      return;
    }
    const mu = img.closest('.mult'); // 倍率图里有一张读不到：整个 ×N 换回文字，不留半图半字
    if (mu) { mu.replaceWith(document.createTextNode(mu.getAttribute('aria-label') || '')); return; }
    if (img.dataset.fb != null) img.replaceWith(document.createTextNode(img.dataset.fb));
    else img.remove();
    return;
  }
  const card = img.closest('.card');
  if (!card) return;
  const raw = rawOf(img.getAttribute('src'));
  if (raw) { img.src = raw; return; } // 转换后的图读不到：换原图再试一次
  S.missing.add(card.dataset.face);
  card.classList.add('noimg');
  img.remove();
}, true);

let preloaded = false;
let ratioFixed = false;
function useRatio(r) {
  if (ratioFixed || !(r > 0.45 && r < 0.95)) return;
  ratioFixed = true;
  store.set('ratio', r);
  if (Math.abs(r - CONFIG.RATIO) < 0.003) return;
  CONFIG.RATIO = r;
  document.documentElement.style.setProperty('--ratio', String(r));
  layoutHand();
}
function preloadFaces() {
  if (preloaded || !S.meta) return;
  preloaded = true;
  // 成就和大乐透的图也先拉下来、解码好：弹出来的那一刻不能是空白
  Object.keys(CONFIG.ART).forEach((k) => resolveArt(k));
  S.meta.faces.forEach((f) => {
    if (fileOf(f.face) == null) return;
    const im = new Image();
    im.decoding = 'async';
    im.onload = () => useRatio(im.naturalWidth / im.naturalHeight);
    im.onerror = () => { const raw = rawOf(im.src); if (raw) im.src = raw; else S.missing.add(f.face); };
    im.src = imgUrl(f.face);
  });
}

function cardDesc(c) {

  if (c.type === 'wild') return c.any ? '可以当任意颜色的地产，单独一张也能收租；不能拿来付款。' : `可以当${COLOR(c.colors[0]).zh}或${COLOR(c.colors[1]).zh}地产，自己回合里随时换色。`;

/* ═══════════ 渲染 ═══════════ */
// 整页重绘时沿用旧的 <img>：同一张图的节点直接挪进新 DOM，已经解码好的位图不用重新解码（Safari 重新解码时会白一帧，看起来就是闪）
function collectImgs(root) {
  const m = new Map();
  $$('img', root).forEach((img) => { const k = img.getAttribute('src'); if (!m.has(k)) m.set(k, []); m.get(k).push(img); });
  return m;
}
function reuseImgs(root, m) {
  if (!m.size) return;
  const old = new Set();
  m.forEach((list) => list.forEach((img) => old.add(img)));
  $$('img', root).forEach((img) => {
    if (old.has(img)) return; // 本来就是沿用下来的旧节点
    const list = m.get(img.getAttribute('src'));
    if (!list) return;
    while (list.length && list[list.length - 1].isConnected) list.pop();
    if (!list.length) return;
    // 同一张图在不同位置样式可能不同（比如电力格的满 / 空用同一张图）：旧节点换上新节点的属性，只是不重新解码
    const keep = list.pop();
    for (const at of [...keep.attributes]) if (!img.hasAttribute(at.name)) keep.removeAttribute(at.name);
    for (const at of [...img.attributes]) if (keep.getAttribute(at.name) !== at.value) keep.setAttribute(at.name, at.value);
    img.replaceWith(keep);
  });
}
const sectionHtml = new Map(); // data-key → 上次生成的 HTML：没变的分块整块沿用旧节点

function render() {
  const root = $('#screen');
  const scroll = {};
  const oldKeyed = new Map();
  $$('[data-key]', root).forEach((el) => { scroll[el.dataset.key] = el.scrollLeft; oldKeyed.set(el.dataset.key, el); });
  const oldImgs = collectImgs(root);
  let html = '';
  switch (S.screen) {
    case 'boot': html = ''; break;
    case 'connecting': html = connectingHTML(); break;
    case 'home': html = homeHTML(); break;
    case 'join': html = joinHTML(); break;
    case 'lobby': html = lobbyHTML(); break;
    case 'matching': html = matchingHTML(); break;
    case 'game': html = S.snap ? gameHTML() : ''; break;
    case 'fatal': html = fatalHTML(); break;
    default: html = '';
  }
  const focusId = document.activeElement && document.activeElement.id;
  const caret = focusId && document.activeElement.selectionStart;
  const keepInputs = {};
  $$('input[id]', root).forEach((el) => { keepInputs[el.id] = el.value; });
  root.innerHTML = html;
  // 手牌、双方桌面这几块内容没变就沿用旧节点：不打断正在惯性滚动的手牌、不重置滚动位置、不重新解码卡图
  const reused = new Set();
  $$('[data-key]', root).forEach((el) => {
    const k = el.dataset.key;
    const h = el.outerHTML;
    const old = oldKeyed.get(k);
    if (old && sectionHtml.get(k) === h) { el.replaceWith(old); reused.add(k); }
    sectionHtml.set(k, h);
  });
  reuseImgs(root, oldImgs);
  // 换页时各块依次上浮进场；同一页里重绘时把"已经过了多久"带上，动画接着播而不是重来
  if (S.screen !== S.lastScreen) { S.lastScreen = S.screen; S.enterAt = performance.now(); }
  const first = root.firstElementChild;
  if (first && motionOK()) {
    first.classList.add('enter');
    first.style.setProperty('--enter-t', Math.round(S.enterAt - performance.now()) + 'ms');
  }
  Object.keys(keepInputs).forEach((k) => { const el = $('#' + k); if (el && document.activeElement !== el) el.value = keepInputs[k]; });
  if (focusId) { const el = $('#' + focusId); if (el) { el.focus(); if (el.setSelectionRange && caret != null) el.setSelectionRange(caret, caret); } }
  $$('[data-key]', root).forEach((el) => { if (!reused.has(el.dataset.key) && scroll[el.dataset.key] != null) el.scrollLeft = scroll[el.dataset.key]; });
  if (S.screen === 'game' && S.snap) {
    S.fresh.forEach((id) => { const el = cardNode(id); if (el) el.classList.add('fresh'); });
    hideHeld();
    layoutHand();
    layoutArcs();
    selFx();
    stageFx();
    morphMain();
    nudgeEnd();
    if (S.dealIn) { S.dealIn = false; dealIn(); }
  }
  if (S.screen === 'game' || S.screen === 'lobby') wake.on();
  const job = S.fxJob;
  const prev = S.flip;
  S.fxJob = null;
  S.flip = null;
  const reveal = job && prev ? pickReveal(job) : null; // 行动卡由"亮相"动画负责，不走普通飞行
  S.handoff = job && prev ? handoffMs(job, reveal) : 0;
  if (prev) { playFlights(prev, reveal && reveal.skip); vanishToDiscard(prev, reveal && reveal.skip); }
  if (job) runEffects(job, prev, reveal);
  S.handoff = 0;
  rouletteSync(job);
  settleDropped();
  document.title = (S.snap && S.screen === 'game' && V().phase !== 'gameOver' && V().activePlayer === me() ? '轮到你了 - ' : '') + 'Monopoly Deal 双人对战';
  renderSheet();
}

  return `<span class="slots" role="img" aria-label="已凑齐 ${Math.min(full.length, need)} / ${need} 套">${s}</span>`;
}

function bankHTML(p) {
  const P = V().players[p];
  const shown = P.bank.slice(-5);
  const pile = shown.length

  return `<button class="bank" data-do="bank" data-p="${p}" aria-label="${p === me() ? '我的' : esc(P.name) + ' 的'}银行，${P.bankTotal}M">${pile}<span class="cap">${ico}<span class="na">银行 </span><b class="num" data-bank="${p}">${P.bankTotal}M</b></span></button>`;
}

function setHTML(set, p) {
  const t = S.target;

  let cls = 'set' + (set.full ? ' full' : '');

  if (t && t.by === 'card' && !(t.owner === p && ids.some((id) => t.valid.has(id)))) cls += ' dim';
  const cardCls = (id) => (t && t.by === 'card' && t.owner === p && t.valid.has(id) ? 'pick' : '');
  const k = COLOR(set.color);
  const boost = V().players[p].boost;
  const boosted = !!(boost && set.full && boost.colors.includes(set.color));
  if (boosted) cls += ' boost';
  const near = !set.full && set.cards.length === set.size - 1;
  if (set.mortgage) cls += ' mortgaged';
  const label = set.mortgage ? '抵押中' : set.full ? `<b>${set.rent}M</b>${boosted ? `<span class="x4">${multHTML(boost.mult)}</span>` : ''}` : near ? `差1<span class="na">→${k.rent[set.size - 1]}M</span>` : `${set.cards.length}/${set.size}`; // 弧形里每组很窄：说明要短（叠起来时只留「差1」）
  const aria = `${p === me() ? '我的' : '对方的'}${k.zh}，${set.cards.length}/${set.size}${set.full ? '，已成套' : ''}${set.mortgage ? '，抵押中（收不了租、不算胜利套数）' : ''}${boosted ? `，下次收租 ×${boost.mult}` : ''}`;
  return `<button type="button" class="${cls}" data-do="set" data-set="${set.id}" data-p="${p}" data-color="${set.color}" style="--n:${ids.length};--c:${k.hex};--ct:${inkOn(k.hex)}" aria-label="${esc(aria)}">
    <span class="stack">${ids.map((id, i) => cardHTML(id, { cls: cardCls(id), color: set.color, style: `--i:${i}` })).join('')}</span>${set.mortgage ? '<span class="lockmark">抵押</span>' : ''}
    <span class="cap${near && !set.mortgage ? ' near' : ''}">${label}</span></button>`;
}

function tableHTML(p) {
  const P = V().players[p];
  const sets = P.sets.map((s) => setHTML(s, p)).join('');
  const loose = P.loose.length ? `<button type="button" class="set${S.target ? ' dim' : ''}" data-do="set" data-set="loose" data-p="${p}" style="--n:${P.loose.length};--c:transparent" aria-label="散落的建筑"><span class="stack">${P.loose.map((id, i) => cardHTML(id, { style: `--i:${i}` })).join('')}</span><span class="cap">散落建筑</span></button>` : '';
  return `<div class="arow" data-key="t${p}">${bankHTML(p)}${sets}${loose}</div>`;
}

// 电力：每格一个闪电（满 / 半 / 空）。有图用电力.png、半电力.png（空格用电力图压暗），没图用内置闪电。旧后端没有电力字段就不显示
function boltHTML(kind) {
  const k = kind === 'half' ? 'powerHalf' : 'power';
  if (artOK(k)) return `<img class="bolt is-${kind}" src="${artUrl(k)}" alt="" decoding="sync" draggable="false" data-art="${k}">`;
  return `<i class="bolt is-${kind}">${ICON.volt}</i>`;
}
const boltsHTML = (power, cap) => Array.from({ length: cap }, (_, k) => { const h = power - k * 2; return boltHTML(h >= 2 ? 'full' : h === 1 ? 'half' : 'empty'); }).join('');
const pctText = (p) => (p == null || p === 50 ? '一半' : `${p}%`);
// 快要触发了（目标梯度：离目标越近越想冲）：捉鬼套装、贪婪大亨、电力满格，各自还差多少。只提示门槛，不碰几率
function nearGoals(p) {
  const v = V();
  const P = v.players[p];
  const r = v.rules;
  const out = [];
  if (r.ghostKit && P.haul != null && P.haul > 0 && P.ghostBar - P.haul < 3) out.push({ key: `g${P.ghostN}`, text: `捉鬼套装：再让对方失去 ${P.ghostBar - P.haul + 1}M 就开老虎机` });
  if (r.tycoon && P.grab != null && !v.tycoon && P.grab > 0 && r.tycoonAt - P.grab < 4) out.push({ key: 't', text: `贪婪大亨：再拿对方 ${r.tycoonAt - P.grab + 1}M 地产就触发` });
  if (r.power && P.power != null && !P.surge && P.power === r.powerCap * 2 - 1) out.push({ key: 'p', text: `电力还差半格就满：再失去 ${r.insuranceStep - P.lost}M 收租 ×${r.surgeMult}` });
  const tk = v.takeover;
  if (tk && tk.player == null && P.sets.some((x) => x.color === tk.color && x.cards.length === x.size - 1)) out.push({ key: 'k', text: `再凑一张${COLOR(tk.color).zh}就触发恶意收购（轮盘赌）` });
  return out;
}
function powerHTML(p) {
  const v = V();
  const P = v.players[p];
  const r = v.rules;
  if (P.power == null || (!r.power && !r.ghostKit && !r.tycoon)) return '';
  const icons = r.power ? boltsHTML(P.power, r.powerCap) : '';
  const surge = P.surge ? `<span class="surge">${multHTML(r.surgeMult)}</span>` : '';
  const ghost = P.curse > 0 ? `<span class="gk">${artOK('ghost') ? `<img src="${artUrl('ghost')}" alt="" decoding="sync" draggable="false" data-art="ghost">` : ''}1M×${P.curse}</span>` : '';
  const ty = v.tycoon && v.tycoon.player === p && v.tycoon.mode === 'vampire' ? '<span class="vb">🩸 吸血</span>' : '';
  if (!icons && !ghost && !ty && !r.tycoon) return '';
  const label = [r.power ? `电力 ${P.power / 2} / ${r.powerCap}` : '', P.surge ? `满格加成中，收租 ×${r.surgeMult}` : '', P.curse > 0 ? `捉鬼套装：下回合开始摸的 ${P.curse} 张都是 1M` : ''].filter(Boolean).join('，');
  const label2 = [label, ty ? '贪婪大亨：吸血中' : ''].filter(Boolean).join('，') || '状态';
  return `<button type="button" class="pw${P.surge ? ' on' : ''}${nearGoals(p).length ? ' near' : ''}" data-do="power" data-p="${p}" aria-label="${esc(label2)}。点开看说明">${icons || (r.tycoon && !ty && !ghost ? '<span class="vb" style="background:var(--mist);color:var(--ink-2)">大亨</span>' : '')}${surge}${ghost}${ty}</button>`;
}

// 自动理牌：地产按颜色（和桌上颜色顺序一致）→ 多功能地产 → 租金 → 行动牌（越狠越靠前）→ 钱（大到小）。
// 同一类挨在一起，找牌不用翻；新摸的牌直接飞进它该在的位置
const ACTION_ORDER = ['dealBreaker', 'hugeWin', 'liquidation', 'bankruptcy', 'justSayNo', 'slyDeal', 'forcedDeal', 'debtCollector', 'birthday', 'doubleRent', 'house', 'hotel', 'passGo'];
function sortHand(ids) {
  const ci = (k) => S.meta.colorKeys.indexOf(k);
  const key = (id) => {
    const c = CARD(id);
    if (c.type === 'property') return [0, ci(c.color), id];
    if (c.type === 'wild') return [1, c.any ? 99 : ci(c.colors[0]), id];
    if (c.type === 'rent') return [2, c.any ? 99 : ci(c.colors[0]), id];
    if (c.type === 'action') { const k = ACTION_ORDER.indexOf(c.action); return [3, k < 0 ? 50 : k, id]; }
    return [4, -c.value, id];
  };
  return ids.slice().sort((a, b) => { const x = key(a); const y = key(b); return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; });
}

// 收益预期：一张收钱的牌最多能收多少（按最贵的颜色、叠满租金翻倍；能赌一把就按 ×4 算"最高"）。只看自己手里的牌
function gainOfPlay(p) {
  if (!p) return 0;
  const hv = (x) => (p.half ? Math.ceil(x / 2) : x);
  if (p.kind === 'rent') return hv(Math.max(0, ...p.colors.map((x) => x.amount)) * Math.pow(2, p.maxDoubles || 0));
  if (p.kind === 'debtCollector' || p.kind === 'birthday' || p.kind === 'bankruptcy') return hv(p.amount || 0);
  return 0;
}
const bestGain = (p) => gainOfPlay(p) * (p && p.bets && p.bets.length ? Math.max(...p.bets) : 1);
// 这回合最多能收多少：出牌次数以内挑最贵的几张收钱牌，其中一张押满
function turnPotential() {
  const o = O();
  const plays = (o.hand || []).map((h) => h.play).filter((p) => gainOfPlay(p) > 0).sort((a, b) => gainOfPlay(b) - gainOfPlay(a)).slice(0, Math.max(1, o.playsLeft || 0));
  if (!plays.length) return 0;
  return plays.reduce((t, p) => t + gainOfPlay(p), 0) + (bestGain(plays[0]) - gainOfPlay(plays[0]));
}
function handHTML() {
  const v = V();
  const raw = v.players[me()].hand || [];
  const hand = S.autoSort ? sortHand(raw) : raw;
  const cnt = `<div class="handcnt">${handCountHTML(me())}${powerHTML(me())}</div>`;
  const box = `<div class="handbox" style="--hpad:${S.handPad || 24}px">`;
  if (!hand.length) return `${box}${ARC_SVG}${cnt}<div class="hand" data-key="hand"></div></div>`; // 空着就空着：不放提示字（张数角标的读屏文字里有「0 张」）
  const o = O();
  const t = S.target;
  const myMain = o.canEndTurn && o.playsLeft > 0;
  return `${box}${ARC_SVG}${cnt}<div class="hand" data-key="hand">${hand.map((id) => {
    const h = o.hand.find((x) => x.cardId === id);
    let cls = (S.sel === id ? 'sel ' : '') + (myMain && !(h && (h.play || h.bank)) ? 'muted' : '');
    if (t) cls = 'dim';
    const g = myMain && h && h.play ? bestGain(h.play) : 0;
    const inner = g ? `<span class="gain"><i>${h.play.bets && h.play.bets.length ? '最高' : '收'} </i>${g}M</span>` : ''; // 扇形挤时 <i> 收起来，只留数字
    return cardHTML(id, { btn: true, cls, data: ' data-do="hand"', inner });
  }).join('')}</div></div>`; // 手牌张数在自己地产区的右上角
}

/* ── 回合台：轮到谁、还能出几张（格子），最下面一行放临时提示 / 连接状态 / 必要的补充 ── */
function stageSub() {
  const v = V();
  if (v.phase !== 'play' || v.turn.player === me()) return '';
  const o = opp();
  if (S.info && S.info.players[o] && !S.info.players[o].online) return '对方掉线了，等他回来';
  if (S.clock) return ''; // 有倒计时就不用再显示"思考中"
  const sec = Math.floor((Date.now() - (S.turnAt || Date.now())) / 1000);
  return sec >= 15 ? `思考中 ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}` : '';
}

// 最下面那一行：临时提示 > 连接状态 > 发送慢 > 这个阶段本身的补充说明
function stageLine(s) {
  if (dragHint.text) return { text: dragHint.text, tone: 'ok' }; // 提示（S.note）不在这一行：单独浮在下面（toastSync）
  if (!S.wsOpen) return { text: S.net === 'offline' ? '网络断开了，连上后会自动恢复' : S.retry > 3 ? '连接不上，正在重试' : S.everOpen ? '正在重新连接…' : '正在连接…', tone: 'warn' };
  if (S.pending && Date.now() - S.pending.t0 > 2500) return { text: '网络有点慢，正在发送…', tone: 'warn' };
  return { text: s.cap || s.title, tone: 'base' }; // 平时显示这个阶段本身：轮到谁、要做什么
}

function stageInfo() {
  const v = V();
  const i = me();
  const o = opp();
  const P = v.players;
  if (v.phase === 'gameOver') {
    const w = v.result.winner;
    return { key: 'over', mode: w === i ? 'win' : 'opp', title: w == null ? '平局' : w === i ? '你赢了' : `${P[o].name} 赢了`, sub: `${v.result.stake > 1 ? `×${v.result.stake} · ` : ''}共 ${v.result.turn} 回合 · 点这里看结果`, cap: `${w == null ? '平局' : w === i ? '你赢了' : `${P[o].name} 赢了`} · 点这里看结果`, tap: 'open-over' };
  }
  if (S.target) return { key: 'target', mode: 'me', title: '选择目标', sub: S.target.prompt, cap: S.target.prompt };
  if (v.phase === 'respond' && v.pending.action === 'auction') {
    const pd = v.pending;
    const bid = pd.bids[i] != null;
    return { key: `a${pd.id}.${bid}`, mode: bid ? 'opp' : 'alert', title: bid ? `等 ${P[o].name} 出价` : '秘密竞价：出价', sub: `${COLOR(pd.color).zh}套的暗标竞价`, cap: bid ? `已出价，等 ${P[o].name}` : `秘密竞价 · ${COLOR(pd.color).zh}` };
  }
  if (v.phase === 'respond' && v.pending.action === 'tycoon') {
    const mine = v.pending.awaiting === i;
    return { key: `ty${v.pending.id}`, mode: mine ? 'alert' : 'opp', title: mine ? '贪婪大亨：吸血还是套现' : `${P[o].name} 触发了贪婪大亨`, sub: mine ? '二选一，这局只有这一次' : '对方在选：吸血，还是套现', cap: mine ? '贪婪大亨：吸血还是套现？' : `等 ${P[o].name} 选择` };
  }
  if (v.phase === 'respond' && v.pending.action === 'sale') {
    const pd = v.pending;
    const lead = pd.leader;
    const what = lead == null ? '起拍价 0，等人出价' : `${lead === i ? '你' : P[o].name} 出价 ${pd.amount}M`;
    return { key: `sl${pd.id}.${pd.step}`, mode: lead === i ? 'me' : 'alert', title: `拍卖：${COLOR(pd.color).zh}地产`, sub: what, cap: `拍卖 · ${what}`, tap: 'open-sale', hint: '点开拍卖面板出价' };
  }
  if (v.phase === 'respond' && v.pending.action === 'takeover') {
    const pd = v.pending;
    const mine = pd.awaiting === i;
    return { key: `tk${pd.id}.${pd.step}`, mode: mine ? 'alert' : 'opp', title: mine ? '轮盘赌：轮到你' : `${P[pd.awaiting].name} 在玩轮盘赌`, sub: `恶意收购 · ${COLOR(pd.color).zh}`, cap: mine ? '恶意收购：轮到你玩轮盘赌' : `${P[pd.awaiting].name} 在玩轮盘赌`, tap: 'rl-open' };
  }
  if (v.phase === 'respond' && v.pending.action === 'gift') {
    const mine = v.pending.awaiting === i;
    return { key: `g${v.pending.id}`, mode: mine ? 'alert' : 'opp', title: mine ? '赌场礼赠：打开或送出' : `${P[o].name} 的赌场礼赠`, sub: mine ? '自己打开，或者送给对方' : '对方在决定自己打开还是送给你', cap: mine ? '赌场礼赠：打开还是送出？' : `等 ${P[o].name} 处理礼赠` };
  }
  if (v.phase === 'respond') {
    const pd = v.pending;
    const mine = pd.awaiting === i;
    const what = pd.action === 'raise' ? `${P[pd.actor].name} 要求加注到 ×${pd.stake}` : `${actionName(pd)}${pd.amount ? ` ${pd.amount}M` : ''}${pd.bet > 1 ? ` · 赌赢 ×${pd.bet}` : ''}`;
    return { key: `r${pd.id}.${pd.chain.length}`, mode: mine ? 'alert' : 'opp', title: mine ? '轮到你回应' : `等 ${P[o].name} 回应`, sub: pd.chain.length ? `${what} · 反对 ×${pd.chain.length}` : what };
  }
  if (v.phase === 'discard') {
    const mine = v.turn.player === i;
    return { key: `d${v.turn.number}`, mode: mine ? 'alert' : 'opp', title: mine ? '手牌太多了' : `${P[o].name} 在弃牌`, sub: `要弃掉 ${v.discardNeed} 张`, cap: mine ? `手牌太多，弃掉 ${v.discardNeed} 张` : `${P[o].name} 在弃牌` };
  }
  const mine = v.turn.player === i;
  const max = v.turn.max || v.rules.playsPerTurn;
  const bonus = max > v.rules.playsPerTurn;
  const sub = stageSub() || (bonus ? `背水一战：可以出 ${max} 张` : '');
  const title = mine ? '你的回合' : `${P[o].name} 的回合`;
  return { key: `t${v.turn.number}`, mode: mine ? 'me' : 'opp', title, pips: Array.from({ length: max }, (_, k) => k < v.turn.playsLeft), base: v.rules.playsPerTurn, lapsed: v.turn.lapsed || 0, sub, cap: stageSub() || (bonus && mine ? `背水一战 · 能出 ${max} 张` : title) };
}

// 仪表：270° 的圆弧，缺口朝下。路径从右下角逆时针画到左下角，stroke-dashoffset = 已经过去的比例，
// 剩下的那段就停在右下角、前端顺时针往前走，像钟表的指针扫过去
const GAUGE_ARC = 'M 78.28 78.28 A 40 40 0 1 0 21.72 78.28';
const saleCanBid = () => !!(O().respond && O().respond.action === 'sale' && O().respond.canBid);
// 拍卖开拍时两边都能出价：倒计时指向能出价的自己，不指向挂着"等谁"的回合方
const actorSeat = () => (!S.clock ? V().activePlayer : S.clock.kind === 'sale' ? (saleCanBid() ? me() : opp()) : S.clock.seat);
function gaugeHTML(s, c) {
  const v = V();
  const over = v.phase === 'gameOver';
  const left = clockLeft(c);
  const e = c ? 1 - left / c.total : 0;
  let face;
  if (over) {
    const w = v.result.winner;
    face = `<span class="g-num"><b>${w == null ? '平' : w === me() ? '胜' : '负'}</b></span>`;
  } else {
    face = `<span class="g-num"><b id="g-sec">${c ? Math.ceil(left / 1000) : ''}</b>${c ? '<small>s</small>' : ''}</span>`;
  }
  const cls = over ? ` over${v.result.winner === me() ? ' win' : ''}` : !c ? ' noclock' : left <= 5000 ? ' hurry' : '';
  return `<span class="gauge${cls}" aria-hidden="true"><svg class="g-svg" viewBox="0 0 100 100"><path class="g-track" d="${GAUGE_ARC}"/><path class="g-fill" d="${GAUGE_ARC}" pathLength="100" style="stroke-dashoffset:${(e * 100).toFixed(2)}"/></svg>${face}<span class="g-arrow" data-dir="${actorSeat() === me() ? 'down' : 'up'}">${ICON.arrow}</span>${s.pips ? gaugeDots(s) : ''}</span>`;
}
// 出牌次数的点：沿着圆弧缺口往下排成一道弧（中间那颗最低），点多了（背水一战）间距收一点
function gaugeDots(s) {
  const n = s.pips.length;
  const sp = n <= 3 ? 24 : n === 4 ? 20 : 17;
  const used = n - s.pips.filter(Boolean).length;
  return s.pips.map((on, k) => {
    const a = (90 - (k - (n - 1) / 2) * sp) * Math.PI / 180; // 角度越大越靠左：第 0 颗在最左边
    const lapsed = !on && k >= n - Math.min(used, s.lapsed || 0); // 超时作废的排在最右边
    const next = k === n - used - 1; // 最右边那颗亮着的：下一次出牌用掉的就是它（对方回合时它在呼吸）
    return `<i class="g-dot${on ? ' on' : ''}${next ? ' next' : ''}${k >= s.base ? ' bonus' : ''}${lapsed ? ' lapsed' : ''}" style="left:${(50 + 45 * Math.cos(a)).toFixed(1)}%;top:${(50 + 45 * Math.sin(a)).toFixed(1)}%"></i>`;
  }).join('');
}
// 手里已经没有能出的牌（出空了，或者次数用完又没开自动结束）：停一下给「结束回合」扫一道光，每回合一次——下一下该点哪里一眼就知道，不加字
let endNudgeTimer = 0;
function nudgeEnd() {
  clearTimeout(endNudgeTimer);
  if (!S.snap) return;
  const key = `${S.round}|${V().turn.number}`;
  const due = () => !!S.snap && S.screen === 'game' && S.endNudged !== key && O().canEndTurn && !O().hand.some((h) => h.play || h.bank);
  if (!due()) return;
  endNudgeTimer = setTimeout(() => {
    const el = $('#screen .dock .main[data-do="end-turn"]');
    if (!el || !due() || S.busy || S.sheet || S.gate) return; // 正在等确认 / 开着面板 / 揭晓还在放：下次重绘再看
    S.endNudged = key;
    shineOn(el);
  }, 600);
}

function stageHTML() {
  const s = stageInfo();
  S.stageNow = s;
  const line = stageLine(s);
  const v = V();
  const c = v.phase === 'gameOver' ? null : S.clock;

// 手牌：像握在手里一样，所有牌绕下方同一个圆心排成一段圆弧——越往两边转得越多、也沉得越低。
// 最外侧那张转 A 度：2 张 ±6°，之后每多一张 +5.5°，最多 ±22°。出牌区左右铺满屏幕，最外侧那张（连转出去的牌角）最多伸出屏幕两成。
// 底边每张露出不到 34px（扇形越往上张得越开，顶上露得更多）就一度一度收小扇形；
// 收到 ±6° 还放不下，才叠起来横向滑（每张露出 44px，不转）
const FAN = { max: 22, per: 5.5, min: 6, step: 34, out: 0.2 };
function fanFor(n, hw, hh, cw, pad) {
  const rad = Math.PI / 180;
  // 以底边中点为轴转 A 度：上角往外甩出去多少
  const swing = (A) => hh * Math.sin(A * rad) - hw / 2 * (1 - Math.cos(A * rad));
  for (let A = Math.min(FAN.max, Math.max(FAN.min, FAN.per * (n - 1))); A >= FAN.min; A -= 1) {
    const room = cw + 2 * FAN.out * hw - 2 * swing(A); // 两头的牌（连甩出去的牌角）各伸出屏幕不超过两成
    const step = Math.min(hw + 8, (room - hw) / (n - 1));
    const corner = hw / 2 * Math.sin(A * rad);   // 转了角，外侧的下角往下沉多少
    if (step < FAN.step || corner > pad - 6) continue;
    const th = 2 * A / (n - 1);                  // 相邻两张差几度
    const R = step / (th * rad);                 // 圆弧半径：相邻两张的底边中点相隔 step、夹角 th
    const dip = R * (1 - Math.cos(A * rad));     // 沿圆弧，最外侧那张比中间低多少
    return { step, th, R, k: Math.min(1, (pad - 2 - corner) / dip) }; // 牌距大时圆弧会沉到底边外面：竖直方向压扁一点
  }
  return null;
}
function layoutHand() {
  const hand = $('#screen .hand');
  if (!hand) return;
  const cards = $$('.card', hand);
  const n = cards.length;
  if (!n) return;
  hand.classList.add('nofx'); // 重绘后直接摆到位，不要每次都"转"一下
  const hw = cards[0].offsetWidth;
  const cw = hand.clientWidth;
  const fan = n > 1 ? fanFor(n, hw, cards[0].offsetHeight, cw, parseFloat(getComputedStyle(hand).paddingBottom) || 0) : null;
  const step = fan ? fan.step : n < 2 ? hw : 44;
  hand.classList.toggle('tight', n > 1 && step < 62); // 每张只露出一窄条：收益标签只留「52M」，数字不被下一张盖住
  const wide = hw + (n - 1) * step;
  hand.classList.toggle('fan', n < 2 || !!fan);
  hand.style.setProperty('--ov', (step - hw) + 'px');
  // 扇形比屏幕宽：两头一样多地伸出去（负边距，内容还是居中）；叠起来横向滑时两头留 10px
  if (fan && wide > cw) hand.style.setProperty('--edge', (-(wide - cw) / 2).toFixed(1) + 'px');
  else if (!fan && n > 1) hand.style.setProperty('--edge', '10px');
  else hand.style.removeProperty('--edge');
  const mid = (n - 1) / 2;
  cards.forEach((el, k) => {
    const a = fan ? (k - mid) * fan.th : 0;
    el.style.setProperty('--r', a.toFixed(2) + 'deg');
    el.style.setProperty('--y', (fan ? fan.R * (1 - Math.cos(a * Math.PI / 180)) * fan.k : 0).toFixed(1) + 'px');
  });
  void hand.offsetWidth;
  hand.classList.remove('nofx');
}
addEventListener('resize', () => { layoutHand(); layoutArcs(); });

/* 弧形分块（设计图）：每块是一段圆环——圆心在下方很远处，外弧在上、内弧在下。
 * 圆环左右一直伸到屏幕外面（两头的斜边看不见），像桌面延伸出去；块里两头的牌也可以伸出屏幕两成。
 * 对方那块整块转 180°，弧形轨道在块里先上下翻过来画（转过来以后也是往上拱，和自己那块一样），牌面和说明再原地转回来（正着看，说明在外弧那一侧）。块里的银行和各组地产沿着弧排开：越往两边越低、跟着弧的切线斜过去；
 * 放得下就留缝，放不下先让两头伸出屏幕，再不够就像手牌一样叠起来。左上角电力、右上角手牌张数贴着外弧、靠着屏幕边 */
const ARC = { rise: 0.15, top: 9, cap: 18, out: 0.2 };
// 每块怎么定牌的大小、间距：strip 外弧下面给两个角留的一条；step 估算一组叠牌总高时每多一张加多少（× 牌高）；zs 叠牌错开最多多少（× 牌高）；
// gap / gapMax 组和组之间（按里圈算）；wmax 牌宽上限（× 分块宽）；show 只缩到一屏看得见几组为止（0：缩到全放下，最多缩到 70%，还放不下才滑着看）。
// 对方那块比自己这块高：牌按圆环厚度放大，叠着的牌错开得更多，组和组之间也拉开，剩下的滑着看。矮的屏幕上这样反而更小，就照自己这块的办法排
const ARC_FIT = { step: 0.14, zs: 0.182, gap: 10, gapMax: 18, wmax: 0.21, wcap: 100, show: 0 };
const ARC_OPP = { step: 0.2, zs: 0.28, gap: 16, gapMax: 28, wmax: 0.25, wcap: Infinity, show: 3 };
// W、H：分块的宽高；ext：两头摆牌最远到分块外面多少（圆环的厚度按这里算，保证两头的牌不出分块的上下边）；
// drop：内弧在屏幕边上最多比分块下沿低多少（不传就不限）
function arcGeom(W, H, ext = 0, drop = Infinity) {
  const m = 2;
  // 外弧在分块左右两边比正中低多少：矮的分块弧度放平一点，多给牌留地方；很高的分块也不超过宽度的 7%
  // （圆太小的话，沿半径立着的牌越往圆心挤得越厉害，为了不叠在一起只能张得很开）
  const s = Math.max(6, Math.min(W * 0.07, H * Math.max(0.1, Math.min(ARC.rise, 0.1 + (H - 130) / 1200))));
  const R1 = ((W / 2) ** 2 + s * s) / (2 * s);
  const phi = Math.asin(Math.min(0.9, (W / 2 + ext) / R1));
  const c = 1 - Math.cos(phi);
  // 圆环的厚度：外弧顶到内弧顶。再加两条上限：内弧在屏幕边上最多比分块下沿低 drop（很厚的圆环内弧弯得厉害，会压到下一排），
  // 内弧的圆也要比屏幕宽（两头画到屏幕外）
  const X = W / 2 + Math.max(0, ext - 16);
  const byDrop = Number.isFinite(drop) ? R1 - Math.hypot(X, Math.max(0, R1 + 2 * m - H - drop)) : Infinity;
  const Hb = Math.max(40, Math.min((H - 2 * m - R1 * c) / (1 - c), byDrop, R1 - W / 2 - ext - 60));
  return { phi, R1, R2: R1 - Hb, Hb, cx: W / 2, cy: m + R1, W, H };
}
// 画圆环：两条弧都画到分块外面 ext 处（屏幕外）再竖着收口，屏幕里看到的就是两条弧一直延伸出去。inv：上下翻过来画
function drawArc(box, g, ext, inv) {
  const svg = $(':scope > .arc', box);
  if (!svg) return;
  const X = Math.min(g.W / 2 + ext, g.R2 * 0.98);
  const y = (R) => { const v = g.cy - Math.sqrt(R * R - X * X); return inv ? g.H - v : v; };
  const P = (x, yy) => `${x.toFixed(1)},${yy.toFixed(1)}`;
  const [s1, s2] = inv ? [0, 1] : [1, 0];
  svg.setAttribute('viewBox', `0 0 ${g.W} ${g.H}`);
  svg.firstChild.setAttribute('d', `M${P(g.cx - X, y(g.R1))} A${g.R1.toFixed(1)},${g.R1.toFixed(1)} 0 0 ${s1} ${P(g.cx + X, y(g.R1))} L${P(g.cx + X, y(g.R2))} A${g.R2.toFixed(1)},${g.R2.toFixed(1)} 0 0 ${s2} ${P(g.cx - X, y(g.R2))} Z`);
}
// 分块左右两边到屏幕边（对局区域的边）还有多远：转了 180° 的那块左右对调
function bleedOf(el, gr) {
  const r = el.getBoundingClientRect();
  const l = Math.max(0, r.left - gr.left);
  const rr = Math.max(0, gr.right - r.right);
  return el.classList.contains('opp') ? { l: rr, r: l } : { l, r: rr };
}
function layoutArcs() {
  if (S.screen !== 'game') return;
  const game = $('#screen .game');
  if (!game) return;
  const gr = game.getBoundingClientRect();
  let mine = null;
  let theirs = null;
  $$('#screen .zone').forEach((z) => {
    const W = z.clientWidth;
    const H = z.clientHeight;
    if (!W || !H) return;
    const bl = bleedOf(z, gr);
    // 对方那块整块转了 180°：块里上下翻过来摆（外弧在下、每项站在外弧上），转过来就是外弧在上、往上拱，说明文字挨着外弧。
    // 它的内弧挨着中间那一排名字：在屏幕边上最多往下伸 14px（自己这块的内弧底下是平行的出牌区，不用限）
    const inv = z.classList.contains('opp');
    const g = arcGeom(W, H, Math.max(bl.l, bl.r) + 16, inv ? 14 : Infinity);
    if (z.classList.contains('me')) mine = { g, r: z.getBoundingClientRect() };
    else theirs = { g, r: z.getBoundingClientRect() };
    const deg = (a) => ((inv ? -a : a) * 180 / Math.PI).toFixed(2) + 'deg';
    drawArc(z, g, Math.max(bl.l, bl.r) + 48, inv);
    const xl = -(W / 2 + bl.l); // 屏幕左边、右边（以分块正中为 0）
