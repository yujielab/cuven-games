  return `<button class="bank${shown.length ? '' : ` empty${p === me() && S.bankReveal ? ' reveal' : ''}`}" data-do="bank" data-p="${p}" aria-label="${p === me() ? '我的' : esc(P.name) + ' 的'}银行，${P.bankTotal}M">${pile}<span class="cap">${ico}<span class="na">银行 </span><b class="num" data-bank="${p}">${P.bankTotal}M</b></span></button>`;
}

function setHTML(set, p) {
  const t = S.target;
  // 建筑垫在最上面那张地产下面：叠起来时最上面还是地产（看得出颜色），建筑从下面露一条边
  const ids = set.cards.slice(0, -1).concat(set.house != null ? [set.house] : [], set.hotel != null ? [set.hotel] : [], set.cards.slice(-1));
  let cls = 'set' + (set.full ? ' full' : '');
  if (t && t.by === 'set') cls += t.valid.has(set.id) && t.owner === p ? ' pick' : ' dim';
  if (t && t.by === 'card' && !(t.owner === p && ids.some((id) => t.valid.has(id))) && !ids.includes(t.give)) cls += ' dim';
  const cardCls = (id) => (t && t.by === 'card' && ((t.owner === p && t.valid.has(id)) || t.give === id) ? 'pick' : ''); // 换牌第二步：要交出的那张还亮着
  const k = COLOR(set.color);
  const boost = V().players[p].boost;
  const boosted = !!(boost && set.full && boost.colors.includes(set.color));
  if (boosted) cls += ' boost';
  const near = !set.full && set.cards.length === set.size - 1;
  if (set.mortgage) cls += ' mortgaged';
  const label = set.mortgage ? '抵押中' : set.full ? `<b>${set.rent}M</b>${boosted ? `<span class="x4">${multHTML(boost.mult)}</span>` : ''}` : near ? `差1<span class="na">→${k.rent[set.size - 1]}M</span>` : `${set.cards.length}/${set.size}`; // 弧形里每组很窄：说明要短（叠起来时只留「差1」）
  const tg = S.target;
  const can = tg && (tg.by === 'set' ? tg.valid.has(set.id) && tg.owner === p : tg.owner === p && ids.some((id) => tg.valid.has(id)));
  const aria = `${tg ? (can ? '可以选：' : '不能选：') : ''}${p === me() ? '我的' : '对方的'}${k.zh}，${set.cards.length}/${set.size}${set.full ? `，已成套，租金 ${set.rent}M` : near ? '，差 1 张成套' : ''}${set.mortgage ? '，抵押中（收不了租、不算胜利套数）' : ''}${boosted ? `，下次收租 ×${boost.mult}` : ''}`;
  return `<button type="button" class="${cls}" data-do="set" data-set="${set.id}" data-p="${p}" data-color="${set.color}" style="--n:${ids.length};--c:${k.hex};--ct:${inkOn(k.hex)}" aria-label="${esc(aria)}">
    <span class="stack">${ids.map((id, i) => cardHTML(id, { cls: cardCls(id), color: set.color, style: `--i:${i}` })).join('')}</span>${set.mortgage ? '<span class="lockmark">抵押</span>' : ''}
    <span class="cap${near && !set.mortgage ? ' near' : ''}">${label}</span></button>`;
}

function tableHTML(p) {
  const P = V().players[p];
  const sets = P.sets.map((s) => setHTML(s, p)).join('');
  const loose = P.loose.length ? `<button type="button" class="set${S.target ? ' dim' : ''}" data-do="set" data-set="loose" data-p="${p}" style="--n:${P.loose.length};--c:transparent" aria-label="散落的建筑"><span class="stack">${P.loose.map((id, i) => cardHTML(id, { style: `--i:${i}` })).join('')}</span><span class="cap">散落建筑</span></button>` : '';
  return `<div class="arow" data-key="t${p}">${bankHTML(p)}${sets}${loose}</div>`; // 银行是各自地产区这一排的第一项
}

// 电力：一条进度条（满格 = 上限，每一点之间一道分隔，半格也看得出），不用闪电 / 筹码图标。旧后端没有电力字段就不显示
const powerBarHTML = (power, cap, big) => `<span class="pwbar${big ? ' big' : ''}" style="--n:${cap}" aria-hidden="true">${Array.from({ length: cap }, (_, k) => `<b><i style="width:${(Math.max(0, Math.min(1, power / 2 - k)) * 100).toFixed(0)}%"></i></b>`).join('')}</span>`; // 一点一格：每格各自描边，按半点填（满格加成时整条发光）
const pctText = (p) => (p == null || p === 50 ? '一半' : `${p}%`);
// 快要触发了（目标梯度：离目标越近越想冲）：捉鬼套装、贪婪大亨、筹码满格，各自还差多少。只提示门槛，不碰几率
function nearGoals(p) {
  const v = V();
  const P = v.players[p];
  const r = v.rules;
  const out = [];
  if (r.ghostKit && P.haul != null && P.haul > 0 && P.ghostBar - P.haul < 3) out.push({ key: `g${P.ghostN}`, text: `捉鬼套装：再让对方失去 ${P.ghostBar - P.haul + 1}M 就开老虎机` });
  if (r.tycoon && P.grab != null && !v.tycoon && P.grab > 0 && r.tycoonAt - P.grab < 4) out.push({ key: 't', text: `贪婪大亨：再拿对方 ${r.tycoonAt - P.grab + 1}M 地产就触发` });
  if (r.power && P.power != null && !P.surge && P.power === r.powerCap * 2 - 1) out.push({ key: 'p', text: `再失去 ${r.insuranceStep - P.lost}M 筹码就满，收租 ×${r.surgeMult}` });
  const tk = v.takeover;
  if (tk && tk.player == null && P.sets.some((x) => x.color === tk.color && x.cards.length === x.size - 1)) out.push({ key: 'k', text: `再凑一张${COLOR(tk.color).zh}就触发恶意收购` });
  return out;
}
function powerHTML(p) {
  const v = V();
  const P = v.players[p];
  const r = v.rules;
  if (P.power == null || (!r.power && !r.ghostKit && !r.tycoon)) return '';
  const icons = r.power ? powerBarHTML(P.power, r.powerCap) : '';
  const mult = r.power ? `<span class="pwx${P.surge ? ' on' : ''}">×${P.surge ? r.surgeMult : 1}</span>` : ''; // 现在收租的倍率：满格加成中是 ×surgeMult，平时 ×1
  const ghost = P.curse > 0 ? `<span class="gk">${artOK('ghost') ? `<img src="${artUrl('ghost')}" alt="" decoding="sync" draggable="false" data-art="ghost">` : ''}1M×${P.curse}</span>` : '';
  const ty = v.tycoon && v.tycoon.player === p && v.tycoon.mode === 'vampire' ? '<span class="vb">吸血</span>' : '';
  if (!icons && !ghost && !ty && !r.tycoon) return '';
  const label = [r.power ? `筹码 ${P.power / 2} / ${r.powerCap}` : '', P.surge ? `满格加成中，收租 ×${r.surgeMult}` : '', P.curse > 0 ? `捉鬼套装：下回合开始摸的 ${P.curse} 张都是 1M` : ''].filter(Boolean).join('，');
  const label2 = [label, ty ? '贪婪大亨：吸血中' : ''].filter(Boolean).join('，') || '状态';
  return `<button type="button" class="pw${P.surge ? ' on' : ''}${nearGoals(p).length ? ' near' : ''}" data-do="power" data-p="${p}" aria-label="${p === me() ? '我的' : '对方的'}${esc(label2)}。点开看说明"><span class="pwcap">${icons || (r.tycoon && !ty && !ghost ? '<span class="vb" style="background:var(--mist);color:var(--ink-2)">大亨</span>' : '')}${ghost}${ty}</span>${mult}</button>`;
}

// 自动理牌：地产按颜色（和桌上颜色顺序一致）→ 多功能地产 → 租金 → 行动牌（越狠越靠前）→ 钱（大到小）。
// 同一类挨在一起，找牌不用翻；新摸的牌直接飞进它该在的位置
const ACTION_ORDER = ['dealBreaker', 'hugeWin', 'liquidation', 'bankruptcy', 'justSayNo', 'slyDeal', 'forcedDeal', 'debtCollector', 'birthday', 'doubleRent', 'house', 'hotel', 'passGo'];
function sortHand(ids) {
  const ci = (k) => S.meta.colorKeys.indexOf(k);
  const key = (id) => {
    const c = CARD(id);
    if (c.type === 'property') return [0, ci(c.color), id];
    if (c.type === 'wild') return [1, c.any ? 99 : ci(c.colors[0]), id];
    if (c.type === 'rent') return [2, c.any ? 99 : ci(c.colors[0]), id];
    if (c.type === 'action') { const k = ACTION_ORDER.indexOf(c.action); return [3, k < 0 ? 50 : k, id]; }
    return [4, -c.value, id];
  };
  return ids.slice().sort((a, b) => { const x = key(a); const y = key(b); return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; });
}

// 收益预期：一张收钱的牌最多能收多少（按最贵的颜色、叠满租金翻倍；能赌一把就按 ×4 算"最高"）。只看自己手里的牌
function gainOfPlay(p) {
  if (!p) return 0;
  const hv = (x) => (p.half ? Math.ceil(x / 2) : x);
  if (p.kind === 'rent') return hv(Math.max(0, ...p.colors.map((x) => x.amount)) * Math.pow(2, p.maxDoubles || 0));
  if (p.kind === 'debtCollector' || p.kind === 'birthday' || p.kind === 'bankruptcy') return hv(p.amount || 0);
  return 0;
}
const bestGain = (p) => gainOfPlay(p) * (p && p.bets && p.bets.length ? Math.max(...p.bets) : 1);
// 这回合最多能收多少：出牌次数以内挑最贵的几张收钱牌，其中一张押满
function turnPotential() {
  const o = O();
  const plays = (o.hand || []).map((h) => h.play).filter((p) => gainOfPlay(p) > 0).sort((a, b) => gainOfPlay(b) - gainOfPlay(a)).slice(0, Math.max(1, o.playsLeft || 0));
  if (!plays.length) return 0;
  return plays.reduce((t, p) => t + gainOfPlay(p), 0) + (bestGain(plays[0]) - gainOfPlay(plays[0]));
}
function handHTML() {
  const v = V();
  const raw = v.players[me()].hand || [];
  const hand = S.autoSort ? sortHand(raw) : raw;
  const cnt = ''; // 张数、筹码在中间那一排（sideHTML）
  const box = `<div class="handbox" style="--hpad:${S.handPad || 24}px">`;
  if (!hand.length) return `${box}${ARC_SVG}${cnt}<div class="hand" data-key="hand"></div></div>`; // 空着就空着：不放提示字（张数角标的读屏文字里有「0 张」）
  const o = O();
  const t = S.target;
  const myMain = o.canEndTurn && o.playsLeft > 0;
  return `${box}${ARC_SVG}${cnt}<div class="hand" data-key="hand">${hand.map((id) => {
    const h = o.hand.find((x) => x.cardId === id);
    let cls = (S.sel === id ? 'sel ' : '') + (myMain && !(h && (h.play || h.bank)) ? 'muted' : '');
    if (t) cls = 'dim';
    const g = myMain && h && h.play ? bestGain(h.play) : 0;
    const inner = g ? `<span class="gain"><i>${h.play.bets && h.play.bets.length ? '最高' : '收'} </i>${g}M</span>` : ''; // 扇形挤时 <i> 收起来，只留数字
    const c = CARD(id);
    const label = `${c.zh}${c.type !== 'money' && c.value ? `，${c.value}M` : ''}${g ? `，${h.play.bets && h.play.bets.length ? '最高' : ''}收 ${g}M` : ''}${cls.includes('muted') ? '，现在打不出' : ''}`; // 读屏：名字之外还有面值、能收多少、现在能不能出
    return cardHTML(id, { btn: true, cls, data: ' data-do="hand"', inner, label });
  }).join('')}</div></div>`; // 手牌张数在中间那一排右边（sideHTML）
}

/* ── 回合台：轮到谁、还能出几张（格子），最下面一行放临时提示 / 连接状态 / 必要的补充 ── */
function stageSub() {
  const v = V();
  if (v.phase !== 'play' || v.turn.player === me()) return '';
  const o = opp();
  if (S.info && S.info.players[o] && !S.info.players[o].online) return '对方离线，等对方回来';
  if (S.clock) return ''; // 有倒计时就不用再显示"思考中"
  const sec = Math.floor((Date.now() - (S.turnAt || Date.now())) / 1000);
  return sec >= 15 ? `思考中 ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}` : '';
}

// 最下面那一行：临时提示 > 连接状态 > 发送慢 > 这个阶段本身的补充说明
function stageLine(s) {
  if (dragHint.text) return { text: dragHint.text, tone: 'ok' }; // 提示（S.note）在 toastNow 里：顶部信息条先显示提示，没有提示才显示这一行
  if (!S.wsOpen) return { text: S.net === 'offline' ? '网络断开，连上后自动恢复' : S.retry > 3 ? '连接不上，正在重试' : S.everOpen ? '正在重新连接…' : '正在连接…', tone: 'warn' };
  if (S.pending && Date.now() - S.pending.t0 > 2500) return { text: '网络慢，发送中…', tone: 'warn' };
  return { text: s.cap || s.title, tone: 'base' }; // 平时显示这个阶段本身：轮到谁、要做什么
}

function stageInfo() {
  const v = V();
  const i = me();
  const o = opp();
  const P = v.players;
  if (v.phase === 'gameOver') {
    const w = v.result.winner;
    return { key: 'over', mode: w === i ? 'win' : 'opp', title: w == null ? '平局' : w === i ? '你赢了' : `${P[o].name} 赢了`, sub: `${v.result.stake > 1 ? `×${v.result.stake} · ` : ''}共 ${v.result.turn} 回合 · 点这里看结果`, cap: `${w == null ? '平局' : w === i ? '你赢了' : `${P[o].name} 赢了`} · 点这里看结果`, tap: 'open-over' };
  }
  if (S.target) return { key: 'target', mode: 'me', title: '选择目标', sub: S.target.prompt, cap: S.target.prompt };
  if (v.phase === 'respond' && v.pending.action === 'auction') {
    const pd = v.pending;
    const bid = pd.bids[i] != null;
    return { key: `a${pd.id}.${bid}`, mode: bid ? 'opp' : 'alert', title: bid ? `等 ${P[o].name} 出价` : '秘密竞价：出价', sub: `${COLOR(pd.color).zh}套的暗标竞价`, cap: bid ? `已出价，等 ${P[o].name}` : `秘密竞价 · ${COLOR(pd.color).zh}` };
  }
  if (v.phase === 'respond' && v.pending.action === 'tycoon') {
    const mine = v.pending.awaiting === i;
    return { key: `ty${v.pending.id}`, mode: mine ? 'alert' : 'opp', title: mine ? '贪婪大亨：吸血还是套现' : `${P[o].name} 触发了贪婪大亨`, sub: mine ? '二选一，每局一次' : '对方在选吸血或套现', cap: mine ? '贪婪大亨：吸血还是套现？' : `等 ${P[o].name} 选择` };
  }
  if (v.phase === 'respond' && v.pending.action === 'sale') {
    const pd = v.pending;
    const lead = pd.leader;
    const what = lead == null ? '起拍 0M，等出价' : `${lead === i ? '你' : P[o].name} 出价 ${pd.amount}M`;
    return { key: `sl${pd.id}.${pd.step}`, mode: lead === i ? 'me' : 'alert', title: `拍卖：${COLOR(pd.color).zh}地产`, sub: what, cap: `拍卖 · ${what}`, tap: 'open-sale', hint: '点开拍卖面板出价' };
  }
  if (v.phase === 'respond' && v.pending.action === 'takeover') {
    const pd = v.pending;
    const mine = pd.awaiting === i;
    return { key: `tk${pd.id}.${pd.step}`, mode: mine ? 'alert' : 'opp', title: mine ? '轮盘赌：轮到你' : `${P[pd.awaiting].name} 在玩轮盘赌`, sub: `恶意收购 · ${COLOR(pd.color).zh}`, cap: mine ? '轮到你玩轮盘赌' : `${P[pd.awaiting].name} 在玩轮盘赌`, tap: 'rl-open' };
  }
  if (v.phase === 'respond' && v.pending.action === 'gift') {
    const mine = v.pending.awaiting === i;
    return { key: `g${v.pending.id}`, mode: mine ? 'alert' : 'opp', title: mine ? '赌场礼赠：打开或送出' : `${P[o].name} 的赌场礼赠`, sub: mine ? '自己打开或送给对方' : '对方在选打开或送你', cap: mine ? '赌场礼赠：打开还是送出？' : `等 ${P[o].name} 处理礼赠` };
  }
  if (v.phase === 'respond') {
    const pd = v.pending;
    const mine = pd.awaiting === i;
    const what = pd.action === 'raise' ? `${P[pd.actor].name} 要求加注到 ×${pd.stake}` : `${actionName(pd)}${pd.amount ? ` ${pd.amount}M` : ''}${pd.bet > 1 ? ` · 赌赢 ×${pd.bet}` : ''}`;
    return { key: `r${pd.id}.${pd.chain.length}`, mode: mine ? 'alert' : 'opp', title: mine ? '轮到你回应' : `等 ${P[o].name} 回应`, sub: pd.chain.length ? `${what} · 反对 ×${pd.chain.length}` : what };
  }
  if (v.phase === 'discard') {
    const mine = v.turn.player === i;
    return { key: `d${v.turn.number}`, mode: mine ? 'alert' : 'opp', title: mine ? '手牌太多了' : `${P[o].name} 在弃牌`, sub: `要弃掉 ${v.discardNeed} 张`, cap: mine ? `手牌太多，弃掉 ${v.discardNeed} 张` : `${P[o].name} 在弃牌` };
  }
  const mine = v.turn.player === i;
  const max = v.turn.max || v.rules.playsPerTurn;
  const bonus = max > v.rules.playsPerTurn;
  const sub = stageSub() || (bonus ? `背水一战：可出 ${max} 张` : '');
  const title = mine ? '你的回合' : `${P[o].name} 的回合`;
  return { key: `t${v.turn.number}`, mode: mine ? 'me' : 'opp', title, pips: Array.from({ length: max }, (_, k) => k < v.turn.playsLeft), base: v.rules.playsPerTurn, lapsed: v.turn.lapsed || 0, sub, cap: stageSub() || (bonus && mine ? `背水一战 · 能出 ${max} 张` : mine ? `${title} · 还能出 ${v.turn.playsLeft} 张` : title) };
}

// 仪表：270° 的圆弧，缺口朝下。路径从右下角逆时针画到左下角，stroke-dashoffset = 已经过去的比例，
// 剩下的那段就停在右下角、前端顺时针往前走，像钟表的指针扫过去
const GAUGE_ARC = 'M 78.28 78.28 A 40 40 0 1 0 21.72 78.28';
const saleCanBid = () => !!(O().respond && O().respond.action === 'sale' && O().respond.canBid);
// 拍卖开拍时两边都能出价：倒计时指向能出价的自己，不指向挂着"等谁"的回合方
const actorSeat = () => (!S.clock ? V().activePlayer : S.clock.kind === 'sale' ? (saleCanBid() ? me() : opp()) : S.clock.seat);
function gaugeHTML(s, c) {
  const v = V();
  const over = v.phase === 'gameOver';
  const left = clockLeft(c);
  const e = c ? 1 - left / c.total : 0;
  let face;
  if (over) {
    const w = v.result.winner;
    face = `<span class="g-num"><b>${w == null ? '平' : w === me() ? '胜' : '负'}</b></span>`;
  } else {
    face = `<span class="g-num"><b id="g-sec">${c ? Math.ceil(left / 1000) : ''}</b>${c ? '<small>s</small>' : ''}</span>`;
  }
  const cls = over ? ` over${v.result.winner === me() ? ' win' : ''}` : !c ? ' noclock' : left <= 5000 ? ' hurry' : '';
  return `<span class="gauge${cls}" aria-hidden="true"><svg class="g-svg" viewBox="0 0 100 100"><path class="g-track" d="${GAUGE_ARC}"/><path class="g-fill" d="${GAUGE_ARC}" pathLength="100" style="stroke-dashoffset:${(e * 100).toFixed(2)}"/></svg>${face}<span class="g-arrow" data-dir="${actorSeat() === me() ? 'down' : 'up'}">${ICON.arrow}</span>${s.pips ? gaugeDots(s) : ''}</span>`;
}
// 出牌次数的点：沿着圆弧缺口往下排成一道弧（中间那颗最低），点多了（背水一战）间距收一点
function gaugeDots(s) {
  const n = s.pips.length;
  const sp = n <= 3 ? 24 : n === 4 ? 20 : 17;
  const used = n - s.pips.filter(Boolean).length;
  return s.pips.map((on, k) => {
    const a = (90 - (k - (n - 1) / 2) * sp) * Math.PI / 180; // 角度越大越靠左：第 0 颗在最左边
    const lapsed = !on && k >= n - Math.min(used, s.lapsed || 0); // 超时作废的排在最右边
    const next = k === n - used - 1; // 最右边那颗亮着的：下一次出牌用掉的就是它（对方回合时它在呼吸）
    return `<i class="g-dot${on ? ' on' : ''}${next ? ' next' : ''}${k >= s.base ? ' bonus' : ''}${lapsed ? ' lapsed' : ''}" style="left:${(50 + 45 * Math.cos(a)).toFixed(1)}%;top:${(50 + 45 * Math.sin(a)).toFixed(1)}%"></i>`;
  }).join('');
}
// 手里已经没有能出的牌（出空了，或者次数用完又没开自动结束）：停一下给「结束回合」扫一道光，每回合一次——下一下该点哪里一眼就知道，不加字
let endNudgeTimer = 0;
function nudgeEnd() {
  clearTimeout(endNudgeTimer);

// 手牌：像握在手里一样，所有牌绕下方同一个圆心排成一段圆弧——越往两边转得越多、也沉得越低。
// 最外侧那张转 A 度：2 张 ±6°，之后每多一张 +5.5°，最多 ±22°。出牌区左右铺满屏幕，最外侧那张（连转出去的牌角）最多伸出屏幕两成。
// 底边每张露出不到 34px（扇形越往上张得越开，顶上露得更多）就一度一度收小扇形；
// 收到 ±6° 还放不下，才叠起来横向滑（每张露出 44px，不转）
const FAN = { max: 22, per: 5.5, min: 6, step: 34, out: 0.2 };
function fanFor(n, hw, hh, cw, pad, hardL, hardR) {
  const rad = Math.PI / 180;

  const swing = (A) => hh * Math.sin(A * rad) - hw / 2 * (1 - Math.cos(A * rad));
  for (let A = Math.min(FAN.max, Math.max(FAN.min, FAN.per * (n - 1))); A >= FAN.min; A -= 1) {

    const step = Math.min(hw + 8, (room - hw) / (n - 1));
    const corner = hw / 2 * Math.sin(A * rad);   // 转了角，外侧的下角往下沉多少
    if (step < FAN.step || corner > pad - 6) continue;
    const th = 2 * A / (n - 1);                  // 相邻两张差几度
    const R = step / (th * rad);                 // 圆弧半径：相邻两张的底边中点相隔 step、夹角 th
    const dip = R * (1 - Math.cos(A * rad));     // 沿圆弧，最外侧那张比中间低多少
    return { step, th, R, k: Math.min(1, (pad - 2 - corner) / dip), lean: swing(A) }; // 牌距大时圆弧会沉到底边外面：竖直方向压扁一点；lean：最外那张的牌角甩出去多少

    const bh = rows.reduce((h, el) => h + el.offsetHeight, 0) + gy * (rows.length - 1);
    const inner = cx + side * (D / 2 + 12);
    const sc = Math.min(1, Math.abs((side < 0 ? xl : xr) - inner) / bw);
    const outer = inner + side * bw * sc;
    let y = yc - (bh * sc) / 2;
    rows.forEach((el) => {
      el.style.transformOrigin = '0 0';
      el.style.scale = sc < 1 ? sc.toFixed(3) : '';
      el.style.left = (side < 0 ? outer : outer - el.offsetWidth * sc).toFixed(1) + 'px';
      el.style.top = y.toFixed(1) + 'px';
      y += (el.offsetHeight + gy) * sc;
    });
  });
  return grew;
}
// 出牌区的圆环：外弧和自己地产区的内弧同一个圆心（两条弧平行，中间留 10px），内弧按出牌区自己的高度
function drawHandArc(mine) {
  const hb = $('#screen .handbox');
  const svg = hb && $(':scope > .arc', hb);
  if (!svg || !hb.clientWidth) return;
  const W = hb.clientWidth;
  const H = hb.clientHeight;
  const g = arcGeom(W, H);
  let ox = g.cx;
  let oy = g.cy;
  let Ro = g.R1;
  if (mine) {
    const r = hb.getBoundingClientRect();
    ox = mine.g.cx + mine.r.left - r.left;
    oy = mine.g.cy + mine.r.top - r.top;
    Ro = mine.g.R2 - 10;
  }
  const E = 48;
  const y = (cx, cy, R, x) => cy - Math.sqrt(Math.max(0, R * R - (x - cx) ** 2));
  const P = (x, yy) => `${x.toFixed(1)},${yy.toFixed(1)}`;
  const si = safeInsets(); // 手牌只排到安全区边上，圆环（装饰）照样画到屏幕边
  const xl = -E - si.l;
  const xr = W + E + si.r;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.firstChild.setAttribute('d', `M${P(xl, y(ox, oy, Ro, xl))} A${Ro.toFixed(1)},${Ro.toFixed(1)} 0 0 1 ${P(xr, y(ox, oy, Ro, xr))} L${P(xr, y(g.cx, g.cy, g.R2, xr))} A${g.R2.toFixed(1)},${g.R2.toFixed(1)} 0 0 0 ${P(xl, y(g.cx, g.cy, g.R2, xl))} Z`);
  // 出牌区上面留的高度（--hpad）：给选中抬起的牌留 24px（手牌张数、筹码都在中间那一排了）
  const bottom = 0;
  const want = Math.max(24, Math.ceil(bottom + 4));
  if (Math.abs(want - (S.handPad || 24)) > 2 && !drawHandArc.again) {
    S.handPad = want;
    hb.style.setProperty('--hpad', want + 'px');
    drawHandArc.again = true;
    try { layoutHand(); layoutArcs(); } finally { drawHandArc.again = false; }
  }
}
// 选中 / 取消选中手牌：整页重绘会直接换成新位置，这里补一段"抬起 / 放下"的过渡
function selFx() {
  const was = S.lastSel;
  S.lastSel = S.sel;
  if (was === S.sel || !motionOK()) return;
  const pose = (el, up) => {
    const r = parseFloat(el.style.getPropertyValue('--r')) || 0;
    const y = parseFloat(el.style.getPropertyValue('--y')) || 0;
    return up ? `translateY(${y - 18}px) rotate(0deg) scale(1.03)` : `translateY(${y}px) rotate(${r}deg)`;
  };
  const on = S.sel != null && cardNode(S.sel);
  if (on && on.closest('.hand')) on.animate([{ transform: pose(on, false) }, { transform: pose(on, true) }], SPR.lift);
  const off = was != null && cardNode(was);
  if (off && off.closest('.hand')) off.animate([{ transform: pose(off, true) }, { transform: pose(off, false) }], { duration: 200, easing: EASE_OUT });
}

/* ═══════════ 底部面板 ═══════════ */
// 重绘时按稳定的操作属性找回焦点，避免按钮、选牌和输入光标被 innerHTML 更新打断。
function saveUIFocus(scope) {
  const el = document.activeElement;
  if (!el || !scope.contains(el) || el === document.body) return null;
  const key = ['id', 'data-do', 'data-v', 'data-card', 'data-set', 'data-p', 'data-a']
    .filter((name) => el.hasAttribute(name)).map((name) => [name, el.getAttribute(name)]);
  return { el, key, section: (el.closest('[data-key]') || {}).dataset?.key, start: el.selectionStart, end: el.selectionEnd, direction: el.selectionDirection };
}
function restoreUIFocus(saved, scope) {
  if (!saved) return false;
  let el = saved.el.isConnected && scope.contains(saved.el) ? saved.el : null;
  if (!el && saved.key.length) el = $$('button, input, select, textarea, a[href], [tabindex]', scope)
    .find((node) => saved.key.every(([name, value]) => node.getAttribute(name) === value) && (node.closest('[data-key]') || {}).dataset?.key === saved.section);
  if (!el || el.disabled || el.closest('[inert], [hidden]') || !el.getClientRects().length) return false;
  if (document.activeElement !== el) el.focus({ preventScroll: true });
  if (el.setSelectionRange && saved.start != null) el.setSelectionRange(saved.start, saved.end, saved.direction);
  return document.activeElement === el;
}
function activeDialog() {
  if (S.sheet && $('#sheet-root').getAttribute('aria-hidden') === 'false') return $('.sheet');
  return RL.el && !RL.el.hidden ? RL.el : null;
}
function syncDialogState() {
  const sheet = !!(S.sheet && $('#sheet-root').getAttribute('aria-hidden') === 'false');
  $('#sheet-root').inert = !sheet;
  $('#screen').inert = !!activeDialog();
  if (RL.el) RL.el.inert = sheet || RL.el.hidden;
  if (RL.pill) RL.pill.inert = !!activeDialog();
}
function focusDialog() {
  const dialog = activeDialog();
  if (dialog && (!dialog.contains(document.activeElement) || document.activeElement.closest('[inert], [hidden]'))) dialog.focus({ preventScroll: true });
}
function openSheet(sheet) {
  closeEmotes();
  closeDrawer();
  sheet.returnFocus = S.sheet ? S.sheet.returnFocus : saveUIFocus(document);
  S.sheet = sheet;
  renderSheet();
  requestAnimationFrame(focusDialog);
}

function closeSheet() {
  if (!S.sheet) return;
  const back = S.sheet.returnFocus;
  S.sheet = null;
  renderSheet();
  if (restoreUIFocus(back, document)) return;
  if (activeDialog()) { focusDialog(); return; }
  const t = back && S.screen === 'game' && ($('#screen .dock .main:not([disabled])') || $('#screen .hand .card')); // 自己弹出来的面板（回应、弃牌）关掉后焦点没处落：落到主按钮上
  if (t) t.focus({ preventScroll: true });
}

let sheetToken = 0;
// 只有偶尔才出现的面板（被收钱、弃牌、结算、规则）内容依次弹出；点牌、点地产组、菜单这种一局里点几十次的面板直接出内容，不让按钮晚到
const STAGGER_SHEETS = new Set(['respond', 'discard', 'over', 'rules']);
let lastSheetType = '';
let lastSheetHtml = '';
let staggerTimer = 0;
function renderSheet() {
  const root = $('#sheet-root');
  const box = $('.sheet', root);
  const returnFocus = S.sheet && S.sheet.returnFocus;
  let html = '';
  if (S.sheet && S.meta) {
    try { html = SHEETS[S.sheet.type](S.sheet); } catch (e) { console.error(e); html = ''; }
  }
  if (!html) {
    const focused = box.contains(document.activeElement);
    if (S.sheet) S.sheet = null;
    sheetToken++; // 作废还没执行的"打开"动画，避免面板关掉后又被打开、挡住整个页面
    lastSheetHtml = '';
    root.classList.remove('open');
    root.setAttribute('aria-hidden', 'true');
    syncDialogState();
    if (focused && !restoreUIFocus(returnFocus, document)) focusDialog();
    return;
  }
  const opening = !root.classList.contains('open') || S.sheet.type !== lastSheetType;
  lastSheetType = S.sheet.type;
  // 内容没变就不动 DOM（对方每次动作都会触发重绘，看记录、选牌付款时面板不该跳回顶部或闪一下）
  if (opening || html !== lastSheetHtml) {
    const top = opening ? 0 : ($('.sbody', box) || {}).scrollTop || 0;
    const imgs = opening ? new Map() : collectImgs(box);
    const focus = opening ? null : saveUIFocus(box);
    box.innerHTML = '<div class="grab" aria-hidden="true"></div><button type="button" class="sr" data-do="close-sheet">关闭</button><div class="sbody">' + html + '</div>';
    const acts = $('.sbody > .acts', box);
    if (acts) box.appendChild(acts); // 按钮固定在面板底部，内容再长也看得到
    reuseImgs(box, imgs);
    if (top) $('.sbody', box).scrollTop = top;
    lastSheetHtml = html;
    stickers.sweep(); // 面板换了内容：原来那些还在播的表情停掉
    if (S.sheet.type === 'chat') chatFill(); // 聊天面板只有骨架，重画后把消息、表情包面板填回去
    if (S.sheet.type === 'check') stickers.mount(box); // 表情包清单里会动的表情
    const title = $('h3', box);
    if (title) { title.id = 'sheet-title'; box.setAttribute('aria-labelledby', title.id); box.removeAttribute('aria-label'); }
    else { box.removeAttribute('aria-labelledby'); box.setAttribute('aria-label', '卡牌详情'); }
    if (focus && !restoreUIFocus(focus, box)) box.focus({ preventScroll: true });
  }
  // 刚打开（或换成另一种面板）时内容依次弹出来；面板里点选、刷新时不再重播
  if (opening && motionOK() && STAGGER_SHEETS.has(S.sheet.type)) {
    box.classList.add('stagger');
    clearTimeout(staggerTimer);
    staggerTimer = setTimeout(() => box.classList.remove('stagger'), 900);
  } else if (!opening) {
    box.classList.remove('stagger');
  }
  root.setAttribute('aria-hidden', 'false');
  syncDialogState();
  const token = ++sheetToken;
  requestAnimationFrame(() => { if (token === sheetToken && S.sheet) root.classList.add('open'); });
}

// 面板：按住顶部把手往下拖可以关闭；拖得不够远就弹回去
(() => {
  const root = $('#sheet-root');
  const box = $('.sheet', root);
  let y0 = 0;
  let dy = 0;
  let t0 = 0;
  let dragging = false;
  let hist = [];
  let resetTimer = 0;
  box.addEventListener('pointerdown', (e) => {
    if (dragging || !e.target.closest('.grab') || !S.sheet) return; // 拖动中再按下的手指不算，避免面板跳位
    dragging = true;
    y0 = e.clientY;
    dy = 0;
    t0 = performance.now();
    hist = [{ y: 0, t: t0 }];
    box.setPointerCapture(e.pointerId);
    clearTimeout(resetTimer);
    box.style.transition = 'none';
  });
  box.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const raw = e.clientY - y0;
    // 往下 1:1 跟手；往上拉越拉越沉（橡皮筋），不是撞上一堵墙
    dy = raw >= 0 ? raw : -((-raw * 48) / (48 + -raw * 0.55)) * 0.55;
    box.style.transform = `translate(-50%, ${dy}px)`;
    const now = performance.now();
    hist.push({ y: dy, t: now });
    while (hist.length > 2 && now - hist[0].t > 90) hist.shift(); // 只看最近 90ms，算松手那一刻的速度
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    const now = performance.now();
    const h0 = hist[0];
    const v = h0 && now - h0.t > 0 ? (dy - h0.y) / (now - h0.t) : 0; // px/ms，往下为正
    const fast = v > 0.11 || dy / Math.max(1, now - t0) > 0.11; // 轻轻一甩就能关，不必拖过某条线
    const later = (ms) => { resetTimer = setTimeout(() => { box.style.transition = ''; }, ms + 40); };
    if (dy > box.offsetHeight * 0.25 || (fast && dy > 16)) {
      // 接着手指的速度滑下去：曲线起步斜率是 3，时长按"剩下的距离 ÷ 速度"算，拖和滑之间没有断层
      const left = box.offsetHeight * 1.1 - dy;
      const ms = Math.round(Math.max(180, Math.min(420, (3 * left) / Math.max(v, 0.6))));
      box.style.transition = motionOK() ? `transform ${ms}ms cubic-bezier(.25, .75, .35, 1)` : '';
      closeSheet();
      if (S.sel != null) { S.sel = null; render(); }
      requestAnimationFrame(() => { box.style.transform = ''; }); // 从手指位置继续滑下去
      later(ms);
    } else {
      // 没拖够：用弹簧弹回去（被往上拉过的，橡皮筋松开也走同一条弹簧）
      box.style.transition = motionOK() ? `transform ${SPR.sheet.duration}ms ${SPR.sheet.easing}` : '';
      box.style.transform = '';
      later(SPR.sheet.duration);
    }
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
})();

const btn = (label, a, cls) => `<button class="btn ${cls || 'primary'}" data-do="act" data-a="${attr(a)}">${esc(label)}</button>`;
const btnH = (html, a, cls) => `<button class="btn ${cls || 'primary'}" data-do="act" data-a="${attr(a)}"><span>${html}</span></button>`; // 文字里带倍率图（html 已经转义好）：包一层，按钮的 flex 间距不插进图和字中间
const btnRich = (label, note, a, cls) => `<button class="btn ${cls || 'primary'}" data-do="act" data-a="${attr(a)}">${esc(label)}<small>${esc(note)}</small></button>`; // 两行：标题 + 一行说明
const btnDo = (label, d, cls, extra) => `<button class="btn ${cls || 'plain'}" data-do="${d}"${extra || ''}>${esc(label)}</button>`;

// 回应 / 弃牌限时：面板盖住了中间的倒计时，在面板底部按钮上面再放一条（时间到服务器会按建议自动处理）
function sheetClockHTML(what) {
  const c = S.clock;
  if (!c || c.seat !== me() || (c.kind !== 'respond' && c.kind !== 'discard') || !c.total) return '';
  const left = clockLeft(c);
  return `<div class="sale-timer sh-clock${left <= 5000 ? ' hot' : ''}"><span class="bar"><i id="sh-bar" style="transform:scaleX(${Math.min(1, left / c.total).toFixed(3)})"></i></span><span class="left" id="sh-left" data-what="${what}">${Math.ceil(left / 1000)} 秒后${what}</span></div>`;
}
const SHEETS = {
  // 聊天：这里只出骨架（内容不随消息变，输入框里打到一半的字不会被重绘冲掉），消息列表由 chat.paint() 直接填
  chat() {
    if (!S.snap) return '';
    return `<div class="chathead"><h3>和 ${esc(nameOf(opp()))} 聊天</h3><button class="link" data-do="chat-mute" aria-pressed="${chat.mute}">${chat.mute ? '取消屏蔽' : '屏蔽对方'}</button></div>
      <div id="chatlist" class="chatlist" role="log" aria-live="polite" aria-label="聊天记录"></div>
      <div id="stkpanel" class="stkpanel" hidden></div>
      <div class="acts chatbar"><input id="chatin" maxlength="120" placeholder="说点什么…" enterkeyhint="send" autocomplete="off" aria-label="聊天内容"><button class="btn primary" data-do="chat-send">发送</button></div>`;
  },
  // 点手牌：能做什么
  hand(sh) {
    const v = V();
    const hand = v.players[me()].hand || [];
    if (!hand.includes(sh.cardId)) return '';
    const c = CARD(sh.cardId);
    const h = O().hand.find((x) => x.cardId === sh.cardId);
    const myTurn = O().canEndTurn;
    const acts = [];
    let extra = '';
    const p = h && h.play;
    if (p) {
      switch (p.kind) {
        case 'property': {
          if (p.colors.length < 2) { p.colors.forEach((k) => acts.push(btn('打出地产', { type: 'PLAY_PROPERTY', cardId: c.id, color: k.color }))); break; }
          // 多色地产：两列色块，颜色本身就是标签，一眼找到；打出去正好凑满一套的颜色描一圈金边（会进最满的那组，见后端 placeCard）
          const mySets = v.players[me()].sets;
          const fills = (k) => (k.setIds || []).some((id) => { const st = mySets.find((x) => x.id === id); return !!st && st.cards.length === st.size - 1; });
          acts.push(`<div class="cpicks">${p.colors.map((k) => { const K = COLOR(k.color); return `<button class="btn cpick${fills(k) ? ' done' : ''}" data-do="act" data-a="${attr({ type: 'PLAY_PROPERTY', cardId: c.id, color: k.color })}" style="--c:${K.hex}" aria-label="当作${esc(K.zh)}打出"><i></i>${esc(K.zh)}</button>`; }).join('')}</div>`);
          break;
        }
        case 'rent': {
          const color = sh.color && p.colors.some((x) => x.color === sh.color) ? sh.color : p.colors.reduce((a, b) => (b.amount > a.amount ? b : a)).color;
          const base = p.colors.find((x) => x.color === color).amount;
          const d = Math.min(sh.doubles || 0, p.maxDoubles);
          extra = `<div class="group">按哪种颜色收</div><div class="chips" role="radiogroup">${p.colors.map((k) => `<button class="chip" role="radio" aria-checked="${k.color === color}" data-do="rent-color" data-v="${k.color}"><i style="background:${COLOR(k.color).hex}"></i>${COLOR(k.color).zh} ${k.amount}M${k.boost > 1 ? `<span class="x4">${multHTML(k.boost)}</span>` : ''}${k.surge > 1 ? `<span class="x4">筹码 ${multHTML(k.surge)}</span>` : ''}</button>`).join('')}</div>`;
          const boost = v.players[me()].boost;
          if (boost) {
            const hit = p.colors.find((x) => x.color === color).boost > 1;
            extra += `<p class="sub boostnote">${hit ? `${AN('hugeWin')} 加成：这次${COLOR(color).zh}收租 ×${boost.mult}，仅此一次。` : `注意：${COLOR(color).zh}没有加成（只有${boost.colors.map((k) => COLOR(k).zh).join('、')}有），但仍会用掉 ${AN('hugeWin')} 的 ×${boost.mult}。`}</p>`;
          }
          if (p.maxDoubles > 0) extra += `<div class="group">叠${AN('doubleRent')} · 每张占 1 次出牌</div><div class="chips" role="radiogroup">${Array.from({ length: p.maxDoubles + 1 }, (_, n) => `<button class="chip" role="radio" aria-checked="${n === d}" data-do="rent-dbl" data-v="${n}">${n === 0 ? '不叠' : multHTML(Math.pow(2, n))}</button>`).join('')}</div>`;
          const amt = base * Math.pow(2, d);

          const hv = (x) => (p.half ? Math.ceil(x / 2) : x); // 对方在吸血：只收一半

          acts.push(m ? btnH(`赌 ${multHTML(m)}：收 ${hv(amt * m)}M 或落空`, Object.assign(a, { bet: m }), 'gold') : btn(`向${nameOf(opp())}收 ${hv(amt)}M`, a));

        }
        case 'passGo': acts.push(btn('打出，再摸 2 张', { type: 'PLAY_ACTION', cardId: c.id })); break;
        case 'debtCollector':

          if (m) acts.push(btnH(`赌 ${multHTML(m)}：${p.kind === 'birthday' ? '随礼' : '讨'} ${hv(p.amount * m)}M 或落空`, { type: 'PLAY_ACTION', cardId: c.id, bet: m }, 'gold'));

        }

          else acts.push(btnDo('选要抢的整套地产', 'target', 'primary', ` data-card="${c.id}"`));
          break;
        case 'bankruptcy': acts.push(btn(`打出，拿走${nameOf(opp())}银行全部 ${p.amount}M`, { type: 'PLAY_ACTION', cardId: c.id })); break;
        case 'liquidation':
          extra = `<p class="sub">${esc(nameOf(opp()))} 的 ${p.handCount} 张手牌也会全部弃掉。</p>`;
          if (p.targets.length <= 3) p.targets.forEach((sid) => { const set = v.players[opp()].sets.find((s) => s.id === sid); if (set) acts.push(btn(`清算${COLOR(set.color).zh}整套`, { type: 'PLAY_ACTION', cardId: c.id, targetSetId: sid })); });

          break;
        case 'hugeWin':
          extra = `<p class="sub">${p.remove ? `${esc(nameOf(opp()))} 桌上的 ${p.remove} 张地产会全部消失。` : `${esc(nameOf(opp()))} 桌上没有地产。`}${p.colors.length ? `你的${p.colors.map((k) => COLOR(k).zh).join('、')}下次收租 ×${p.mult}。` : '你没有完整套，拿不到加成。'}</p>`;
          acts.push(btn(`打出 ${NM('hugeWin')}`, { type: 'PLAY_ACTION', cardId: c.id }));
          break;
        default: break;
      }
    }
    if (h && h.bank) acts.push(btn(`存进银行 ${c.value}M`, { type: 'PLAY_BANK', cardId: c.id }, p ? 'plain' : 'primary'));
    if (c.action === 'doubleRent' && myTurn) { // 租金翻倍：直接配一张能翻倍的租金卡打
      const r = O().hand.find((x) => x.play && x.play.kind === 'rent' && x.play.maxDoubles > 0);
      if (r) acts.unshift(btnDo(`配「${CARD(r.cardId).zh}」一起打出`, 'rent-double', 'primary', ` data-card="${r.cardId}"`));
    }
    const R = O().respond;
    if (R && R.action !== 'sale' && R.action !== 'takeover') { // 对方在等你回应：从手牌这里也能回去（反对行动直接用）
      if (c.action === 'justSayNo' && R.canJustSayNo && (R.jsnIds || []).includes(c.id)) acts.push(btn(AN('justSayNo'), { type: 'JUST_SAY_NO', cardId: c.id }, 'gold'));
      acts.push(btnDo('去回应', 'open-respond', 'primary'));
    } else if (O().discard) acts.push(btnDo(`去弃牌（${O().discard.count} 张）`, 'open-discard', 'primary'));
    const note = handNote(c, p, myTurn);
    return `<div class="feature">${cardHTML(c.id)}<div class="txt"><h3>${esc(c.zh)}</h3><p class="sub">${esc(cardDesc(c))}${c.value ? `面值 ${c.value}M。` : ''}</p>${note ? `<p class="sub">${esc(note)}</p>` : ''}</div></div>${extra}<div class="acts">${acts.join('')}</div>`;
  },

  // 点一组地产：看大图；自己回合可以换色、并组、挪建筑；选目标时在这里点具体哪一张
  set(sh) {
    const v = V();
    const P = v.players[sh.p];
    const mine = sh.p === me();
    let ids;
    let title;
    let sub;
    let color = null;
    let redeemBtn = '';
    if (sh.setId === 'loose') {
      ids = P.loose.slice();
      if (!ids.length) return '';
      title = '散落的建筑';
      sub = `原来的地产没了，${NM('house')}和${NM('hotel')}可挪到别的完整套。`;
    } else {
      const set = P.sets.find((x) => x.id === sh.setId);
      if (!set) return '';
      color = set.color;
      ids = set.cards.concat(set.house != null ? [set.house] : [], set.hotel != null ? [set.hotel] : []);
      const k = COLOR(set.color);
      title = `${mine ? '' : P.name + ' 的'}${k.zh}（${set.cards.length}/${set.size}）`;
      sub = set.full ? `已成套，收租 ${set.rent}M。` : `差 ${set.size - set.cards.length} 张成套，现收租 ${set.rent}M。`;
      if (set.mortgage) {
        const left = set.mortgage.cheapAt - v.turn.number;
        sub = `抵押中：不能收租，不算套数。${left > 0 ? `现在赎回付双倍 ${set.mortgage.cost}M，第 ${set.mortgage.cheapAt} 回合起付原价。` : `赎回付原价 ${set.mortgage.cost}M。`}`;
        const ro = mine && (O().redeem || []).find((x) => x.setId === set.id);
        if (ro) redeemBtn = `<div class="acts"><button class="btn gold" data-do="redeem-open" data-set="${set.id}" ${P.bankTotal >= ro.cost ? '' : 'disabled'}>${P.bankTotal >= ro.cost ? `赎回（${ro.cost}M）` : `银行不够 ${ro.cost}M`}</button></div>`;
      }
    }
    const T = S.target;
    const picking = !!(T && T.by === 'card' && T.owner === sh.p);
    const tiles = ids.map((id) => {
      const ok = !picking || T.valid.has(id);
      return `<button class="tile${!picking && sh.sel === id ? ' on' : ''}${ok ? '' : ' dim'}" data-do="set-pick" data-card="${id}" ${ok ? '' : 'disabled'} aria-pressed="${!picking && sh.sel === id}"><span class="tick">${ICON.tick}</span>${cardHTML(id, { color })}</button>`;
    }).join('');
    let below = '';
    if (picking) below = `<p class="sub">${esc(T.prompt)}</p>`;
    else if (sh.sel != null && ids.includes(sh.sel)) {
      const c = CARD(sh.sel);
      const acts = mine ? moveButtons(sh.sel) : [];
      below = `<div class="group">${esc(c.zh)}</div><p class="sub">${esc(cardDesc(c))}</p>`;
      if (acts.length) below += `<div class="acts">${acts.join('')}</div>`;
      else if (mine) below += `<p class="sub">${O().canEndTurn ? '这张现在没地方可挪。' : '轮到你时可以整理。'}</p>`;
    } else {
      below = `<p class="sub">${mine ? (O().canEndTurn ? '点牌可换色、并组或挪建筑，不占出牌次数。' : '点牌看说明。轮到你时可以整理。') : '点牌看说明。'}</p>`;
    }
    return `<h3>${esc(title)}</h3>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}<div class="bigcards" style="--k:${(tiles.match(/class="tile/g) || []).length || 1}">${tiles}</div>${below}${redeemBtn}`;
  },

  // 秘密竞价：双方各自暗标。没出价时选银行里的牌出价；出完价等对方，亮价后面板自己关
  auction(sh) {
    const v = V();
    const pd = v.pending;
    if (!pd || pd.action !== 'auction') return '';
    const i = me();
    const o = opp();
    const k = COLOR(pd.color);
    const sets = `<div class="duelsets"><div>你的${esc(k.zh)}<div class="cards">${setCardsHTML(i, pd.sets[i])}</div></div><div>${esc(v.players[o].name)} 的${esc(k.zh)}<div class="cards">${setCardsHTML(o, pd.sets[o])}</div></div></div>`;
    const head = `${artOK('auction') ? `<img class="hero-art" src="${artUrl('auction')}" alt="" decoding="sync" draggable="false" data-art="auction">` : '<div class="hero-art fb">秘密竞价</div>'}<h3>秘密竞价：${esc(k.zh)}</h3><p class="sub">双方都有完整的${esc(k.zh)}。用银行的钱暗标出价，出价高的拿走双方出价，并毁掉对方那套；一样多各自退回。</p>`;
    const mine = pd.bids[i];
    if (mine) {
      const amt = mine.reduce((t, id) => t + CARD(id).value, 0);
      return `${head}${sets}<div class="sealed"><span class="env" aria-hidden="true">✉️</span>你出了 ${amt}M · ${pd.bids[o] ? '对方也出了，马上亮价' : `等 ${esc(v.players[o].name)} 出价…`}</div>`;
    }
    const bank = v.players[i].bank;
    const pick = [...sh.pick].filter((id) => bank.includes(id));
    const amt = pick.reduce((t, id) => t + CARD(id).value, 0);
    const tiles = bank.map((id) => `<button class="tile${sh.pick.has(id) ? ' on' : ''}" data-do="bid-pick" data-card="${id}" aria-pressed="${sh.pick.has(id)}"><span class="tick">${ICON.tick}</span>${cardHTML(id)}</button>`).join('');
    return `${head}${sets}${pd.bids[o] ? `<p class="sub">✉️ ${esc(v.players[o].name)} 已出价。</p>` : ''}<div class="group">点选银行里的牌出价</div>${bank.length ? `<div class="cards">${tiles}</div>` : '<p class="sub">银行是空的，只能出 0。</p>'}
      <div class="sum"><span>出价 <b class="num">${amt}M</b> / 银行 ${v.players[i].bankTotal}M</span></div>
      <div class="acts"><button class="btn gold" data-do="act" data-a="${attr({ type: 'BID', cardIds: pick })}">${amt ? `暗标出价 ${amt}M` : '出 0（不竞价）'}</button></div>`;
  },

  // 拍卖：拍品、当前最高价和谁领先、倒计时、加价按钮。双方都看这个面板；领先的一方等对方加价
  sale() {
    const v = V();
    const pd = salePd();
    if (!pd) return '';
    const i = me();
    const o = opp();
    const k = COLOR(pd.color);
    const r = v.rules;
    const R = O().respond && O().respond.action === 'sale' ? O().respond : null;
    const lead = pd.leader;
    const bank = v.players[i].bankTotal;
    const left = saleLeft();
    const head = `${artOK('sale') ? `<img class="hero-art" src="${artUrl('sale')}" alt="" decoding="sync" draggable="false" data-art="sale">` : '<div class="hero-art fb">拍卖</div>'}<h3>拍卖：${esc(k.zh)}地产</h3>`;
    const status = lead == null ? '还没人出价' : lead === i ? '你出价最高' : `${esc(v.players[o].name)} 出价最高`;
    const lot = `<div class="sale-lot"><div class="sale-card">${cardHTML(pd.cardId, { color: pd.color })}</div><div class="sale-info">
      <div class="sale-price"><small>${lead == null ? '起拍价' : '当前最高价'}</small><b>${pd.amount}M</b></div>
      <div class="sale-lead${lead === i ? ' me' : lead != null ? ' opp' : ''}">${status}</div>
      <div class="sale-timer"><span class="bar"><i id="sale-bar" style="transform:scaleX(${left == null ? 1 : saleRatio(pd, left)})"></i></span><span class="left" id="sale-left">${left == null ? '' : `${Math.ceil(left / 1000)} 秒后${lead == null ? '流拍' : '成交'}`}</span></div>
    </div></div>`;
    const hist = pd.history.length ? `<ul class="sale-hist">${pd.history.slice(-4).reverse().map((h, n) => `<li class="${n ? '' : 'top'}">${h.player === i ? '你' : esc(v.players[o].name)} 出价 <b>${h.amount}M</b></li>`).join('')}</ul>` : '';
    let acts;
    // 出价按钮放在 .acts 里：面板把它钉在底部，横屏、小屏也不用先滚动才能出价
    if (lead === i) acts = `<div class="acts"><p class="sale-wait" tabindex="-1">你领先：${r.saleHoldSeconds || 6} 秒内 ${esc(v.players[o].name)} 不加价就成交</p></div>`;
    else if (!R || !R.canBid) acts = `<div class="acts"><p class="sale-wait" tabindex="-1">${bank ? `银行只有 ${bank}M，跟不动了` : '银行是空的，出不了价'}</p></div>`;
    else {
      const steps = [1, 2, 5, 10].map((d) => pd.amount + d).filter((x) => x >= R.min && x < R.max).slice(0, 3).concat(R.max); // 最多 3 档加价 + 全部押上
      acts = `<div class="acts sale-bids">${steps.map((x) => `<button class="btn ${x === R.min ? 'gold' : 'plain'}" data-do="act" data-a="${attr({ type: 'SALE_BID', amount: x })}">出价 ${x}M<small>${x === R.max ? '全部' : `+${x - pd.amount}M`}</small></button>`).join('')}</div>`;
    }
    return `${head}${lot}${hist}${acts}<p class="sub sale-note">只能用银行的钱出价，你有 ${bank}M，每次至少加 1M。开拍 ${r.saleOpenSeconds || 8} 秒没人出价就流拍；有人出价后 ${r.saleHoldSeconds || 6} 秒没人加价就成交。成交从银行付钱，不找零。</p>`;
  },

  // 赌场礼赠：自己打开，或者送给对方（对方强制打开）
  gift() {
    const v = V();
    const pd = v.pending;
    if (!pd || pd.action !== 'gift' || pd.awaiting !== me()) return '';
    const o = v.players[opp()].name;
    return `${artOK('gift') ? `<img class="hero-art" src="${artUrl('gift')}" alt="" decoding="sync" draggable="false" data-art="gift">` : '<div class="hero-art fb">赌场礼赠</div>'}<h3>赌场礼赠</h3>
      <p class="sub">连续 ${v.rules.giftStreak || 4} 次押 ×4 以上的奖励。自己打开，还是送给 ${esc(o)}？送出去对方必须当场打开。</p>
      <div class="group">坏结果：打开的人承受其一</div><ul class="giftlist"><li class="bad">银行和地产全部清空</li><li class="bad">租金最高的一套完整地产被抵押</li></ul>
      <div class="group">好结果：随机得到其一</div><ul class="giftlist"><li>一整套地产 · 4 种颜色地产各一张</li><li>一张 10M 行动卡 · 一张行动卡</li><li>两张${AN('justSayNo')} · 两张全色租金 · 银行进账 20M</li></ul>
      <div class="acts two">${btn(`送给 ${o}`, { type: 'GIFT', give: true }, 'plain')}${btn('自己打开', { type: 'GIFT', give: false }, 'gold')}</div>`;
  },

  // 贪婪大亨：二选一
  tycoon() {
    const v = V();
    const pd = v.pending;
    const R = O().respond;
    if (!pd || pd.action !== 'tycoon' || pd.awaiting !== me() || !R) return '';
    const o = v.players[opp()].name;
    return `${artOK('tycoon') ? `<img class="hero-art" src="${artUrl('tycoon')}" alt="" decoding="sync" draggable="false" data-art="tycoon">` : '<div class="hero-art fb">贪婪大亨</div>'}<h3>贪婪大亨</h3>
      <p class="sub">你从 ${esc(o)} 那里拿到的地产超过了 ${v.rules.tycoonAt}M。每局只有一次，二选一：</p>
      <div class="tyopt">${btnRich('🩸 吸血', `本局 ${o} 每存 ${R.step}M 你白拿 1M；${o} 向你收钱、用「${NM('bankruptcy')}」拿钱都只算一半`, { type: 'TYCOON', vampire: true }, 'red')}${btnRich('💰 套现', `马上拿 ${Math.min(2, R.rentAny)} 张全色租金，再按地产总值 ${R.propValue}M 的${pctText(R.pct)}存进银行 ${R.cash}M`, { type: 'TYCOON', vampire: false }, 'gold')}</div>`;
  },

  // 赎回抵押：用银行里的钱付，不找零
  redeem(sh) {
    const v = V();
    const P = v.players[me()];
    const set = P.sets.find((x) => x.id === sh.setId);
    const ro = (O().redeem || []).find((x) => x.setId === sh.setId);
    if (!set || !set.mortgage || !ro) return '';
    const k = COLOR(set.color);
    const pick = [...sh.pick].filter((id) => P.bank.includes(id));
    const amt = pick.reduce((t, id) => t + CARD(id).value, 0);
    const tiles = P.bank.map((id) => `<button class="tile${sh.pick.has(id) ? ' on' : ''}" data-do="redeem-pick" data-card="${id}" aria-pressed="${sh.pick.has(id)}"><span class="tick">${ICON.tick}</span>${cardHTML(id)}</button>`).join('');
    return `<h3>赎回${esc(k.zh)}</h3><p class="sub">${ro.early ? `未满 ${v.rules.mortgageTurns} 回合，付双倍 ${ro.cost}M；第 ${ro.cheapAt} 回合起付原价。` : `付原价 ${ro.cost}M 赎回。`}不找零，不占出牌次数。</p>
      <div class="cards">${setCardsHTML(me(), set.id)}</div><div class="group">银行</div><div class="cards">${tiles}</div>
      <div class="sum"><span>已选 <b class="num${amt >= ro.cost ? '' : ' bad'}">${amt}M</b> / 要付 ${ro.cost}M</span></div>
      <div class="acts"><button class="btn gold" data-do="act" data-a="${attr({ type: 'REDEEM', setId: set.id, cardIds: pick })}" ${amt >= ro.cost ? '' : 'disabled'}>付 ${amt}M 赎回</button></div>`;
  },

  preview(sh) {
    const c = CARD(sh.cardId);
    return `<div class="feature">${cardHTML(c.id, { color: sh.color })}<div class="txt"><h3>${esc(c.zh)}</h3><p class="sub">${esc(cardDesc(c))}${c.value ? `面值 ${c.value}M。` : ''}</p></div></div>`;
  },

  // 加注：先确认一下，说清楚对方的两个选择
  raise() {
    const R = O().raise;
    if (!R) return '';
    const o = nameOf(opp());
    return `<h3>加注到 ${multHTML(R.stake)}？</h3><p class="sub">${esc(o)} <b>跟注</b>：继续打，赢家得 ${R.stake} 分，之后只有${esc(o)}能再加注。<br><b>弃牌</b>：你直接赢，得 ${R.from} 分。</p>${scoreHTML()}<div class="acts two">${btnDo('算了', 'close-sheet')}${btnH(`加注 ${multHTML(R.stake)}`, { type: 'RAISE' }, 'gold')}</div>`;
  },

  // 被针对 / 自己的行动被对方挡下时
  respond(sh) {
    const o = O();
    const R = o.respond;
    if (!R) return '';
    const v = V();
    const pd = v.pending;
    const actor = v.players[pd.actor].name;
    if (pd.action === 'raise') {
      return `<h3>${esc(actor)} 要求加注到 ${multHTML(R.stake)}</h3><p class="sub"><b>跟注</b>：赢家得 ${R.stake} 分，之后只有你能再加注。<br><b>弃牌</b>：直接输，${esc(actor)} 得 ${R.from} 分。</p>${scoreHTML()}<div class="acts two">${btn('弃牌', { type: 'FOLD' }, 'plain')}${btnH(`跟注 ${multHTML(R.stake)}`, { type: 'ACCEPT' }, 'gold')}</div>`;
    }
    const target = v.players[pd.target].name;
    const jsn = R.canJustSayNo ? btn(AN('justSayNo'), { type: 'JUST_SAY_NO', cardId: R.jsnIds[0] }, 'gold') : ''; // 反击牌：金色（和出价 / 赌 / 加注一样），和旁边酒红的接受 / 付钱分得开
    const what = pendingText(pd, actor);
    if (R.role === 'actor') {
      return `<h3>${esc(target)} 打出了${AN('justSayNo')}</h3><p class="sub">你的「${esc(actionName(pd))}」被挡下了。${R.canJustSayNo ? `再打一张${AN('justSayNo')}可让它生效。` : `你没有${AN('justSayNo')}，只能作罢。`}</p><div class="acts${jsn ? ' two' : ''}">${jsn}${btn(R.canJustSayNo ? '算了' : '知道了', { type: 'ACCEPT' }, 'plain')}</div>`;
    }
    const countered = pd.chain.length >= 2 ? `<p class="sub">${esc(actor)} 又打出${AN('justSayNo')}，挡回了你的${AN('justSayNo')}。</p>` : '';
    if (!R.mustPay) {
      const T = v.players[pd.target];
      let show;
      if (pd.action === 'forcedDeal') show = `<div class="swap">${cardHTML(pd.giveCardId)}<span aria-hidden="true">⇄</span>${cardHTML(pd.targetCardId)}</div>`;
      else if (pd.action === 'slyDeal') show = `<div class="cards">${cardHTML(pd.targetCardId, { color: pd.color })}</div>`;
      else if (pd.action === 'bankruptcy') show = `<p class="sub">你的银行里有 ${T.bank.length} 张牌，共 ${T.bankTotal}M，${pd.half ? `你在吸血：只会被拿走凑够 ${pd.amount}M 的几张（不找零）` : '会全部归对方'}。</p><div class="cards">${T.bank.map((id) => cardHTML(id)).join('')}</div>`;
      else if (pd.action === 'liquidation') show = `<p class="sub">这一整套会进弃牌堆${T.hand && T.hand.length ? `，你手里的 ${T.hand.length} 张牌也会全部弃掉` : ''}。</p><div class="cards">${setCardsHTML(pd.target, pd.targetSetId)}</div>`;
      else if (pd.action === 'hugeWin') show = T.sets.length ? `<p class="sub">你桌上这些地产会全部消失。</p><div class="cards">${T.sets.map((x) => setCardsHTML(pd.target, x.id)).join('')}</div>` : '<p class="sub">你桌上没有地产，不受影响。</p>';
      else show = `<div class="cards">${setCardsHTML(pd.target, pd.targetSetId)}</div>`;
      return `<h3>${esc(what)}</h3>${countered}${show}<div class="acts${jsn ? ' two' : ''}">${sheetClockHTML('自动接受')}${jsn}${btn(R.canJustSayNo ? '接受' : '只能接受', { type: 'ACCEPT' }, jsn ? 'plain' : 'primary')}</div>`;
    }
    // 付款
    const P = v.players[me()];
    const sel = sh.pay;
    const total = R.payable.reduce((t, id) => t + CARD(id).value, 0);
    const picked = [...sel].filter((id) => R.payable.includes(id));
    const sum = picked.reduce((t, id) => t + CARD(id).value, 0);
    if (!R.payable.length) {
      return `<h3>${esc(what)}</h3>${countered}<p class="sub">你没有能付的牌，不用付。</p><div class="acts${jsn ? ' two' : ''}">${jsn}${btn('好的', { type: 'PAY', cardIds: [] }, jsn ? 'plain' : 'primary')}</div>`;
    }
    const lock = R.mustPayAll;
    const tile = (id) => {
      const inSet = P.sets.find((s) => s.cards.includes(id));
      return `<button class="tile${sel.has(id) || lock ? ' on' : ''}${lock ? ' lock' : ''}" data-do="pay-pick" data-card="${id}" aria-pressed="${sel.has(id) || lock}"><span class="tick">${ICON.tick}</span>${cardHTML(id, { color: inSet && inSet.color })}</button>`;
    };
    const bankIds = R.payable.filter((id) => P.bank.includes(id));
    const propIds = R.payable.filter((id) => P.sets.some((s) => s.cards.includes(id)));
    const bldIds = R.payable.filter((id) => !bankIds.includes(id) && !propIds.includes(id));
    const group = (title, list) => (list.length ? `<div class="group">${title}</div><div class="cards">${list.map(tile).join('')}</div>` : '');
    const enough = lock || sum >= R.amount;
    const payNow = lock ? R.payable : picked;
    const sumLine = lock
      ? `<div class="sum"><span>桌上只有 <b class="num">${total}M</b>，要全部付出</span></div>`
      : `<div class="sum"><span>已选 <b class="num${enough ? '' : ' bad'}">${sum}M</b> / 要付 ${R.amount}M${picked.some((id) => !P.bank.includes(id)) ? ` · 含${picked.filter((id) => !P.bank.includes(id)).map((id) => esc(CARD(id).zh)).join('、')}` : ''}</span><span class="cnt">${sum > R.amount ? '不找零' : ''}</span></div>`;
    // 地产按套分组：没成套的在前；成套的标出来——给出一张就拆了套（胜利条件）
    const propGroups = P.sets.filter((st) => st.cards.some((id) => propIds.includes(id))).sort((a, b) => a.full - b.full)
      .map((st) => group(`${esc(COLOR(st.color).zh)} ${st.cards.length}/${st.size}${st.full ? ' · 已成套，给出一张就拆套' : ''}`, st.cards.filter((id) => propIds.includes(id)))).join('');
    return `<h3>${esc(what)}</h3>${countered}<p class="sub">${lock ? '' : '已选好最划算的组合，可以自己改。'}</p>${group('银行', bankIds)}${propGroups}${group('建筑', bldIds)}<div class="acts${jsn ? ' two' : ''}">${sheetClockHTML('自动按建议付款')}${sumLine}${jsn}<button class="btn primary" data-do="act" data-a="${attr({ type: 'PAY', cardIds: payNow })}" ${enough ? '' : 'disabled'}>${lock ? '全部付出' : `付 ${sum}M`}</button></div>`;
  },

  discard(sh) {
    const o = O();
    if (!o.discard) return '';
    const hand = V().players[me()].hand;
    const n = o.discard.count;
    const k = [...sh.pick].filter((id) => hand.includes(id)).length;
    return `<h3>手牌太多了</h3><p class="sub">手牌最多留 ${V().rules.handLimit} 张，选 ${n} 张弃掉。已按价值帮你选好。</p>
      <div class="cards">${hand.map((id) => `<button class="tile${sh.pick.has(id) ? ' on' : ''}" data-do="discard-pick" data-card="${id}" aria-pressed="${sh.pick.has(id)}"><span class="tick">${ICON.tick}</span>${cardHTML(id)}</button>`).join('')}</div>
      <div class="acts">${sheetClockHTML('按建议弃牌')}<div class="sum"><span>已选 <b class="num${k === n ? '' : ' bad'}">${k}</b> / ${n} 张</span></div><button class="btn primary dsc" data-do="act" data-a="${attr({ type: 'DISCARD', cardIds: [...sh.pick].filter((id) => hand.includes(id)) })}" ${k === n ? '' : 'disabled'}>${k === n ? `弃掉 ${n} 张<small>${[...sh.pick].filter((id) => hand.includes(id)).map((id) => esc(CARD(id).zh)).join(' · ')}</small>` : `已选 ${k} 张，还要选 ${n - k} 张`}</button></div>`;
  },

  over() {
    const v = V();
    if (v.phase !== 'gameOver') return '';
    const r = v.result;
    const i = me();
    const o = opp();
    const title = r.winner == null ? '平局' : r.winner === i ? '你赢了' : `${v.players[o].name} 赢了`;
    const why = ({ sets: `凑齐了 ${v.rules.setsToWin} 套不同颜色的完整地产。`, resign: r.winner === i ? '对方认输了。' : '你认输了。', away: r.winner === i ? '对方离线太久，判你获胜。' : '你离线太久，被判负。', fold: r.winner === i ? '对方弃牌了。' : '你弃牌了。', stalemate: '牌堆耗尽、双方都打不出牌。', maxTurns: '达到回合上限。' }[r.reason] || '') + (r.stake > 1 && r.winner != null ? `这局 ×${r.stake}，赢家得 ${r.stake} 分。` : '');
    const rows = [['出牌', 'cardsPlayed', ''], ['收到', 'received', 'M'], ['付出', 'paid', 'M'], ['单笔最高', 'biggestHit', 'M'], [`${NM('slyDeal')} / ${NM('forcedDeal')}成功`, 'steals', ''], [`${NM('dealBreaker')}成功`, 'setsStolen', ''], [`打出${AN('justSayNo')}`, 'justSayNo', '']];
    if (v.rules.gamble) rows.push(['赌一把（赢 / 次）', 'bets', '']);
    const cell = (P, k, u) => (k === 'bets' ? `${P.stats.betsWon || 0} / ${P.stats.bets || 0}` : `${P.stats[k]}${u}`);
    const want = S.info ? S.info.rematch : [false, false];
    const main = oppGone() ? '<button class="btn primary" data-do="rematch-new">重新匹配</button>' : want[i] ? `<button class="btn primary" disabled>${esc(mainButton().label)}</button>` : `<button class="btn primary${want[o] ? ' nudge' : ''}" data-do="rematch">${want[o] ? `${esc(v.players[o].name)} 想再来一局，开始` : '再来一局'}</button>`;
    const score = S.info && S.info.score ? S.info.score : null;
    // 刚在眼前结束的这一局：赢家的分先停在加分前，面板弹出 450ms 后跳到新分、弹一下、响一声（只跳一次，之后重画直接是新分）
    const rd = S.info ? S.info.round : 0;
    const shown = score ? score.slice() : null;
    if (score && r.winner != null && S.justOver === rd && S.scoreTicked !== rd) {
      S.scoreTicked = rd;
      const w = r.winner;
      shown[w] = Math.max(0, score[w] - (r.stake || 1));
      setTimeout(() => {
        const b = S.sheet && S.sheet.type === 'over' && $$('.sheet .scoreline b')[w === i ? 0 : 1];
        if (!b || !S.info || !S.info.score) return;
        b.textContent = S.info.score[w];
        bumpEl(b, 1.45);
        sound.play(w === i ? 'coin' : 'tick');
      }, 450);
    }
    const scoreline = score ? `<div class="scoreline" aria-label="本房间比分 ${score[i]} 比 ${score[o]}"><span class="nm">${esc(v.players[i].name)}</span><b>${shown[i]}</b><span>:</span><b>${shown[o]}</b><span class="nm">${esc(v.players[o].name)}</span></div>` : '';
    const badges = titlesFor(v.players[i], r.winner === i, r.turn, r.reason);
    const streak = winStreak(r.winner);
    if (r.winner === i && streak >= 2) badges.unshift({ icon: ICON.bolt, text: `连胜 ×${streak}`, hot: true });
    if (r.winner === i && r.stake >= 4) badges.unshift({ icon: ICON.dice, text: `豪赌：×${r.stake} 拿下`, html: `豪赌：${multHTML(r.stake)} 拿下`, hot: true });
    const won = (v.players[i].awards || []).slice();
    if (S.info && (S.info.emoteAward ? S.info.emoteAward[i] : S.info.emotes && S.info.emotes[i] > 5)) won.push('emoteMaster'); // 旧后端没有 emoteAward：按本局表情数
    const awardBadges = won.filter((k) => AWARD_INFO[k]).map((k) => ({ icon: artOK(k) ? `<img class="ico" src="${artUrl(k)}" alt="" decoding="sync" draggable="false" data-art="${k}">` : ICON.crown, text: AWARD_INFO[k].name, hot: true }));
    const all = awardBadges.concat(badges);
    const badgeRow = all.length ? `<div class="badges">${all.slice(0, 6).map((b) => `<span class="badge${b.cool ? ' cool' : ''}${b.hot ? ' hot' : ''}">${b.icon}${b.html ? `<span>${b.html}</span>` : esc(b.text)}</span>`).join('')}</div>` : '';
    const rec = S.info && S.info.mode === 'match' ? matchRec() : null;
    const recLine = rec && rec.g ? `<p class="sub mrec">匹配战绩：${rec.w} 胜 ${rec.g - rec.w} 负${rec.streak >= 2 ? ` · 连胜 ${rec.streak}` : ''}${r.winner === i ? '' : ' · 再来一局赢回来'}</p>` : '';
    return `<h3>${esc(title)}</h3><p class="sub">${esc(why)}共 ${r.turn} 回合。</p>${recLine}${endNote(v, r, streak)}${scoreline}${badgeRow}
      <table class="stats"><thead><tr><th></th><th>${esc(v.players[i].name)}</th><th>${esc(v.players[o].name)}</th></tr></thead><tbody>${rows.map(([t, k, u]) => `<tr><td>${t}</td><td>${cell(v.players[i], k, u)}</td><td>${cell(v.players[o], k, u)}</td></tr>`).join('')}</tbody></table>
      <div class="acts two">${main}${btnDo('回到首页', 'leave')}</div>${S.info && S.info.mode === 'match' && !oppGone() ? '<div class="foot"><button class="link" data-do="rematch-new">换个对手</button></div>' : ''}`;
  },

  menu() {
    const inGame = S.snap && V().phase !== 'gameOver';
    return `<h3>菜单</h3><div class="menu">
      <button data-do="log">对局记录</button>
      ${S.room ? `<button class="kv" data-do="chat">聊天${chat.unread ? ` · ${chat.unread} 条新消息` : ''}<span>聊天记录 · 屏蔽对方</span></button>` : ''}
      ${S.snap ? `<button class="kv" data-do="discard-pile">弃牌堆 · ${V().discardCount} 张<span>牌堆剩 ${V().deckCount} 张</span></button>` : ''}
      <button data-do="rules">玩法速览</button>
      <button class="sw" data-do="autosort" role="switch" aria-checked="${S.autoSort}">自动理牌<span>${S.autoSort ? '开' : '关'}</span></button>
      <button class="sw" data-do="sound" role="switch" aria-checked="${sound.on}">声音<span>${sound.on ? '开' : '关'}</span></button>
      ${S.info && S.info.mode === 'match' ? '' : '<button data-do="copy-link">复制邀请链接</button>'}
      ${DEBUG ? '<button data-do="check-cards">检查资源</button>' : ''}
      <div class="sep" aria-hidden="true"></div>
      ${inGame ? '<button class="danger" data-do="resign">认输</button>' : ''}
      <button data-do="leave">离开房间（可用链接回来）</button>
    </div>`;
  },

  // 筹码说明：点中央指示器旁边的闪电打开
  power(sh) {
    const v = V();
    const P = v.players[sh.p];
    if (!P || P.power == null) return '';
    const r = v.rules;
    const mine = sh.p === me();
    const now = v.turn.player === sh.p && v.phase !== 'gameOver';
    const rows = [];
    const bar = (a, b) => `<span class="bar"><i style="width:${Math.min(100, Math.round((a / b) * 100))}%"></i></span>`;
    if (r.power) {
      rows.push(`<li>筹码保险：钱或地产每失去 ${r.insuranceStep}M +0.5，还差 ${r.insuranceStep - P.lost}M。${bar(P.lost, r.insuranceStep)}</li>`);
      if (P.surge) {
        const n = P.surge.left + (now && P.surge.since === v.turn.number ? 1 : 0);
        rows.push(`<li><b>满格加成中：收租 ×${r.surgeMult}</b>，不成套也算，还剩 ${n} 个${now ? '回合（含这回合）' : '自己的回合'}，结束时筹码清零。</li>`);
      } else {
        rows.push(`<li>攒满 ${r.powerCap} 点立刻满格加成：收租 ×${r.surgeMult}，不成套也算，再持续 ${r.surgeTurns} 个自己的回合，然后筹码清零。</li>`);
      }
    }
    if (r.lottery) rows.push(`<li>大乐透：每次收租都有机会额外中 ${r.lotteryMin}–${r.lotteryMax}M。</li>`);
    if (r.tycoon && P.grab != null) {
      const t = v.tycoon;
      if (!t) rows.push(`<li>贪婪大亨：每局最先从对方拿到超过 ${r.tycoonAt}M 地产的人触发一次。已累计 ${P.grab}M。${bar(P.grab, r.tycoonAt + 1)}</li>`);
      else if (t.player === sh.p) rows.push(t.mode === 'vampire' ? `<li><b>贪婪大亨 · 吸血中</b>：对方每存 ${r.vampireStep}M 你白拿 1M${t.owed ? `（还欠你 ${t.owed}M）` : ''}；对方向你收钱、用${NM('bankruptcy') ? `「${NM('bankruptcy')}」` : '破产'}拿钱都只算一半。</li>` : t.mode === 'cash' ? '<li>贪婪大亨：已经套现。</li>' : '<li>贪婪大亨：正在选吸血或套现。</li>');
      else rows.push(`<li>对方已触发贪婪大亨${t.mode === 'vampire' ? '：对方在吸血，你每存 ' + r.vampireStep + 'M 对方白拿 1M，你向对方收钱只算一半' : ''}。</li>`);
    }
    if (r.ghostKit && P.haul != null) {
      rows.push(`<li>捉鬼套装：累计让对方失去超过 ${P.ghostBar}M 就拉一次老虎机。转出三个钱袋多拿两张${NM('debtCollector') ? `「${NM('debtCollector')}」` : '讨债人'}；转不出来失去一张随机颜色的地产，没有地产就弃光手牌，下回合摸的 5 张都是 1M。触发后累计清零，门槛 +${r.ghostStep}M。已累计 ${P.haul}M。${bar(P.haul, P.ghostBar)}</li>`);
      if (P.curse > 0) rows.push(`<li><b>下回合摸的 ${P.curse} 张都是 1M。</b></li>`);
    }
    return `<h3>${esc(r.power ? (mine ? '你的筹码' : `${P.name} 的筹码`) : mine ? '你的状态' : `${P.name} 的状态`)}</h3>${r.power ? `<div class="pwbig">${powerBarHTML(P.power, r.powerCap, true)}<b>${P.power / 2} / ${r.powerCap}${P.power >= r.powerCap * 2 ? ' 已满' : ''}</b></div>` : ''}<ul class="pwrows">${rows.join('')}</ul>`;
  },

  rules() {
    const A = (k) => `「${NM(k)}」`;
    const v = S.snap ? V() : null;
    const r = v ? v.rules : (S.meta && S.meta.roomRules) || {}; // 首页打开：按房间默认规则说
    const it = (on, name, text) => (on ? `<li><b>${name}</b>${text}</li>` : '');
    // 先说基本规则，再说这一局开着的特别玩法（名字加粗、一条一句）
    return `<h3>玩法速览</h3><div class="rgroup">基本</div><ol class="rules">
      <li>先凑齐 ${v ? r.setsToWin : 3} 套不同颜色的完整地产就赢。</li>
      <li>每回合摸 2 张（没手牌摸 5 张），最多出 3 张。</li>
      <li>钱和行动卡可以存银行；地产只能摆到桌上。</li>
      <li>被收钱时用银行或桌上的牌付，不找零；付出的地产归对方。</li>
      <li>${A('justSayNo')}能挡掉对方的行动卡，对方也能再挡回来。</li>
      <li>完整套上可以加${A('house')}（租金 +3M），再加${A('hotel')}（再 +4M）。</li>
      <li>回合结束时手牌最多 7 张。</li>
      ${v && v.turn.lapsed != null ? `<li>出牌不限时；回应和弃牌限时 ${S.clock && S.clock.kind !== 'play' ? Math.round(S.clock.total / 1000) : 25} 秒，超时按建议处理。</li>` : ''}
      <li>点一下手牌看能怎么出（收租卡直接弹出 ×1–×5）；也可以拖到桌上打出、拖到银行存钱；长按放大。</li>
      <li>中间的圆盘：箭头指向轮到的人，下面的圆点是这回合还能出几张，外圈是回应倒计时。点它看对局记录。</li>
      <li>地产组下面的「差1→6M」：再来 1 张成套，成套后收租 6M。拖地产区边上的小横条，整叠摊开看。</li>
      <li>点顶部信息条：菜单、表情和消息。</li>
    </ol><div class="rgroup">特别玩法</div><ul class="rules">
      ${it(r.gamble, '赌一把', '打出租金、讨债人或生日时可押 ×2–×5：老虎机转出三个一样，这次收的钱就乘几倍；没中这张牌作废。押得越大越难中，每回合一次。')}
      ${it(r.jackpot, '奖池', `每次赌输 +1 张（最多 ${r.potMax} 张），下一个押 ×4 以上赌赢的人全部摸走。`)}
      ${it(r.lottery, '大乐透', `每次收租都有机会额外中 ${r.lotteryMin}–${r.lotteryMax}M，直接进银行。`)}
      ${it(r.doubling, '加注', `自己回合出牌前点「结束回合」上方的 ×N，这局分值翻倍（最高 ×${r.maxStake}）。对方跟注就继续，之后只有跟注方能再加注；弃牌直接输，按加注前的分值算。`)}
      ${it(r.comeback, '追赶', '落后两套以上时，有机会回合开始多摸 1 张；对方只差一套时，有机会这回合出 4 张。')}
      ${it(r.power, '筹码', `付出的钱、被拿走或毁掉的地产，每满 ${r.insuranceStep}M +0.5 点。攒满 ${r.powerCap} 点：收租 ×${r.surgeMult}（不成套也算），持续 ${r.surgeTurns} 个自己的回合，然后清零。`)}
      ${it(r.auction, '秘密竞价', '双方都有同色完整套时，各用银行的钱暗标出价：高的拿走双方出价，并毁掉对方那套；一样多各自退回。')}
      ${it(r.casinoGift, '赌场礼赠', `连续 ${r.giftStreak} 次押 ×4 以上（输赢都算），下回合得到一个礼盒：自己打开，或送给对方当场打开。可能清空打开者的银行和地产、抵押其租金最高的一套，也可能开出地产、行动卡、${A('justSayNo')}、全色租金或 20M。`)}
      ${it(r.casinoGift, '抵押', `抵押的那套不能收租、不算套数。点它赎回：满 ${r.mortgageTurns} 回合付原价租金，提前付双倍；不占出牌次数。`)}
      ${it(r.ghostKit, '捉鬼套装', `累计让对方失去超过门槛（${r.ghostStep}M 起，每次 +${r.ghostStep}M；${A('forcedDeal')}不算）就拉一次老虎机：三个钱袋多拿两张${A('debtCollector')}；不中失去一张随机地产，没有地产就弃光手牌、下回合摸的 5 张都是 1M。`)}
      ${it(r.tycoon, '贪婪大亨', `每局一次，最先从对方拿到超过 ${r.tycoonAt}M 地产的人二选一。吸血：本局对方每存 ${r.vampireStep}M 你白拿 1M，对方向你收钱、用${A('bankruptcy')}拿钱只算一半。套现：拿两张全色租金，再按地产总值的${pctText(r.tycoonCash)}存进银行。`)}
      ${it(v && v.takeover, '恶意收购', v && v.takeover ? `每局一次，先集齐${COLOR(v.takeover.color).zh}完整套的人触发：双方银行和地产按面值折成筹码，轮流玩轮盘赌（每人最多 ${r.rouletteSpins} 局，每局押 ${r.rouletteMin}–${r.rouletteMax}M）。红 / 黑 / 单 / 双中了翻倍；数字中了 ×5 并结束，另得每色地产各一张和一张 10M 行动卡；开出绿色 0 清零并结束。每局开奖后可带着筹码离开，换成钱存进银行。` : '')}
      ${it(r.sale, '拍卖', `每局最多一次，双方桌上有两种以上同色地产时可能触发：一张地产起拍价 0，轮流加价（每次至少 1M，只能用银行的钱）。${r.saleOpenSeconds} 秒没人出价流拍；有人出价后 ${r.saleHoldSeconds} 秒没人加价成交，整场最长 ${r.saleMaxMinutes} 分钟。不找零。`)}
      <li><b>10M 行动卡</b>${A('bankruptcy')}拿走对方银行全部；${A('liquidation')}清掉对方一整套完整地产并弃光对方手牌；${A('hugeWin')}让对方地产全部消失，你的完整套下次收租 ×4。都能被${A('justSayNo')}挡下。</li>
      <li><b>成就</b>只是荣誉，每局每项一次，须在自己的一个回合内完成：超级大盗（让对方损失超过 10M 或抢走一整套）、破坏大师（清空对方桌上的地产）、超级金库（搬空对方银行或自己银行超过 30M）、表情大师（发 5 个以上表情）。</li>
      ${it(r.auction || r.casinoGift, '一回合一个', `追赶、赌一把、大乐透、秘密竞价、赌场礼赠${r.sale ? '、拍卖' : ''}每回合最多触发一个${r.power || r.ghostKit || r.tycoon ? `；筹码、捉鬼套装、贪婪大亨${v && v.takeover ? '、恶意收购' : ''}不受此限` : ''}。`)}
    </ul>`;
  },

  claim() {
    const aw = oppAway();
    return `<h3>判你获胜？</h3><p class="sub">${esc(nameOf(opp()))} 已经离线 ${fmtDur(aw || 0)}。判胜按对方认输结算。</p><div class="acts two">${btnDo('再等等', 'close-sheet')}${btnDo('判我获胜', 'claim-confirm', 'gold')}</div>`;

function endNote(v, r, streak) {
  const i = me();
  const need = v.rules.setsToWin;
  const mine = v.players[i].fullColors.length;
  const t = []; // 一句一行：中文自动平衡换行会把词拆开

    if (r.reason === 'fold') t.push(`弃牌止损：只丢 ${r.stake} 分，跟注再输要丢 ${r.stake * 2} 分。`);

function pickWhy(c) {

function pickHint() {
  const h = O().hand.find((x) => x.cardId === S.pick) || {};

  if (!p) return pickWhy(c); // 「存进银行」按钮就在倍率上面：不用再说
  const g = gainOfPlay(p);
  const upTo = p.kind === 'rent' && (p.maxDoubles > 0 || p.colors.length > 1); // 租金：按最贵的颜色、加上翻倍才有这么多
  const one = g ? `×1 ${upTo ? '最多' : ''}收 ${g}M` : `×1 打出「${c.zh}」`;
  if (p.bets && p.bets.length) return `${one} · 押中最多 ${g * Math.max(...p.bets)}M，不中作废`;
  const v = V();
  if (g && v.rules.gamble && (v.turn.gambled || v.turn.mech)) return `${one} · ${v.turn.gambled ? '本回合已赌过' : '这回合不能再赌'}`;
  return one;
}

// 银行里凑够 amount 的最小组合：总额尽量小，一样小时张数尽量少
function cheapestBank(ids, amount) {
  const best = new Map([[0, []]]);
  for (const id of ids) {
    const val = CARD(id).value;
    for (const [t, arr] of Array.from(best.entries())) { const cur = best.get(t + val); if (!cur || cur.length > arr.length + 1) best.set(t + val, arr.concat(id)); }
  }
  let pick = null;
  let tot = Infinity;
  for (const [t, arr] of best) if (t >= amount && (t < tot || (t === tot && arr.length < pick.length))) { pick = arr; tot = t; }
  return pick || ids.slice();
}

function startTarget(cardId) {
  const h = O().hand.find((x) => x.cardId === cardId);
  if (!h || !h.play) return;
  const p = h.play;
  const T = { cardId, kind: p.kind };
  switch (p.kind) {
    case 'slyDeal': Object.assign(T, { by: 'card', owner: opp(), valid: new Set(p.targets), prompt: '选一张要拿走的地产' }); break;
    case 'forcedDeal': Object.assign(T, { by: 'card', owner: me(), valid: new Set(p.give), step: 'give', take: p.take, prompt: '先选你要交出的地产' }); break;
    case 'dealBreaker': Object.assign(T, { by: 'set', owner: opp(), valid: new Set(p.targets), prompt: '选要抢的整套' }); break;
    case 'liquidation': Object.assign(T, { by: 'set', owner: opp(), valid: new Set(p.targets), prompt: '选要清算的整套' }); break;
    case 'house':
    case 'hotel': Object.assign(T, { by: 'set', owner: me(), valid: new Set(p.setIds), prompt: `选要放${NM(p.kind)}的一套` }); break;
    default: return;
  }
  S.target = T;
  S.sel = null;
  closeSheet();
  render();
}

function pickTarget(kind, id, owner) {
  const T = S.target;
  if (!T || T.owner !== owner || T.by !== kind || !T.valid.has(id)) return false;
  if (T.kind === 'forcedDeal' && T.step === 'give') {
    Object.assign(T, { step: 'take', give: id, owner: opp(), valid: new Set(T.take), shown: false, prompt: `用「${CARD(id).zh}」换：再选对方的地产` });
    render();
    return true;
  }
  const a = { type: 'PLAY_ACTION', cardId: T.cardId };
  if (T.kind === 'slyDeal') a.targetCardId = id;
  else if (T.kind === 'forcedDeal') Object.assign(a, { giveCardId: T.give, targetCardId: id });
  else if (T.kind === 'dealBreaker' || T.kind === 'liquidation') a.targetSetId = id;
  else a.setId = id;
  S.target = null;
  act(a);
  return true;
}

  async act(el) {
    let a;
    try { a = JSON.parse(el.dataset.a); } catch (e) { return; }
    const sh = S.sheet;
    const stay = !sh || sh.type === 'sale' || ANSWER_SHEETS.has(sh.type); // 回应类答完由 act 自己收；竞价出完价留着面板显示"等对方"，结算后自己关；拍卖出完价也留着看倒计时
    // 手牌面板里出牌：不等服务器确认，面板马上收起，大图那张牌直接从面板里拿起来停在原处（和拖牌一样），结果回来再从这里飞去银行 / 桌上；
    // 揭晓还在放时点的也一样：牌先停着，放完再出
    const launch = !!sh && sh.type === 'hand' && /^PLAY_/.test(a.type) && a.cardId != null && !dragDrops.has(String(a.cardId));
    if (launch) {
      const src = $('.sheet .feature .card');
      const r = src && motionOK() && !(a.bet > 1) ? src.getBoundingClientRect() : null; // 押了倍数：先转老虎机，牌等转完再从手里亮出来，不先拿起来悬在半空
      if (r && r.width) {
        const box = { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: r.width, h: r.height };
        const g = makeGhost(cleanClone(src), box, false, 'drag');
        hold(String(a.cardId));
        src.style.visibility = 'hidden'; // 面板滑走时里面那张别和飞出来的替身重影
        g.animate([{ transform: 'none' }, { transform: 'translateY(-12px) scale(1.04)' }], { duration: 180, easing: EASE_OUT, fill: 'forwards' });
        dragDrops.set(String(a.cardId), { ghost: g, box: Object.assign({}, box, { cy: box.cy - 12, w: box.w * 1.04, h: box.h * 1.04 }) }); // 停住时的样子：之后的飞行从这里接上
      }
      haptic('medium');
      sound.play(a.type === 'PLAY_BANK' ? 'coin' : 'card');
      S.sel = null;
      closeSheet();
    } else if (S.gate && !S.queued && !stay) closeSheet(); // 揭晓还在放：这一下先排着，面板先收起来，别让人以为没点上
    const ok = await act(a);
    if (launch) {
      if (ok) setTimeout(settleDropped, 1500); // 正常情况下局面更新会先到；这里兜底
      else returnGhost(a.cardId); // 没出成：替身弹回手里
    } else if (ok && !stay && S.sheet === sh) closeSheet(); // 等结果的时候换了别的面板：那个不关
    if (ok) S.sel = null;
  },

document.addEventListener('pointerdown', () => sound.unlock(), { passive: true });
// iOS 只认 touchend / click 里的解锁；切回前台后声音也要在下一次触摸时恢复
document.addEventListener('touchend', () => sound.unlock(), { passive: true });
// iOS：对局中双指捏合会把整页放大、牌桌跑出屏幕（长按卡牌本来就能放大看）
document.addEventListener('gesturestart', (e) => { if (S.screen === 'game') e.preventDefault(); });
// 旧版 iOS（15 及以下）不认 overscroll-behavior：在页面顶部往下拉时拦住，不让 Safari 下拉刷新把对局刷掉
if (!(window.CSS && CSS.supports && CSS.supports('overscroll-behavior', 'none'))) {
  let ty = 0;
  document.addEventListener('touchstart', (e) => { ty = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (S.screen !== 'game' || e.touches.length !== 1 || window.scrollY > 0 || e.touches[0].clientY <= ty || e.target.closest('.sbody')) return;
    e.preventDefault();
  }, { passive: false });
}
// iOS Safari 只有在页面监听了 touchstart 时才会给按钮套用 :active，没有这一行，所有"按下缩一下"的反馈在 iPhone 上都不出现
document.addEventListener('touchstart', () => {}, { passive: true });
document.addEventListener('click', (e) => {
  if (e.target.id === 'md-haptic' || e.target.htmlFor === 'md-haptic') return; // 触感开关的程序点击，不是用户点的
  if ($('#pop') && !e.target.closest('#pop') && !e.target.closest('[data-do="emotes"]')) closeEmotes();
  const el = e.target.closest('[data-do]');
  if (!el || el.disabled || !el.dataset.do) return;
  const fn = DO[el.dataset.do];
  if (!fn) return;
  if (S.busy && el.dataset.do === 'act') return;
  if (el.dataset.do !== 'end-turn' && el.closest('#sheet-root, #screen .dock .pk')) S.dockFreeAt = performance.now(); // 面板 / 倍率面板刚收起：底下就是结束回合，连点的第二下别落到它上面
  // 同一张牌既是牌又在组里：点牌优先
  if (el.dataset.do === 'set' && e.target.closest('[data-do="card"]') && !(S.target && S.target.by === 'set')) return;
