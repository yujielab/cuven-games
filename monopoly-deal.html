  svg.firstChild.setAttribute('d', `M${P(xl, y(ox, oy, Ro, xl))} A${Ro.toFixed(1)},${Ro.toFixed(1)} 0 0 1 ${P(xr, y(ox, oy, Ro, xr))} L${P(xr, y(g.cx, g.cy, g.R2, xr))} A${g.R2.toFixed(1)},${g.R2.toFixed(1)} 0 0 0 ${P(xl, y(g.cx, g.cy, g.R2, xl))} Z`);
  // 手牌张数 + 电力：沿外弧排在正中（张数在左、电力在右，中间 8px），上沿离外弧 5px，跟着弧转一点。
  // 出牌区上面留的高度（--hpad）按这个算：刚好放下它们（转了角的那头最低）、离牌 4px（至少 24px，给选中抬起的牌）。
  // 算出来的高度记在 S.handPad，下次重绘直接用；变了就按新高度再排一遍（只排一次）
  const cnt = $(':scope > .handcnt', hb);
  if (!cnt) return;
  const els = [...cnt.children];
  const gap = 8;
  let u = -(els.reduce((t, el) => t + el.offsetWidth, 0) + gap * (els.length - 1)) / 2; // 弧长，屏幕正中为 0
  const a0 = Math.asin(Math.max(-1, Math.min(1, (W / 2 - ox) / Ro))); // 屏幕正中在外弧上的角度（圆心不一定正好在正中）
  let bottom = 0;
  els.forEach((el) => {
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    const r = Ro - 5 - h / 2;
    const a = a0 + (u + w / 2) / r;
    const ex = ox + r * Math.sin(a);
    const ey = oy - r * Math.cos(a);
    el.style.left = (ex - w / 2).toFixed(1) + 'px';
    el.style.top = (ey - h / 2).toFixed(1) + 'px';
    el.style.rotate = (a * 180 / Math.PI).toFixed(2) + 'deg';
    bottom = Math.max(bottom, ey + (h / 2) * Math.cos(a) + (w / 2) * Math.abs(Math.sin(a)));
    u += w + gap;
  });
  const want = Math.max(24, Math.ceil(bottom + 4));
  if (Math.abs(want - (S.handPad || 24)) > 2 && !drawHandArc.again) {
    S.handPad = want;
    hb.style.setProperty('--hpad', want + 'px');
    drawHandArc.again = true;
    try { layoutHand(); layoutArcs(); } finally { drawHandArc.again = false; }
  }
}
// 选中 / 取消选中手牌：整页重绘会直接换成新位置，这里补一段"抬起 / 放下"的过渡
function selFx() {
  const was = S.lastSel;
  S.lastSel = S.sel;
  if (was === S.sel || !motionOK()) return;
  const pose = (el, up) => {
    const r = parseFloat(el.style.getPropertyValue('--r')) || 0;
    const y = parseFloat(el.style.getPropertyValue('--y')) || 0;
    return up ? `translateY(${y - 18}px) rotate(0deg) scale(1.03)` : `translateY(${y}px) rotate(${r}deg)`;
  };
  const on = S.sel != null && cardNode(S.sel);
  if (on && on.closest('.hand')) on.animate([{ transform: pose(on, false) }, { transform: pose(on, true) }], SPR.lift);
  const off = was != null && cardNode(was);
  if (off && off.closest('.hand')) off.animate([{ transform: pose(off, true) }, { transform: pose(off, false) }], { duration: 200, easing: EASE_OUT });
}

/* ═══════════ 底部面板 ═══════════ */
function openSheet(sheet) {
  closeEmotes();
  sheet.returnFocus = document.activeElement;
  S.sheet = sheet;
  renderSheet();
  requestAnimationFrame(() => { const b = $('.sheet .btn:not([disabled]), .sheet button'); if (b) b.focus({ preventScroll: true }); });
}

function closeSheet() {
  if (!S.sheet) return;
  const back = S.sheet.returnFocus;
  S.sheet = null;
  renderSheet();
  if (back && back.isConnected) back.focus({ preventScroll: true });
}

let sheetToken = 0;
// 只有偶尔才出现的面板（被收钱、弃牌、结算、规则）内容依次弹出；点牌、点地产组、菜单这种一局里点几十次的面板直接出内容，不让按钮晚到
const STAGGER_SHEETS = new Set(['respond', 'discard', 'over', 'rules']);
let lastSheetType = '';
let lastSheetHtml = '';
let staggerTimer = 0;
function renderSheet() {
  const root = $('#sheet-root');
  const box = $('.sheet', root);
  let html = '';
  if (S.sheet && S.meta) {
    try { html = SHEETS[S.sheet.type](S.sheet); } catch (e) { console.error(e); html = ''; }
  }
  if (!html) {
    if (S.sheet) S.sheet = null;
    sheetToken++; // 作废还没执行的"打开"动画，避免面板关掉后又被打开、挡住整个页面
    lastSheetHtml = '';
    root.classList.remove('open');
    root.setAttribute('aria-hidden', 'true');
    return;
  }
  const opening = !root.classList.contains('open') || S.sheet.type !== lastSheetType;
  lastSheetType = S.sheet.type;
  // 内容没变就不动 DOM（对方每次动作都会触发重绘，看记录、选牌付款时面板不该跳回顶部或闪一下）
  if (opening || html !== lastSheetHtml) {
    const top = opening ? 0 : ($('.sbody', box) || {}).scrollTop || 0;
    const imgs = opening ? new Map() : collectImgs(box);
    const refocus = !opening && S.sheet.type === 'sale' && box.contains(document.activeElement); // 拍卖面板跟着倒计时、出价重画：焦点别掉回页面
    box.innerHTML = '<div class="grab" aria-hidden="true"></div><div class="sbody">' + html + '</div>';
    const acts = $('.sbody > .acts', box);
    if (acts) box.appendChild(acts); // 按钮固定在面板底部，内容再长也看得到
    reuseImgs(box, imgs);
    if (top) $('.sbody', box).scrollTop = top;
    lastSheetHtml = html;
    stickers.sweep(); // 面板换了内容：原来那些还在播的表情停掉
    if (S.sheet.type === 'chat') chatFill(); // 聊天面板只有骨架，重画后把消息、表情包面板填回去
    if (refocus && !box.contains(document.activeElement)) { const f = $('.sale-bids .btn.gold', box) || $('.sale-wait', box); if (f) f.focus({ preventScroll: true }); }
  }
  // 刚打开（或换成另一种面板）时内容依次弹出来；面板里点选、刷新时不再重播
  if (opening && motionOK() && STAGGER_SHEETS.has(S.sheet.type)) {
    box.classList.add('stagger');
    clearTimeout(staggerTimer);
    staggerTimer = setTimeout(() => box.classList.remove('stagger'), 900);
  } else if (!opening) {
    box.classList.remove('stagger');
  }
  root.setAttribute('aria-hidden', 'false');
  const token = ++sheetToken;
  requestAnimationFrame(() => { if (token === sheetToken && S.sheet) root.classList.add('open'); });
}

// 面板：按住顶部把手往下拖可以关闭；拖得不够远就弹回去
(() => {
  const root = $('#sheet-root');
  const box = $('.sheet', root);
  let y0 = 0;
  let dy = 0;
  let t0 = 0;
  let dragging = false;
  let hist = [];
  let resetTimer = 0;
  box.addEventListener('pointerdown', (e) => {
    if (dragging || !e.target.closest('.grab') || !S.sheet) return; // 拖动中再按下的手指不算，避免面板跳位
    dragging = true;
    y0 = e.clientY;
    dy = 0;
    t0 = performance.now();
    hist = [{ y: 0, t: t0 }];
    box.setPointerCapture(e.pointerId);
    clearTimeout(resetTimer);
    box.style.transition = 'none';
  });
  box.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const raw = e.clientY - y0;
    // 往下 1:1 跟手；往上拉越拉越沉（橡皮筋），不是撞上一堵墙
    dy = raw >= 0 ? raw : -((-raw * 48) / (48 + -raw * 0.55)) * 0.55;
    box.style.transform = `translate(-50%, ${dy}px)`;
    const now = performance.now();
    hist.push({ y: dy, t: now });
    while (hist.length > 2 && now - hist[0].t > 90) hist.shift(); // 只看最近 90ms，算松手那一刻的速度
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    const now = performance.now();
    const h0 = hist[0];
    const v = h0 && now - h0.t > 0 ? (dy - h0.y) / (now - h0.t) : 0; // px/ms，往下为正
    const fast = v > 0.11 || dy / Math.max(1, now - t0) > 0.11; // 轻轻一甩就能关，不必拖过某条线
    const later = (ms) => { resetTimer = setTimeout(() => { box.style.transition = ''; }, ms + 40); };
    if (dy > box.offsetHeight * 0.25 || (fast && dy > 16)) {
      // 接着手指的速度滑下去：曲线起步斜率是 3，时长按"剩下的距离 ÷ 速度"算，拖和滑之间没有断层
      const left = box.offsetHeight * 1.1 - dy;
      const ms = Math.round(Math.max(180, Math.min(420, (3 * left) / Math.max(v, 0.6))));
      box.style.transition = motionOK() ? `transform ${ms}ms cubic-bezier(.25, .75, .35, 1)` : '';
      closeSheet();
      if (S.sel != null) { S.sel = null; render(); }
      requestAnimationFrame(() => { box.style.transform = ''; }); // 从手指位置继续滑下去
      later(ms);
    } else {
      // 没拖够：用弹簧弹回去（被往上拉过的，橡皮筋松开也走同一条弹簧）
      box.style.transition = motionOK() ? `transform ${SPR.sheet.duration}ms ${SPR.sheet.easing}` : '';
      box.style.transform = '';
      later(SPR.sheet.duration);
    }
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
})();

const btn = (label, a, cls) => `<button class="btn ${cls || 'primary'}" data-do="act" data-a="${attr(a)}">${esc(label)}</button>`;
const btnH = (html, a, cls) => `<button class="btn ${cls || 'primary'}" data-do="act" data-a="${attr(a)}"><span>${html}</span></button>`; // 文字里带倍率图（html 已经转义好）：包一层，按钮的 flex 间距不插进图和字中间
const btnRich = (label, note, a, cls) => `<button class="btn ${cls || 'primary'}" data-do="act" data-a="${attr(a)}">${esc(label)}<small>${esc(note)}</small></button>`; // 两行：标题 + 一行说明
const btnDo = (label, d, cls, extra) => `<button class="btn ${cls || 'plain'}" data-do="${d}"${extra || ''}>${esc(label)}</button>`;

const SHEETS = {
  // 聊天：这里只出骨架（内容不随消息变，输入框里打到一半的字不会被重绘冲掉），消息列表由 chat.paint() 直接填
  chat() {
    if (!S.snap) return '';
    return `<div class="chathead"><h3>和 ${esc(nameOf(opp()))} 聊天</h3><button class="link" data-do="chat-mute" aria-pressed="${chat.mute}">${chat.mute ? '取消屏蔽' : '屏蔽对方'}</button></div>
      <div id="chatlist" class="chatlist" role="log" aria-live="polite" aria-label="聊天记录"></div>
      <div class="chips quick">${CHAT_QUICK.map((q) => `<button class="chip" data-do="chat-quick" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <div id="stkpanel" class="stkpanel" hidden></div>
      <div class="acts chatbar"><button class="round stktoggle" data-do="chat-stickers" aria-label="表情包" aria-expanded="false" hidden>${ICON.smile}</button><input id="chatin" maxlength="120" placeholder="说点什么…" enterkeyhint="send" autocomplete="off" aria-label="聊天内容"><button class="btn primary" data-do="chat-send">发送</button></div>`;
  },
  // 点手牌：能做什么
  hand(sh) {
    const v = V();
    const hand = v.players[me()].hand || [];
    if (!hand.includes(sh.cardId)) return '';
    const c = CARD(sh.cardId);
    const h = O().hand.find((x) => x.cardId === sh.cardId);
    const myTurn = O().canEndTurn;
    const acts = [];
    let extra = '';
    const p = h && h.play;
    if (p) {
      switch (p.kind) {
        case 'property': {
          if (p.colors.length < 2) { p.colors.forEach((k) => acts.push(btn('打出地产', { type: 'PLAY_PROPERTY', cardId: c.id, color: k.color }))); break; }
          // 多色地产：两列色块，颜色本身就是标签，一眼找到；打出去正好凑满一套的颜色描一圈金边（会进最满的那组，见后端 placeCard）
          const mySets = v.players[me()].sets;
          const fills = (k) => (k.setIds || []).some((id) => { const st = mySets.find((x) => x.id === id); return !!st && st.cards.length === st.size - 1; });
          acts.push(`<div class="cpicks">${p.colors.map((k) => { const K = COLOR(k.color); return `<button class="btn cpick${fills(k) ? ' done' : ''}" data-do="act" data-a="${attr({ type: 'PLAY_PROPERTY', cardId: c.id, color: k.color })}" style="--c:${K.hex}" aria-label="当作${esc(K.zh)}打出"><i></i>${esc(K.zh)}</button>`; }).join('')}</div>`);
          break;
        }
        case 'rent': {
          const color = sh.color && p.colors.some((x) => x.color === sh.color) ? sh.color : p.colors.reduce((a, b) => (b.amount > a.amount ? b : a)).color;
          const base = p.colors.find((x) => x.color === color).amount;
          const d = Math.min(sh.doubles || 0, p.maxDoubles);
          extra = `<div class="group">按哪种颜色收</div><div class="chips" role="radiogroup">${p.colors.map((k) => `<button class="chip" role="radio" aria-checked="${k.color === color}" data-do="rent-color" data-v="${k.color}"><i style="background:${COLOR(k.color).hex}"></i>${COLOR(k.color).zh} ${k.amount}M${k.boost > 1 ? `<span class="x4">${multHTML(k.boost)}</span>` : ''}${k.surge > 1 ? `<span class="x4">电力 ${multHTML(k.surge)}</span>` : ''}</button>`).join('')}</div>`;
          const boost = v.players[me()].boost;
          if (boost) {
            const hit = p.colors.find((x) => x.color === color).boost > 1;
            extra += `<p class="sub boostnote">${hit ? `${AN('hugeWin')} 加成生效：这次按${COLOR(color).zh}收租 ×${boost.mult}，用完就没了。` : `注意：这次收租会用掉 ${AN('hugeWin')} 的 ×${boost.mult} 加成，但${COLOR(color).zh}不在加成里（加成的是 ${boost.colors.map((k) => COLOR(k).zh).join('、')}）。`}</p>`;
          }
          if (p.maxDoubles > 0) extra += `<div class="group">叠${AN('doubleRent')}（每张多占 1 次出牌）</div><div class="chips" role="radiogroup">${Array.from({ length: p.maxDoubles + 1 }, (_, n) => `<button class="chip" role="radio" aria-checked="${n === d}" data-do="rent-dbl" data-v="${n}">${n === 0 ? '不叠' : multHTML(Math.pow(2, n))}</button>`).join('')}</div>`;
          const amt = base * Math.pow(2, d);
          const m = betOf(p, sh);
          extra += betHTML(p, m, amt, d > 0);
          if (v.rules.lottery && !m && !v.turn.mech) extra += `<p class="sub teaser">收完租还有机会额外中大乐透 ${v.rules.lotteryMin}–${v.rules.lotteryMax}M</p>`;
          const hv = (x) => (p.half ? Math.ceil(x / 2) : x); // 对方在吸血：只收一半
          if (p.half) extra += `<p class="sub boostnote">${esc(nameOf(opp()))} 在吸血（贪婪大亨）：向他收的钱只算一半。</p>`;
          const a = { type: 'PLAY_ACTION', cardId: c.id, color, doubles: p.doubleIds.slice(0, d) };
          acts.push(m ? btnH(`赌 ${multHTML(m)}：收 ${hv(amt * m)}M 或落空`, Object.assign(a, { bet: m }), 'gold') : btn(`向${nameOf(opp())}收 ${hv(amt)}M`, a));
          break;
        }
        case 'passGo': acts.push(btn('打出，再摸 2 张', { type: 'PLAY_ACTION', cardId: c.id })); break;
        case 'debtCollector':
        case 'birthday': {
          const m = betOf(p, sh);
          const hv = (x) => (p.half ? Math.ceil(x / 2) : x);
          extra = betHTML(p, m, p.amount, false) + (p.half ? `<p class="sub boostnote">${esc(nameOf(opp()))} 在吸血（贪婪大亨）：向他收的钱只算一半。</p>` : '');
          if (m) acts.push(btnH(`赌 ${multHTML(m)}：${p.kind === 'birthday' ? '随礼' : '讨'} ${hv(p.amount * m)}M 或落空`, { type: 'PLAY_ACTION', cardId: c.id, bet: m }, 'gold'));
          else acts.push(btn(p.kind === 'birthday' ? `打出，${nameOf(opp())}要随礼 ${hv(2)}M` : `打出，向${nameOf(opp())}讨 ${hv(5)}M`, { type: 'PLAY_ACTION', cardId: c.id }));
          break;
        }
        case 'house':
        case 'hotel':
          if (p.setIds.length === 1) {
            const set = v.players[me()].sets.find((s) => s.id === p.setIds[0]);
            acts.push(btn(`盖在${COLOR(set.color).zh}上`, { type: 'PLAY_ACTION', cardId: c.id, setId: set.id }));
          } else acts.push(btnDo('选一组完整地产', 'target', 'primary', ` data-card="${c.id}"`));
          break;
        case 'slyDeal': acts.push(btnDo('选要拿走的地产', 'target', 'primary', ` data-card="${c.id}"`)); break;
        case 'forcedDeal': acts.push(btnDo('选要交换的地产', 'target', 'primary', ` data-card="${c.id}"`)); break;
        case 'dealBreaker': acts.push(btnDo('选要抢的整套地产', 'target', 'primary', ` data-card="${c.id}"`)); break;
        case 'bankruptcy': acts.push(btn(`打出，拿走${nameOf(opp())}银行全部 ${p.amount}M`, { type: 'PLAY_ACTION', cardId: c.id })); break;
        case 'liquidation':
          extra = `<p class="sub">${esc(nameOf(opp()))} 手里还有 ${p.handCount} 张牌，会全部弃掉。</p>`;
          acts.push(btnDo('选要清算的整套地产', 'target', 'primary', ` data-card="${c.id}"`));
          break;
        case 'hugeWin':
          extra = `<p class="sub">${p.remove ? `${esc(nameOf(opp()))} 桌上的 ${p.remove} 张地产会全部消失。` : `${esc(nameOf(opp()))} 桌上现在没有地产。`}${p.colors.length ? `你的${p.colors.map((k) => COLOR(k).zh).join('、')}下次收租 ×${p.mult}。` : '你现在没有完整套，拿不到收租加成。'}</p>`;
          acts.push(btn(`打出 ${NM('hugeWin')}`, { type: 'PLAY_ACTION', cardId: c.id }));
          break;
        default: break;
      }
    }
    if (h && h.bank) acts.push(btn(`存进银行（${c.value}M）`, { type: 'PLAY_BANK', cardId: c.id }, p ? 'plain' : 'primary'));
    let note = '';
    if (!myTurn) note = '轮到你的回合时才能出牌。';
    else if (O().playsLeft === 0) note = `这回合的 ${v.rules.playsPerTurn} 次出牌已经用完了${v.rules.autoEndTurn ? '，回合会自动结束' : '，可以结束回合'}。`;
    else if (c.action === 'justSayNo') note = `${AN('justSayNo')}要等对方对你出牌时再用。`;
    else if (c.action === 'doubleRent') note = '和租金卡一起打出时才能用。';
    else if (!p) note = c.type === 'rent' ? '你桌上还没有这几种颜色的地产，收不了租。'
      : c.action === 'house' ? `要先有一组完整地产（${COLOR('railroad').zh}、${COLOR('utility').zh}除外）才能放${NM('house')}。`
        : c.action === 'hotel' ? `要先有一组放了${NM('house')}的完整地产才能放${NM('hotel')}。`
          : c.action === 'dealBreaker' || c.action === 'liquidation' ? '对方还没有完整的一套。'
            : c.action === 'bankruptcy' ? '对方银行是空的，现在打出去拿不到东西。'
              : c.action === 'hugeWin' ? '对方桌上没有地产，你也没有完整套，现在打出去没有效果。'
            : c.action === 'slyDeal' || c.action === 'forcedDeal' ? '对方桌上没有能拿的地产（完整套不能动）。' : '';
    return `<div class="feature">${cardHTML(c.id)}<div class="txt"><h3>${esc(c.zh)}</h3><p class="sub">${esc(cardDesc(c))}${c.value ? `面值 ${c.value}M。` : ''}</p>${note ? `<p class="sub">${esc(note)}</p>` : ''}</div></div>${extra}<div class="acts">${acts.join('')}</div>`;
  },

  // 点一组地产：看大图；自己回合可以换色、并组、挪建筑；选目标时在这里点具体哪一张
  set(sh) {
    const v = V();
    const P = v.players[sh.p];
    const mine = sh.p === me();
    let ids;
    let title;
    let sub;
    let color = null;
    let redeemBtn = '';
    if (sh.setId === 'loose') {
      ids = P.loose.slice();
      if (!ids.length) return '';
      title = '散落的建筑';
      sub = `原来那组地产没了，${NM('house')}和${NM('hotel')}可以挪到别的完整套上。`;
    } else {
      const set = P.sets.find((x) => x.id === sh.setId);
      if (!set) return '';
      color = set.color;
      ids = set.cards.concat(set.house != null ? [set.house] : [], set.hotel != null ? [set.hotel] : []);
      const k = COLOR(set.color);
      title = `${mine ? '' : P.name + ' 的'}${k.zh}（${set.cards.length}/${set.size}）`;
      sub = set.full ? `已成套，收租 ${set.rent}M。` : `还差 ${set.size - set.cards.length} 张成套，现在收租 ${set.rent}M。`;
      if (set.mortgage) {
        const left = set.mortgage.cheapAt - v.turn.number;
        sub = `抵押中：收不了这套的租，也不算胜利套数。${left > 0 ? `现在赎回要付 ${set.mortgage.cost}M（双倍），第 ${set.mortgage.cheapAt} 回合起只要付原价。` : `赎回要付原价 ${set.mortgage.cost}M。`}`;
        const ro = mine && (O().redeem || []).find((x) => x.setId === set.id);
        if (ro) redeemBtn = `<div class="acts"><button class="btn gold" data-do="redeem-open" data-set="${set.id}" ${P.bankTotal >= ro.cost ? '' : 'disabled'}>${P.bankTotal >= ro.cost ? `赎回（${ro.cost}M）` : `银行不够 ${ro.cost}M`}</button></div>`;
      }
    }
    const T = S.target;
    const picking = !!(T && T.by === 'card' && T.owner === sh.p);
    const tiles = ids.map((id) => {
      const ok = !picking || T.valid.has(id);
      return `<button class="tile${!picking && sh.sel === id ? ' on' : ''}${ok ? '' : ' dim'}" data-do="set-pick" data-card="${id}" ${ok ? '' : 'disabled'} aria-pressed="${!picking && sh.sel === id}"><span class="tick">${ICON.tick}</span>${cardHTML(id, { color })}</button>`;
    }).join('');
    let below = '';
    if (picking) below = `<p class="sub">${esc(T.prompt)}</p>`;
    else if (sh.sel != null && ids.includes(sh.sel)) {
      const c = CARD(sh.sel);
      const acts = mine ? moveButtons(sh.sel) : [];
      below = `<div class="group">${esc(c.zh)}</div><p class="sub">${esc(cardDesc(c))}</p>`;
      if (acts.length) below += `<div class="acts">${acts.join('')}</div>`;
      else if (mine) below += `<p class="sub">${O().canEndTurn ? '这张现在没有可以挪去的地方。' : '轮到你的回合时可以整理桌面。'}</p>`;
    } else {
      below = `<p class="sub">${mine ? (O().canEndTurn ? '点一张牌可以换颜色、并组或挪建筑，不占出牌次数。' : '点一张牌看说明。轮到你的回合时可以整理桌面。') : '点一张牌看说明。'}</p>`;
    }
    return `<h3>${esc(title)}</h3>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}<div class="bigcards">${tiles}</div>${below}${redeemBtn}`;
  },

  // 秘密竞价：双方各自暗标。没出价时选银行里的牌出价；出完价等对方，亮价后面板自己关
  auction(sh) {
    const v = V();
    const pd = v.pending;
    if (!pd || pd.action !== 'auction') return '';
    const i = me();
    const o = opp();
    const k = COLOR(pd.color);
    const sets = `<div class="duelsets"><div>你的${esc(k.zh)}<div class="cards">${setCardsHTML(i, pd.sets[i])}</div></div><div>${esc(v.players[o].name)} 的${esc(k.zh)}<div class="cards">${setCardsHTML(o, pd.sets[o])}</div></div></div>`;
    const head = `${artOK('auction') ? `<img class="hero-art" src="${artUrl('auction')}" alt="" decoding="sync" draggable="false" data-art="auction">` : '<div class="hero-art fb">秘密竞价</div>'}<h3>秘密竞价：${esc(k.zh)}</h3><p class="sub">你们都有完整的${esc(k.zh)}。从银行里挑钱暗标出价，谁都看不到对方出了多少；出价高的拿走双方的钱，并毁掉对方那套。一样多就各自退回。</p>`;
    const mine = pd.bids[i];
    if (mine) {
      const amt = mine.reduce((t, id) => t + CARD(id).value, 0);
      return `${head}${sets}<div class="sealed"><span class="env" aria-hidden="true">✉️</span>你出了 ${amt}M · ${pd.bids[o] ? '对方也出完了，马上亮价' : `等 ${esc(v.players[o].name)} 出价…`}</div>`;
    }
    const bank = v.players[i].bank;
    const pick = [...sh.pick].filter((id) => bank.includes(id));
    const amt = pick.reduce((t, id) => t + CARD(id).value, 0);
    const tiles = bank.map((id) => `<button class="tile${sh.pick.has(id) ? ' on' : ''}" data-do="bid-pick" data-card="${id}" aria-pressed="${sh.pick.has(id)}"><span class="tick">${ICON.tick}</span>${cardHTML(id)}</button>`).join('');
    return `${head}${sets}${pd.bids[o] ? `<p class="sub">✉️ ${esc(v.players[o].name)} 已经出完价了。</p>` : ''}<div class="group">你的银行（点选出价的牌）</div>${bank.length ? `<div class="cards">${tiles}</div>` : '<p class="sub">银行是空的，只能出 0。</p>'}
      <div class="sum"><span>出价 <b class="num">${amt}M</b> / 银行 ${v.players[i].bankTotal}M</span></div>
      <div class="acts"><button class="btn gold" data-do="act" data-a="${attr({ type: 'BID', cardIds: pick })}">${amt ? `暗标出价 ${amt}M` : '出 0（不竞价）'}</button></div>`;
  },

  // 拍卖：拍品、当前最高价和谁领先、倒计时、加价按钮。双方都看这个面板；领先的一方等对方加价
  sale() {
    const v = V();
    const pd = salePd();
    if (!pd) return '';
    const i = me();
    const o = opp();
    const k = COLOR(pd.color);
    const r = v.rules;
    const R = O().respond && O().respond.action === 'sale' ? O().respond : null;
    const lead = pd.leader;
    const bank = v.players[i].bankTotal;
    const left = saleLeft();
    const head = `${artOK('sale') ? `<img class="hero-art" src="${artUrl('sale')}" alt="" decoding="sync" draggable="false" data-art="sale">` : '<div class="hero-art fb">拍卖</div>'}<h3>拍卖：${esc(k.zh)}地产</h3>`;
    const status = lead == null ? '还没人出价' : lead === i ? '你出价最高' : `${esc(v.players[o].name)} 出价最高`;
    const lot = `<div class="sale-lot"><div class="sale-card">${cardHTML(pd.cardId, { color: pd.color })}</div><div class="sale-info">
      <div class="sale-price"><small>${lead == null ? '起拍价' : '当前最高价'}</small><b>${pd.amount}M</b></div>
      <div class="sale-lead${lead === i ? ' me' : lead != null ? ' opp' : ''}">${status}</div>
      <div class="sale-timer"><span class="bar"><i id="sale-bar" style="transform:scaleX(${left == null ? 1 : saleRatio(pd, left)})"></i></span><span class="left" id="sale-left">${left == null ? '' : `${Math.ceil(left / 1000)} 秒后${lead == null ? '流拍' : '成交'}`}</span></div>
    </div></div>`;
    const hist = pd.history.length ? `<ul class="sale-hist">${pd.history.slice(-4).reverse().map((h, n) => `<li class="${n ? '' : 'top'}">${h.player === i ? '你' : esc(v.players[o].name)} 出价 <b>${h.amount}M</b></li>`).join('')}</ul>` : '';
    let acts;
    // 出价按钮放在 .acts 里：面板把它钉在底部，横屏、小屏也不用先滚动才能出价
    if (lead === i) acts = `<div class="acts"><p class="sale-wait" tabindex="-1">你领先：${r.saleHoldSeconds || 6} 秒内 ${esc(v.players[o].name)} 不加价就成交</p></div>`;
    else if (!R || !R.canBid) acts = `<div class="acts"><p class="sale-wait" tabindex="-1">${bank ? `银行只有 ${bank}M，跟不动了` : '银行是空的，出不了价'}</p></div>`;
    else {
      const steps = [1, 2, 5, 10].map((d) => pd.amount + d).filter((x) => x >= R.min && x < R.max).slice(0, 3).concat(R.max); // 最多 3 档加价 + 全部押上
      acts = `<div class="acts sale-bids">${steps.map((x) => `<button class="btn ${x === R.min ? 'gold' : 'plain'}" data-do="act" data-a="${attr({ type: 'SALE_BID', amount: x })}">出价 ${x}M<small>${x === R.max ? '全部' : `+${x - pd.amount}M`}</small></button>`).join('')}</div>`;
    }
    return `${head}${lot}${hist}${acts}<p class="sub sale-note">只能用银行里的钱出价（你的银行 ${bank}M）：每次至少加 1M，刚出过价要等对方加价。开拍 ${r.saleOpenSeconds || 8} 秒没人出价就流拍；有人出价后 ${r.saleHoldSeconds || 6} 秒没人加价就成交。成交后从银行里付钱（不找零），地产直接放进地产区。</p>`;
  },

  // 赌场礼赠：自己打开，或者送给对方（对方强制打开）
  gift() {
    const v = V();
    const pd = v.pending;
    if (!pd || pd.action !== 'gift' || pd.awaiting !== me()) return '';
    const o = v.players[opp()].name;
    return `${artOK('gift') ? `<img class="hero-art" src="${artUrl('gift')}" alt="" decoding="sync" draggable="false" data-art="gift">` : '<div class="hero-art fb">赌场礼赠</div>'}<h3>赌场礼赠</h3>
      <p class="sub">连续 ${v.rules.giftStreak || 4} 次押 ×4 换来的礼盒。自己打开，还是送给 ${esc(o)}？送出去对方不能拒收，会当场打开。</p>
      <div class="group">可能开出坏结果（打开的人倒霉，二选一）</div><ul class="giftlist"><li class="bad">银行和地产全部清空</li><li class="bad">租金最高的一套完整地产被抵押（两样都无从谈起时是空盒）</li></ul>
      <div class="group">也可能开出好结果（其中随机一样）</div><ul class="giftlist"><li>一整套完整地产 · 4 种颜色的地产各一张</li><li>一张 10M 行动卡 · 一张行动卡</li><li>两张${AN('justSayNo')} · 两张全色租金 · 银行进账 20M</li></ul>
      <div class="acts two">${btn(`送给 ${o}`, { type: 'GIFT', give: true }, 'plain')}${btn('自己打开', { type: 'GIFT', give: false }, 'gold')}</div>`;
  },

  // 贪婪大亨：二选一
  tycoon() {
    const v = V();
    const pd = v.pending;
    const R = O().respond;
    if (!pd || pd.action !== 'tycoon' || pd.awaiting !== me() || !R) return '';
    const o = v.players[opp()].name;
    return `${artOK('tycoon') ? `<img class="hero-art" src="${artUrl('tycoon')}" alt="" decoding="sync" draggable="false" data-art="tycoon">` : '<div class="hero-art fb">贪婪大亨</div>'}<h3>贪婪大亨</h3>
      <p class="sub">你从 ${esc(o)} 那里拿到的地产累计超过了 ${v.rules.tycoonAt}M，这局只有你能触发，只有这一次。选一样：</p>
      <div class="tyopt">${btnRich('🩸 吸血', `直到这局结束：${o} 每往银行存 ${R.step}M，你白拿 1M；${o} 向你收的钱、用「${NM('bankruptcy')}」拿你的钱都只算一半`, { type: 'TYCOON', vampire: true }, 'red')}${btnRich('💰 套现', `马上拿 ${Math.min(2, R.rentAny)} 张全色租金，再按你现有地产总值 ${R.propValue}M 的${pctText(R.pct)}，存进银行 ${R.cash}M`, { type: 'TYCOON', vampire: false }, 'gold')}</div>`;
  },

  // 赎回抵押：用银行里的钱付，不找零
  redeem(sh) {
    const v = V();
    const P = v.players[me()];
    const set = P.sets.find((x) => x.id === sh.setId);
    const ro = (O().redeem || []).find((x) => x.setId === sh.setId);
    if (!set || !set.mortgage || !ro) return '';
    const k = COLOR(set.color);
    const pick = [...sh.pick].filter((id) => P.bank.includes(id));
    const amt = pick.reduce((t, id) => t + CARD(id).value, 0);
    const tiles = P.bank.map((id) => `<button class="tile${sh.pick.has(id) ? ' on' : ''}" data-do="redeem-pick" data-card="${id}" aria-pressed="${sh.pick.has(id)}"><span class="tick">${ICON.tick}</span>${cardHTML(id)}</button>`).join('');
    return `<h3>赎回${esc(k.zh)}</h3><p class="sub">${ro.early ? `还没满 ${v.rules.mortgageTurns} 回合，要付双倍：${ro.cost}M（第 ${ro.cheapAt} 回合起只要原价）。` : `付原价 ${ro.cost}M 赎回。`}钱进弃牌堆，不找零；不占出牌次数。</p>
      <div class="cards">${setCardsHTML(me(), set.id)}</div><div class="group">银行</div><div class="cards">${tiles}</div>
      <div class="sum"><span>已选 <b class="num${amt >= ro.cost ? '' : ' bad'}">${amt}M</b> / 要付 ${ro.cost}M</span></div>
      <div class="acts"><button class="btn gold" data-do="act" data-a="${attr({ type: 'REDEEM', setId: set.id, cardIds: pick })}" ${amt >= ro.cost ? '' : 'disabled'}>付 ${amt}M 赎回</button></div>`;
  },

  preview(sh) {
    const c = CARD(sh.cardId);
    return `<div class="feature">${cardHTML(c.id, { color: sh.color })}<div class="txt"><h3>${esc(c.zh)}</h3><p class="sub">${esc(cardDesc(c))}${c.value ? `面值 ${c.value}M。` : ''}</p></div></div>`;
  },

  // 加注：先确认一下，说清楚对方的两个选择
  raise() {
    const R = O().raise;
    if (!R) return '';
    const o = nameOf(opp());
    return `<h3>加注到 ${multHTML(R.stake)}？</h3><p class="sub">${esc(o)} 可以<b>跟注</b>：继续打，这局赢家得 ${R.stake} 分，之后只有${esc(o)}能再加注。<br>也可以<b>弃牌</b>：这局直接算你赢，得 ${R.from} 分。</p>${scoreHTML()}<div class="acts two">${btnDo('算了', 'close-sheet')}${btnH(`加注 ${multHTML(R.stake)}`, { type: 'RAISE' }, 'gold')}</div>`;
  },

  // 被针对 / 自己的行动被对方挡下时
  respond(sh) {
    const o = O();
    const R = o.respond;
    if (!R) return '';
    const v = V();
    const pd = v.pending;
    const actor = v.players[pd.actor].name;
    if (pd.action === 'raise') {
      return `<h3>${esc(actor)} 要求加注到 ${multHTML(R.stake)}</h3><p class="sub"><b>跟注</b>：继续打，这局赢家得 ${R.stake} 分，之后加注权在你手里。<br><b>弃牌</b>：这局直接输，${esc(actor)} 得 ${R.from} 分。</p>${scoreHTML()}<div class="acts two">${btn('弃牌', { type: 'FOLD' }, 'plain')}${btnH(`跟注 ${multHTML(R.stake)}`, { type: 'ACCEPT' }, 'gold')}</div>`;
    }
    const target = v.players[pd.target].name;
    const jsn = R.canJustSayNo ? btn(AN('justSayNo'), { type: 'JUST_SAY_NO', cardId: R.jsnIds[0] }, 'gold') : ''; // 反击牌：金色（和出价 / 赌 / 加注一样），和旁边酒红的接受 / 付钱分得开
    const what = pendingText(pd, actor);
    if (R.role === 'actor') {
      return `<h3>${esc(target)} 打出了${AN('justSayNo')}</h3><p class="sub">你的「${esc(actionName(pd))}」被挡下了。${R.canJustSayNo ? `再打一张${AN('justSayNo')}就能让它照样生效。` : `你手里没有${AN('justSayNo')}，这次只能作罢。`}</p><div class="acts${jsn ? ' two' : ''}">${jsn}${btn(R.canJustSayNo ? '算了' : '知道了', { type: 'ACCEPT' }, 'plain')}</div>`;
    }
    const countered = pd.chain.length >= 2 ? `<p class="sub">${esc(actor)} 又打出${AN('justSayNo')}，顶回了你的${AN('justSayNo')}。</p>` : '';
    if (!R.mustPay) {
      const T = v.players[pd.target];
      let show;
      if (pd.action === 'forcedDeal') show = `<div class="swap">${cardHTML(pd.giveCardId)}<span aria-hidden="true">⇄</span>${cardHTML(pd.targetCardId)}</div>`;
      else if (pd.action === 'slyDeal') show = `<div class="cards">${cardHTML(pd.targetCardId, { color: pd.color })}</div>`;
      else if (pd.action === 'bankruptcy') show = `<p class="sub">你的银行里有 ${T.bank.length} 张牌，共 ${T.bankTotal}M，${pd.half ? `你在吸血：只会被拿走凑够 ${pd.amount}M 的几张（不找零）` : '会全部归对方'}。</p><div class="cards">${T.bank.map((id) => cardHTML(id)).join('')}</div>`;
      else if (pd.action === 'liquidation') show = `<p class="sub">这一整套会进弃牌堆${T.hand && T.hand.length ? `，你手里的 ${T.hand.length} 张牌也会全部弃掉` : ''}。</p><div class="cards">${setCardsHTML(pd.target, pd.targetSetId)}</div>`;
      else if (pd.action === 'hugeWin') show = T.sets.length ? `<p class="sub">你桌上这些地产会全部消失（散落的建筑保留）。</p><div class="cards">${T.sets.map((x) => setCardsHTML(pd.target, x.id)).join('')}</div>` : '<p class="sub">你桌上没有地产，不受影响。</p>';
      else show = `<div class="cards">${setCardsHTML(pd.target, pd.targetSetId)}</div>`;
      return `<h3>${esc(what)}</h3>${countered}${show}<div class="acts${jsn ? ' two' : ''}">${jsn}${btn(R.canJustSayNo ? '接受' : '只能接受', { type: 'ACCEPT' }, jsn ? 'plain' : 'primary')}</div>`;
    }
    // 付款
    const P = v.players[me()];
    const sel = sh.pay;
    const total = R.payable.reduce((t, id) => t + CARD(id).value, 0);
    const picked = [...sel].filter((id) => R.payable.includes(id));
    const sum = picked.reduce((t, id) => t + CARD(id).value, 0);
    if (!R.payable.length) {
      return `<h3>${esc(what)}</h3>${countered}<p class="sub">你桌上没有能付的牌，这次不用付。</p><div class="acts${jsn ? ' two' : ''}">${jsn}${btn('好的', { type: 'PAY', cardIds: [] }, jsn ? 'plain' : 'primary')}</div>`;
    }
    const lock = R.mustPayAll;
    const tile = (id) => {
      const inSet = P.sets.find((s) => s.cards.includes(id));
      return `<button class="tile${sel.has(id) || lock ? ' on' : ''}${lock ? ' lock' : ''}" data-do="pay-pick" data-card="${id}" aria-pressed="${sel.has(id) || lock}"><span class="tick">${ICON.tick}</span>${cardHTML(id, { color: inSet && inSet.color })}</button>`;
    };
    const bankIds = R.payable.filter((id) => P.bank.includes(id));
    const propIds = R.payable.filter((id) => P.sets.some((s) => s.cards.includes(id)));
    const bldIds = R.payable.filter((id) => !bankIds.includes(id) && !propIds.includes(id));
    const group = (title, list) => (list.length ? `<div class="group">${title}</div><div class="cards">${list.map(tile).join('')}</div>` : '');
    const enough = lock || sum >= R.amount;
    const payNow = lock ? R.payable : picked;
    const sumLine = lock
      ? `<div class="sum"><span>桌上只有 <b class="num">${total}M</b>，要全部付出</span></div>`
      : `<div class="sum"><span>已选 <b class="num${enough ? '' : ' bad'}">${sum}M</b> / 要付 ${R.amount}M</span><span class="cnt">${sum > R.amount ? '不找零' : ''}</span></div>`;
    return `<h3>${esc(what)}</h3>${countered}<p class="sub">${lock ? '' : '已经帮你选好最划算的组合，也可以自己改。'}</p>${group('银行', bankIds)}${group('地产（付出去会到对方桌上）', propIds)}${group('建筑', bldIds)}${sumLine}<div class="acts${jsn ? ' two' : ''}">${jsn}<button class="btn primary" data-do="act" data-a="${attr({ type: 'PAY', cardIds: payNow })}" ${enough ? '' : 'disabled'}>${lock ? '全部付出' : `付 ${sum}M`}</button></div>`;
  },

  discard(sh) {
    const o = O();
    if (!o.discard) return '';
    const hand = V().players[me()].hand;
    const n = o.discard.count;
    const k = [...sh.pick].filter((id) => hand.includes(id)).length;
    return `<h3>手牌太多了</h3><p class="sub">回合结束时最多留 ${V().rules.handLimit} 张，选 ${n} 张弃掉。已经按价值帮你选好了。</p>
      <div class="cards">${hand.map((id) => `<button class="tile${sh.pick.has(id) ? ' on' : ''}" data-do="discard-pick" data-card="${id}" aria-pressed="${sh.pick.has(id)}"><span class="tick">${ICON.tick}</span>${cardHTML(id)}</button>`).join('')}</div>
      <div class="sum"><span>已选 <b class="num${k === n ? '' : ' bad'}">${k}</b> / ${n} 张</span></div>
      <div class="acts"><button class="btn primary" data-do="act" data-a="${attr({ type: 'DISCARD', cardIds: [...sh.pick].filter((id) => hand.includes(id)) })}" ${k === n ? '' : 'disabled'}>弃掉 ${n} 张</button></div>`;
  },

  over() {
    const v = V();
    if (v.phase !== 'gameOver') return '';
    const r = v.result;
    const i = me();
    const o = opp();
    const title = r.winner == null ? '平局' : r.winner === i ? '你赢了' : `${v.players[o].name} 赢了`;
    const why = ({ sets: `凑齐了 ${v.rules.setsToWin} 套不同颜色的完整地产。`, resign: r.winner === i ? '对方认输了。' : '你认输了。', away: r.winner === i ? '对方离线太久，判你获胜。' : '你离线太久，被判负。', fold: r.winner === i ? '对方没跟注，弃牌了。' : '你没跟注，弃牌了。', stalemate: '牌堆耗尽、双方都打不出牌。', maxTurns: '达到回合上限。' }[r.reason] || '') + (r.stake > 1 && r.winner != null ? `这局 ×${r.stake}，赢家得 ${r.stake} 分。` : '');
    const rows = [['出牌', 'cardsPlayed', ''], ['收到', 'received', 'M'], ['付出', 'paid', 'M'], ['单笔最多收到', 'biggestHit', 'M'], [`${NM('slyDeal')} / ${NM('forcedDeal')}成功`, 'steals', ''], [`${NM('dealBreaker')}成功`, 'setsStolen', ''], [`打出${AN('justSayNo')}`, 'justSayNo', '']];
    if (v.rules.gamble) rows.push(['赌一把（赢 / 次）', 'bets', '']);
    const cell = (P, k, u) => (k === 'bets' ? `${P.stats.betsWon || 0} / ${P.stats.bets || 0}` : `${P.stats[k]}${u}`);
    const want = S.info ? S.info.rematch : [false, false];
    const main = oppGone() ? '<button class="btn primary" data-do="rematch-new">重新匹配</button>' : want[i] ? `<button class="btn primary" disabled>等 ${esc(v.players[o].name)} 确认</button>` : `<button class="btn primary${want[o] ? ' nudge' : ''}" data-do="rematch">${want[o] ? `${esc(v.players[o].name)} 想再来一局，开始` : '再来一局'}</button>`;
    const score = S.info && S.info.score ? S.info.score : null;
    // 刚在眼前结束的这一局：赢家的分先停在加分前，面板弹出 450ms 后跳到新分、弹一下、响一声（只跳一次，之后重画直接是新分）
    const rd = S.info ? S.info.round : 0;
    const shown = score ? score.slice() : null;
    if (score && r.winner != null && S.justOver === rd && S.scoreTicked !== rd) {
      S.scoreTicked = rd;
      const w = r.winner;
      shown[w] = Math.max(0, score[w] - (r.stake || 1));
      setTimeout(() => {
        const b = S.sheet && S.sheet.type === 'over' && $$('.sheet .scoreline b')[w === i ? 0 : 1];
        if (!b || !S.info || !S.info.score) return;
        b.textContent = S.info.score[w];
        bumpEl(b, 1.45);
        sound.play(w === i ? 'coin' : 'tick');
      }, 450);
    }
    const scoreline = score ? `<div class="scoreline" aria-label="本房间比分 ${score[i]} 比 ${score[o]}"><span class="nm">${esc(v.players[i].name)}</span><b>${shown[i]}</b><span>:</span><b>${shown[o]}</b><span class="nm">${esc(v.players[o].name)}</span></div>` : '';
    const badges = titlesFor(v.players[i], r.winner === i, r.turn, r.reason);
    const streak = winStreak(r.winner);
    if (r.winner === i && streak >= 2) badges.unshift({ icon: ICON.bolt, text: `连胜 ×${streak}`, hot: true });
    if (r.winner === i && r.stake >= 4) badges.unshift({ icon: ICON.dice, text: `豪赌：×${r.stake} 拿下`, html: `豪赌：${multHTML(r.stake)} 拿下`, hot: true });
    const won = (v.players[i].awards || []).slice();
    if (S.info && (S.info.emoteAward ? S.info.emoteAward[i] : S.info.emotes && S.info.emotes[i] > 5)) won.push('emoteMaster'); // 旧后端没有 emoteAward：按本局表情数
    const awardBadges = won.filter((k) => AWARD_INFO[k]).map((k) => ({ icon: artOK(k) ? `<img class="ico" src="${artUrl(k)}" alt="" decoding="sync" draggable="false" data-art="${k}">` : ICON.crown, text: AWARD_INFO[k].name, hot: true }));
    const all = awardBadges.concat(badges);
    const badgeRow = all.length ? `<div class="badges">${all.slice(0, 6).map((b) => `<span class="badge${b.cool ? ' cool' : ''}${b.hot ? ' hot' : ''}">${b.icon}${b.html ? `<span>${b.html}</span>` : esc(b.text)}</span>`).join('')}</div>` : '';
    const rec = S.info && S.info.mode === 'match' ? matchRec() : null;
    const recLine = rec && rec.g ? `<p class="sub mrec">匹配战绩：${rec.w} 胜 ${rec.g - rec.w} 负${rec.streak >= 2 ? ` · 连胜 ${rec.streak}` : ''}${r.winner === i ? '' : ' · 再来一局赢回来'}</p>` : '';
    return `<h3>${esc(title)}</h3><p class="sub">${esc(why)}共 ${r.turn} 回合。</p>${recLine}${endNote(v, r, streak)}${scoreline}${badgeRow}
      <table class="stats"><thead><tr><th></th><th>${esc(v.players[i].name)}</th><th>${esc(v.players[o].name)}</th></tr></thead><tbody>${rows.map(([t, k, u]) => `<tr><td>${t}</td><td>${cell(v.players[i], k, u)}</td><td>${cell(v.players[o], k, u)}</td></tr>`).join('')}</tbody></table>
      <div class="acts two">${main}${btnDo('回到首页', 'leave')}</div>${S.info && S.info.mode === 'match' && !oppGone() ? '<div class="foot"><button class="link" data-do="rematch-new">换个对手</button></div>' : ''}`;
  },

  menu() {
    const inGame = S.snap && V().phase !== 'gameOver';
    return `<h3>菜单</h3><div class="menu">
      <button data-do="log">对局记录</button>
      ${S.snap ? `<button class="kv" data-do="discard-pile">弃牌区 · ${V().discardCount} 张<span>牌堆还剩 ${V().deckCount} 张</span></button>` : ''}
      <button data-do="rules">玩法速览</button>
      <button class="sw" data-do="autosort" role="switch" aria-checked="${S.autoSort}">自动理牌<span>${S.autoSort ? '开' : '关'}</span></button>
      <button data-do="sound">${sound.on ? '关闭声音' : '打开声音'}</button>
      <button data-do="copy-link">复制邀请链接</button>
      <button data-do="check-cards">检查资源（卡图、成就、大乐透）</button>
      <div class="sep" aria-hidden="true"></div>
      ${inGame ? '<button class="danger" data-do="resign">认输</button>' : ''}
      <button data-do="leave">离开房间（之后用链接还能回来）</button>
    </div>`;
  },

  // 电力说明：点名字旁边的闪电打开
  power(sh) {
    const v = V();
    const P = v.players[sh.p];
    if (!P || P.power == null) return '';
    const r = v.rules;
    const mine = sh.p === me();
    const now = v.turn.player === sh.p && v.phase !== 'gameOver';
    const rows = [];
    const bar = (a, b) => `<span class="bar"><i style="width:${Math.min(100, Math.round((a / b) * 100))}%"></i></span>`;
    if (r.power) {
      rows.push(`<li><b>${P.power / 2} / ${r.powerCap} 点</b>${P.power >= r.powerCap * 2 ? '：已满，再失去也不加' : ''}</li>`);
      rows.push(`<li>电力保险：每失去 ${r.insuranceStep}M（付出去的钱、被偷 / 被抢 / 被毁的地产都算）+0.5。已经失去 ${P.lost}M，再失去 ${r.insuranceStep - P.lost}M 就 +0.5。${bar(P.lost, r.insuranceStep)}</li>`);
      if (P.surge) {
        const n = P.surge.left + (now && P.surge.since === v.turn.number ? 1 : 0);
        rows.push(`<li><b>满格加成中：收租 ×${r.surgeMult}</b>（不论是否成套），还剩 ${n} 个${now ? '回合（含这回合）' : '自己的回合'}，结束时电力清零。</li>`);
      } else {
        rows.push(`<li>攒满 ${r.powerCap} 点：立刻开始满格加成，收租 ×${r.surgeMult}（不论是否成套），持续到之后第 ${r.surgeTurns} 个自己的回合结束，然后电力清零。电力不会自然减少。</li>`);
      }
    }
    if (r.lottery) rows.push(`<li>大乐透：每次收租都有机会额外中 ${r.lotteryMin}–${r.lotteryMax}M。</li>`);
    if (r.tycoon && P.grab != null) {
      const t = v.tycoon;
      if (!t) rows.push(`<li>贪婪大亨：每局最先累计从对方那里拿到超过 ${r.tycoonAt}M 地产的人触发一次（偷、抢来的，强买强卖换来的，对方用地产付给你的都算）。现在累计 ${P.grab}M。${bar(P.grab, r.tycoonAt + 1)}</li>`);
      else if (t.player === sh.p) rows.push(t.mode === 'vampire' ? `<li><b>贪婪大亨 · 吸血中</b>：对方每往银行存 ${r.vampireStep}M，你白拿 1M${t.owed ? `（还欠你 ${t.owed}M，牌堆里有钱就补）` : ''}；对方向你收的钱、用${NM('bankruptcy') ? `「${NM('bankruptcy')}」` : '破产'}拿你的钱都只算一半。</li>` : t.mode === 'cash' ? '<li>贪婪大亨：已经套现。</li>' : '<li>贪婪大亨：正在选择吸血还是套现。</li>');
      else rows.push(`<li>贪婪大亨这局已经被对方触发了${t.mode === 'vampire' ? '：对方在吸血，你每往银行存 ' + r.vampireStep + 'M 对方白拿 1M，你向对方收的钱只算一半' : ''}。</li>`);
    }
    if (r.ghostKit && P.haul != null) {
      rows.push(`<li>捉鬼套装：累计从对方拿走 / 让对方失去的面值超过 ${P.ghostBar}M 就拉一把老虎机：转出三个钱袋多拿两张${NM('debtCollector') ? `「${NM('debtCollector')}」` : '讨债人'}，转不出来就失去随机颜色的一张地产（没有地产可丢就弃掉全部手牌，下回合摸的 5 张都是 1M）。触发后累计清零，门槛 +${r.ghostStep}M。现在累计 ${P.haul}M。${bar(P.haul, P.ghostBar)}</li>`);
      if (P.curse > 0) rows.push(`<li><b>下回合开始摸的 ${P.curse} 张都是 1M。</b></li>`);
    }
    return `<h3>${esc(r.power ? (mine ? '你的电力' : `${P.name} 的电力`) : mine ? '你的状态' : `${P.name} 的状态`)}</h3>${r.power ? `<div class="pwbig">${boltsHTML(P.power, r.powerCap)}</div>` : ''}<ul class="pwrows">${rows.join('')}</ul>`;
  },

  rules() {
    const A = (k) => `「${NM(k)}」`;
    return `<h3>玩法速览</h3><ol class="rules">
      <li>先凑齐 ${S.snap ? V().rules.setsToWin : 3} 套不同颜色的完整地产就赢。</li>
      <li>每回合先摸 2 张（手里没牌摸 5 张），最多出 3 张；出满会自动结束回合，没出满也可以提前点「结束回合」。</li>
      ${S.snap && V().rules.auction ? '<li>秘密竞价：双方同时有同一种颜色的完整套时触发。双方各从银行里挑钱暗标出价（看不到对方出了多少），出价高的拿走双方的钱，并毁掉对方那套；一样多就各自退回。同一段"双方都有"只竞价一次。</li>' : ''}
      ${S.snap && V().rules.casinoGift ? `<li>赌场礼赠：连续 ${V().rules.giftStreak} 次押 ×4 赌一把（输赢都算，押一次 ×2 就重新数），下回合开始拿到一份礼盒，自己打开或送给对方（对方强制打开）。开盒可能是坏结果：清空打开方的银行和地产，或抵押他租金最高的一套；也可能是好结果：一整套地产、4 种颜色的地产各一张、一张 10M 行动卡、一张行动卡、两张${A('justSayNo')}、两张全色租金或银行进账 20M。</li><li>抵押：抵押中的那套收不了租、不算胜利套数；满 ${V().rules.mortgageTurns} 回合后付原价租金赎回，之前赎回付双倍（点那套地产赎回，不占出牌次数）。</li>` : ''}
      ${S.snap && V().rules.power ? `<li>电力（名字旁边的闪电，上限 ${V().rules.powerCap} 点，不会自然减少）：每失去 ${V().rules.insuranceStep}M +0.5（电力保险：付出去的钱、被偷 / 被抢 / 被毁的地产都算），到上限后溢出的不算。攒满 ${V().rules.powerCap} 点立刻开始满格加成：收租 ×${V().rules.surgeMult}（不论是否成套），持续到之后第 ${V().rules.surgeTurns} 个自己的回合结束，然后电力清零。</li>` : ''}
      ${S.snap && V().rules.ghostKit ? `<li>捉鬼套装：累计从对方拿走 / 让对方失去的面值（收到的付款、偷 / 抢 / 毁掉的地产、${A('bankruptcy')}拿走的钱、竞价赢来的……；${A('forcedDeal')}是交换不算）超过门槛就拉一把老虎机：转出三个钱袋多拿两张${A('debtCollector')}，转不出来就失去随机颜色的一张地产；没有地产可丢就弃掉全部手牌，下回合开始摸的 5 张都是 1M。门槛第 1 次 ${V().rules.ghostStep}M，每触发一次 +${V().rules.ghostStep}M（${V().rules.ghostStep}、${V().rules.ghostStep * 2}、${V().rules.ghostStep * 3}M……），触发后累计清零。</li>` : ''}
      ${S.snap && V().rules.tycoon ? `<li>贪婪大亨（每局只触发一次）：最先累计从对方那里拿到超过 ${V().rules.tycoonAt}M 地产的人触发（${A('slyDeal')}、${A('dealBreaker')}抢来的，${A('forcedDeal')}换来的，对方用地产付给你的都算）。二选一——吸血：直到这局结束，对方每往银行存 ${V().rules.vampireStep}M 你白拿 1M，对方向你收的钱、用${A('bankruptcy')}拿你的钱都只算一半（向上取整）；套现：马上拿两张全色租金，再按你现有地产总值的${pctText(V().rules.tycoonCash)}存进银行。</li>` : ''}
      ${S.snap && V().takeover ? `<li>恶意收购（每局只触发一次）：开局随机定一种颜色（这局是${COLOR(V().takeover.color).zh}），谁先集齐这种颜色的完整套就触发——双方的银行和地产（连同房屋、旅馆）全部按面值折成筹码，触发的人先玩轮盘赌、另一个人后玩。每人至少 1 局、最多 ${V().rules.rouletteSpins} 局，每局押 ${V().rules.rouletteMin}–${V().rules.rouletteMax}M：押红 / 黑 / 单 / 双，中了押的筹码翻倍；押一个数字，中了 ×5、立即结束，还拿到每种颜色的地产各一张和一张 10M 行动卡；开出绿色 0 筹码清零、立即结束。每局开奖后可以带着筹码离开，筹码换成钱存进银行。</li>` : ''}
      ${S.snap && V().rules.sale ? `<li>拍卖（每局最多一次）：双方桌上同时有两种以上相同颜色的地产时有机会触发（只掷一次，没触发这局就没有了）。系统从双方都有的颜色里挑一种，拿一张这种颜色的地产公开拍卖：起拍价 0，双方轮流出价，每次至少加 1M，只能用银行里的钱。开拍 ${V().rules.saleOpenSeconds} 秒没人出价就流拍；有人出价后 ${V().rules.saleHoldSeconds} 秒没人加价就成交（加价不封顶，整场最长 ${V().rules.saleMaxMinutes} 分钟）。成交后从银行里付钱（不找零），地产进拍得的人的地产区。</li>` : ''}
      ${S.snap && (V().rules.auction || V().rules.casinoGift) ? `<li>一回合只触发一个机制：追赶、赌一把、大乐透、秘密竞价、赌场礼赠${V().rules.sale ? '、拍卖' : ''}，同一回合里最多出现一个，互不叠加。${V().rules.power || V().rules.ghostKit || V().rules.tycoon ? `电力、捉鬼套装、贪婪大亨${V().takeover ? '、恶意收购' : ''}是规则后果，不占这个名额。` : ''}</li>` : ''}
      ${S.snap && V().turn.lapsed != null ? `<li>出牌不限时。被收钱 / 被针对时的回应、回合结束时的弃牌有时限（${S.clock && S.clock.kind !== 'play' ? Math.round(S.clock.total / 1000) : 25} 秒），超时自动接受 / 按建议付款 / 按建议弃牌，不会替你出「反对行动」。</li>` : ''}
      <li>钱和行动卡可以存进银行；地产只能摆到桌上。</li>
      <li>被收钱时用桌上的牌付（银行或地产都行），不找零；付出去的地产归对方。</li>
      <li>对方对你出行动卡时，可以打${A('justSayNo')}挡掉，对方也能再反对回来。</li>
      <li>完整套上可以放${A('house')}（租金 +3M），再放${A('hotel')}（再 +4M）。</li>
      <li>回合结束时手牌最多 7 张，多出来的要弃掉。</li>
      ${S.snap && V().rules.gamble ? '<li>赌一把：打出租金、讨债人或生日时可以押 ×2 或 ×4，然后拉一把老虎机：三个转轮转出三个一样就赢，这次收的钱翻倍或变四倍；转不出来这张牌作废。押得越大越难中。每回合最多一次，双方规则一样，结果由服务器决定。</li>' : ''}
      ${S.snap && V().rules.lottery ? `<li>大乐透：每次收租结算时都有机会额外中一笔 ${V().rules.lotteryMin}–${V().rules.lotteryMax}M 的彩票奖金，从牌堆和弃牌堆里的钱凑出来，直接进银行。双方都一样。</li>` : ''}
      <li>成就（每局每人每项一次，只是荣誉；都只在自己的一个回合内计数）：超级大盗（一回合内让对方损失超过 10M，或抢走一整套）、破坏大师（一回合内把对方桌上的地产清空）、超级金库（一回合内搬空对方银行，或让自己的银行超过 30M）、表情大师（一回合内发 5 个以上表情）。</li>
      ${S.snap && V().rules.jackpot ? `<li>奖池：每次有人赌输，奖池 +1 张（最多 ${V().rules.potMax} 张）；下一个押 ×4 赌赢的人把奖池里的牌全部摸走。</li>` : ''}
      ${S.snap && V().rules.doubling ? `<li>加注：在自己回合开始、还没出牌时，可以点底栏的金色筹码把这局分值翻倍（最高 ×${V().rules.maxStake}）。对方跟注就继续打，之后只有跟注的一方能再加注；对方弃牌就直接输掉这局，按加注前的分值算。房间比分按分累计。</li>` : ''}
      ${S.snap && V().rules.comeback ? `<li>追赶机制（双方规则一样，只帮落后的一方，满足条件时有机会触发）：落后两套以上时，回合开始多摸 1 张（逆风补给）；对方只差一套就赢时，你这回合可以出 4 张（背水一战）。</li>` : ''}
      <li>三张特殊行动卡（面值都是 10M，都能被${A('justSayNo')}挡下）：${A('bankruptcy')}拿走对方银行全部；${A('liquidation')}清空对方一整套完整地产并弃掉他全部手牌；${A('hugeWin')}让对方所有地产消失，你现有的完整套下次收租 ×4（只对那次收租选的一套生效一次）。</li>
      <li>手牌往上拖到桌上就能直接打出，拖到自己的银行就是存钱；长按任意一张牌可以放大看清楚。</li>
    </ol>`;
  },

  claim() {
    const aw = oppAway();
    return `<h3>判你获胜？</h3><p class="sub">${esc(nameOf(opp()))} 已经离线 ${fmtDur(aw || 0)}。判胜后这一局按对方认输结算。</p><div class="acts two">${btnDo('再等等', 'close-sheet')}${btnDo('判我获胜', 'claim-confirm', 'gold')}</div>`;
  },
  leave() {
    return `<h3>离开这一局？</h3><p class="sub">对局会保留 24 小时。之后打开邀请链接，或者在首页点「继续」，都能回到原来的座位。</p><div class="acts two">${btnDo('离开', 'leave-confirm')}${btnDo('留下', 'close-sheet', 'primary')}</div>`;

function winStreak(winner) {
  if (winner == null || !S.room) return 0;
  const hist = (store.get('hist', {}) || {})[S.room.id] || [];
  let k = 0;
  for (let j = hist.length - 1; j >= 0 && hist[j] === winner; j--) k++;
  return k;
}
function recordWinner(winner) {
  if (!S.room) return;
  const all = store.get('hist', {}) || {};
  const list = (all[S.room.id] || []).slice(-19);
  list.push(winner);
  all[S.room.id] = list;
  store.set('hist', all);
}
// 结算时给输的一方一句体面、具体的话，给赢的一方一点余味（峰终定律：结尾决定整局的感受）
function endNote(v, r, streak) {
  const i = me();
  const need = v.rules.setsToWin;
  const mine = v.players[i].fullColors.length;
  const t = []; // 一句一行：中文自动平衡换行会把词拆开
  if (r.winner === i) {
    if (r.reason === 'fold') t.push(`对方不敢跟注，${r.stake} 分到手。`);
    if (streak >= 2) t.push(`已经连赢 ${streak} 局，手感正好。`);
  } else if (r.winner != null) {
    if (r.reason === 'fold') t.push(`弃牌止损：这局只丢 ${r.stake} 分（跟注再输就是 ${r.stake * 2} 分）。`);
    else if (r.reason === 'sets' && mine === need - 1) t.push(`差一点！你也凑齐了 ${mine} 套。`);
    else if (mine > 0) t.push(`你凑齐了 ${mine} 套，下一局再来。`);
    else t.push('这局手气不在你这边，下一局扳回来。');
    if (streak >= 2) t.push(`对方已经连赢 ${streak} 局，扳回来？`);
  }
  return t.length ? `<p class="endnote">${t.map(esc).join('<br>')}</p>` : '';
}

function titlesFor(P, won, turns, reason) {
  const st = P.stats;
  const out = [];
  if (won && turns <= 12 && reason === 'sets') out.push({ icon: ICON.bolt, text: `闪电战：${turns} 回合拿下` });
  if (st.biggestHit >= 8) out.push({ icon: ICON.coin, text: `收租王：一次收了 ${st.biggestHit}M` });
  if (st.setsStolen >= 1) out.push({ icon: ICON.crown, text: `大盗：抢下 ${st.setsStolen} 整套` });
  if (st.steals >= 2) out.push({ icon: ICON.hand, text: `妙手：偷换成功 ${st.steals} 次` });
  if (st.justSayNo >= 2) out.push({ icon: ICON.shield, text: `铁壁：反对了 ${st.justSayNo} 次`, cool: true });
  if (st.betsWon >= 2) out.push({ icon: ICON.dice, text: `赌神：赌赢 ${st.betsWon} 次`, hot: true });
  if (st.received >= 20) out.push({ icon: ICON.coin, text: `财神：一共收了 ${st.received}M` });
  if (!won && st.paid >= 12) out.push({ icon: ICON.shield, text: `扛住了 ${st.paid}M 的进攻`, cool: true });
  return out.slice(0, 3);
}

// 银行里凑够 amount 的最小组合：总额尽量小，一样小时张数尽量少
function cheapestBank(ids, amount) {
  const best = new Map([[0, []]]);
  for (const id of ids) {
    const val = CARD(id).value;
    for (const [t, arr] of Array.from(best.entries())) { const cur = best.get(t + val); if (!cur || cur.length > arr.length + 1) best.set(t + val, arr.concat(id)); }
  }
  let pick = null;
  let tot = Infinity;
  for (const [t, arr] of best) if (t >= amount && (t < tot || (t === tot && arr.length < pick.length))) { pick = arr; tot = t; }
  return pick || ids.slice();
}

/* ═══════════ 选目标 ═══════════ */
function startTarget(cardId) {
  const h = O().hand.find((x) => x.cardId === cardId);
  if (!h || !h.play) return;
  const p = h.play;
  const T = { cardId, kind: p.kind };
  switch (p.kind) {
    case 'slyDeal': Object.assign(T, { by: 'card', owner: opp(), valid: new Set(p.targets), prompt: '点对方桌上要拿走的地产' }); break;
    case 'forcedDeal': Object.assign(T, { by: 'card', owner: me(), valid: new Set(p.give), step: 'give', take: p.take, prompt: '先点你要交出去的地产' }); break;
    case 'dealBreaker': Object.assign(T, { by: 'set', owner: opp(), valid: new Set(p.targets), prompt: '点对方要抢的那一整套' }); break;
    case 'liquidation': Object.assign(T, { by: 'set', owner: opp(), valid: new Set(p.targets), prompt: '点对方要清算的那一整套' }); break;
    case 'house':
    case 'hotel': Object.assign(T, { by: 'set', owner: me(), valid: new Set(p.setIds), prompt: `点要放${NM(p.kind)}的那一套` }); break;
    default: return;
  }
  S.target = T;
  S.sel = null;
  closeSheet();
  render();
}

function pickTarget(kind, id, owner) {
  const T = S.target;
  if (!T || T.owner !== owner || T.by !== kind || !T.valid.has(id)) return false;
  if (T.kind === 'forcedDeal' && T.step === 'give') {
    Object.assign(T, { step: 'take', give: id, owner: opp(), valid: new Set(T.take), prompt: '再点对方要换过来的地产' });
    render();
    return true;
  }
  const a = { type: 'PLAY_ACTION', cardId: T.cardId };
  if (T.kind === 'slyDeal') a.targetCardId = id;
  else if (T.kind === 'forcedDeal') Object.assign(a, { giveCardId: T.give, targetCardId: id });
  else if (T.kind === 'dealBreaker' || T.kind === 'liquidation') a.targetSetId = id;
  else a.setId = id;
  S.target = null;
  act(a);
  return true;
}

document.addEventListener('pointerdown', () => sound.unlock(), { passive: true });
// iOS 只认 touchend / click 里的解锁；切回前台后声音也要在下一次触摸时恢复
document.addEventListener('touchend', () => sound.unlock(), { passive: true });
// iOS：对局中双指捏合会把整页放大、牌桌跑出屏幕（长按卡牌本来就能放大看）
document.addEventListener('gesturestart', (e) => { if (S.screen === 'game') e.preventDefault(); });
// 旧版 iOS（15 及以下）不认 overscroll-behavior：在页面顶部往下拉时拦住，不让 Safari 下拉刷新把对局刷掉
if (!(window.CSS && CSS.supports && CSS.supports('overscroll-behavior', 'none'))) {
  let ty = 0;
  document.addEventListener('touchstart', (e) => { ty = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (S.screen !== 'game' || e.touches.length !== 1 || window.scrollY > 0 || e.touches[0].clientY <= ty || e.target.closest('.sbody')) return;
    e.preventDefault();
  }, { passive: false });
}
// iOS Safari 只有在页面监听了 touchstart 时才会给按钮套用 :active，没有这一行，所有"按下缩一下"的反馈在 iPhone 上都不出现
document.addEventListener('touchstart', () => {}, { passive: true });
document.addEventListener('click', (e) => {
  if (e.target.id === 'md-haptic' || e.target.htmlFor === 'md-haptic') return; // 触感开关的程序点击，不是用户点的
  if ($('#pop') && !e.target.closest('#pop') && !e.target.closest('[data-do="emotes"]')) closeEmotes();
  const el = e.target.closest('[data-do]');
  if (!el || el.disabled || !el.dataset.do) return;
  const fn = DO[el.dataset.do];
  if (!fn) return;
  if (S.busy && el.dataset.do === 'act') return;
  // 同一张牌既是牌又在组里：点牌优先
  if (el.dataset.do === 'set' && e.target.closest('[data-do="card"]') && !(S.target && S.target.by === 'set')) return;
  fn(el, e);
});
document.addEventListener('keydown', (e) => {

  if (e.key === 'Enter' && e.target.id === 'code') DO['join-code']();
  if (e.key === 'Enter' && e.target.id === 'name' && S.screen === 'home') DO.create($('[data-do="create"]'));

});

// 匹配超时：请 AI 对手入座（它坐下后服务器会推开局，自动进入牌桌）
async function callBot(roomId) {
  if (!S.match || S.match.roomId !== roomId || S.screen !== 'matching' || !S.room) return;
  S.match.bot = true;
  render();
  try { await api(`/api/rooms/${roomId}/bot`, { token: S.room.token, rec: matchRec() }); } catch (e) { notice('匹配失败：' + e.message, 'err'); }
}
// 自己的匹配战绩（只存在这台设备上，全球匹配的对局都算）：结束页显示，服务器也按它调 AI 对手的牌力
const matchRec = () => Object.assign({ g: 0, w: 0, streak: 0 }, store.get('mrec', null) || store.get('airec', {}));
function recordMatch(winner) {
  if (!S.room || !S.info || S.info.mode !== 'match' || winner == null) return;
  const key = `${S.room.id}#${S.info.round}`;
  const r = matchRec();
  if (r.last === key) return;
  const won = winner === me();
  r.g += 1;
  if (won) r.w += 1;
  r.streak = won ? Math.max(1, r.streak + 1) : Math.min(-1, r.streak - 1);
  r.last = key;
  store.set('mrec', r);
}
// 对手说的话：名字旁边弹一个对话气泡
function sayBubble(seat, text) {
  if (!S.room || !S.snap || S.screen !== 'game') return;
  const mine = seat === me();
  const av = nameEl(seat);
  if (!av) return;
  const r = av.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'say' + (mine ? '' : ' down');
  el.textContent = text;
  fxLayer.appendChild(el);
  const x = Math.max(8, Math.min(innerWidth - el.offsetWidth - 8, r.left));
  el.style.left = x + 'px';
  el.style.top = Math.max(4, mine ? r.top - el.offsetHeight - 4 : r.bottom + 4) + 'px';
  speak(`${nameOf(seat)}：${text}`);
  sound.play('pop');
  const out = () => el.remove();
  if (!motionOK()) { setTimeout(out, 3600); return; }
  el.animate([{ opacity: 0, transform: 'translateY(-6px) scale(.9)' }, { opacity: 1, transform: 'none', offset: 0.08 }, { opacity: 1, transform: 'none', offset: 0.9 }, { opacity: 0, transform: 'translateY(-4px)' }], { duration: 3600, easing: EASE_OUT }).onfinish = out;
}

/* ═══════════ 实时聊天 ═══════════
 * 服务器存最近 60 条，连上时整段下发（chatlog）。自己发的先显示成半透明，服务器带着同一个 cid 广播回来时转正；
 * 被限速打回来的标红。对方的消息：面板没开时从他名字旁边冒个气泡、聊天按钮上记未读；可以一键屏蔽。 */
const CHAT_QUICK = ['你好 👋', '好牌！', '手气真好', '稍等一下', '再来一局？', 'GG'];
// Telegram 表情包：清单和图片都从自己的后端拿（后端拿着机器人 token 去 Telegram 取），浏览器碰不到 token，国内也能看。
// 三种贴纸都会动：静态的是 webp；视频贴纸用 <video>；动画贴纸（Lottie）用 lottie 播放器画。先摆静态缩略图，
// 滑到看得见的地方才开始播、看不见就停（省电）；播放器加载失败、浏览器放不了、系统设置了减少动态效果时就停在缩略图。
const LOTTIE = { v: '5.13.0', sri: 'sha384-Gr3FGWSrOz4fzm9bvrWwhuQH87JMUCLlOTaHhpddbnlHHWCZPxMeQ3KUPsomzIii', cdn: 'https://cdn.jsdelivr.net/npm/lottie-web@5.13.0/build/player/lottie_light.min.js' };
const stickers = {
  sets: null,
  tab: 0,
  open: false,
  loading: null,
  live: new Set(), // 在页面上、交给观察器管着的动态贴纸
  io: null,
  json: new Map(), // 动画数据（id → Promise<文本>），最多留 40 个
  playerP: null,
  url: (id, thumb) => `${API}/api/stickers/img/${encodeURIComponent(id)}${thumb ? '?thumb=1' : ''}`,
  load() {
    if (this.sets) return Promise.resolve(this.sets);
    if (!this.loading) this.loading = api('/api/stickers', null, 1).then((r) => { this.sets = (r.sets || []).filter((x) => x.stickers && x.stickers.length); return this.sets; }).catch(() => { this.loading = null; return []; });
    return this.loading;
  },
  // 一张表情的 HTML。size：grid = 面板里的格子（静态的用缩略图省流量）/ msg = 聊天记录 / big = 弹出的大表情
  html(st, size) {
    const alt = esc(st.emoji || '表情');
    const cls = `stk${size === 'big' ? ' big' : ''}`;
    if (st.kind === 'video') return `<video class="${cls}" src="${this.url(st.id)}" poster="${this.url(st.id, true)}" preload="none" loop muted playsinline disablepictureinpicture aria-label="${alt}"></video>`;
    if (st.kind === 'animated') return `<span class="${cls} lot" data-lot="${esc(st.id)}" role="img" aria-label="${alt}"><img src="${this.url(st.id, true)}" alt="" decoding="async" draggable="false"></span>`;
    return `<img class="${cls}" src="${this.url(st.id, size === 'grid')}" alt="${alt}" loading="lazy" decoding="async" draggable="false">`;
  },
  // Lottie 播放器：先从自己的后端取（后端核对过指纹），不行再走 jsDelivr；两边都用 integrity 再核一遍
  player() {
    if (window.lottie && window.lottie.loadAnimation) return Promise.resolve(window.lottie);
    if (!this.playerP) {
      this.playerP = new Promise((res, rej) => {
        const srcs = [`${API}/api/stickers/player.js?v=${LOTTIE.v}`, LOTTIE.cdn];
        const next = (i) => {
          if (i >= srcs.length) { rej(new Error('lottie')); return; }
          const sc = document.createElement('script');
          sc.src = srcs[i];
          sc.integrity = LOTTIE.sri;
          sc.crossOrigin = 'anonymous';
          sc.async = true;
          sc.onload = () => (window.lottie && window.lottie.loadAnimation ? res(window.lottie) : next(i + 1));
          sc.onerror = () => { sc.remove(); next(i + 1); };
          document.head.appendChild(sc);
        };
        next(0);
      });
      this.playerP.catch(() => setTimeout(() => { this.playerP = null; }, 60000)); // 都失败：一分钟内不再试，先显示静态图
    }
    return this.playerP;
  },
  data(id) {
    let p = this.json.get(id);
    if (!p) {
      p = fetch(`${API}/api/stickers/anim/${encodeURIComponent(id)}`).then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.text(); });
      p.catch(() => this.json.delete(id));
      this.json.set(id, p);
      if (this.json.size > 40) this.json.delete(this.json.keys().next().value);
    }
    return p;
  },
  // 把 root 里的视频 / 动画贴纸交给观察器：看得见就播，看不见就停；顺手清掉已经不在页面上的
  mount(root) {
    if (!root || !window.IntersectionObserver) return;
    if (!this.io) this.io = new window.IntersectionObserver((es) => es.forEach((e) => this.seen(e.target, e.isIntersecting)), { threshold: 0.01 });
    root.querySelectorAll('.stk.lot, video.stk').forEach((el) => { if (!this.live.has(el)) { this.live.add(el); this.io.observe(el); } });
    this.sweep();
  },
  seen(el, vis) {
    if (!el.isConnected) { this.drop(el); return; }
    el.mdVis = vis;
    const go = vis && motionOK();
    if (el.tagName === 'VIDEO') {
      if (go) { const p = el.play(); if (p && p.catch) p.catch(() => {}); } else el.pause();
      return;
    }
    if (!go) { if (el.mdAnim) el.mdAnim.pause(); return; }
    if (el.mdAnim) { el.mdAnim.play(); return; }
    if (el.mdBusy) return;
    el.mdBusy = true;
    Promise.all([this.player(), this.data(el.dataset.lot)]).then(([L, txt]) => {
      if (!el.isConnected || !this.live.has(el) || el.mdAnim) return;
      const a = L.loadAnimation({ container: el, renderer: 'svg', loop: true, autoplay: false, animationData: JSON.parse(txt), rendererSettings: { preserveAspectRatio: 'xMidYMid meet' } });
      el.mdAnim = a;
      const shown = () => el.classList.add('on');
      if (a.isLoaded) shown(); else a.addEventListener('DOMLoaded', shown);
      if (el.mdVis && motionOK()) a.play();
    }).catch(() => {}).finally(() => { el.mdBusy = false; });
  },
  drop(el) {
    if (el.mdAnim) { try { el.mdAnim.destroy(); } catch { /* 已经销毁 */ } el.mdAnim = null; }
    if (el.tagName === 'VIDEO') el.pause();
    this.live.delete(el);
    if (this.io) this.io.unobserve(el);
  },
  sweep() { for (const el of this.live) if (!el.isConnected) this.drop(el); },
  unmount(root) { root.querySelectorAll('.stk.lot, video.stk').forEach((el) => this.drop(el)); },
  paint() {
    const box = $('#stkpanel');
    if (!box) return;
    box.hidden = !this.open;
    if (!this.open) { this.sweep(); return; }
    if (!this.sets) { box.innerHTML = '<p class="empty">表情包加载中…</p>'; return; }
    if (!this.sets.length) { box.innerHTML = '<p class="empty">还没接入表情包</p>'; return; }
    const k = Math.min(this.tab, this.sets.length - 1);
    const tabs = this.sets.length > 1 ? `<div class="stktabs" role="tablist">${this.sets.map((x, i) => `<button class="chip${i === k ? ' on' : ''}" role="tab" aria-selected="${i === k}" data-do="stk-set" data-v="${i}">${esc(x.title)}</button>`).join('')}</div>` : '';
    box.innerHTML = tabs + `<div class="stkgrid">${this.sets[k].stickers.map((x) => `<button class="stkbtn" data-do="stk-send" data-id="${esc(x.id)}" data-emoji="${esc(x.emoji)}" data-kind="${esc(x.kind)}" aria-label="发送表情 ${esc(x.emoji)}">${this.html(x, 'grid')}</button>`).join('')}</div>`;
    this.mount(box);
  },
};
window.mdStickers = Object.freeze({ live: () => [...stickers.live] }); // 只读：页面上正被管着的动态表情（调试 / 自动化测试看这里）
// 对方发来的表情：面板没开时，从他名字旁边弹出一张大的
function stickerPop(seat, st) {
  if (!S.room || !S.snap || S.screen !== 'game') return;
  const mine = seat === me();
  const av = nameEl(seat);
  if (!av) return;
  const r = av.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'stkpop' + (mine ? '' : ' down');
  el.innerHTML = stickers.html(st, 'big');
  fxLayer.appendChild(el);
  stickers.mount(el);
  el.style.left = Math.max(8, Math.min(innerWidth - 140, r.left)) + 'px';
  el.style.top = Math.max(4, mine ? r.top - 140 : r.bottom + 6) + 'px';
  speak(`${nameOf(seat)} 发了一个表情 ${st.emoji || ''}`);
  sound.play('pop');
  const out = () => { stickers.unmount(el); el.remove(); };
  if (!motionOK()) { setTimeout(out, 3200); return; }
  el.animate([{ opacity: 0, transform: 'scale(.4) rotate(-8deg)' }, { opacity: 1, transform: 'scale(1.08) rotate(3deg)', offset: 0.12 }, { transform: 'scale(1) rotate(0)', offset: 0.2 }, { opacity: 1, offset: 0.88 }, { opacity: 0, transform: 'scale(.9)' }], { duration: 3200, easing: EASE_OUT }).onfinish = out;
}
const chat = {
  list: [],
  unread: 0,
  mute: false,
  reset() { this.list = []; this.unread = 0; this.mute = false; },
  load(list) {
    const pend = this.list.filter((x) => x.pending);
    this.list = (list || []).concat(pend);
    this.paint();
  },
  add(m, cid) {
    const k = cid ? this.list.findIndex((x) => x.cid === cid) : -1;
    if (k >= 0) this.list[k] = Object.assign({}, m, { cid }); // 留着 cid：聊天记录里这一行原地变成"已送达"，不用整列重画
    else if (!this.list.some((x) => x.id === m.id)) this.list.push(m);
    else return;
    if (this.list.length > 80) this.list.splice(0, this.list.length - 80);
    const mine = S.room && m.seat === S.room.seat;
    if (!mine && !this.mute) {
      if (S.sheet && S.sheet.type === 'chat') sound.play('pop');
      else { this.unread++; this.badge(); if (m.sticker) stickerPop(m.seat, m.sticker); else sayBubble(m.seat, m.text); haptic('light'); }
    }
    this.paint();
  },
  reject(cid, why) {
    const x = this.list.find((y) => y.cid === cid);
    if (x) { x.pending = false; x.failed = true; }
    notice(why || '没发出去', 'err');
    this.paint();
  },
  send(text) {
    const t = String(text || '').replace(/\s+/g, ' ').trim();
    if (!t || !S.room) return false;
    if (!S.ws || S.ws.readyState !== 1) { notice('还没连上，连上后再发', 'err'); return false; }
    const cid = randomHex(6);
    const body = Array.from(t).slice(0, 120).join('');
    this.list.push({ cid, seat: S.room.seat, text: body, at: Date.now(), pending: true });
    try { S.ws.send(JSON.stringify({ t: 'chat', text: body, cid })); } catch { this.reject(cid, '没发出去，稍后再试'); return false; }
    sound.play('pop');
    this.paint();
    return true;
  },
  sendSticker(st) {
    if (!S.room) return false;
    if (!S.ws || S.ws.readyState !== 1) { notice('还没连上，连上后再发', 'err'); return false; }
    const cid = randomHex(6);
    this.list.push({ cid, seat: S.room.seat, text: '', sticker: st, at: Date.now(), pending: true });
    try { S.ws.send(JSON.stringify({ t: 'chat', sticker: st.id, cid })); } catch { this.reject(cid, '没发出去，稍后再试'); return false; }
    sound.play('pop');
    this.paint();
    return true;
  },
  badge() {
    const b = $('#screen [data-do="chat"]');
    if (b) b.outerHTML = chatBtnHTML();
  },
  // 聊天记录：能接着画就只补新的那几行（已经在播的表情不会被打断重来），对不上再整列重画
  paint() {
    const box = $('#chatlist');
    if (!box) return;
    const me0 = S.room ? S.room.seat : 0;
    const rows = this.list.filter((m) => !(this.mute && m.seat !== me0));
    const hid = this.list.length - rows.length;
    const key = (m) => (m.cid ? 'c' + m.cid : 'i' + m.id);
    const cls = (m) => `msg${m.seat === me0 ? ' me' : ''}${m.sticker ? ' sticker' : ''}${m.pending ? ' pending' : ''}${m.failed ? ' failed' : ''}`;
    const row = (m) => `<div class="${cls(m)}" data-k="${esc(key(m))}">${m.sticker ? stickers.html(m.sticker, 'msg') : esc(m.text)}${m.failed ? '<small>没发出去</small>' : ''}</div>`;
    box.querySelectorAll(':scope > p.empty').forEach((e) => e.remove());
    const kids = [...box.children];
    if (rows.length && kids.length <= rows.length && kids.every((e, j) => e.dataset.k === key(rows[j]))) {
      kids.forEach((e, j) => {
        const m = rows[j];
        if (e.className !== cls(m)) e.className = cls(m);
        const sm = e.querySelector(':scope > small');
        if (m.failed && !sm) e.insertAdjacentHTML('beforeend', '<small>没发出去</small>');
        else if (!m.failed && sm) sm.remove();
      });
      if (rows.length > kids.length) box.insertAdjacentHTML('beforeend', rows.slice(kids.length).map(row).join(''));
    } else box.innerHTML = rows.length ? rows.map(row).join('') : '<p class="empty">打个招呼吧</p>';
    if (hid) box.insertAdjacentHTML('beforeend', `<p class="empty">已屏蔽对方的 ${hid} 条消息</p>`);
    box.scrollTop = box.scrollHeight;
    stickers.mount(box);
  },
};
// 填聊天面板：消息列表 + 表情包按钮（有表情包才露出来）+ 表情包面板
function chatFill() {
  chat.paint();
  stickers.paint();
  const b = $('.sheet [data-do="chat-stickers"]');
  if (b) { b.hidden = !(stickers.sets && stickers.sets.length); b.setAttribute('aria-expanded', String(stickers.open)); }
}
// 聊天框（顶栏）：看起来就是一个输入框——没新消息时是"发消息…"，有新消息时显示最近一条和未读数；点开就是聊天面板，直接打字
function chatBtnHTML() {
  const n = chat.unread;
  const me0 = S.room ? S.room.seat : 0;
  const last = n ? chat.list.filter((m) => m.seat !== me0).pop() : null;
  const peek = last ? `${nameOf(last.seat)}：${last.sticker ? `[表情 ${last.sticker.emoji || ''}]` : last.text}` : '';
  return `<button class="chatq${n ? ' has' : ''}" data-do="chat" aria-label="聊天${n ? `，${n} 条新消息` : ''}">${ICON.chat}<span class="ph">${peek ? esc(peek) : '发消息…'}</span>${n ? `<b class="badge">${n > 9 ? '9+' : n}</b>` : ''}</button>`;
}
// 输入框里按回车发送（中文输入法选字时的回车不算）
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'chatin' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); DO['chat-send'](); }
});

function goHome() {
  // 还在排队就从排队处撤下：否则十几秒内别人可能被配进这个没人的房间
  if (S.match) { clearTimeout(S.match.timer); api('/api/match/cancel', { roomId: S.match.roomId }).catch(() => {}); S.match = null; }
  closeEmotes();
  held.clear();
  if (S.pending) S.pending.done({ ok: false }, true);
  disconnect();
  wake.off();
  S.room = null;
  S.snap = null;
  S.info = null;
  S.netBody = null;
  S.netN = 0;
  S.netRoom = null;
  S.resyncing = false;
  chat.reset();
  S.target = null;
  S.sel = null;
  S.log = [];
  S.lastIds = null;
  closeSheet();
  history.replaceState(null, '', location.pathname + location.search);
  S.screen = 'home';
  render();
}

function readCode() {
  const raw = (location.hash.replace(/^#\/?/, '') || params.get('room') || '').trim().toUpperCase();
  return ROOM_RE.test(raw) ? raw : null;
}

// 打开某个房间：本机有座位凭证就直接回座位，否则走加入流程
async function openRoom(code) {
  history.replaceState(null, '', location.href.split('#')[0] + '#' + code);
  const saved = store.seat(code);
  if (saved) {
    S.room = { id: code, seat: saved.seat, token: saved.token };
    S.screen = 'connecting';
    preloadFaces();
    connect();
    render();
    return;
  }
  S.join = { code, host: null, error: null, full: false, seats: null };
  S.screen = 'join';
  render();
  await loadJoinInfo();
}

// 加入页：看房间现在的样子（等人 / 已开局、谁在线）
async function loadJoinInfo() {
  const j = S.join;
  if (!j) return;
  try {
    const info = await api(`/api/rooms/${j.code}`);
    if (S.join !== j) return;
    j.full = !!info.players[1];
    j.seats = info.players;
    j.host = info.players[0] && info.players[0].name;
  } catch (e) {
    if (S.join !== j) return;
    j.full = false;
    j.error = e.message;
  }
  if (S.screen === 'join') render();
}

async function checkCards() {
  const sh = { type: 'check', done: 0, bad: [], art: null };
  openSheet(sh);
  // 成就 / 大乐透 / 银行图：每张都重新试一遍所有候选网址，列出结果
  Promise.all(Object.keys(CONFIG.ART).map((k) => resolveArt(k, true).then((ok) => [k, ok]))).then((res) => {
    sh.art = res;
    if (S.sheet === sh) renderSheet();
  });
  const faces = S.meta.faces.filter((f) => fileOf(f.face) != null);
  let i = 0;
  const worker = async () => {
    while (i < faces.length) {
      const f = faces[i++];
      const ok = await new Promise((resolve) => {
        const im = new Image();
        const t = setTimeout(() => resolve(false), 8000);
        im.onload = () => { clearTimeout(t); useRatio(im.naturalWidth / im.naturalHeight); resolve(true); };
        im.onerror = () => { clearTimeout(t); resolve(false); };
        im.src = rawImgUrl(f.face) + '?check=' + Date.now();
      });
      if (!ok) { sh.bad.push(f.face); S.missing.add(f.face); } else S.missing.delete(f.face);
      sh.done++;
      if (S.sheet === sh) renderSheet();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  if (S.screen === 'game') render();
}

/* ═══════════ 启动 ═══════════ */
const META_CARDS = 109; // 当前牌组张数（标准 106 + 自定义 3）；本机缓存的牌面数据张数不对就重新拉
// 启动：先用本机缓存的牌面数据立刻出界面，再在后台刷新；没有缓存就联网拉取，失败自动重试
async function boot() {
  probeTransform();
  render();
  const cached = store.get('meta', null);
  if (cached && Array.isArray(cached.cards) && cached.cards.length === META_CARDS) {
    S.meta = cached;
    route();
    api('/api/meta', null, 2).then((fresh) => {
      if (fresh.engine === S.meta.engine && fresh.service === S.meta.service) return;
      S.meta = fresh;
      store.set('meta', fresh);
      render();
    }).catch(() => { /* 用缓存继续 */ });
    return;
  }
  try {
    S.meta = await api('/api/meta', null, 3);
    store.set('meta', S.meta);
  } catch (e) {
    S.fatal = { title: '连不上对战服务', text: navigator.onLine ? `请确认 Worker 已部署，并把页面里的 CONFIG.API 改成它的地址（现在是 ${API}）。` : '网络断开了，连上后会自动重试。' };
    S.screen = 'fatal';
    S.meta = null;
    $('#screen').innerHTML = fatalHTML().replace('data-do="go-home"', 'onclick="location.reload()"').replace('回到首页', '重新连接');
    addEventListener('online', () => location.reload(), { once: true });
    return;
  }
  route();
}

function route() {
  const code = readCode();
  if (code) openRoom(code);
  else { S.screen = 'home'; render(); }
}

if (DEBUG) window.__md = { S, act, send, render, cardHTML, motionOK, NET, probe, connect };
boot();
})();
