<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Monopoly Deal 双人对战</title>
<style>
/* ── 设计令牌：白底 Apple 极简。颜色主要来自卡牌本身，界面只用白、浅灰，加酒红 + 金色两种重点色 ── */
:root {
  color-scheme: light;
  --paper: #ffffff;
  --mist: #f5f5f7;
  --mist-2: #e8e8ed;
  --ink: #1d1d1f;
  --ink-2: #6e6e73;
  --ink-3: #aeaeb2;
  --hair: rgba(0, 0, 0, .08);
  --line: #f0f0f3;                               /* 仅保留的几条分割线：接近背景色，几乎看不出来 */
  /* 全局重点色：酒红 + 金色，只上在元素（按钮、徽章、描边、光效）上；重点文字一律白色（压在酒红 / 金色上） */
  --wine: #7d1431;
  --wine-hi: #a51d43;
  --wine-down: #5e0d24;
  --gold: #d99a14;
  --gold-hi: #ffd45c;
  --gold-deep: #a26a04;
  --wine-grad: linear-gradient(135deg, #a51d43, #7d1431 58%, #5c0f27);
  --gold-grad: linear-gradient(135deg, #f2bd3a, #d38f0c 55%, #a86b04);
  --on-gold: 0 1px 1px rgba(90, 45, 0, .55);    /* 金底白字的一层阴影，保证看得清 */
  --accent: var(--wine);
  --accent-down: var(--wine-down);
  --red: #b3173b;
  --green: var(--gold);
  --out: cubic-bezier(.23, 1, .32, 1);          /* 进场与按压反馈：强 ease-out */
  --move: cubic-bezier(.645, .045, .355, 1);    /* 屏幕内移动：ease-in-out */
  --sheet-ease: cubic-bezier(.32, .72, 0, 1);   /* iOS 底部面板 */
  --spring: cubic-bezier(.34, 1.56, .64, 1);    /* 带一点回弹：弹出、勾选。支持 linear() 的浏览器启动时换成真正的阻尼弹簧曲线（见 spring()） */
  --sheet-spring: var(--sheet-ease);            /* 面板打开：同上，换成阻尼 0.86 的弹簧 */
  --ease-move: cubic-bezier(.65, 0, .25, 1);    /* 屏幕上飞来飞去：强 ease-in-out，起步干脆、落点柔和 */
  --ratio: .6437;
  --tw: clamp(46px, min(13.4vw, 8.8svh), 76px);   /* 桌面卡宽（不支持容器查询时的兜底）：手机按屏宽、矮屏按高度收缩。
                                                    高度一律用 svh（最小视口）：Safari 地址栏伸缩时 dvh 会变，所有卡跟着变大变小，画面会抖 */
  --twmax: min(14.6vw, 80px);                     /* 桌面卡宽上限：按所在分块的高度自动缩放，但不超过这个 */
  --hw: clamp(56px, min(20.5vw, 10.5svh), 100px);  /* 手牌卡宽 */
  --mh: clamp(52px, 7svh, 72px);                  /* 中间一排（地产颜色区 / 中央指示器）的高度 */
  --oppx: calc(clamp(60px, 10svh, 112px) + 10px); /* 对方地产区比自己的高出多少（原来牌堆、弃牌区那一排腾出来的地方） */
  --card-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 12px rgba(0, 0, 0, .07); /* 无描边：只靠柔和投影和底色区分 */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--paper); }
html { overscroll-behavior: none; } /* 根滚动层上才生效：iOS Safari 不再下拉刷新、不再整页回弹（对局中下拉会把页面刷掉） */
body {
  color: var(--ink); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overscroll-behavior: none; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
input { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; }
:focus-visible { outline: 2px solid rgba(29, 29, 31, .7); outline-offset: 3px; }
/* 触屏：按钮和卡牌禁用双击缩放（touch-action 不继承，滚动区里的元素要单独声明），点按立刻响应 */
button, a, input, .card { touch-action: manipulation; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── 按钮：按下缩一点，松手回弹（只动 transform） ── */
.btn {
  height: 52px; padding: 0 24px; border-radius: 999px;
  font-size: 17px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 160ms var(--out), background-color 160ms var(--out), opacity 160ms var(--out);
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:active { background: var(--accent-down); }
.btn.red { background: var(--wine-grad); color: #fff; } /* 认输、吸血这类重的选择：同一个酒红色系（不再和主按钮两种红挨着） */
.btn.plain { background: var(--mist); color: var(--ink); }
.btn.plain:active { background: var(--mist-2); }
.btn.alert { background: var(--wine-grad); color: #fff; }
.btn.block { width: 100%; }
.btn[disabled], .btn.wait { opacity: .4; pointer-events: none; }
.link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--gold); font-size: 16px; padding: 12px 14px; border-radius: 12px; }
.link:active { opacity: .5; }
.round {
  flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  background: var(--mist); color: var(--ink); transition: transform 160ms var(--out), background-color 160ms var(--out);
}
.round:active { transform: scale(.92); background: var(--mist-2); }
.round svg { width: 22px; height: 22px; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .3; } }

/* ── 首页 / 加入 / 等待 ── */
.page {
  max-width: 440px; margin: 0 auto; min-height: 100vh; min-height: 100svh;
  padding: calc(var(--safe-t) + 40px) 20px calc(var(--safe-b) + 28px);
  display: flex; flex-direction: column; gap: 18px;
}
/* 换页：各块依次上浮进场。--enter-t 是"进场已经过了多久"（负数），同一页里重绘时动画接着播，不会从头再来。
 * 用 backwards 不用 both：终点就是本来的样子，播完不留填充——一直挂着的动画会让每一块各自成一层，
 * 中间一排的提示、名字被后画的自己地产区盖住（层级在 .midrow / .handbox 上定死） */
.enter > * { animation: rise 380ms var(--out) backwards; animation-delay: calc(var(--enter-t, 0ms) + var(--k, 0) * 40ms); }
.enter > :nth-child(2) { --k: 1; } .enter > :nth-child(3) { --k: 2; } .enter > :nth-child(4) { --k: 3; }
.enter > :nth-child(5) { --k: 4; } .enter > :nth-child(6) { --k: 5; } .enter > :nth-child(7) { --k: 6; } .enter > :nth-child(n+8) { --k: 7; }
@keyframes rise { from { opacity: 0; translate: 0 14px; } }
.hero { height: 188px; position: relative; margin: 0 0 6px; }
.hero .card {
  position: absolute; left: 50%; bottom: 6px; --w: 104px; transform-origin: 50% 120%; box-shadow: 0 18px 40px rgba(0, 0, 0, .14);
  animation: heroIn 640ms var(--spring) both;
  animation-delay: calc(var(--enter-t, 0ms) + var(--d, 0ms));
}
.hero .card:nth-child(2) { --d: 70ms; }
.hero .card:nth-child(3) { --d: 140ms; }
@keyframes heroIn { from { opacity: 0; translate: 0 36px; scale: .9; } }
.hero { cursor: pointer; }
.hero .card { transition: transform 520ms var(--spring); }
.hero .card:nth-child(1) { transform: translateX(-50%) rotate(-13deg) translateX(-38px); }
.hero .card:nth-child(2) { transform: translateX(-50%) translateY(-12px); z-index: 1; }
.hero .card:nth-child(3) { transform: translateX(-50%) rotate(13deg) translateX(38px); }
h1 { font-size: 40px; line-height: 1.05; letter-spacing: -.03em; font-weight: 700; margin: 0; text-align: center; text-wrap: balance; }
h2 { font-size: 28px; line-height: 1.15; letter-spacing: -.02em; font-weight: 700; margin: 0; text-align: center; text-wrap: balance; }
.lede { color: var(--ink-2); text-align: center; margin: 0 auto; max-width: 26em; font-size: 17px; line-height: 1.5; text-wrap: balance; }
.panel { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font-size: 13px; color: var(--ink-2); padding-left: 4px; }
.field input {
  width: 100%; min-width: 0; height: 52px; border-radius: 14px; border: 0; padding: 0 16px;
  font: inherit; font-size: 17px; color: var(--ink); background: var(--mist); outline: none;
  transition: background-color 160ms var(--out), box-shadow 160ms var(--out);
}
.field input::placeholder { color: var(--ink-3); }
.field input:focus { background: #fbf2f4; } /* 聚焦：淡淡一层酒红 */
.field input:focus-visible { outline: none; } /* 输入框聚焦用底色变化表示，不加描边 */
.joinrow { display: flex; gap: 10px; align-items: flex-end; }
.joinrow .field { flex: 1; min-width: 0; }
.joinrow .btn { flex: none; }
.joinrow input:not(:placeholder-shown) { text-transform: uppercase; letter-spacing: .2em; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 12px; background: var(--mist); }
.seg button { position: relative; z-index: 1; height: 38px; border-radius: 9px; font-size: 15px; font-weight: 600; color: var(--ink-2); transition: color 200ms var(--out); }
.seg button[aria-checked="true"] { color: var(--ink); }
.seg .thumb { position: absolute; top: 3px; left: 3px; width: calc(50% - 3px); height: 38px; border-radius: 9px; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .1); transition: transform 280ms var(--out); }
.seg[data-v="official"] .thumb { transform: translateX(100%); }
.hint { margin: -2px 4px 0; font-size: 13px; color: var(--ink-2); }
.divider { height: 1px; background: var(--line); margin: 8px 0; }
.resume { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 14px 18px; border-radius: 18px; background: var(--mist); text-align: left; transition: transform 160ms var(--out), background-color 160ms var(--out); }
.resume:active { transform: scale(.98); background: var(--mist-2); }
.resume .r1 { font-size: 17px; font-weight: 700; color: var(--ink); }
.resume .r2 { font-size: 13px; color: var(--ink-2); }
.foot { display: flex; justify-content: center; }
.qrbox { padding: 8px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.qr { width: min(62vw, 228px); aspect-ratio: 1; border-radius: 18px; overflow: hidden; }
.qr svg { display: block; width: 100%; height: 100%; }
.roomcode { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 30px; font-weight: 700; letter-spacing: .28em; padding-left: .28em; }
.url { font-size: 13px; color: var(--ink-2); word-break: break-all; text-align: center; -webkit-user-select: text; user-select: text; }
.btnrow { display: flex; gap: 10px; }
.btnrow .btn { flex: 1; }
.waiting { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink-2); margin: 0; }
.waiting i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
.note { font-size: 14px; color: #fff; background: var(--wine); padding: 6px 12px; border-radius: 10px; text-align: center; margin: 0; }
.panel .note.left { text-align: left; padding-left: 4px; }

/* ── 卡牌：白卡 + 细边 + 轻投影，在白底上靠阴影分层 ── */
.card {
  --w: var(--tw);
  position: relative; display: block; flex: none; width: var(--w); height: calc(var(--w) / var(--ratio));
  border-radius: calc(var(--w) * .075); background: #fff; overflow: hidden; color: #1d1d1f;
  box-shadow: var(--card-shadow);
}
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-touch-callout: none; }
.card.flip img, .card.flip .fb { transform: rotate(180deg); }
.card .fb {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: 26% 8% 14%; font-size: calc(var(--w) * .125); font-weight: 600; text-align: center; line-height: 1.2;
}
.card.noimg .fb { display: flex; }
.card .fb i { position: absolute; left: 6%; right: 6%; top: 5%; height: 21%; border-radius: calc(var(--w) * .04); }
.card .fb em { position: absolute; left: 8%; bottom: 5%; font-style: normal; font-size: calc(var(--w) * .11); color: #6e6e73; }
.card .fb.money { background: #eef6ef; padding: 8%; }
.card .fb.money b { font-size: calc(var(--w) * .3); color: #1d7a42; }
.card .fb.act { background: #f2f4f9; padding: 8%; }
.card.back { background: #c8102e; }
.card.back .fb { padding: 0; background: radial-gradient(120% 90% at 30% 10%, #e23a46, #b00b20 70%); }
.card.back .fb::before { content: ""; position: absolute; inset: 7%; border-radius: calc(var(--w) * .05); box-shadow: inset 0 0 0 max(1px, calc(var(--w) * .022)) rgba(255, 255, 255, .9); }
.card.back .fb::after { content: "Deal"; color: #fff; font-style: italic; font-weight: 800; font-size: calc(var(--w) * .2); letter-spacing: -.02em; transform: rotate(-14deg); }
.card.fresh { animation: pop 260ms var(--out) both; }
@keyframes pop { from { opacity: 0; scale: .92; } }
.card.pick { z-index: 3; box-shadow: 0 8px 22px rgba(125, 20, 49, .5); }
/* 可选目标：不描边，用一圈会呼吸的酒红光晕托起来。呼吸只动伪元素的透明度（合成层完成），不逐帧重绘阴影 */
@keyframes glowPulse { 50% { opacity: .3; } }
.dim { opacity: .3; transition: opacity 240ms var(--out); } /* 只动透明度：filter 过渡在 Safari 上每帧重绘，很多张牌一起变会卡 */
/* 飞行替身：固定定位、以中心为原点缩放，飞的时候投影更深，像被拿起来 */
.ghost { position: fixed; z-index: 30; margin: 0; pointer-events: none; transform-origin: 50% 50%; will-change: transform; }
.ghost.card, .ghost .card { box-shadow: 0 14px 30px rgba(0, 0, 0, .22); }
.flip3d { perspective: 900px; }
.flip3d .flipper { position: absolute; inset: 0; transform-style: preserve-3d; }
.flip3d .flipper > .card { position: absolute; inset: 0; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.flip3d .flipper > .card.back { transform: rotateY(180deg); }

/* ── 对局：按参考图分块布局。上面对手、中间「牌堆 / 回合台 / 弃牌堆」、下面自己、手牌，最底下一排操作按钮 ──
 * 分块只用来定位，不画底色、不描边：各块之间靠间距和留白自然分开。
 * 整页撑满一屏；屏幕太矮时各块保留最小高度，页面可以上下滚，操作按钮始终贴在底部。 */
.game {
  --gap: 12px;
  max-width: 760px; margin: 0 auto; min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; gap: var(--gap);
  padding: calc(var(--safe-t) + 14px) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px));
}
.zone { position: relative; flex: 1 1 0; min-height: 150px; touch-action: pan-y; } /* 横着划交给弧形轨道（放不下时左右滑），竖着划还是页面滚动 */
.zone.scrolls { cursor: grab; }
.zone.sliding { cursor: grabbing; }
/* 拖牌时：能松手的地方亮起来（弧形框线变实、变色；银行和地产组抬一下、套一圈光） */
.zone.drop > .arc path { stroke: var(--accent); stroke-dasharray: none; stroke-width: 2.5; }
.bank.drop .pile, .set.drop .stack { translate: 0 -4px; }
.bank.drop .pile .card:last-child, .bank.drop .pile.none, .set.drop .stack { box-shadow: 0 0 0 3px rgba(125, 20, 49, .45), var(--card-shadow); border-radius: calc(var(--tw) * .075); }
body.dragging, body.dragging * { cursor: grabbing; }
.ghost.drag { z-index: 46; box-shadow: 0 24px 48px rgba(0, 0, 0, .26); }
/* 当前行动方：那一方的名字压在酒红牌子上 */
.who .nm { padding: 0 8px; border-radius: 999px; transition: color 300ms var(--out), background-color 300ms var(--out); }
.turn-me .side.me .nm, .turn-opp .side.opp .nm { color: #fff; background: var(--wine-grad); box-shadow: 0 0 0 2px var(--gold-hi); } /* 轮到谁：名字压在酒红牌子上 */
.who { flex: none; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 8px 0 6px; }
.nm { font-size: 16px; font-weight: 600; letter-spacing: -.01em; max-width: 8.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.off { flex: none; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.slots { display: inline-flex; gap: 4px; }
.slots i { width: 18px; height: 8px; border-radius: 4px; background: var(--mist-2); transition: background-color 300ms var(--out); }
.who .grow { flex: 1; }
.minis { display: inline-flex; align-items: center; }
.minis .card { --w: 16px; border-radius: 2px; box-shadow: -1px 0 3px rgba(0, 0, 0, .18); }
.cnt { font-size: 13px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hc { display: inline-flex; align-items: center; gap: 6px; }
.row { flex: 1 1 0; min-height: 0; display: flex; gap: 10px; align-items: flex-start; overflow: auto; padding: 6px 6px 4px; scroll-snap-type: x proximity; scrollbar-width: none; overscroll-behavior: contain; }
.row::-webkit-scrollbar, .hand::-webkit-scrollbar, .bigcards::-webkit-scrollbar { display: none; }
.empty { align-self: center; max-width: 15em; color: var(--ink-3); font-size: 14px; line-height: 1.45; padding: 0 8px; text-wrap: balance; }
.set, .bank { flex: none; min-width: 44px; display: flex; flex-direction: column; align-items: center; gap: 6px; scroll-snap-align: start; border-radius: 12px; padding: 2px; }
.set { position: relative; --th: calc(var(--tw) / var(--ratio)); --step: calc(var(--th) * .21); } /* 抵押印章等绝对定位的标记以这一组为准 */
/* 支持容器查询时：卡宽跟着分块高度走（大屏卡更大、矮屏自动缩），一组叠得太高就把每张露出的部分压小一点 */
@supports (container-type: size) {
  .row { container-type: size; --rh: calc(100cqh - 32px); --tw: clamp(34px, calc(var(--rh) / 1.3 * var(--ratio)), var(--twmax)); }
  .set { --step: max(calc(var(--th) * .12), min(calc(var(--th) * .21), calc((var(--rh) - var(--th)) / max(1, var(--n) - 1)))); }
}
.set .stack, .bank .pile { transition: transform 160ms var(--out), translate 200ms var(--out), box-shadow 200ms var(--out); }
.set:active .stack, .bank:active .pile { transform: scale(.96); }
.stack { position: relative; width: var(--tw); height: calc(var(--th) + (var(--n) - 1) * var(--step)); }
.stack > .card { position: absolute; left: 0; top: calc(var(--i) * var(--step)); }
.set.full .cap { padding: 0 8px; border-radius: 999px; background: var(--c); color: var(--ct, #fff); line-height: 18px; }
.set.full .cap b { color: inherit; }
.set.boost .stack { border-radius: calc(var(--tw) * .075); box-shadow: 0 6px 22px rgba(255, 170, 0, .55); }
.x4 { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 6px; background: var(--gold-grad); color: #fff; text-shadow: var(--on-gold); font-size: 11px; font-weight: 800; line-height: 16px; vertical-align: 1px; }
.boostnote { margin-top: 10px; padding: 8px 12px; border-radius: 12px; background: var(--wine-grad); color: #fff; }
.set.pick .stack { border-radius: calc(var(--tw) * .075); translate: 0 -3px; box-shadow: 0 6px 16px rgba(125, 20, 49, .32); }
.set.pick .stack::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 8px 26px rgba(125, 20, 49, .6); animation: glowPulse 1.3s ease-in-out infinite; pointer-events: none; }
.cap { font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cap b { color: var(--ink); font-weight: 600; }
.set .cap.near { padding: 0 7px; border-radius: 999px; background: var(--gold-grad); color: #fff; text-shadow: var(--on-gold); font-weight: 700; } /* 差一张就成套：期待感，也让双方都看清威胁 */
.zone.opp .set .cap.near { background: var(--wine-grad); text-shadow: none; }
/* 电力：名字旁边一排小闪电（满 / 半 / 空）；满格加成时闪电发光、旁边写收租倍数；捉鬼套装罚到下回合只摸 1M 时多一个小标。点开看说明 */
.pw { position: relative; flex: none; display: inline-flex; align-items: center; gap: 1px; min-height: 30px; margin: 0 -2px; padding: 0 2px; border-radius: 10px; transition: transform 160ms var(--out); }
.pw::before { content: ''; position: absolute; inset: -7px -6px; } /* 点按区域扩到 44px 高（图标本身不变大） */
.pw:active { transform: scale(.93); }
.pw .bolt, .pwbig .bolt { flex: none; display: grid; place-items: center; width: 17px; height: 17px; object-fit: contain; }
img.bolt.is-empty { opacity: .45; filter: grayscale(1) brightness(.8); } /* 空格：同一张电力图压成灰色 */
i.bolt svg { width: 88%; height: 88%; }
i.bolt .bk { fill: #d8d8de; }
i.bolt .fg { fill: #ffb800; }
i.bolt.is-empty .fg { display: none; }
i.bolt.is-half .fg { clip-path: inset(50% 0 0 0); } /* 半格：下半截亮 */
.pw.on .bolt:not(.is-empty) { filter: drop-shadow(0 0 3px rgba(255, 184, 0, .85)); animation: pwPulse 1.4s ease-in-out infinite; } /* 阴影不动，只让图标轻轻一胀一缩 */
@keyframes pwPulse { 50% { transform: scale(1.14); } }
.pw.near { animation: pwNear 1.6s ease-in-out infinite; } /* 有东西快触发了：整块轻轻发光 */
@keyframes pwNear { 50% { box-shadow: 0 0 0 3px rgba(255, 184, 0, .35); background: rgba(255, 214, 90, .16); } }
.pw .surge { margin-left: 3px; padding: 0 5px; border-radius: 6px; background: var(--gold-grad); color: #fff; text-shadow: var(--on-gold); font-size: 11px; font-weight: 800; line-height: 16px; }
.pw .gk { display: inline-flex; align-items: center; gap: 2px; margin-left: 4px; padding: 0 6px 0 3px; border-radius: 8px; background: var(--wine-grad); color: #fff; font-size: 11px; font-weight: 800; line-height: 18px; white-space: nowrap; }
.pw .gk img { width: 16px; height: 16px; object-fit: contain; }
.pw .vb { margin-left: 4px; padding: 0 6px; border-radius: 8px; background: var(--wine-grad); color: #fff; font-size: 11px; font-weight: 800; line-height: 18px; white-space: nowrap; } /* 贪婪大亨选了吸血 */
.sheet .tyopt { display: grid; gap: 10px; margin-top: 12px; }
.sheet .tyopt .btn { height: auto; min-height: 52px; padding: 10px 18px; flex-direction: column; gap: 2px; white-space: normal; text-align: center; }
.sheet .tyopt .btn small { font-size: 13px; font-weight: 500; opacity: .85; line-height: 1.35; }
.pwbig { display: flex; justify-content: center; gap: 6px; margin: 4px 0 10px; }
.pwbig .bolt { width: 44px; height: 44px; }
.pwrows { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; font-size: 15px; line-height: 1.5; color: var(--ink); }
.pwrows li::marker { color: var(--ink-3); }
.pwrows .bar { display: block; height: 6px; margin-top: 6px; border-radius: 3px; background: var(--mist-2); overflow: hidden; }
.pwrows .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ffd84a, #ff9f0a); }
.pwpop { position: fixed; z-index: 46; width: 72px; height: 72px; object-fit: contain; pointer-events: none; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .25)); }
.mp { flex: none; padding: 0 7px; border-radius: 7px; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .04em; line-height: 17px; }
.bank .pile { position: relative; height: calc(var(--tw) / var(--ratio)); width: calc(var(--tw) + var(--k) * 7px); }
.bank .pile .card { position: absolute; top: 0; left: calc(var(--i) * 7px); }
.bank .pile.none { width: var(--tw); border-radius: calc(var(--tw) * .075); background: transparent; border: 1.5px dashed #e2c06c; } /* 银行空着：一圈和弧线同色的虚线空位，不是一块灰牌 */
.zone.opp .bank .pile.none { border-color: #cfcfd6; }
.bank.drop .pile.none { border-style: solid; border-color: var(--wine-hi); }

/* 中间一排：牌堆 | 回合台 | 弃牌堆。两堆牌横着放（像桌上横摆的牌），回合台留够放字的宽度，剩下的都给两堆牌 */
.midrow { position: relative; flex: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(136px, 1.25fr) minmax(0, 1fr); gap: var(--gap); height: var(--mh); }
/* 回合台：中间一个圆弧仪表。出牌不限时：中间是 ↑ / ↓，指向该出牌的一方，换人时弹进来、弧条重新画满；
   回应 / 弃牌有倒计时：酒红弧条顺时针走掉，中间是剩下的秒数。下面一排点是这回合还能出几张（金色）。最下面一行字是状态和临时提示。点一下看对局记录 */
.stage {
  position: relative; overflow: hidden; min-width: 0; border-radius: 22px; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px 6px; text-align: center;
  transition: transform 160ms var(--out);
  --clock: var(--wine-hi);  /* 倒计时：酒红 */
  --plays: var(--gold);     /* 出牌次数：金色 */
}
.stage:active { transform: scale(.97); }
.gauge { --D: clamp(44px, calc(var(--mh) - 34px), 96px); position: relative; flex: none; width: var(--D); height: var(--D); }
.g-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.g-svg path { fill: none; stroke-width: 7; stroke-linecap: round; }
.g-track { stroke: rgba(0, 0, 0, .07); }
.g-fill { stroke: var(--clock); stroke-dasharray: 100 100; }
.stage[data-who="opp"] .g-fill { stroke: rgba(165, 29, 67, .3); }  /* 对方的倒计时：同一个酒红，淡一点 */
.stage[data-who="opp"] .g-arrow { color: var(--ink-2); }            /* 轮到对方：箭头也安静一点 */
.stage[data-mode="win"] .g-fill { stroke: #ffb020; }
.gauge.over:not(.win) .g-fill { stroke: rgba(0, 0, 0, .16); }
.g-num, .g-arrow { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.g-num { padding-bottom: 6%; font-size: calc(var(--D) * .34); font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.g-num b { display: inline-block; font-weight: inherit; transition: color 200ms var(--out); }
.g-num small { align-self: flex-end; margin: 0 0 calc(var(--D) * .3) .05em; font-size: .4em; font-weight: 700; color: var(--ink-2); }
.gauge.over .g-num { font-size: calc(var(--D) * .3); }
.stage[data-mode="win"] .g-num b { color: var(--ink); }
.g-arrow { opacity: 0; padding-bottom: 6%; color: var(--ink); }
.g-arrow svg { width: 40%; height: 40%; }
.g-arrow[data-dir="down"] svg { transform: rotate(180deg); }
.stage[data-who="me"] .g-arrow { color: var(--accent); }
.gauge.noclock .g-arrow { opacity: 1; } /* 这一步不限时（出牌阶段，或旧后端）：中间常驻箭头，指向该出牌的一方 */
.gauge.noclock .g-num { opacity: 0; }
.gauge.hurry .g-num b { color: var(--ink); } /* 最后 5 秒：弧条变酒红、呼吸 */
.gauge.hurry .g-fill { animation: g-breathe 1s ease-in-out infinite; }
@keyframes g-breathe { 50% { opacity: .5; } }
.g-dot {
  position: absolute; width: calc(var(--D) * .09); height: calc(var(--D) * .09); margin: calc(var(--D) * -.045) 0 0 calc(var(--D) * -.045);
  border-radius: 50%; background: rgba(0, 0, 0, .12); transition: background-color 260ms var(--out), box-shadow 260ms var(--out);
}
.g-dot.on { background: var(--plays); box-shadow: 0 0 0 calc(var(--D) * .022) rgba(255, 200, 60, .22); }
.stage[data-who="opp"] .g-dot.on { background: #ecd28f; box-shadow: none; }
.g-dot.bonus.on { background: linear-gradient(135deg, #ffcf3f, #ff9500); box-shadow: 0 0 0 calc(var(--D) * .022) rgba(255, 159, 10, .22); }
.g-dot.lapsed { background: rgba(165, 29, 67, .3); } /* 超时作废的那次 */
/* 对方在想下一步：他下一次要用掉的那颗点慢慢呼吸，中间的箭头轻轻上下浮——"在等他"和"卡住了"一眼分得开。
   延迟 ~1 秒才动：等他刚打出的牌落定；每次更新回合台都是新节点，动画自动从头等起。动 svg 不动 .g-arrow，不和换人时箭头的动画抢 transform */
.stage[data-who="opp"] .g-dot.next { animation: g-think 1.3s ease-in-out .9s infinite; }
@keyframes g-think { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.5); background-color: #e2b24a; } }
.stage[data-who="opp"] .gauge.noclock .g-arrow[data-dir="up"] svg { animation: g-bob 1.6s ease-in-out 1s infinite; }
@keyframes g-bob { 50% { transform: translateY(-6%); } }
@media (prefers-reduced-motion: reduce) { .stage[data-who="opp"] .g-dot.next, .stage[data-who="opp"] .gauge.noclock .g-arrow[data-dir="up"] svg { animation: none !important; } }
.g-ring { position: absolute; border-radius: 50%; border: 2px solid var(--plays); pointer-events: none; }
.st-sub { max-width: 100%; min-height: 16px; margin-top: 9px; font-size: 12px; line-height: 16px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; transition: color 200ms var(--out); }
.stage[data-mode="me"] .st-sub.base, .stage[data-mode="alert"] .st-sub.base, .st-sub.err, .st-sub.ok { display: inline-block; width: fit-content; max-width: 100%; margin: 9px auto 0; padding: 0 8px; border-radius: 999px; color: #fff; background: var(--wine-grad); font-weight: 600; } /* 重点提示：酒红 / 金色小牌子上的白字 */
/* 提示：浮在中间那一行下沿，可以比回合台宽、最多两行，字大一号——回合台那一行太窄，长一点的提示会被截断 */
.toast { position: absolute; left: 50%; top: calc(100% + 4px); z-index: 6; width: max-content; max-width: min(calc(100% - 12px), 360px); padding: 6px 13px; border-radius: 14px; color: #fff; background: var(--wine-grad); box-shadow: 0 6px 18px rgba(60, 10, 25, .22), 0 0 0 1.5px rgba(255, 255, 255, .7); font-size: 13px; line-height: 18px; font-weight: 600; text-align: center; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; pointer-events: none; transform: translateX(-50%); transition: opacity 200ms var(--out), transform 260ms var(--spring); }
.toast.err { background: var(--red); }
.toast[hidden] { display: -webkit-box; opacity: 0; transform: translate(-50%, 6px) scale(.96); visibility: hidden; transition: opacity 160ms var(--out), transform 160ms var(--out), visibility 0s 160ms; }
.stage[data-mode="win"] .st-sub.base, .st-sub.warn { display: inline-block; width: fit-content; max-width: 100%; margin: 9px auto 0; padding: 0 8px; border-radius: 999px; color: #fff; background: var(--gold-grad); text-shadow: var(--on-gold); font-weight: 600; }

/* 手牌：单独一块，像握在手里一样沿圆弧扇形展开；太多放不下就叠起来横向滑。
   底下多留的空白给两边往下沉的牌（转了角、又沿弧线下沉），上面的空白给选中时抬起的牌 */
.handbox { flex: none; position: relative; }
.hand {
  display: flex; align-items: flex-end; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain;
  --hb: calc(8px + var(--hw) * .26); /* 底下的留白：牌越大，转了角往下沉得越多 */
  height: calc(var(--hw) / var(--ratio) + 26px + var(--hb)); padding: 26px 14px var(--hb);
}
.hand .card {
  --w: var(--hw); transform-origin: 50% 100%;
  transform: translateY(var(--y, 0px)) rotate(var(--r, 0deg));
  transition: transform 260ms var(--out), translate 200ms var(--out), opacity 200ms var(--out), box-shadow 260ms var(--out);
}
.hand .card { touch-action: pan-x; } /* 横向滑交给浏览器滚动手牌，往上拖交给拖牌出牌 */
.hand .card:first-child { margin-left: var(--edge, auto); }
.hand .card:last-child { margin-right: var(--edge, auto); }
.hand .card + .card { margin-left: var(--ov, 8px); }
.hand.nofx .card { transition: none; }
.hand .card:active { transform: translateY(var(--y, 0px)) rotate(var(--r, 0deg)) scale(.97); }
.hand .card.sel { transform: translateY(calc(var(--y, 0px) - 18px)) rotate(0deg) scale(1.03); z-index: 2; box-shadow: 0 14px 28px rgba(0, 0, 0, .18); }
.hand .card.muted { opacity: .55; } /* 自己回合里打不出、也存不进银行的牌（比如单独的「反对行动」）：淡一点，点开会说明原因 */
.hcount { position: absolute; top: 5px; right: 16px; font-size: 11px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; pointer-events: none; }
.hcount.over { padding: 0 6px; border-radius: 999px; background: var(--wine); color: #fff; }

/* 底部操作：左菜单、中主按钮、右表情。这一排本身不画底，只在页面滚动时用一层和页面同色的渐隐垫着 */
.dock {
  flex: none; position: sticky; bottom: 0; z-index: 5; margin: 0 -10px;
  display: flex; align-items: center; gap: 10px; padding: 8px 10px calc(var(--safe-b) + 10px);
  background: linear-gradient(to top, var(--paper) 70%, rgba(255, 255, 255, 0));
}
.dock .round { width: 52px; height: 52px; border-radius: 50%; background: var(--mist); color: var(--ink); }
.dock:has(.raise) .round { width: 46px; height: 46px; } /* 加注按钮也在时：圆按钮缩一点，给主按钮留地方 */
.dock .round.chatbtn { position: relative; }
.chatbtn .badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--wine-grad); color: #fff; font-size: 11px; font-weight: 800; line-height: 18px; box-shadow: 0 0 0 2px var(--paper); }
/* 聊天面板 */
.chathead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.chathead .link { font-size: 13px; color: var(--ink-3); }
.chatlist { display: flex; flex-direction: column; gap: 6px; max-height: min(42vh, 360px); min-height: 120px; overflow-y: auto; overscroll-behavior: contain; margin: 10px -4px 12px; padding: 4px; }
.chatlist .empty { margin: auto; color: var(--ink-3); font-size: 14px; }
.msg { max-width: 78%; padding: 8px 12px; border-radius: 16px 16px 16px 6px; background: var(--mist); color: var(--ink); font-size: 15px; line-height: 1.4; word-break: break-word; align-self: flex-start; }
.msg.me { align-self: flex-end; border-radius: 16px 16px 6px 16px; background: var(--wine-grad); color: #fff; }
.msg.pending { opacity: .6; }
.msg.failed { opacity: 1; box-shadow: inset 0 0 0 1.5px #c0392b; }
.msg .who { display: block; font-size: 11px; font-weight: 700; color: var(--ink-3); margin-bottom: 2px; }
.msg small { display: block; font-size: 11px; opacity: .8; margin-top: 2px; }
.chips.quick { gap: 6px; }
.chips.quick .chip { min-height: 36px; padding: 0 12px; font-size: 14px; }
.sheet .acts.chatbar { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.sheet .acts.chatbar .stktoggle { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--mist); color: var(--ink); display: grid; place-items: center; }
.sheet .acts.chatbar .stktoggle[aria-expanded="true"] { background: var(--ink); color: #fff; }
.sheet .acts.chatbar .stktoggle svg { width: 22px; height: 22px; }
.stkpanel { margin-top: 10px; }
.stktabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
.stktabs .chip { min-height: 32px; padding: 0 12px; font-size: 13px; flex: none; }
.stktabs .chip.on { background: var(--ink); color: #fff; }
.stkgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; max-height: 180px; overflow-y: auto; overscroll-behavior: contain; }
.stkbtn { aspect-ratio: 1; border-radius: 12px; background: var(--mist); display: grid; place-items: center; padding: 6px; }
.stkbtn:active { transform: scale(.92); }
.stkbtn > * { pointer-events: none; }
.stkbtn .stk { display: block; width: 100%; height: 100%; object-fit: contain; }
.stk.lot { position: relative; display: block; }
.stk.lot > img { display: block; width: 100%; height: 100%; object-fit: contain; }
.stk.lot > svg { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
.stk.lot.on > img { visibility: hidden; }
.msg.sticker { background: none !important; padding: 0; box-shadow: none; }
.msg.sticker .stk { display: block; width: 112px; height: 112px; object-fit: contain; }
.stkpop { position: fixed; z-index: 3; width: 132px; height: 132px; pointer-events: none; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .25)); }
.stkpop .stk { width: 100%; height: 100%; object-fit: contain; }
.acts.chatbar input { flex: 1; min-width: 0; height: 48px; padding: 0 14px; border-radius: 24px; border: 1.5px solid var(--mist-2); background: #fff; font: inherit; font-size: 16px; color: var(--ink); }
.acts.chatbar input:focus { outline: none; border-color: var(--wine-hi); }
.sheet .acts.chatbar .btn { flex: none; width: auto; padding: 0 20px; height: 48px; }
.dock .round:active { background: var(--mist-2); }
.dock .round[aria-expanded="true"] { background: var(--ink); color: #fff; }
.dock .round svg { width: 22px; height: 22px; transition: transform 300ms var(--spring); }
.dock .round[aria-expanded="true"] svg { transform: rotate(-12deg) scale(1.08); }
.dock .btn { flex: 1; min-width: 0; height: 52px; position: relative; overflow: hidden; }
.dock .btn.plain { background: var(--mist); color: var(--ink); }
.dock .btn[disabled] { opacity: 1; background: var(--mist); color: var(--ink-3); }
.dock .btn.wait { opacity: .75; }
.dock .btn.alert { animation: alertRing 1.8s ease-out infinite; }
@keyframes alertRing { 0% { box-shadow: 0 0 0 0 rgba(165, 29, 67, .55); } 70%, 100% { box-shadow: 0 0 0 9px rgba(165, 29, 67, 0); } }
.dock .btn .shine { border-radius: inherit; z-index: 1; }

/* ── 底部面板：iOS 曲线弹出，可以下拉关闭 ── */
#sheet-root { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#sheet-root.open { pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .28); opacity: 0; transition: opacity 300ms var(--out); }
#sheet-root.open .scrim { opacity: 1; }
.sheet {
  position: absolute; left: 50%; bottom: -60px; width: min(100%, 560px); max-height: calc(88svh + 60px);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translate(-50%, 110%); transition: transform 420ms var(--sheet-ease); will-change: transform;
  border-radius: 28px 28px 0 0; padding: 0 20px calc(var(--safe-b) + 76px);
  background: #fff; box-shadow: 0 -16px 40px rgba(0, 0, 0, .1);
}
#sheet-root.open .sheet { transform: translate(-50%, 0); transition-timing-function: var(--sheet-spring); transition-duration: 520ms; } /* 打开带一点点回弹（底下多垫了 60px，回弹时不露缝）；关上用 iOS 曲线 */
.grab { flex: none; height: 30px; margin: 0 -20px 2px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.grab::before { content: ""; width: 38px; height: 5px; border-radius: 3px; background: #d2d2d7; }
.sbody { flex: 1 1 auto; min-height: 0; overflow: auto; margin: 0 -20px; padding: 0 20px 4px; overscroll-behavior: contain; }
.sheet h3 { font-size: 22px; line-height: 1.25; letter-spacing: -.015em; font-weight: 700; margin: 2px 0 6px; text-wrap: balance; }
.sheet .sub { color: var(--ink-2); margin: 0 0 12px; font-size: 15px; }
.sheet .acts { flex: none; display: grid; gap: 10px; margin-top: 14px; }
.sheet .acts.two { grid-template-columns: 1fr 1fr; }
.sheet .acts.two .btn { padding: 0 14px; } /* 两边字都放得下：两列一样宽（320 宽也是） */
.sheet .acts .btn { width: 100%; }
.feature { display: flex; gap: 16px; align-items: flex-start; }
.feature .card { --w: min(36vw, 150px, calc(30svh * var(--ratio))); } /* 横屏这种矮屏：按高度收，整张牌露得出来 */
.feature .txt { flex: 1; min-width: 0; padding-top: 4px; }
.cards { display: flex; flex-wrap: wrap; gap: 10px; }
.cards .card { --w: 60px; }
.sheet .cards:has(> .tile) { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); justify-items: center; } /* 可选的牌格：等分成列，右边不剩一条空 */
.bigcards { display: flex; gap: 12px; overflow-x: auto; padding: 8px 20px 12px; margin: 0 -20px; scroll-padding-inline: 20px; scrollbar-width: none; } /* 伸到面板两边：牌在屏幕边滑出去，不在内边距那里被切一刀 */
.bigcards .card { --w: min(27vw, 108px); }
.tile { position: relative; flex: none; border-radius: 10px; transition: transform 200ms var(--out), opacity 200ms var(--out); }
.tile .card { --w: 64px; }
.bigcards .tile .card { --w: min(27vw, 108px); }
.tile:active { transform: scale(.96); }
.tile.on { transform: translateY(-4px); transition: transform 320ms var(--spring), opacity 200ms var(--out); }
.tile.on .card { box-shadow: 0 8px 22px rgba(125, 20, 49, .38); }
.tile .tick { position: absolute; right: -6px; top: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; z-index: 2; opacity: 0; transform: scale(.6); transition: opacity 140ms var(--out), transform 260ms var(--spring); box-shadow: 0 0 0 2px #fff; }
.tile.on .tick { opacity: 1; transform: none; }
.tile .tick svg { width: 12px; height: 12px; }
.tile.lock { pointer-events: none; }
.group { margin: 14px 0 6px; font-size: 13px; color: var(--ink-2); }
.sum { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; font-size: 15px; }
.sum b { font-size: 20px; }
.sum .bad { padding: 0 6px; border-radius: 999px; background: var(--wine); color: #fff; }
/* 多色地产选颜色：两列色块（颜色本身就是标签）；能凑满一套的那个颜色描一圈金边 */
.cpicks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.btn.cpick { height: 48px; padding: 0 14px; justify-content: flex-start; gap: 10px; background: var(--mist); color: var(--ink); font-size: 16px; }
.btn.cpick i { flex: none; width: 22px; height: 22px; border-radius: 7px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); }
.btn.cpick:active { background: var(--mist-2); }
.btn.cpick.done { background: #fff; box-shadow: 0 0 0 2px var(--gold), 0 6px 16px rgba(217, 154, 20, .25); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 20px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; background: var(--mist); transition: transform 160ms var(--out), background-color 160ms var(--out), box-shadow 160ms var(--out); }
.chip:active { transform: scale(.96); }
.chip i { width: 12px; height: 12px; border-radius: 50%; }
.chip[aria-checked="true"] { background: var(--accent); color: #fff; }
.chip[aria-checked="true"] i { box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); }
.menu { display: flex; flex-direction: column; gap: 2px; margin: 0 -10px; }

.stats { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }

.stats tbody tr + tr td { box-shadow: inset 0 1px 0 var(--line); }
.stats th:first-child, .stats td:first-child { text-align: left; color: var(--ink-2); font-weight: 400; }
.stats thead th { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.loglist { display: flex; flex-direction: column; font-size: 15px; }
.loglist p { margin: 0; padding: 6px 0; line-height: 1.5; }
.loglist p.turn { margin-top: 14px; padding: 0 0 2px; color: var(--ink-3); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.loglist p.turn:first-child { margin-top: 0; }
.check { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 10px; margin-top: 12px; }
.check .card { --w: 56px; }
.check .bad .card { box-shadow: 0 6px 18px rgba(165, 29, 67, .45); opacity: .8; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; -webkit-user-select: text; user-select: text; }
p.mono { word-break: break-all; line-height: 1.6; } /* 检查资源里的长网址 */
/* 抵押中的地产：灰掉、压一枚"抵押"章；收不了租、不算胜利套数 */
.set.mortgaged .stack { opacity: .5; }
.set.mortgaged .cap { padding: 0 8px; border-radius: 999px; background: #6e6e73; color: #fff; line-height: 18px; }
.set .lockmark { position: absolute; left: 50%; top: 38%; z-index: 9; transform: translate(-50%, -50%) rotate(-12deg); padding: 2px 7px; border: 2px solid #6e6e73; border-radius: 6px; background: rgba(255, 255, 255, .9); color: #48484a; font-size: 11px; font-weight: 800; letter-spacing: .1em; pointer-events: none; white-space: nowrap; }
/* 秘密竞价、赌场礼赠的面板 */
.sheet .hero-art { display: block; width: 132px; height: 132px; margin: 0 auto 6px; object-fit: contain; }
.sheet .hero-art.fb { display: grid; place-items: center; border-radius: 30px; background: var(--gold-grad); color: #fff; text-shadow: var(--on-gold); font-size: 22px; font-weight: 900; }
.duelsets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 4px; }
/* 拍卖面板：左边拍品，右边最高价、谁领先、倒计时条；下面出价记录和加价按钮 */
.sale-lot { display: flex; gap: 14px; align-items: center; margin: 8px 0 6px; }
.sale-card { flex: none; --w: 92px; }

.sale-lead { align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: var(--mist); color: var(--ink-2); font-size: 13px; font-weight: 700; }

.sale-timer { display: flex; align-items: center; gap: 8px; }

.sale-timer .bar i { display: block; height: 100%; background: var(--gold-grad); transform-origin: 0 50%; transition: transform 200ms linear; }
.sale-timer .left { flex: none; font-size: 12.5px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sale-timer.hot .bar i { background: var(--wine-grad); }
.sale-timer.hot .left { color: var(--wine); }
.sale-hist { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink-3); }
.sale-hist li.top { color: var(--ink); }
.sheet .acts.sale-bids { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.sale-bids .btn { height: auto; min-height: 52px; padding: 6px 10px; flex-direction: column; gap: 0; line-height: 1.2; }
.sale-bids .btn small { font-size: 11.5px; font-weight: 600; opacity: .8; }
.sale-wait { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--mist); text-align: center; font-size: 14px; font-weight: 600; color: var(--ink-2); }

@media (max-height: 480px) { .sheet .hero-art { width: 64px; height: 64px; } .sheet .hero-art.fb { border-radius: 16px; font-size: 15px; } }
.duelsets > div { border-radius: 16px; background: var(--mist); padding: 8px; text-align: center; font-size: 12px; color: var(--ink-2); }
.duelsets .cards { justify-content: center; }
.sealed { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0; padding: 14px; border-radius: 18px; background: #1d1d1f; color: #fff; font-size: 15px; font-weight: 700; }
.sealed .env { font-size: 22px; }
.giftlist { margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.giftlist .bad { color: var(--ink); font-weight: 600; } .giftlist .bad::marker { color: var(--wine); }
/* 竞价亮价：两边的出价数字滚到真实金额，赢的一边变大发光 */
.spot .duel { position: absolute; left: 50%; top: 44%; display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(90vw, 380px); transform: translate(-50%, -50%); text-align: center; }
.spot .duel .bids { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; width: 100%; }
.spot .duel .bid { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 6px; border-radius: 22px; background: rgba(255, 255, 255, .1); color: #fff; }
.spot .duel .bid .nm { font-size: 13px; font-weight: 700; opacity: .85; }
.spot .duel .bid b { font-size: 46px; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; }
.spot .duel .bid.win { background: var(--gold-grad); color: #fff; text-shadow: var(--on-gold); box-shadow: 0 0 40px rgba(255, 190, 40, .6); }
.spot .duel .vs { font-size: 18px; font-weight: 900; color: #fff; }
.spot .duel .art { width: min(36vw, 140px); height: min(36vw, 140px); }
.swap { display: flex; align-items: center; gap: 12px; }
.swap .card { --w: 92px; }
.swap span { color: var(--ink-3); font-size: 22px; }

/* ── 反馈与庆祝：飘字、印章、扫光、表情、长按预览、五彩纸屑 ── */
#fx { position: fixed; inset: 0; z-index: 45; pointer-events: none; overflow: hidden; }
#fx canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.float { position: fixed; transform: translate(-50%, 0); padding: 2px 12px 3px; border-radius: 999px; font-size: 20px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; color: #fff; background: var(--gold-grad); text-shadow: var(--on-gold); box-shadow: 0 0 0 2px rgba(255, 255, 255, .85), 0 8px 20px rgba(160, 100, 0, .35), 0 0 24px rgba(255, 200, 60, .55); font-variant-numeric: tabular-nums; }
.float.minus { background: var(--wine-grad); text-shadow: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .85), 0 8px 20px rgba(94, 13, 36, .35); }
.float.gold { font-size: 24px; }
.stamp { position: fixed; z-index: 48; left: 50%; top: 40%; padding: 14px 34px 16px; border-radius: 24px; font-size: 44px; font-weight: 900; letter-spacing: .04em; white-space: nowrap; color: #fff; background: var(--wine-grad); box-shadow: 0 0 0 3px var(--gold-hi), 0 0 0 6px var(--wine-down), 0 22px 54px rgba(94, 13, 36, .45), 0 0 50px rgba(255, 200, 60, .35); }
.stamp.good { background: var(--gold-grad); font-size: 46px; text-shadow: var(--on-gold), 0 0 18px rgba(255, 240, 190, .8); box-shadow: 0 0 0 3px #fff3c4, 0 0 0 6px var(--gold-deep), 0 22px 54px rgba(160, 100, 0, .45), 0 0 70px rgba(255, 200, 60, .7); } /* 对自己有利：金色，和吃亏的酒红一眼分开 */
.stamp.gold { background: var(--gold-grad); font-size: 54px; text-shadow: var(--on-gold), 0 0 18px rgba(255, 240, 190, .8); box-shadow: 0 0 0 3px #fff3c4, 0 0 0 6px var(--gold-deep), 0 22px 54px rgba(160, 100, 0, .45), 0 0 70px rgba(255, 200, 60, .7); }
.shine { position: absolute; inset: 0; overflow: hidden; border-radius: calc(var(--tw) * .075); pointer-events: none; z-index: 6; }
.shine i { position: absolute; top: -10%; bottom: -10%; left: -70%; width: 60%; background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .9), rgba(255, 255, 255, 0)); }
/* 表情气泡：从头像旁边弹出来的对话泡，带几颗小表情往上飘 */
.emo {
  position: fixed; left: 0; top: 0; z-index: 2; padding: 7px 11px 8px; border-radius: 20px 20px 20px 6px;
  background: #fff; box-shadow: 0 10px 28px rgba(0, 0, 0, .16);
  font-size: 34px; line-height: 1; transform-origin: 0 100%;
}
.emo.down { border-radius: 6px 20px 20px 20px; transform-origin: 0 0; }
.emo span { display: block; }
.emo-p { position: fixed; left: 0; top: 0; font-size: 18px; line-height: 1; margin: -9px 0 0 -9px; }
.emo-coin { position: fixed; left: 0; top: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, #ffcc33 45%, #e09b00); box-shadow: inset 0 0 0 1.5px rgba(160, 100, 0, .35); }
.peek-dim { position: fixed; inset: 0; background: rgba(0, 0, 0, .38); }
.card.peek { position: fixed; margin: 0; transform-origin: 0 0; box-shadow: 0 30px 60px rgba(0, 0, 0, .28); }
/* 表情面板：黑色毛玻璃胶囊，从表情按钮上方弹出 */
.pop {
  position: fixed; z-index: 50; display: grid; grid-template-columns: repeat(6, 48px); gap: 2px; padding: 6px; border-radius: 28px;
  background: rgba(22, 22, 24, .97); /* 不用 backdrop-filter：毛玻璃层在 Safari 上一边缩放一边模糊会闪 */
  box-shadow: 0 18px 44px rgba(0, 0, 0, .3); transform-origin: calc(100% - 28px) 100%;
}
.pop button { width: 48px; height: 48px; border-radius: 50%; font-size: 28px; line-height: 1; display: grid; place-items: center; color: #fff; transition: transform 200ms var(--spring), background-color 160ms var(--out); }
/* 表情一律用彩色表情字体：系统字体列表里有的字体自带单色表情，会被画成深色、在深色面板上看不见 */
.pop button, .emo, .emo-p { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", sans-serif; }
.pop button:active { transform: scale(.8); background: rgba(255, 255, 255, .14); }
/* 被对方针对时屏幕四周闪一圈红 */
/* 付款时的金币 */
.coin {
  position: fixed; left: 0; top: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #fff8cf 0 12%, #ffd84a 34%, #e8a500 72%, #b97f00);
  box-shadow: 0 2px 5px rgba(0, 0, 0, .22), inset 0 0 0 1.5px rgba(255, 255, 255, .35);
}
/* 行动卡登场：从出牌人那里飞到屏幕中央亮个相，再落进弃牌堆 */
.reveal-dim { position: fixed; inset: 0; background: radial-gradient(circle at 50% 44%, rgba(0, 0, 0, .06), rgba(0, 0, 0, .3)); }
.reveal-cap {
  position: fixed; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 40px); padding: 9px 16px; border-radius: 999px;
  background: #000; color: #fff; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 10px 26px rgba(0, 0, 0, .25);
}
.reveal-cap.alert { background: var(--red); }
.ghost.reveal .card { box-shadow: 0 30px 60px rgba(0, 0, 0, .32); }
/* 凑齐一套时向外扩散的彩圈 */
.ring { position: fixed; left: 0; top: 0; border-radius: 50%; border: 4px solid var(--c); box-shadow: 0 0 18px var(--c), inset 0 0 12px var(--c); }
/* 底部面板刚打开时：内容依次上浮，卡牌一张张弹出来 */
.sheet.stagger .sbody > *, .sheet.stagger > .acts { animation: rise 320ms var(--out) both; animation-delay: calc(40ms + var(--k, 0) * 30ms); }
.sheet.stagger .sbody > :nth-child(2) { --k: 1; } .sheet.stagger .sbody > :nth-child(3) { --k: 2; } .sheet.stagger .sbody > :nth-child(4) { --k: 3; }
.sheet.stagger .sbody > :nth-child(n+5) { --k: 4; } .sheet.stagger > .acts { --k: 5; }
.sheet.stagger .cards > .tile, .sheet.stagger .bigcards > .tile, .sheet.stagger .cards > .card { animation: tileIn 300ms var(--spring) both; animation-delay: calc(80ms + var(--j, 0) * 24ms); }
.sheet.stagger :is(.cards, .bigcards) > :nth-child(2) { --j: 1; } .sheet.stagger :is(.cards, .bigcards) > :nth-child(3) { --j: 2; }
.sheet.stagger :is(.cards, .bigcards) > :nth-child(4) { --j: 3; } .sheet.stagger :is(.cards, .bigcards) > :nth-child(5) { --j: 4; }
.sheet.stagger :is(.cards, .bigcards) > :nth-child(6) { --j: 5; } .sheet.stagger :is(.cards, .bigcards) > :nth-child(7) { --j: 6; }
.sheet.stagger :is(.cards, .bigcards) > :nth-child(n+8) { --j: 7; }
@keyframes tileIn { from { opacity: 0; translate: 0 8px; scale: .92; } }
.scoreline { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 14px 0 8px; font-size: 15px; color: var(--ink-2); }
.scoreline b { font-size: 32px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.scoreline .nm { font-size: 15px; font-weight: 600; color: var(--ink); max-width: 6em; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
.badge { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 14px 0 10px; border-radius: 17px; background: var(--gold-grad); color: #fff; text-shadow: var(--on-gold); font-size: 14px; font-weight: 700; }
.badge svg, .badge .ico { width: 18px; height: 18px; object-fit: contain; }
.badge.cool { background: var(--wine-grad); text-shadow: none; }
.badge.hot { background: linear-gradient(135deg, #c42a52, #8a1535); text-shadow: none; }
.endnote { margin: 6px 0 0; font-size: 15px; color: var(--ink-2); }
/* 对方已经点了再来一局：按钮轻轻"呼吸"，提醒一下 */
.btn.nudge { animation: nudge 1.8s ease-out infinite; }
@keyframes nudge { 0% { box-shadow: 0 0 0 0 rgba(125, 20, 49, .45); } 70%, 100% { box-shadow: 0 0 0 10px rgba(125, 20, 49, 0); } }
.rules { margin: 0; padding-left: 1.2em; display: grid; gap: 10px; font-size: 16px; line-height: 1.5; color: var(--ink); }
/* 赌一把：押注筹码和按钮用金色，一眼看出"这是在冒险" */
.chip.gold[aria-checked="true"] { background: var(--gold-grad); color: #fff; text-shadow: var(--on-gold); }
.btn.gold { background: var(--gold-grad); color: #fff; text-shadow: var(--on-gold); }
.betnote { margin: 8px 0 0; font-size: 13px; }
.stamp.gray { background: #8e8e93; box-shadow: 0 18px 44px rgba(0, 0, 0, .2); }
/* 老虎机（赌一把、捉鬼套装）：老虎机.png 做机身，三个竖向转轮嵌在图上的三个白色窗口里；没有图时用 CSS 画一台。
 * 窗口位置按 1254×1254 的原图量：上沿 35.4%、高 31.8%，三格左沿 16.4% / 38.6% / 61.4%、宽约 20.4%；
 * 圆顶紫色区放标题，底下出币口是金币喷出来的地方。格子是正方形（和 7.png、8.png 这些 1254×1254 的图一样），
 * 窗口里正好露出一整格 + 上下各小半格，"差一格"看得见。 */
.slot { position: fixed; z-index: 47; left: 50%; top: 0; --sw: min(330px, calc(100vw - 48px), 58vh); width: var(--sw); transform: translateX(-50%); text-align: center; }
.slot .sm { position: relative; width: var(--sw); height: var(--sw); }
/* 投影只加在机身图本身：滤镜加在包着转轮的整台机器上，iOS Safari 会把整层（连机身图）画丢 */
.slot .sm-art { position: absolute; inset: 0; width: 100%; height: 100%; -webkit-user-drag: none; filter: drop-shadow(0 20px 36px rgba(0, 0, 0, .38)); }
.slot .sm-fb { position: absolute; inset: 0; filter: drop-shadow(0 20px 36px rgba(0, 0, 0, .38)); }
.slot .sm-fb i { position: absolute; display: block; }
.slot .sm-fb .dome { left: 22%; right: 22%; top: 6%; height: 26%; border-radius: 48% 48% 10% 10% / 70% 70% 10% 10%; background: linear-gradient(180deg, #7b3cff, #4a10d8); box-shadow: inset 0 0 0 calc(var(--sw) * .028) #ffc21a; }
.slot .sm-fb .body { left: 9%; right: 9%; top: 27%; height: 54%; border-radius: 9%; background: linear-gradient(180deg, #ffd84a, #ffae00); box-shadow: inset 0 0 0 calc(var(--sw) * .012) #ff9500; }
.slot .sm-fb .face { left: 14%; right: 14%; top: 33%; height: 36%; border-radius: 4%; background: #4a10d8; }
.slot .sm-fb .base { left: 5%; right: 5%; top: 77%; height: 17%; border-radius: 6% 6% 14% 14%; background: linear-gradient(180deg, #6a24f0, #3d08b8); box-shadow: inset 0 calc(var(--sw) * -.03) 0 #ffb800; }
.slot .sm-fb .tray { left: 28%; right: 28%; top: 79%; height: 8%; border-radius: 12%; background: linear-gradient(180deg, #8a5200, #ffb800); box-shadow: 0 0 0 calc(var(--sw) * .014) #ffd84a; }
.slot .sm-fb .lever { right: 1.5%; top: 34%; width: 3%; height: 30%; border-radius: 99px; background: linear-gradient(90deg, #ffae00, #ffe27a); }
.slot .sm-fb .knob { right: -1%; top: 25%; width: 10%; height: 10%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a8a, #e0001b 60%, #a00012); }

/* 倍率图（×2 / ×4 / ×8）：X 和数字的图拼在一行。每张图用负边距裁掉透明边，--mh 是数字的字高（X 小一些、居中）；
 * 金色的字压在金色底上看不清：带倍率图的徽章、按钮底色换成酒红 */
.mult { display: inline-flex; align-items: center; vertical-align: middle; --mh: 1.3em; line-height: 1; white-space: nowrap; }
.mult .mg { --h: calc(var(--mh) / (var(--y1) - var(--y0))); flex: none; width: var(--h); height: var(--h); margin: calc(var(--h) * var(--y0) * -1) calc(var(--h) * (var(--x1) - 1)) calc(var(--h) * (var(--y1) - 1)) calc(var(--h) * var(--x0) * -1); -webkit-user-drag: none; pointer-events: none; }
.mult .mg.x { --mh: .82em; margin-right: calc(var(--h) * (var(--x1) - 1) + .04em); }
.mult .mg:not(.x) + .mg { margin-left: calc(var(--h) * var(--x0) * -1 - .06em); }
.round.raise:has(.mg), .zstake:has(.mg), .x4:has(.mg), .pw .surge:has(.mg) { background: var(--wine-grad); } /* 图真的在才换底色：读不到换回文字时还是原来的金色 */
.round.raise:has(.mg) { box-shadow: 0 0 0 2px var(--gold-hi), 0 6px 16px rgba(125, 20, 49, .4); }
.chip[aria-checked="true"] .x4:has(.mg) { box-shadow: 0 0 0 1px rgba(255, 255, 255, .55); } /* 选中的颜色片本身就是酒红：描一圈白边 */
.round.raise .mult { --mh: 1.55em; }
.zstake .mult { --mh: 1.25em; margin: -3px 0; }
.x4 .mult, .pw .surge .mult { --mh: 1.2em; margin: -2px 0; }
.chip .mult { --mh: 1.35em; margin: -4px 0; }
.chip.gold { padding: 0 12px; } /* 押注片（只有它用 gold）：带倍率图会宽一点，窄屏、有奖池时也排得下一行 */
.chip .x4 .mult { --mh: 1.2em; margin: -2px 0; }
.btn .mult { --mh: 1.35em; margin: -4px 1px; }
.slot .sm-title .mult { --mh: 1.4em; margin: -6px 0 -6px 2px; }
.stamp .mult { --mh: 1.15em; margin: -10px 0 -10px 6px; }
.float .mult { --mh: 1.25em; }
.sheet h3 .mult { --mh: 1.3em; margin: -6px 1px; }
.badge .mult { --mh: 1.3em; margin: -6px 0; }

/* ═══════════ 设计图布局 ═══════════
 * 顶栏 → 对方地产区（弧形）→ 地产颜色区 + 中央指示器 → 自己的地产区（弧形）→ 出牌区（弧形）→ 主按钮。
 * 牌堆、弃牌区不画在桌上（摸牌、弃牌的动画从中央指示器进出，弃牌历史在菜单里），腾出来的高度都给对方地产区 */
.game { gap: 6px; padding-top: 0; --gpl: max(10px, env(safe-area-inset-left, 0px)); --gpr: max(10px, env(safe-area-inset-right, 0px)); overflow-x: clip; } /* 两边的牌可以伸出屏幕一点：在这里裁掉，不出横向滚动 */
@supports not (overflow: clip) { html { overflow-x: hidden; } }
.topbar {
  position: sticky; top: calc(var(--safe-t) + 6px); z-index: 6; flex: none; margin-top: calc(var(--safe-t) + 6px);
  display: flex; align-items: center; gap: 6px; height: 50px; padding: 4px; border-radius: 25px;
  /* 阴影最后那层：和页面同色的实心垫子（排在最后，画在真阴影底下），垫住顶栏上面那道缝和两边——页面滚动时桌面不从顶栏上沿、两边冒出来 */
  background: rgba(255, 255, 255, .97); box-shadow: 0 6px 18px rgba(40, 20, 0, .08), 0 0 0 1px rgba(0, 0, 0, .05), 0 -14px 0 16px var(--paper);
}
.tb-more { flex: none; width: 64px; height: 42px; border-radius: 21px; background: var(--mist); color: var(--ink); display: grid; place-items: center; transition: transform 160ms var(--out), background-color 160ms var(--out); }
.tb-more svg { width: 22px; height: 22px; }
.chatq { position: relative; flex: 1; min-width: 0; height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-radius: 21px; background: var(--mist); color: var(--ink-3); font-size: 15px; text-align: left; transition: transform 160ms var(--out), background-color 160ms var(--out); }
.chatq svg { flex: none; width: 18px; height: 18px; opacity: .7; }
.chatq .ph { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chatq.has { color: var(--ink); background: #fff3f5; box-shadow: inset 0 0 0 1.5px rgba(165, 29, 67, .25); }
.chatq .badge { flex: none; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--wine-grad); color: #fff; font-size: 12px; font-weight: 800; line-height: 22px; text-align: center; }
.tb-emo { flex: none; width: 42px; height: 42px; background: var(--mist); color: var(--ink); }
.tb-emo svg { width: 22px; height: 22px; }
.tb-emo[aria-expanded="true"] { background: var(--ink); color: #fff; }
.tb-more:active, .chatq:active, .tb-emo:active { transform: scale(.94); background: var(--mist-2); }
.pop.down { transform-origin: calc(100% - 28px) 0; }
/* 弧形分块：框线是一段圆环（SVG），里面的银行、地产组由 layoutArcs 按弧摆好 */
.zone > .arc, .handbox > .arc { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.arc path { fill: rgba(255, 255, 255, .42); stroke: #e2c06c; stroke-width: 1.5; stroke-dasharray: 7 5; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: stroke 160ms var(--out); }
.zone.opp > .arc path { stroke: #cfcfd6; }
.handbox > .arc path { fill: rgba(255, 255, 255, .28); stroke: #ead9b4; }
.zone.opp { flex-basis: var(--oppx); transform: rotate(180deg); } /* 对方坐在对面：整块倒过来（弧形轨道在块里先上下翻着画，转过来还是往上拱） */
.arow { position: absolute; inset: 0; z-index: 1; }
.arow > .bank, .arow > .set { position: absolute; transform: rotate(var(--ar, 0deg)); transform-origin: 50% 0; padding: 0; gap: 4px; }
.arow > .set::before { content: ''; position: absolute; inset: -4px -5px; } /* 牌缩小时点按区域往外扩一点（组距至少 10px，不会叠） */
.arow > .set { width: var(--tw); min-width: 0; } /* 每组宽度就是牌宽：说明文字比牌宽时往两边伸（说明在外弧那一侧，那里牌距本来就更宽），不把整组撑宽 */
.zone.opp .arow > .bank, .zone.opp .arow > .set { transform-origin: 50% 100%; } /* 对方那块：每项站在外弧上（块里是下沿贴着外弧） */
.zone.me .arow > .bank, .zone.me .arow > .set { flex-direction: column-reverse; } /* 自己这块：说明文字在牌上方（挨着外弧），和对方那块一样 */
/* 对方那块的牌面、说明文字、两个角原地转 180°：看起来是正的；位置不变（说明还在外弧那一侧，牌在下面） */
.zone.opp .arow .stack, .zone.opp .arow .pile, .zone.opp .arow .cap, .zone.opp > .zcorner, .zone.opp > .zstake { rotate: 180deg; }
.zone.opp .set .lockmark { transform: translate(-50%, -50%) rotate(168deg); }
.zone .set { --step: var(--zstep, calc(var(--th) * .16)); }
.arow .cap { font-size: 11.5px; line-height: 18px; }
.arow .set .cap.near { padding: 0 6px; }
/* 挤不下：说明收成短的（layoutArcs 按这一项和左右邻居的间距加 .tight）——「差1→4M」→「差1」、「银行 37M」→「37M」；
 * 抵押的只留牌上的「抵押」章（visibility 不改高度，量好的位置不变）。完整信息都在 aria-label 里 */
.arow > .tight .cap .na, .arow > .bank.tight .cap .ico { display: none; }
.arow > .set.mortgaged.tight .cap { visibility: hidden; }
.zcorner { position: absolute; left: 0; top: 0; z-index: 30; white-space: nowrap; transform-origin: 50% 50%; }
/* 加注倍率：对方地产区外弧最高点正下方的金色小牌子（只在加过注时出现）。位置由 layoutArcs 算 */
.zstake { position: absolute; left: 0; top: 0; z-index: 30; padding: 0 10px; border-radius: 11px; background: var(--gold-grad); color: #fff; text-shadow: var(--on-gold); font-size: 13px; font-weight: 800; line-height: 22px; letter-spacing: .02em; white-space: nowrap; box-shadow: 0 0 0 1.5px #fff3c4, 0 3px 8px rgba(160, 100, 0, .3); pointer-events: none; }
.zstake small { margin-right: 3px; font-size: 11px; font-weight: 700; }
.zcorner .hc, .handcnt .hc { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px 0 5px; border-radius: 13px; background: rgba(255, 255, 255, .85); box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); }
.zcorner .hc .cnt, .handcnt .hc .cnt { font-size: 13px; font-weight: 700; color: var(--ink); }
.zcorner .hc.over, .handcnt .hc.over { background: var(--wine-grad); }
.zcorner .hc.over .cnt, .handcnt .hc.over .cnt { color: #fff; }
/* 自己的手牌张数 + 电力：出牌区圆环外弧正中、手牌上方，张数在左、电力在右，沿外弧排。位置由 drawHandArc 算。
 * 压在手牌上面（电力能点）；选中一张牌时沉到手牌底下，抬起的牌盖在它们上面 */
.handcnt { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.handcnt > * { position: absolute; left: 0; top: 0; margin: 0; }
.handbox:has(.card.sel) > .handcnt { z-index: 0; }
.handcnt .pw { pointer-events: auto; }
.zcorner .pw, .handcnt .pw { background: rgba(255, 255, 255, .85); box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); padding: 0 5px; min-height: 26px; }
.zcorner .pw::before { inset: -9px -6px; } /* 角标是斜着放的：点按区域再放大一点，保证 44px 左右 */
.handcnt .pw::before { inset: -9px -6px -4px; } /* 底下离牌只有几 px：点按区域往下少伸一点，不盖住牌 */
/* 中间一排：中央指示器放大，摆在对方内弧和自己外弧正中间（往上伸进对方内弧底下的空当）；
 * 两边的名字（胶囊）、地产颜色格沿一段往上拱、穿过指示器的弧排开：左边名字 + 颜色，右边颜色 + 名字。位置由 layoutMid 算 */
.midrow { position: relative; z-index: 2; display: block; height: var(--mh); pointer-events: none; } /* 压在两块地产区上面（提示、名字、指示器不被弧形底色和说明文字盖住），在底栏 5、顶栏 6 下面 */
.midrow .stage { pointer-events: auto; } /* 这一排只有中央指示器能点：名字、颜色格不挡住上下伸过来的电力 / 张数角标 */
.side { position: absolute; inset: 0; }
.side > * { position: absolute; left: 0; top: 0; }
.side .who { display: inline-flex; align-items: center; gap: 4px; min-height: 0; padding: 0; }
.side .nm { font-size: 14px; max-width: 8em; line-height: 26px; padding: 0 11px; background: rgba(255, 255, 255, .94); box-shadow: 0 0 0 1px rgba(0, 0, 0, .08), 0 2px 6px rgba(0, 0, 0, .06); }
.side .slots i { width: 20px; height: 26px; border-radius: 7px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .08), 0 2px 6px rgba(0, 0, 0, .06); } /* 和名字胶囊一样高：一格像一张竖着的小牌 */
.side .slots:has(i:nth-child(4)) i { width: 16px; } /* 要凑 4 套以上：格子窄一点，给名字留地方 */
@media (max-width: 389px) { /* 窄屏：颜色格、名字胶囊再收一点，每边多出将近 20px 给名字 */
  .side .slots { gap: 3px; }
  .side .slots i { width: 15px; border-radius: 6px; }
  .side .slots:has(i:nth-child(4)) i { width: 13px; }
  .side .nm { padding: 0 9px; }
}
.midrow .stage { position: absolute; left: 50%; top: 0; width: var(--gd, 64px); height: var(--gd, 64px); margin-left: calc(var(--gd, 64px) / -2); padding: 0; border-radius: 50%; overflow: visible; }
.midrow .gauge { --D: var(--gd, 64px); }
.midrow .stage .st-sub { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } /* 状态那一行只给读屏；看的人看主按钮和浮动提示 */
.midrow .stage .corner { top: -4px; }
.midrow .stage .corner.pot { left: -12px; }
.midrow .toast { top: calc(100% + 2px); }
/* 出牌区：手牌的扇形外面也描一段圆环。这一块左右铺满屏幕，扇形两头的牌可以伸出屏幕两成 */
.handbox { position: relative; z-index: 1; margin: -14px calc(-1 * var(--gpr)) 0 calc(-1 * var(--gpl)); } /* 往上收一点：自己地产区内弧中间拱起来，底下本来就空着。
  自己一层（z-index 1）：整块盖在自己地产区上面（拱进去的张数、电力也是），里面张数 / 选中的牌的先后照旧 */
.hand { position: relative; z-index: 1; padding: var(--hpad, 24px) 0 var(--hb); height: calc(var(--hw) / var(--ratio) + var(--hpad, 24px) + var(--hb)); } /* 上面留的高度 --hpad 由 drawHandArc 算：刚好在外弧和牌中间放下手牌张数 */
.hand.fan { overflow: hidden; overflow: clip; } /* 扇形放得下：不能横向滑（伸出去的那点直接裁掉）；放不下才叠起来横向滑 */
/* 主按钮：整排 */
.dock { gap: 8px; padding-top: 6px; padding-bottom: calc(var(--safe-b) + 8px); }
.dock .round.raise { width: 52px; height: 52px; }

@media (min-width: 700px) {
  :root { --tw: 70px; --twmax: 92px; --hw: clamp(66px, 12svh, 108px); }
  .game { --gap: 16px; padding-top: calc(var(--safe-t) + 22px); }
}
@media (min-width: 900px) { /* 电脑：对局区域两边是空白，扇形两头的牌渐隐出去，不在 760px 的边上被一刀切断。
  只给牌那一层：出牌区的圆环、张数和电力拱在这一块上沿外面，遮罩会把它们裁掉；地产区也不加（两个角标会被一起淡掉） */
  .hand { -webkit-mask-image: linear-gradient(90deg, transparent, #000 32px, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(90deg, transparent, #000 32px, #000 calc(100% - 32px), transparent); }
}

  .zone { min-height: 129px; }

}
/* 手机横屏这种特别矮的屏幕：本来就要上下滚，桌面区宁可高一点，也别把牌下面的说明裁掉 */
@media (max-height: 480px) {

}
/* 有鼠标的设备才有悬停效果：牌微微抬起，按钮底色略深（触屏点一下不会卡在"悬停"状态） */
@media (hover: hover) and (pointer: fine) {
  .hand .card:not(.sel):not(.dim):hover { translate: 0 -8px; }
  .set:not(.dim):hover .stack, .bank:hover .pile { translate: 0 -3px; }
  .btn.primary:not([disabled]):hover { background: var(--wine-hi); }
  .btn.cpick:not(.done):hover { background: var(--mist-2); }
  .btn.plain:not([disabled]):hover, .round:hover, .chip:not([aria-checked="true"]):hover, .resume:hover { background: var(--mist-2); }
  .menu button:hover { background: var(--mist); }
  .btn, .round, .chip, .resume, .menu button { transition-property: transform, background-color, opacity; }
}
/* 很矮的屏幕（横屏手机等）：中间一排和手牌再收一点，放不下就上下滚 */
@media (max-height: 620px) {
  :root { --mh: 56px; --hw: clamp(52px, min(18vw, 13svh), 76px); }
}
/* 全球匹配：首页按钮、雷达等待页、对手的对话气泡 */

/* 收益预期：手牌上的"最高 32M"、牌桌上奖池发光 */
.hand .card .gain { position: absolute; left: 4%; top: 4%; z-index: 4; /* 扇形里每张牌只露出左边：标签放左上角才看得全 */ padding: 1px 7px; border-radius: 999px; background: var(--gold-grad); color: #fff; text-shadow: var(--on-gold); font-size: calc(var(--w) * .13); font-weight: 800; line-height: 1.5; white-space: nowrap; box-shadow: 0 0 0 1.5px #fff3c4, 0 3px 8px rgba(160, 100, 0, .45); pointer-events: none; animation: gainPulse 1.8s ease-in-out infinite; }

/* 集齐一整套：史诗级大场面 */

/* 二维码：字节模式、纠错等级 M、版本 1–40 自动选择、8 种掩码按惩罚分取最优（算法参照 ISO/IEC 18004，思路同 Nayuki 实现） */
const QR = (() => {
  const ECC_PER_BLOCK = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
  const NUM_BLOCKS = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];

  const bit = (x, i) => ((x >>> i) & 1) !== 0;

  function rawModules(ver) {
    let r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  const dataCodewords = (ver) => Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ver] * NUM_BLOCKS[ver];

  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 0xff;
  }
  function rsDivisor(degree) {
    const r = new Array(degree).fill(0);
    r[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < r.length; j++) {
        r[j] = gfMul(r[j], root);
        if (j + 1 < r.length) r[j] ^= r[j + 1];
      }
      root = gfMul(root, 2);
    }
    return r;
  }
  function rsRemainder(data, div) {
    const r = div.map(() => 0);
    for (const b of data) {
      const f = b ^ r.shift();
      r.push(0);
      div.forEach((c, i) => { r[i] ^= gfMul(c, f); });
    }
    return r;
  }

  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 1;
    for (; ver <= 40; ver++) {
      const ccBits = ver <= 9 ? 8 : 16;
      if (4 + ccBits + bytes.length * 8 <= dataCodewords(ver) * 8) break;
    }
    if (ver > 40) throw new Error('内容太长，二维码放不下');
    const ccBits = ver <= 9 ? 8 : 16;
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(4, 4); // 字节模式 0100
    push(bytes.length, ccBits);
    bytes.forEach((b) => push(b, 8));
    const cap = dataCodewords(ver) * 8;
    push(0, Math.min(4, cap - bits.length));
    push(0, (8 - (bits.length % 8)) % 8);
    for (let pad = 0xec; bits.length < cap; pad ^= 0xec ^ 0x11) push(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));

    // 分块加纠错码并交织
    const nb = NUM_BLOCKS[ver];
    const eccLen = ECC_PER_BLOCK[ver];
    const raw = Math.floor(rawModules(ver) / 8);
    const nShort = nb - (raw % nb);
    const shortLen = Math.floor(raw / nb);
    const div = rsDivisor(eccLen);
    const blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const codewords = [];
    for (let i = 0; i < blocks[0].length; i++) {
      blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= nShort) codewords.push(b[i]); });
    }

    // 画功能图形
    const size = ver * 4 + 17;
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setFn = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy));
        const x = cx + dx;
        const y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setFn(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3);
    finder(size - 4, 3);
    finder(3, size - 4);
    if (ver > 1) {
      const n = Math.floor(ver / 7) + 2;
      const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
      const pos = [6];
      for (let p = size - 7; pos.length < n; p -= step) pos.splice(1, 0, p);
      pos.forEach((y, i) => pos.forEach((x, j) => {
        if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) return;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setFn(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }));
    }
    const drawFormat = (mask) => {
      const d = (0 << 3) | mask; // 纠错等级 M 的格式位是 00
      let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((d << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setFn(8, i, bit(b, i));
      setFn(8, 7, bit(b, 6));
      setFn(8, 8, bit(b, 7));
      setFn(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(b, i));
      setFn(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
      const b = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const a = size - 11 + (i % 3);
        const c = Math.floor(i / 3);
        setFn(a, c, bit(b, i));
        setFn(c, a, bit(b, i));
      }
    }

    // 放数据（之字形）
    let k = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let v = 0; v < size; v++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const up = ((right + 1) & 2) === 0;
          const y = up ? size - 1 - v : v;
          if (!fn[y][x] && k < codewords.length * 8) {
            mod[y][x] = bit(codewords[k >>> 3], 7 - (k & 7));
            k++;
          }
        }
      }
    }

    const MASKS = [
      (x, y) => (x + y) % 2 === 0,
      (x, y) => y % 2 === 0,
      (x) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
      (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
      (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
    ];
    const applyMask = (m) => {

    let data = null;

window.mdNet = NET; // 只读的联机统计（调试 / 自动化测试看这里）

/* ═══════════ 联机会话层（协议 v2） ═══════════
 * 网络消息先到这里：按编号把增量补丁打到"最后收到的局面"上、核对校验值，编号接不上或校验对不上就要一份完整局面；
 * 断线回来的补课（catchup）和"什么都没错过"（resume）也在这里处理。处理好的完整消息再交给展示层（onMessage：先播大场面再结算）。
 * 展示层的桌面可能还停在旧局面（等动画），所以补丁永远打在网络层自己的 S.netBody 上，不打在 S.snap 上。 */
const canonJson = (x) => (x === null || typeof x !== 'object' ? JSON.stringify(x) : Array.isArray(x) ? '[' + x.map(canonJson).join(',') + ']'

function hashOf(x) {

  for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36);

// 打补丁：不改原对象，没变的部分和原对象共用
function patchJson(a, p) {

  if (Object.prototype.hasOwnProperty.call(p, '$')) return p.$;
  if (p.o) {
    const r = Object.assign({}, a);
    for (const k of Object.keys(p.o)) { if (p.o[k].x) delete r[k]; else r[k] = patchJson(a ? a[k] : undefined, p.o[k]); }
    return r;
  }
  if (p.a) {
    const r = a.slice();
    for (const k of Object.keys(p.a)) r[Number(k)] = patchJson(a[Number(k)], p.a[k]);
    return r;

}
const copyJson = (x) => JSON.parse(JSON.stringify(x));
function receive(m) {
  switch (m.t) {
    case 'welcome':
      S.resyncing = false;
      S.netRoom = S.room ? S.room.id : null;
      S.netN = m.n || 0;
      if (m.view) {
        S.netBody = { view: m.view, options: m.options, discardHint: m.discardHint == null ? null : m.discardHint };
        if (m.hash && hashOf(S.netBody) !== m.hash) NET.hashBad++;
        S.netBody = copyJson(S.netBody);
      } else S.netBody = null;
      NET.fulls++;
      break;
    case 'update': {
      if (S.resyncing) return; // 已经在要完整局面了：中间这些增量没有基准，丢掉
      let body;
      if (m.base != null) { // 增量
        if (!S.netBody || m.base !== S.netN) { resync('编号接不上'); return; }
        body = patchJson(S.netBody, m.patch);
        NET.patches++;
      } else {
        body = { view: m.view, options: m.options, discardHint: m.discardHint == null ? null : m.discardHint };
        if (!m.catchup) NET.fulls++;
      }
      if (m.hash && hashOf(body) !== m.hash) { NET.hashBad++; resync('校验不符'); return; }
      S.netBody = body;
      S.netN = m.n;
      S.netRoom = S.room ? S.room.id : null;
      delete m.patch;
      Object.assign(m, copyJson(body)); // 展示层拿一份自己的拷贝：它怎么改都不影响下一次打补丁
      if (m.catchup) { // 断线期间错过的几步：一次补上（动画照播；太多就安静地刷新）
        NET.catchups++;
        if (S.snap && S.screen !== 'game') S.screen = 'game';
        if (m.events.length > 24) m.quiet = true;
        onMessage(m);
        reconnected();
        return;
      }
      break;
    }
    case 'resume': // 断线期间什么都没错过：核对一下桌面，对得上就接着打
      if (!S.netBody || hashOf(S.netBody) !== m.hash) { resync('重连核对不符'); return; }
      S.netN = m.n;
      NET.resumes++;
      if (S.snap && S.screen !== 'game') { S.screen = 'game'; render(); }
      if (m.clock !== undefined) setClock(m.clock);
      onMessage({ t: 'room', room: m.room });
      reconnected();
      return;
    case 'chatlog': chat.load(m.list); return;
    case 'chat': chat.add(m.m, m.cid); return;

}
function resync(why) {
  NET.resyncs++;
  S.resyncing = true;
  S.netBody = null;
  console.warn('[联机] 重新同步：' + why);
  try { if (S.ws && S.ws.readyState === 1) S.ws.send(JSON.stringify({ t: 'sync' })); } catch { /* 连接断了：重连时会拿到完整局面 */ }
}
function reconnected() {
  if (S.justReconnected) { S.justReconnected = false; notice('已重新连接', 'ok', 1800); }
  sendPending();
}
const randomHex = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => b.toString(16).padStart(2, '0')).join('');
// 这台设备的编号（只用于匹配时别把自己配给自己）
const PID = store.get('pid', null) || (() => { const p = randomHex(12); store.set('pid', p); return p; })();
// 房间码输入：大小写、空格、横线都行，也可以直接粘贴整条邀请链接
function parseCode(raw) {
  const t = String(raw || '').trim();
  const m = t.match(/(?:#\/?|[?&]room=)([A-Za-z0-9]{6})(?![A-Za-z0-9])/) || t.replace(/[\s-]/g, '').match(/^([A-Za-z0-9]{6})$/);
  return (m ? m[1] : t.replace(/[\s-]/g, '')).toUpperCase();
}

function connect() {
  if (!S.room || S.screen === 'fatal') return; // 停下的窗口（座位在别处打开了）不因为切回前台 / 网络恢复就自己连回去，等玩家点"在这里继续"
  clearTimeout(S.retryTimer);
  clearTimeout(S.openTimer);
  stopBeat();
  if (S.ws) { S.ws.onclose = null; S.ws.onerror = null; try { S.ws.close(); } catch (e) { /* 忽略 */ } }
  // navigator.onLine 有时不准（部分 WebView 一直报离线）：照样试着连，只是状态显示"网络断开"
  // v=2：增量更新 + 校验 + 断线补课；last：这台设备看到的最后一次更新（同一个房间、桌面还在时才报，服务器据此只补错过的几步）
  const last = S.snap && S.netBody && S.netRoom === S.room.id ? `&last=${S.netN || 0}` : '';
  const ws = new WebSocket(`${WS_BASE}/api/rooms/${S.room.id}/ws?token=${encodeURIComponent(S.room.token)}&v=2${last}`);
  S.ws = ws;
  S.wsOpen = false;
  S.net = !navigator.onLine ? 'offline' : S.everOpen ? 'reconnecting' : 'connecting';
  refreshStatus();
  // 握手迟迟不成功就放弃这次，换一条连接再试
  S.openTimer = setTimeout(() => { if (S.ws === ws && ws.readyState !== 1) { try { ws.close(); } catch (e) { /* 忽略 */ } dropped(ws); } }, NET.openTimeout);
  ws.onopen = () => {
    if (S.ws !== ws) return;
    clearTimeout(S.openTimer);
    S.wsOpen = true;
    S.net = 'open';
    S.lastRx = Date.now();
    if (S.everOpen && S.retry > 0) S.justReconnected = true; // 等 welcome 到了再提示"已重新连接"
    S.everOpen = true;
    S.retry = 0;
    startBeat(ws);
    refreshStatus();
  };
  ws.onmessage = (e) => {
    if (S.ws !== ws) return;
    S.lastRx = Date.now();
    clearTimeout(S.watchdog);
    if (e.data === 'pong') { notePong(); return; }
    let m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    NET.rx += e.data.length;
    receive(m);
  };

}

// 连接断了：没确认的动作先挂着（重连后原样重发），然后按退避节奏重连
function dropped(ws) {
  if (S.ws !== ws) return;
  S.ws = null;
  S.wsOpen = false;
  stopBeat();
  clearTimeout(S.openTimer);
  if (S.pending) S.pending.sent = false;
  if (S.room && S.screen !== 'fatal') scheduleReconnect();
  render();
}

function scheduleReconnect(delay) {
  clearTimeout(S.retryTimer);
  if (!S.room || S.screen === 'fatal') return;
  // 第一次几乎立刻重连，之后 0.6s、1s、1.6s……最多 8s，加一点随机避免两边同时挤；系统说断网了就每 5 秒试一次（online 事件来了立刻连）
  const off = !navigator.onLine;
  const d = delay != null ? delay : off ? 5000 : S.retry === 0 ? 150 : Math.min(8000, 600 * Math.pow(1.6, S.retry - 1)) * (0.75 + Math.random() * 0.5);
  S.retry++;
  S.net = off ? 'offline' : 'reconnecting';
  S.retryTimer = setTimeout(connect, d);
  refreshStatus();
}

function disconnect() {
  S.gate = null;
  clearTimeout(S.gateTimer);
  dropQueued();
  clearTimeout(S.retryTimer);
  clearTimeout(S.openTimer);
  stopBeat();
  if (S.ws) { S.ws.onclose = null; S.ws.onerror = null; try { S.ws.close(); } catch (e) { /* 忽略 */ } }
  S.ws = null;
  S.wsOpen = false;
  S.net = 'idle';
  S.everOpen = false;
  S.retry = 0;
}

// 心跳：定时发 ping，服务器运行时自动回 pong；超过看门狗时间没有任何回音，就当连接已死，立刻换一条
function startBeat(ws) {
  stopBeat();

}
function stopBeat() {
  clearInterval(S.beat);
  clearTimeout(S.watchdog);
