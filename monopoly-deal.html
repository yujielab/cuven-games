  });
  S.fresh = new Set(S.lastIds ? [...ids].filter((x) => !S.lastIds.has(x)) : []);
  S.lastIds = ids;
  const top = v.discardTop;
  const turnCls = v.phase === 'gameOver' ? '' : v.activePlayer === me() ? 'turn-me' : 'turn-opp';
  return `<section class="game ${turnCls}" style="--breath:-${Date.now() % 2600}ms">
    <div class="zone opp">${whoHTML(opp())}${tableHTML(opp())}</div>
    <div class="midrow">
      <button class="pilebtn" data-do="deck" aria-label="抽牌堆 ${v.deckCount} 张">${deckHTML(v.deckCount)}<span class="cap">牌堆 <b class="num">${v.deckCount}</b></span></button>
      ${stageHTML()}
      <button class="pilebtn" data-do="discard-pile" aria-label="弃牌堆 ${v.discardCount} 张">${top != null ? cardHTML(top) : '<span class="slot"></span>'}<span class="cap">弃牌堆 <b class="num">${v.discardCount}</b></span></button>
    </div>
    <div class="zone me">${tableHTML(me())}${whoHTML(me())}</div>
    ${handHTML()}
    <div class="dock">
      <button class="round" data-do="menu" aria-label="菜单">${ICON.more}</button>
      ${mainButtonHTML()}
      <button class="round" data-do="emotes" aria-label="发表情" aria-haspopup="menu" aria-expanded="${!!$('#pop')}">${ICON.smile}</button>
    </div>
  </section>`;
}

function mainButton() {
  const v = V();
  const o = O();
  if (!S.wsOpen) return { label: S.net === 'offline' ? '网络断开了' : S.everOpen ? '正在重新连接' : '正在连接', disabled: true, cls: 'plain' };
  if (v.phase === 'gameOver') {
    const want = S.info ? S.info.rematch : [false, false];
    if (want[me()]) return { label: `等 ${nameOf(opp())} 确认`, disabled: true };
    return { label: want[opp()] ? `${nameOf(opp())} 想再来一局` : '再来一局', do: 'rematch', cls: 'primary' };
  }
  if (o.respond) return { label: '回应', do: 'open-respond', cls: 'alert' };
  if (o.discard) return { label: `弃掉 ${o.discard.count} 张`, do: 'open-discard', cls: 'alert' };
  if (S.target) return { label: '取消选择', do: 'cancel-target', cls: 'plain' };
  if (o.canEndTurn) return { label: '结束回合', do: 'end-turn', cls: 'primary' };
  return { label: v.phase === 'respond' ? '等对方回应' : '对方回合', disabled: true, cls: 'plain' };
}

function mainButtonHTML() {
  const b = mainButton();
  S.mainNow = `${b.cls || 'primary'}|${b.label}|${b.disabled ? 1 : 0}`;
  return `<button class="btn ${b.cls || 'primary'} main${S.busy ? ' wait' : ''}" ${b.disabled ? 'disabled' : ''} data-do="${b.do || ''}">${S.busy ? '<span class="spin"></span>' : esc(b.label)}</button>`;
}

function renderDock() {
  const old = $('.dock .main');
  if (!old || !S.snap) return;
  old.outerHTML = mainButtonHTML();
  morphMain();
}

// 手牌：放得下就居中、轻轻扇形展开；多了就叠起来（至少露出 44px 好点），不再扇形，方便横向滑
function layoutHand() {
  const hand = $('#screen .hand');
  if (!hand) return;
  const cards = $$('.card', hand);
  const n = cards.length;
  if (!n) return;
  hand.classList.add('nofx'); // 重绘后直接摆到位，不要每次都"转"一下
  const hw = cards[0].offsetWidth;
  const avail = hand.clientWidth - 28;
  const step = n < 2 ? hw : Math.max(44, Math.min(hw + 8, (avail - hw) / (n - 1)));
  hand.style.setProperty('--ov', (step - hw) + 'px');
  const fits = hw + step * (n - 1) <= avail + 1;
  const spread = fits && n > 1 ? Math.min(2.6, 15 / n) : 0;
  const mid = (n - 1) / 2;
  cards.forEach((el, k) => {
    const d = k - mid;
    el.style.setProperty('--r', (d * spread).toFixed(2) + 'deg');
    el.style.setProperty('--y', (d * d * spread * 0.32).toFixed(1) + 'px');
  });
  void hand.offsetWidth;
  hand.classList.remove('nofx');
}
addEventListener('resize', () => layoutHand());

// 选中 / 取消选中手牌：整页重绘会直接换成新位置，这里补一段"抬起 / 放下"的过渡
function selFx() {
  const was = S.lastSel;
  S.lastSel = S.sel;
  if (was === S.sel || !motionOK()) return;
  const pose = (el, up) => {
    const r = parseFloat(el.style.getPropertyValue('--r')) || 0;
    const y = parseFloat(el.style.getPropertyValue('--y')) || 0;
    return up ? `translateY(${y - 18}px) rotate(0deg) scale(1.03)` : `translateY(${y}px) rotate(${r}deg)`;
  };
  const spring = 'cubic-bezier(.34, 1.56, .64, 1)';
  const on = S.sel != null && cardNode(S.sel);
  if (on && on.closest('.hand')) on.animate([{ transform: pose(on, false) }, { transform: pose(on, true) }], { duration: 340, easing: spring });
  const off = was != null && cardNode(was);
  if (off && off.closest('.hand')) off.animate([{ transform: pose(off, true) }, { transform: pose(off, false) }], { duration: 300, easing: EASE_OUT });
}

/* ═══════════ 底部面板 ═══════════ */
function openSheet(sheet) {
  closeEmotes();
  sheet.returnFocus = document.activeElement;
  S.sheet = sheet;
  renderSheet();
  requestAnimationFrame(() => { const b = $('.sheet .btn:not([disabled]), .sheet button'); if (b) b.focus({ preventScroll: true }); });
}

function closeSheet() {
  if (!S.sheet) return;
  const back = S.sheet.returnFocus;
  S.sheet = null;
  renderSheet();
  if (back && back.isConnected) back.focus({ preventScroll: true });
}

let sheetToken = 0;
let lastSheetType = '';
let staggerTimer = 0;
function renderSheet() {
  const root = $('#sheet-root');
  const box = $('.sheet', root);
  let html = '';
  if (S.sheet && S.meta) {
    try { html = SHEETS[S.sheet.type](S.sheet); } catch (e) { console.error(e); html = ''; }
  }
  if (!html) {
    if (S.sheet) S.sheet = null;
    sheetToken++; // 作废还没执行的"打开"动画，避免面板关掉后又被打开、挡住整个页面
    root.classList.remove('open');
    root.setAttribute('aria-hidden', 'true');
    return;
  }
  const opening = !root.classList.contains('open') || S.sheet.type !== lastSheetType;
  lastSheetType = S.sheet.type;
  box.innerHTML = '<div class="grab" aria-hidden="true"></div><div class="sbody">' + html + '</div>';
  const acts = $('.sbody > .acts', box);
  if (acts) box.appendChild(acts); // 按钮固定在面板底部，内容再长也看得到
  // 刚打开（或换成另一种面板）时内容依次弹出来；面板里点选、刷新时不再重播
  if (opening && motionOK()) {
    box.classList.add('stagger');
    clearTimeout(staggerTimer);
    staggerTimer = setTimeout(() => box.classList.remove('stagger'), 900);
  } else if (!opening) {
    box.classList.remove('stagger');
  }
  root.setAttribute('aria-hidden', 'false');
  const token = ++sheetToken;
  requestAnimationFrame(() => { if (token === sheetToken && S.sheet) root.classList.add('open'); });
}

// 面板：按住顶部把手往下拖可以关闭；拖得不够远就弹回去
(() => {
  const root = $('#sheet-root');
  const box = $('.sheet', root);
  let y0 = 0;
  let dy = 0;
  let t0 = 0;
  let dragging = false;
  box.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('.grab') || !S.sheet) return;
    dragging = true;
    y0 = e.clientY;
    dy = 0;
    t0 = performance.now();
    box.setPointerCapture(e.pointerId);
    box.style.transition = 'none';
  });
  box.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dy = Math.max(0, e.clientY - y0);
    box.style.transform = `translate(-50%, ${dy}px)`;
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    box.style.transition = '';
    const fast = dy / Math.max(1, performance.now() - t0) > 0.5;
    if (dy > box.offsetHeight * 0.25 || (fast && dy > 24)) {
      closeSheet();
      if (S.sel != null) { S.sel = null; render(); }
      requestAnimationFrame(() => { box.style.transform = ''; }); // 从手指位置继续滑下去
    } else {
      box.style.transform = '';
    }
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
})();

const btn = (label, a, cls) => `<button class="btn ${cls || 'primary'}" data-do="act" data-a="${attr(a)}">${esc(label)}</button>`;
const btnDo = (label, d, cls, extra) => `<button class="btn ${cls || 'plain'}" data-do="${d}"${extra || ''}>${esc(label)}</button>`;

const SHEETS = {
  // 点手牌：能做什么
  hand(sh) {
    const v = V();
    const hand = v.players[me()].hand || [];
    if (!hand.includes(sh.cardId)) return '';
    const c = CARD(sh.cardId);
    const h = O().hand.find((x) => x.cardId === sh.cardId);
    const myTurn = O().canEndTurn;
    const acts = [];
    let extra = '';
    const p = h && h.play;
    if (p) {
      switch (p.kind) {
        case 'property':
          p.colors.forEach((k) => acts.push(btn(p.colors.length > 1 ? `当作${COLOR(k.color).zh}打出` : '打出地产', { type: 'PLAY_PROPERTY', cardId: c.id, color: k.color })));
          break;
        case 'rent': {
          const color = sh.color && p.colors.some((x) => x.color === sh.color) ? sh.color : p.colors.reduce((a, b) => (b.amount > a.amount ? b : a)).color;
          const base = p.colors.find((x) => x.color === color).amount;
          const d = Math.min(sh.doubles || 0, p.maxDoubles);
          extra = `<div class="group">按哪种颜色收</div><div class="chips" role="radiogroup">${p.colors.map((k) => `<button class="chip" role="radio" aria-checked="${k.color === color}" data-do="rent-color" data-v="${k.color}"><i style="background:${COLOR(k.color).hex}"></i>${COLOR(k.color).zh} ${k.amount}M${k.boost > 1 ? `<span class="x4">×${k.boost}</span>` : ''}</button>`).join('')}</div>`;
          const boost = v.players[me()].boost;
          if (boost) {
            const hit = p.colors.find((x) => x.color === color).boost > 1;
            extra += `<p class="sub boostnote">${hit ? `${AN('hugeWin')} 加成生效：这次按${COLOR(color).zh}收租 ×${boost.mult}，用完就没了。` : `注意：这次收租会用掉 ${AN('hugeWin')} 的 ×${boost.mult} 加成，但${COLOR(color).zh}不在加成里（加成的是 ${boost.colors.map((k) => COLOR(k).zh).join('、')}）。`}</p>`;
          }
          if (p.maxDoubles > 0) extra += `<div class="group">叠${AN('doubleRent')}（每张多占 1 次出牌）</div><div class="chips" role="radiogroup">${Array.from({ length: p.maxDoubles + 1 }, (_, n) => `<button class="chip" role="radio" aria-checked="${n === d}" data-do="rent-dbl" data-v="${n}">${n === 0 ? '不叠' : '×' + Math.pow(2, n)}</button>`).join('')}</div>`;
          acts.push(btn(`向${nameOf(opp())}收 ${base * Math.pow(2, d)}M`, { type: 'PLAY_ACTION', cardId: c.id, color, doubles: p.doubleIds.slice(0, d) }));
          break;
        }
        case 'passGo': acts.push(btn('打出，再摸 2 张', { type: 'PLAY_ACTION', cardId: c.id })); break;
        case 'debtCollector': acts.push(btn(`打出，向${nameOf(opp())}讨 5M`, { type: 'PLAY_ACTION', cardId: c.id })); break;
        case 'birthday': acts.push(btn(`打出，${nameOf(opp())}要随礼 2M`, { type: 'PLAY_ACTION', cardId: c.id })); break;
        case 'house':
        case 'hotel':
          if (p.setIds.length === 1) {
            const set = v.players[me()].sets.find((s) => s.id === p.setIds[0]);
            acts.push(btn(`盖在${COLOR(set.color).zh}上`, { type: 'PLAY_ACTION', cardId: c.id, setId: set.id }));
          } else acts.push(btnDo('选一组完整地产', 'target', 'primary', ` data-card="${c.id}"`));
          break;
        case 'slyDeal': acts.push(btnDo('选要拿走的地产', 'target', 'primary', ` data-card="${c.id}"`)); break;
        case 'forcedDeal': acts.push(btnDo('选要交换的地产', 'target', 'primary', ` data-card="${c.id}"`)); break;
        case 'dealBreaker': acts.push(btnDo('选要抢的整套地产', 'target', 'primary', ` data-card="${c.id}"`)); break;
        case 'bankruptcy': acts.push(btn(`打出，拿走${nameOf(opp())}银行全部 ${p.amount}M`, { type: 'PLAY_ACTION', cardId: c.id })); break;
        case 'liquidation':
          extra = `<p class="sub">${esc(nameOf(opp()))} 手里还有 ${p.handCount} 张牌，会全部弃掉。</p>`;
          acts.push(btnDo('选要清算的整套地产', 'target', 'primary', ` data-card="${c.id}"`));
          break;
        case 'hugeWin':
          extra = `<p class="sub">${p.remove ? `${esc(nameOf(opp()))} 桌上的 ${p.remove} 张地产会全部消失。` : `${esc(nameOf(opp()))} 桌上现在没有地产。`}${p.colors.length ? `你的${p.colors.map((k) => COLOR(k).zh).join('、')}下次收租 ×${p.mult}。` : '你现在没有完整套，拿不到收租加成。'}</p>`;
          acts.push(btn(`打出 ${NM('hugeWin')}`, { type: 'PLAY_ACTION', cardId: c.id }));
          break;
        default: break;
      }
    }
    if (h && h.bank) acts.push(btn(`存进银行（${c.value}M）`, { type: 'PLAY_BANK', cardId: c.id }, p ? 'plain' : 'primary'));
    let note = '';
    if (!myTurn) note = '轮到你的回合时才能出牌。';
    else if (O().playsLeft === 0) note = `这回合的 ${v.rules.playsPerTurn} 次出牌已经用完了${v.rules.autoEndTurn ? '，回合会自动结束' : '，可以结束回合'}。`;
    else if (c.action === 'justSayNo') note = `${AN('justSayNo')}要等对方对你出牌时再用。`;
    else if (c.action === 'doubleRent') note = '和租金卡一起打出时才能用。';
    else if (!p) note = c.type === 'rent' ? '你桌上还没有这几种颜色的地产，收不了租。'
      : c.action === 'house' ? `要先有一组完整地产（${COLOR('railroad').zh}、${COLOR('utility').zh}除外）才能放${NM('house')}。`
        : c.action === 'hotel' ? `要先有一组放了${NM('house')}的完整地产才能放${NM('hotel')}。`
          : c.action === 'dealBreaker' || c.action === 'liquidation' ? '对方还没有完整的一套。'
            : c.action === 'bankruptcy' ? '对方银行是空的，现在打出去拿不到东西。'
              : c.action === 'hugeWin' ? '对方桌上没有地产，你也没有完整套，现在打出去没有效果。'
            : c.action === 'slyDeal' || c.action === 'forcedDeal' ? '对方桌上没有能拿的地产（完整套不能动）。' : '';
    return `<div class="feature">${cardHTML(c.id)}<div class="txt"><h3>${esc(c.zh)}</h3><p class="sub">${esc(cardDesc(c))}${c.value ? `面值 ${c.value}M。` : ''}</p>${note ? `<p class="sub">${esc(note)}</p>` : ''}</div></div>${extra}<div class="acts">${acts.join('')}</div>`;
  },

  // 点一组地产：看大图；自己回合可以换色、并组、挪建筑；选目标时在这里点具体哪一张
  set(sh) {
    const v = V();
    const P = v.players[sh.p];
    const mine = sh.p === me();
    let ids;
    let title;
    let sub;
    let color = null;
    if (sh.setId === 'loose') {
      ids = P.loose.slice();
      if (!ids.length) return '';
      title = '散落的建筑';
      sub = `原来那组地产没了，${NM('house')}和${NM('hotel')}可以挪到别的完整套上。`;
    } else {
      const set = P.sets.find((x) => x.id === sh.setId);
      if (!set) return '';
      color = set.color;
      ids = set.cards.concat(set.house != null ? [set.house] : [], set.hotel != null ? [set.hotel] : []);
      const k = COLOR(set.color);
      title = `${mine ? '' : P.name + ' 的'}${k.zh}（${set.cards.length}/${set.size}）`;
      sub = set.full ? `已成套，收租 ${set.rent}M。` : `还差 ${set.size - set.cards.length} 张成套，现在收租 ${set.rent}M。`;
    }
    const T = S.target;
    const picking = !!(T && T.by === 'card' && T.owner === sh.p);
    const tiles = ids.map((id) => {
      const ok = !picking || T.valid.has(id);
      return `<button class="tile${!picking && sh.sel === id ? ' on' : ''}${ok ? '' : ' dim'}" data-do="set-pick" data-card="${id}" ${ok ? '' : 'disabled'} aria-pressed="${!picking && sh.sel === id}"><span class="tick">${ICON.tick}</span>${cardHTML(id, { color })}</button>`;
    }).join('');
    let below = '';
    if (picking) below = `<p class="sub">${esc(T.prompt)}</p>`;
    else if (sh.sel != null && ids.includes(sh.sel)) {
      const c = CARD(sh.sel);
      const acts = mine ? moveButtons(sh.sel) : [];
      below = `<div class="group">${esc(c.zh)}</div><p class="sub">${esc(cardDesc(c))}</p>`;
      if (acts.length) below += `<div class="acts">${acts.join('')}</div>`;
      else if (mine) below += `<p class="sub">${O().canEndTurn ? '这张现在没有可以挪去的地方。' : '轮到你的回合时可以整理桌面。'}</p>`;
    } else {
      below = `<p class="sub">${mine ? (O().canEndTurn ? '点一张牌可以换颜色、并组或挪建筑，不占出牌次数。' : '点一张牌看说明。轮到你的回合时可以整理桌面。') : '点一张牌看说明。'}</p>`;
    }
    return `<h3>${esc(title)}</h3>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}<div class="bigcards">${tiles}</div>${below}`;
  },

  preview(sh) {
    const c = CARD(sh.cardId);
    return `<div class="feature">${cardHTML(c.id, { color: sh.color })}<div class="txt"><h3>${esc(c.zh)}</h3><p class="sub">${esc(cardDesc(c))}${c.value ? `面值 ${c.value}M。` : ''}</p></div></div>`;
  },

  // 被针对 / 自己的行动被对方挡下时
  respond(sh) {
    const o = O();
    const R = o.respond;
    if (!R) return '';
    const v = V();
    const pd = v.pending;
    const actor = v.players[pd.actor].name;
    const target = v.players[pd.target].name;
    const jsn = R.canJustSayNo ? btn(`打出${AN('justSayNo')}`, { type: 'JUST_SAY_NO', cardId: R.jsnIds[0] }, 'red') : '';
    const what = pendingText(pd, actor);
    if (R.role === 'actor') {
      return `<h3>${esc(target)} 打出了${AN('justSayNo')}</h3><p class="sub">你的「${esc(actionName(pd))}」被挡下了。${R.canJustSayNo ? `再打一张${AN('justSayNo')}就能让它照样生效。` : `你手里没有${AN('justSayNo')}，这次只能作罢。`}</p><div class="acts${jsn ? ' two' : ''}">${jsn}${btn(R.canJustSayNo ? '算了' : '知道了', { type: 'ACCEPT' }, 'plain')}</div>`;
    }
    const countered = pd.chain.length >= 2 ? `<p class="sub">${esc(actor)} 又打出${AN('justSayNo')}，顶回了你的${AN('justSayNo')}。</p>` : '';
    if (!R.mustPay) {
      const T = v.players[pd.target];
      let show;
      if (pd.action === 'forcedDeal') show = `<div class="swap">${cardHTML(pd.giveCardId)}<span aria-hidden="true">⇄</span>${cardHTML(pd.targetCardId)}</div>`;
      else if (pd.action === 'slyDeal') show = `<div class="cards">${cardHTML(pd.targetCardId, { color: pd.color })}</div>`;
      else if (pd.action === 'bankruptcy') show = `<p class="sub">你的银行里有 ${T.bank.length} 张牌，共 ${T.bankTotal}M，会全部归对方。</p><div class="cards">${T.bank.map((id) => cardHTML(id)).join('')}</div>`;
      else if (pd.action === 'liquidation') show = `<p class="sub">这一整套会进弃牌堆${T.hand && T.hand.length ? `，你手里的 ${T.hand.length} 张牌也会全部弃掉` : ''}。</p><div class="cards">${setCardsHTML(pd.target, pd.targetSetId)}</div>`;
      else if (pd.action === 'hugeWin') show = T.sets.length ? `<p class="sub">你桌上这些地产会全部消失（散落的建筑保留）。</p><div class="cards">${T.sets.map((x) => setCardsHTML(pd.target, x.id)).join('')}</div>` : '<p class="sub">你桌上没有地产，不受影响。</p>';
      else show = `<div class="cards">${setCardsHTML(pd.target, pd.targetSetId)}</div>`;
      return `<h3>${esc(what)}</h3>${countered}${show}<div class="acts${jsn ? ' two' : ''}">${jsn}${btn(R.canJustSayNo ? '接受' : '只能接受', { type: 'ACCEPT' }, jsn ? 'plain' : 'primary')}</div>`;
    }
    // 付款
    const P = v.players[me()];
    const sel = sh.pay;
    const total = R.payable.reduce((t, id) => t + CARD(id).value, 0);
    const picked = [...sel].filter((id) => R.payable.includes(id));
    const sum = picked.reduce((t, id) => t + CARD(id).value, 0);
    if (!R.payable.length) {
      return `<h3>${esc(what)}</h3>${countered}<p class="sub">你桌上没有能付的牌，这次不用付。</p><div class="acts${jsn ? ' two' : ''}">${jsn}${btn('好的', { type: 'PAY', cardIds: [] }, jsn ? 'plain' : 'primary')}</div>`;
    }
    const lock = R.mustPayAll;
    const tile = (id) => {
      const inSet = P.sets.find((s) => s.cards.includes(id));
      return `<button class="tile${sel.has(id) || lock ? ' on' : ''}${lock ? ' lock' : ''}" data-do="pay-pick" data-card="${id}" aria-pressed="${sel.has(id) || lock}"><span class="tick">${ICON.tick}</span>${cardHTML(id, { color: inSet && inSet.color })}</button>`;
    };
    const bankIds = R.payable.filter((id) => P.bank.includes(id));
    const propIds = R.payable.filter((id) => P.sets.some((s) => s.cards.includes(id)));
    const bldIds = R.payable.filter((id) => !bankIds.includes(id) && !propIds.includes(id));
    const group = (title, list) => (list.length ? `<div class="group">${title}</div><div class="cards">${list.map(tile).join('')}</div>` : '');
    const enough = lock || sum >= R.amount;
    const payNow = lock ? R.payable : picked;
    const sumLine = lock
      ? `<div class="sum"><span>桌上只有 <b class="num">${total}M</b>，要全部付出</span></div>`
      : `<div class="sum"><span>已选 <b class="num${enough ? '' : ' bad'}">${sum}M</b> / 要付 ${R.amount}M</span><span class="cnt">${sum > R.amount ? '不找零' : ''}</span></div>`;
    return `<h3>${esc(what)}</h3>${countered}<p class="sub">${lock ? '' : '已经帮你选好最划算的组合，也可以自己改。'}</p>${group('银行', bankIds)}${group('地产（付出去会到对方桌上）', propIds)}${group('建筑', bldIds)}${sumLine}<div class="acts${jsn ? ' two' : ''}">${jsn}<button class="btn primary" data-do="act" data-a="${attr({ type: 'PAY', cardIds: payNow })}" ${enough ? '' : 'disabled'}>${lock ? '全部付出' : `付 ${sum}M`}</button></div>`;
  },

  discard(sh) {
    const o = O();
    if (!o.discard) return '';
    const hand = V().players[me()].hand;
    const n = o.discard.count;
    const k = [...sh.pick].filter((id) => hand.includes(id)).length;
    return `<h3>手牌太多了</h3><p class="sub">回合结束时最多留 ${V().rules.handLimit} 张，选 ${n} 张弃掉。已经按价值帮你选好了。</p>
      <div class="cards">${hand.map((id) => `<button class="tile${sh.pick.has(id) ? ' on' : ''}" data-do="discard-pick" data-card="${id}" aria-pressed="${sh.pick.has(id)}"><span class="tick">${ICON.tick}</span>${cardHTML(id)}</button>`).join('')}</div>
      <div class="sum"><span>已选 <b class="num${k === n ? '' : ' bad'}">${k}</b> / ${n} 张</span></div>
      <div class="acts"><button class="btn primary" data-do="act" data-a="${attr({ type: 'DISCARD', cardIds: [...sh.pick].filter((id) => hand.includes(id)) })}" ${k === n ? '' : 'disabled'}>弃掉 ${n} 张</button></div>`;
  },

  over() {
    const v = V();
    if (v.phase !== 'gameOver') return '';
    const r = v.result;
    const i = me();
    const o = opp();
    const title = r.winner == null ? '平局' : r.winner === i ? '你赢了' : `${v.players[o].name} 赢了`;
    const why = { sets: `凑齐了 ${v.rules.setsToWin} 套不同颜色的完整地产。`, resign: r.winner === i ? '对方认输了。' : '你认输了。', stalemate: '牌堆耗尽、双方都打不出牌。', maxTurns: '达到回合上限。' }[r.reason] || '';
    const rows = [['出牌', 'cardsPlayed', ''], ['收到', 'received', 'M'], ['付出', 'paid', 'M'], ['单笔最多收到', 'biggestHit', 'M'], [`${NM('slyDeal')} / ${NM('forcedDeal')}成功`, 'steals', ''], [`${NM('dealBreaker')}成功`, 'setsStolen', ''], [`打出${AN('justSayNo')}`, 'justSayNo', '']];
    const want = S.info ? S.info.rematch : [false, false];
    const main = want[i] ? `<button class="btn primary" disabled>等 ${esc(v.players[o].name)} 确认</button>` : `<button class="btn primary" data-do="rematch">${want[o] ? `${esc(v.players[o].name)} 想再来一局，开始` : '再来一局'}</button>`;
    const score = S.info && S.info.score ? S.info.score : null;
    const scoreline = score ? `<div class="scoreline" aria-label="本房间战绩 ${score[i]} 比 ${score[o]}"><span class="nm">${esc(v.players[i].name)}</span><b>${score[i]}</b><span>:</span><b>${score[o]}</b><span class="nm">${esc(v.players[o].name)}</span></div>` : '';
    const badges = titlesFor(v.players[i], r.winner === i, r.turn);
    const badgeRow = badges.length ? `<div class="badges">${badges.map((b) => `<span class="badge${b.cool ? ' cool' : ''}">${b.icon}${esc(b.text)}</span>`).join('')}</div>` : '';
    return `<h3>${esc(title)}</h3><p class="sub">${esc(why)}共 ${r.turn} 回合。</p>${scoreline}${badgeRow}
      <table class="stats"><thead><tr><th></th><th>${esc(v.players[i].name)}</th><th>${esc(v.players[o].name)}</th></tr></thead><tbody>${rows.map(([t, k, u]) => `<tr><td>${t}</td><td>${v.players[i].stats[k]}${u}</td><td>${v.players[o].stats[k]}${u}</td></tr>`).join('')}</tbody></table>
      <div class="acts two">${main}${btnDo('回到首页', 'leave')}</div>`;
  },

  menu() {
    const live = S.snap && V().phase !== 'gameOver';
    return `<h3>菜单</h3><div class="menu">
      <button data-do="log">对局记录</button>
      <button data-do="rules">玩法速览</button>
      <button data-do="sound">${sound.on ? '关闭声音' : '打开声音'}</button>
      <button data-do="copy-link">复制邀请链接</button>
      <button data-do="check-cards">检查卡图</button>
      <div class="sep" aria-hidden="true"></div>
      ${live ? '<button class="danger" data-do="resign">认输</button>' : ''}
      <button data-do="leave">离开房间（之后用链接还能回来）</button>
    </div>`;
  },

  rules() {
    const A = (k) => `「${NM(k)}」`;
    return `<h3>玩法速览</h3><ol class="rules">
      <li>先凑齐 ${S.snap ? V().rules.setsToWin : 3} 套不同颜色的完整地产就赢。</li>
      <li>每回合先摸 2 张（手里没牌摸 5 张），最多出 3 张；出满会自动结束回合，没出满也可以提前点「结束回合」。</li>
      <li>钱和行动卡可以存进银行；地产只能摆到桌上。</li>
      <li>被收钱时用桌上的牌付（银行或地产都行），不找零；付出去的地产归对方。</li>
      <li>对方对你出行动卡时，可以打${A('justSayNo')}挡掉，对方也能再反对回来。</li>
      <li>完整套上可以放${A('house')}（租金 +3M），再放${A('hotel')}（再 +4M）。</li>
      <li>回合结束时手牌最多 7 张，多出来的要弃掉。</li>
      <li>三张特殊行动卡（面值都是 10M，都能被${A('justSayNo')}挡下）：${A('bankruptcy')}拿走对方银行全部；${A('liquidation')}清空对方一整套完整地产并弃掉他全部手牌；${A('hugeWin')}让对方所有地产消失，你现有的完整套下次收租 ×4（只对那次收租选的一套生效一次）。</li>
      <li>长按任意一张牌可以放大看清楚。</li>
    </ol>`;
  },

  leave() {
    return `<h3>离开这一局？</h3><p class="sub">对局会保留 24 小时。之后打开邀请链接，或者在首页点「继续」，都能回到原来的座位。</p><div class="acts two">${btnDo('离开', 'leave-confirm')}${btnDo('留下', 'close-sheet', 'primary')}</div>`;
  },

  resign() {
    return `<h3>确定认输？</h3><p class="sub">这一局直接算 ${esc(nameOf(opp()))} 赢。</p><div class="acts two">${btn('认输', { type: 'RESIGN' }, 'red')}${btnDo('继续打', 'close-sheet')}</div>`;
  },

  log() {
    // "某某 出满 3 张，自动结束回合" 后面紧跟的那句 "某某 结束回合" 是重复信息，不显示
    const lines = S.log.slice(-200).filter((t, k, a) => !(k > 0 && /自动结束回合$/.test(a[k - 1]) && /结束回合$/.test(t) && !/自动/.test(t)));
    return `<h3>对局记录</h3><div class="loglist">${lines.map((t) => (/^第 \d+ 回合/.test(t) ? `<p class="turn">${esc(t)}</p>` : `<p>${esc(t)}</p>`)).join('') || '<p>还没有记录。</p>'}</div>`;
  },

  pile(sh) {
    const v = V();
    let ids;
    let title;
    if (sh.which === 'discard') { ids = v.discard.slice().reverse(); title = `弃牌堆（${ids.length} 张）`; }
    else { const P = v.players[sh.p]; ids = P.bank.slice().reverse(); title = `${sh.p === me() ? '我的' : P.name + ' 的'}银行：${P.bankTotal}M`; }
    return `<h3>${esc(title)}</h3><p class="sub">${sh.which === 'discard' ? '最上面的是最近打出的牌。' : '银行里的牌只能用来付款。'}</p><div class="cards">${ids.map((id) => cardHTML(id, { btn: true, data: ' data-do="preview"' })).join('') || '<span class="cnt">空的</span>'}</div>`;
  },

  check(sh) {
    const faces = S.meta.faces;
    const done = sh.done || 0;
    const bad = sh.bad || [];
    const list = faces.filter((f) => fileOf(f.face) != null);
    const builtIn = faces.filter((f) => fileOf(f.face) == null).map((f) => f.zh);
    return `<h3>检查卡图</h3><p class="sub">从 <span class="mono">${esc(CARD_BASE)}</span> 加载 ${list.length} 张图。${done < list.length ? `正在检查 ${done} / ${list.length}` : bad.length ? `有 ${bad.length} 张加载失败，会用简易牌面代替：` : '全部加载成功。'}${builtIn.length ? `${builtIn.join('、')}用内置样式。` : ''}</p>
      ${bad.length ? `<p class="mono">${bad.map((f) => esc(fileOf(f)) + '.png').join('<br>')}</p>` : ''}
      <div class="check">${faces.map((f) => `<div class="${bad.includes(f.face) ? 'bad' : ''}" title="${esc(fileOf(f.face) || f.zh)}">${f.face === 'back' ? backHTML() : cardHTML(S.meta.cards.findIndex((c) => c.face === f.face))}</div>`).join('')}</div>`;
  },
};

// 本局称号：给自己的高光时刻起个名字
function titlesFor(P, won, turns) {
  const st = P.stats;
  const out = [];
  if (won && turns <= 12) out.push({ icon: ICON.bolt, text: `闪电战：${turns} 回合拿下` });
  if (st.biggestHit >= 8) out.push({ icon: ICON.coin, text: `收租王：一次收了 ${st.biggestHit}M` });
  if (st.setsStolen >= 1) out.push({ icon: ICON.crown, text: `大盗：抢下 ${st.setsStolen} 整套` });
  if (st.steals >= 2) out.push({ icon: ICON.hand, text: `妙手：偷换成功 ${st.steals} 次` });
  if (st.justSayNo >= 2) out.push({ icon: ICON.shield, text: `铁壁：反对了 ${st.justSayNo} 次`, cool: true });
  if (st.received >= 20) out.push({ icon: ICON.coin, text: `财神：一共收了 ${st.received}M` });
  return out.slice(0, 3);
}

function moveButtons(cardId) {
  const v = V();
  const mv = O().moves;
  const acts = [];
  const m = mv.cards.find((x) => x.cardId === cardId);
  if (m) {
    m.targets.forEach((t) => {
      if (t.auto) acts.push(btn(`改当${COLOR(t.color).zh}`, { type: 'MOVE_CARD', cardId, color: t.color }, 'plain'));
      t.setIds.forEach((sid) => {
        const set = v.players[me()].sets.find((x) => x.id === sid);
        acts.push(btn(`并进另一组${COLOR(t.color).zh}（现有 ${set.cards.length} 张）`, { type: 'MOVE_CARD', cardId, color: t.color, setId: sid }, 'plain'));
      });
    });
  }
  const b = mv.buildings.find((x) => x.cardId === cardId);
  if (b) {
    b.setIds.forEach((sid) => {
      const set = v.players[me()].sets.find((x) => x.id === sid);
      acts.push(btn(`挪到${COLOR(set.color).zh}上`, { type: 'MOVE_BUILDING', cardId, setId: sid }, 'plain'));
    });
  }
  return acts;
}

function setCardsHTML(p, setId) {
  const set = V().players[p].sets.find((s) => s.id === setId);
  if (!set) return '';
  return set.cards.concat(set.house != null ? [set.house] : [], set.hotel != null ? [set.hotel] : []).map((id) => cardHTML(id, { color: set.color })).join('');
}

function actionName(pd) {
  return pd.action === 'rent' ? '收租' : S.meta.actions[pd.action].zh;
}

function pendingText(pd, actor) {
  switch (pd.action) {
    case 'rent': return `${actor} 按${COLOR(pd.color).zh}向你收租 ${pd.amount}M`;
    case 'debtCollector': return `${actor} 向你讨债 ${pd.amount}M`;
    case 'birthday': return `${actor} 过生日，你要随礼 ${pd.amount}M`;
    case 'slyDeal': return `${actor} 要拿走你的「${CARD(pd.targetCardId).zh}」`;
    case 'forcedDeal': return `${actor} 要用「${CARD(pd.giveCardId).zh}」换你的「${CARD(pd.targetCardId).zh}」`;
    case 'dealBreaker': return `${actor} 要抢走你整套${COLOR(pd.color).zh}`;
    case 'bankruptcy': return `${actor} 打出${AN('bankruptcy')}，要拿走你银行里的全部 ${pd.amount}M`;
    case 'liquidation': return `${actor} 打出${AN('liquidation')}，要清算你整套${COLOR(pd.color).zh}`;
    case 'hugeWin': return `${actor} 打出${AN('hugeWin')}，你桌上的地产要全部消失`;
    default: return `${actor} 对你出了牌`;
  }
}

/* ═══════════ 选目标 ═══════════ */
function startTarget(cardId) {
  const h = O().hand.find((x) => x.cardId === cardId);
  if (!h || !h.play) return;
  const p = h.play;
  const T = { cardId, kind: p.kind };
  switch (p.kind) {
    case 'slyDeal': Object.assign(T, { by: 'card', owner: opp(), valid: new Set(p.targets), prompt: '点对方桌上要拿走的地产' }); break;
    case 'forcedDeal': Object.assign(T, { by: 'card', owner: me(), valid: new Set(p.give), step: 'give', take: p.take, prompt: '先点你要交出去的地产' }); break;
    case 'dealBreaker': Object.assign(T, { by: 'set', owner: opp(), valid: new Set(p.targets), prompt: '点对方要抢的那一整套' }); break;
    case 'liquidation': Object.assign(T, { by: 'set', owner: opp(), valid: new Set(p.targets), prompt: '点对方要清算的那一整套' }); break;
    case 'house':
    case 'hotel': Object.assign(T, { by: 'set', owner: me(), valid: new Set(p.setIds), prompt: `点要放${NM(p.kind)}的那一套` }); break;
    default: return;
  }
  S.target = T;
  S.sel = null;
  closeSheet();
  render();
}

function pickTarget(kind, id, owner) {
  const T = S.target;
  if (!T || T.owner !== owner || T.by !== kind || !T.valid.has(id)) return false;
  if (T.kind === 'forcedDeal' && T.step === 'give') {
    Object.assign(T, { step: 'take', give: id, owner: opp(), valid: new Set(T.take), prompt: '再点对方要换过来的地产' });
    render();
    return true;
  }
  const a = { type: 'PLAY_ACTION', cardId: T.cardId };
  if (T.kind === 'slyDeal') a.targetCardId = id;
  else if (T.kind === 'forcedDeal') Object.assign(a, { giveCardId: T.give, targetCardId: id });
  else if (T.kind === 'dealBreaker' || T.kind === 'liquidation') a.targetSetId = id;
  else a.setId = id;
  S.target = null;
  act(a);
  return true;
}

/* ═══════════ 操作 ═══════════ */
const DO = {
  preset(el) { S.preset = el.dataset.v; store.set('preset', S.preset); render(); },
  async create(el) {
    const name = ($('#name') || {}).value || '';
    store.set('name', name.trim());
    el.classList.add('wait');
    S.homeError = '';
    try {
      const r = await api('/api/rooms', { name: name.trim(), preset: S.preset, claim: randomHex(16) });
      store.saveSeat(r.roomId, r.seat, r.token);
      S.room = { id: r.roomId, seat: r.seat, token: r.token };
      history.replaceState(null, '', '#' + r.roomId);
      S.screen = 'lobby';
      S.snap = null;
      S.log = [];
      preloadFaces();
      connect();
      render();
    } catch (e) {
      S.homeError = e.message; // 留在页面上，配置类的错误原因比较长，闪一下看不全
      island.flash('创建房间失败', 'err');
      render();
    }
  },
  'join-code'() {
    const code = (($('#code') || {}).value || '').trim().toUpperCase();
    if (!ROOM_RE.test(code)) { island.flash('房间码是 6 位字母或数字', 'err'); return; }
    openRoom(code);
  },
  async 'join-confirm'() {
    if (S.joining) return;
    const name = (($('#name') || {}).value || '').trim();
    store.set('name', name);
    S.joining = true;
    render();
    try {
      const saved = store.seat(S.join.code);
      S.join.claim = S.join.claim || randomHex(16);
      const r = await api(`/api/rooms/${S.join.code}/join`, { name, token: saved ? saved.token : '', claim: S.join.claim });
      store.saveSeat(r.roomId, r.seat, r.token);
      S.room = { id: r.roomId, seat: r.seat, token: r.token };
      S.screen = 'connecting';
      preloadFaces();
      connect();
    } catch (e) {
      S.join.error = e.message;
    }
    S.joining = false;
    render();
  },
  'go-home'() { goHome(); },
  leave() {
    if (S.snap && S.screen === 'game' && V().phase !== 'gameOver') openSheet({ type: 'leave' });
    else goHome();
  },
  'leave-confirm'() { closeSheet(); goHome(); },
  resume(el) { openRoom(el.dataset.code); },
  reconnect() { S.retry = 0; connect(); },
  async 'copy-link'() {
    if (!S.room) return;
    const link = inviteLink();
    try {
      await navigator.clipboard.writeText(link);
      island.flash('链接已复制');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = link;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); island.flash('链接已复制'); } catch (err) { island.flash('复制不了，请长按链接手动复制', 'err'); }
      ta.remove();
    }
    if (S.sheet && S.sheet.type === 'menu') closeSheet();
  },
  async 'share-link'() {
    try { await navigator.share({ title: 'Monopoly Deal 邀请', text: '来一局 Monopoly Deal', url: inviteLink() }); } catch (e) { /* 用户取消 */ }
  },
  hand(el) {
    const id = +el.dataset.card;
    if (S.target) return;
    sound.play('tap');
    haptic('light');
    S.sel = id;
    render();
    openSheet({ type: 'hand', cardId: id });
  },
  set(el) {
    const p = +el.dataset.p;
    const setId = el.dataset.set === 'loose' ? 'loose' : +el.dataset.set;
    const T = S.target;
    if (T && T.by === 'set') { pickTarget('set', setId, p); return; }
    if (T && T.by === 'card') {
      if (T.owner !== p || setId === 'loose') return;
      const set = V().players[p].sets.find((x) => x.id === setId);
      const valid = set ? set.cards.filter((id) => T.valid.has(id)) : [];
      if (valid.length === 1) pickTarget('card', valid[0], p); // 组里只有一张能选：直接选中
      else if (valid.length > 1) openSheet({ type: 'set', p, setId, sel: null });
      return;
    }
    openSheet({ type: 'set', p, setId, sel: null });
  },
  'set-pick'(el) {
    const id = +el.dataset.card;
    const sh = S.sheet;
    if (!sh) return;
    if (S.target && S.target.by === 'card') {
      const p = sh.p;
      closeSheet();
      pickTarget('card', id, p);
      return;
    }
    sh.sel = sh.sel === id ? null : id;
    renderSheet();
  },
  target(el) { startTarget(+el.dataset.card); },
  'cancel-target'() { S.target = null; render(); },
  async act(el) {
    let a;
    try { a = JSON.parse(el.dataset.a); } catch (e) { return; }
    const ok = await act(a);
    if (ok && S.sheet && !['respond', 'discard'].includes(S.sheet.type)) closeSheet();
    if (ok) S.sel = null;
  },
  'rent-color'(el) { S.sheet.color = el.dataset.v; renderSheet(); },
  'rent-dbl'(el) { S.sheet.doubles = +el.dataset.v; renderSheet(); },
  'pay-pick'(el) { const id = +el.dataset.card; const s = S.sheet.pay; if (s.has(id)) s.delete(id); else s.add(id); renderSheet(); },
  'discard-pick'(el) {
    const id = +el.dataset.card;
    const s = S.sheet.pick;
    const n = O().discard ? O().discard.count : 0;
    if (s.has(id)) s.delete(id);
    else { if (s.size >= n) s.delete(s.values().next().value); s.add(id); }
    renderSheet();
  },
  'end-turn'() { act({ type: 'END_TURN' }); },
  'open-respond'() { const o = O(); if (o.respond) openSheet({ type: 'respond', key: S.autoKey, pay: new Set(o.respond.suggested || []) }); },
  'open-discard'() { if (O().discard) openSheet({ type: 'discard', pick: new Set(S.snap.discardHint || []) }); },
  'open-over'() { openSheet({ type: 'over' }); },
  rematch() { send({ t: 'rematch' }); },
  menu() { openSheet({ type: 'menu' }); },
  emotes() { toggleEmotes(); haptic('light'); },
  emote(el) {
    // 服务器限制每 1.2 秒一个：太快就晃一下面板，不发
    if (Date.now() - (S.emoteAt || 0) < 1250) { shakeEl(el.closest('.pop')); haptic('error'); return; }
    if (!send({ t: 'emote', e: el.dataset.e })) return;
    S.emoteAt = Date.now();
    haptic('light');
    if (motionOK()) el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35)', offset: 0.4 }, { transform: 'scale(.9)' }], { duration: 200, easing: EASE_OUT });
    setTimeout(closeEmotes, motionOK() ? 120 : 0);
  },
  sound() { sound.toggle(); renderSheet(); },
  rules() { openSheet({ type: 'rules' }); },
  resign() { openSheet({ type: 'resign' }); },
  log() { openSheet({ type: 'log' }); requestAnimationFrame(() => { const s = $('.sbody'); if (s) s.scrollTop = s.scrollHeight; }); },
  bank(el) { openSheet({ type: 'pile', which: 'bank', p: +el.dataset.p }); },
  'discard-pile'() { openSheet({ type: 'pile', which: 'discard' }); },
  deck() { island.flash(`牌堆还剩 ${V().deckCount} 张`); },
  preview(el) { openSheet({ type: 'preview', cardId: +el.dataset.card }); },
  'close-sheet'() { closeSheet(); if (S.sel != null) { S.sel = null; render(); } },
  'check-cards'() { checkCards(); },
};

document.addEventListener('pointerdown', () => sound.unlock(), { passive: true });
document.addEventListener('click', (e) => {
  if (e.target.id === 'md-haptic' || e.target.htmlFor === 'md-haptic') return; // 触感开关的程序点击，不是用户点的
  if ($('#pop') && !e.target.closest('#pop') && !e.target.closest('[data-do="emotes"]')) closeEmotes();
  const el = e.target.closest('[data-do]');
  if (!el || el.disabled || !el.dataset.do) return;
  const fn = DO[el.dataset.do];
  if (!fn) return;
  if (S.busy && el.dataset.do === 'act') return;
  // 同一张牌既是牌又在组里：点牌优先
  if (el.dataset.do === 'set' && e.target.closest('[data-do="card"]') && !(S.target && S.target.by === 'set')) return;
  fn(el, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.sheet) closeSheet(); else if (S.target) { S.target = null; render(); } }
  if (e.key === 'Enter' && e.target.id === 'code') DO['join-code']();
  if (e.key === 'Enter' && e.target.id === 'name' && S.screen === 'home') DO.create($('[data-do="create"]'));
});
// 回到前台：连接死了就立刻重连；还活着就探一下（3 秒内没回音就换连接），并要一份最新局面
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (S.room) {
    if (!S.ws || S.ws.readyState > 1) { S.retry = 0; connect(); }
    else if (S.ws.readyState === 1) { probe(S.ws, 3000); try { S.ws.send(JSON.stringify({ t: 'sync' })); } catch (e) { /* 忽略 */ } }
  }
  if (S.screen === 'game' || S.screen === 'lobby') wake.on();
});
addEventListener('online', () => { if (S.room && !S.wsOpen) { S.retry = 0; connect(); } else island.refresh(); });
addEventListener('offline', () => { if (!S.wsOpen) S.net = 'offline'; else if (S.ws) probe(S.ws, 2500); island.refresh(); renderDock(); });
addEventListener('pageshow', (e) => { if (e.persisted && S.room) { S.retry = 0; connect(); } }); // 从后退缓存恢复：旧连接已经关了
setInterval(() => { // 对方思考计时、"正在发送"这类随时间变化的提示
  if (S.screen === 'game' && S.snap && (S.pending || V().activePlayer !== me())) { island.refresh(); tickStage(); }
}, 1000);
addEventListener('scroll', () => { if ($('#pop')) closeEmotes(); }, { passive: true });
addEventListener('resize', () => { if ($('#pop')) closeEmotes(); });
addEventListener('hashchange', () => {
  const code = readCode();
  if (code && (!S.room || S.room.id !== code)) openRoom(code);
});

function goHome() {
  closeEmotes();
  held.clear();
  if (S.pending) S.pending.done({ ok: false }, true);
  disconnect();
  wake.off();
  S.room = null;
  S.snap = null;
  S.info = null;
  S.target = null;
  S.sel = null;
  S.log = [];
  S.lastIds = null;
  closeSheet();
  history.replaceState(null, '', location.pathname + location.search);
  S.screen = 'home';
  render();
}

function readCode() {
  const raw = (location.hash.replace(/^#\/?/, '') || params.get('room') || '').trim().toUpperCase();
  return ROOM_RE.test(raw) ? raw : null;
}

// 打开某个房间：本机有座位凭证就直接回座位，否则走加入流程
async function openRoom(code) {
  history.replaceState(null, '', location.href.split('#')[0] + '#' + code);
  const saved = store.seat(code);
  if (saved) {
    S.room = { id: code, seat: saved.seat, token: saved.token };
    S.screen = 'connecting';
    preloadFaces();
    connect();
    render();
    return;
  }
  S.join = { code, host: null, error: null };
  S.screen = 'join';
  render();
  try {
    const info = await api(`/api/rooms/${code}`);
    if (info.players[1]) S.join.error = '这个房间已经满了。';
    else S.join.host = info.players[0] && info.players[0].name;
  } catch (e) {
    S.join.error = e.message;
  }
  if (S.screen === 'join') render();
}

async function checkCards() {
  const sh = { type: 'check', done: 0, bad: [] };
  openSheet(sh);
  const faces = S.meta.faces.filter((f) => fileOf(f.face) != null);
  let i = 0;
  const worker = async () => {
    while (i < faces.length) {
      const f = faces[i++];
      const ok = await new Promise((resolve) => {
        const im = new Image();
        const t = setTimeout(() => resolve(false), 8000);
        im.onload = () => { clearTimeout(t); useRatio(im.naturalWidth / im.naturalHeight); resolve(true); };
        im.onerror = () => { clearTimeout(t); resolve(false); };
        im.src = imgUrl(f.face) + '?check=' + Date.now();
      });
      if (!ok) { sh.bad.push(f.face); S.missing.add(f.face); } else S.missing.delete(f.face);
      sh.done++;
      if (S.sheet === sh) renderSheet();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  if (S.screen === 'game') render();
}

/* ═══════════ 启动 ═══════════ */
const META_CARDS = 109; // 当前牌组张数（标准 106 + 自定义 3）；本机缓存的牌面数据张数不对就重新拉
// 启动：先用本机缓存的牌面数据立刻出界面，再在后台刷新；没有缓存就联网拉取，失败自动重试
async function boot() {
  render();
  const cached = store.get('meta', null);
  if (cached && Array.isArray(cached.cards) && cached.cards.length === META_CARDS) {
    S.meta = cached;
    route();
    api('/api/meta', null, 2).then((fresh) => {
      if (fresh.engine === S.meta.engine && fresh.service === S.meta.service) return;
      S.meta = fresh;
      store.set('meta', fresh);
      render();
    }).catch(() => { /* 用缓存继续 */ });
    return;
  }
  try {
    S.meta = await api('/api/meta', null, 3);
    store.set('meta', S.meta);
  } catch (e) {
    S.fatal = { title: '连不上对战服务', text: navigator.onLine ? `请确认 Worker 已部署，并把页面里的 CONFIG.API 改成它的地址（现在是 ${API}）。` : '网络断开了，连上后会自动重试。' };
    S.screen = 'fatal';
    S.meta = null;
    $('#screen').innerHTML = fatalHTML().replace('data-do="go-home"', 'onclick="location.reload()"').replace('回到首页', '重新连接');
    addEventListener('online', () => location.reload(), { once: true });
    return;
  }
  route();
}

function route() {
  const code = readCode();
  if (code) openRoom(code);
  else { S.screen = 'home'; render(); }
}

if (DEBUG) window.__md = { S, act, send, render, cardHTML, motionOK, NET, probe, connect };
boot();
})();
</script>
