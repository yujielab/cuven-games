      err.code = data && data.error && data.error.code;
      throw err;
    }
    return data;
  }
}

// 连接参数：心跳间隔、看门狗、连接超时（调试页可以改小来测试）
const NET = { ping: 15000, watchdog: 6000, openTimeout: 8000 };
const randomHex = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => b.toString(16).padStart(2, '0')).join('');

function connect() {
  if (!S.room) return;
  clearTimeout(S.retryTimer);
  clearTimeout(S.openTimer);
  stopBeat();
  if (S.ws) { S.ws.onclose = null; S.ws.onerror = null; try { S.ws.close(); } catch (e) { /* 忽略 */ } }
  if (!navigator.onLine) { S.net = 'offline'; S.wsOpen = false; island.refresh(); renderDock(); return; } // 等 online 事件
  const ws = new WebSocket(`${WS_BASE}/api/rooms/${S.room.id}/ws?token=${encodeURIComponent(S.room.token)}`);
  S.ws = ws;
  S.wsOpen = false;
  S.net = S.everOpen ? 'reconnecting' : 'connecting';
  island.refresh();
  // 握手迟迟不成功就放弃这次，换一条连接再试
  S.openTimer = setTimeout(() => { if (S.ws === ws && ws.readyState !== 1) { try { ws.close(); } catch (e) { /* 忽略 */ } dropped(ws); } }, NET.openTimeout);
  ws.onopen = () => {
    if (S.ws !== ws) return;
    clearTimeout(S.openTimer);
    S.wsOpen = true;
    S.net = 'open';
    S.lastRx = Date.now();
    if (S.everOpen && S.retry > 0) S.justReconnected = true; // 等 welcome 到了再提示"已重新连接"
    S.everOpen = true;
    S.retry = 0;
    startBeat(ws);
    island.refresh();
  };
  ws.onmessage = (e) => {
    if (S.ws !== ws) return;
    S.lastRx = Date.now();
    clearTimeout(S.watchdog);
    if (e.data === 'pong') { notePong(); return; }
    let m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    onMessage(m);
  };
  ws.onerror = () => { /* 交给 onclose 处理 */ };
  ws.onclose = () => dropped(ws);
}

// 连接断了：没确认的动作先挂着（重连后原样重发），然后按退避节奏重连
function dropped(ws) {
  if (S.ws !== ws) return;
  S.ws = null;
  S.wsOpen = false;
  stopBeat();
  clearTimeout(S.openTimer);
  if (S.pending) S.pending.sent = false;
  if (S.room && S.screen !== 'fatal') scheduleReconnect();
  render();
}

function scheduleReconnect(delay) {
  clearTimeout(S.retryTimer);
  if (!S.room || S.screen === 'fatal') return;
  if (!navigator.onLine) { S.net = 'offline'; island.refresh(); return; }
  // 第一次几乎立刻重连，之后 0.6s、1s、1.6s……最多 8s，加一点随机避免两边同时挤
  const d = delay != null ? delay : S.retry === 0 ? 150 : Math.min(8000, 600 * Math.pow(1.6, S.retry - 1)) * (0.75 + Math.random() * 0.5);
  S.retry++;
  S.net = 'reconnecting';
  S.retryTimer = setTimeout(connect, d);
  island.refresh();
}

function disconnect() {
  clearTimeout(S.retryTimer);
  clearTimeout(S.openTimer);
  stopBeat();
  if (S.ws) { S.ws.onclose = null; S.ws.onerror = null; try { S.ws.close(); } catch (e) { /* 忽略 */ } }
  S.ws = null;
  S.wsOpen = false;
  S.net = 'idle';
  S.everOpen = false;
  S.retry = 0;
}

// 心跳：定时发 ping，服务器运行时自动回 pong；超过看门狗时间没有任何回音，就当连接已死，立刻换一条
function startBeat(ws) {
  stopBeat();
  S.beat = setInterval(() => probe(ws), NET.ping);
}
function stopBeat() {
  clearInterval(S.beat);
  clearTimeout(S.watchdog);
}
function probe(ws, wait) {
  ws = ws || S.ws;
  if (!ws || ws.readyState !== 1 || S.ws !== ws) return;
  S.pingAt = Date.now();
  try { ws.send('ping'); } catch (e) { dropped(ws); return; }
  clearTimeout(S.watchdog);
  S.watchdog = setTimeout(() => {
    if (S.ws !== ws || S.lastRx >= S.pingAt) return;
    try { ws.close(); } catch (e) { /* 忽略 */ }
    dropped(ws);
  }, wait || NET.watchdog);
}
function notePong() {
  if (!S.pingAt) return;
  const rtt = Date.now() - S.pingAt;
  S.pingAt = 0;
  S.slow = rtt > 1200 ? (S.slow || 0) + 1 : 0;
  if (S.slow === 2) island.flash('网络有点慢，操作会晚一点生效');
}

function send(msg) {
  if (S.ws && S.ws.readyState === 1) {
    try { S.ws.send(JSON.stringify(msg)); return true; } catch (e) { return false; }
  }
  island.flash(S.net === 'offline' ? '网络断开了，连上后再试' : '正在重新连接，稍等一下', 'err');
  return false;
}

// 发一个动作，等服务器确认。断线时不丢：连接恢复后用同一个编号重发，服务器保证只执行一次
function act(action) {
  if (S.busy) return Promise.resolve(false);
  if (!S.wsOpen && S.net !== 'reconnecting') { island.flash('还没连上，稍等一下', 'err'); return Promise.resolve(false); }
  S.busy = true;
  document.body.classList.add('busy');
  renderDock();
  const p = { aid: randomHex(10), action, t0: Date.now(), sent: false };
  S.pending = p;
  return new Promise((resolve) => {
    p.timer = setTimeout(() => p.done({ ok: false, error: { message: '这一步没收到确认。如果桌面上已经生效就不用再点' } }), 15000);
    p.slowTimer = setTimeout(() => island.refresh(), 2600);
    p.done = (m, quiet) => {
      if (S.pending !== p) return;
      clearTimeout(p.timer);
      clearTimeout(p.slowTimer);
      S.pending = null;
      S.busy = false;
      document.body.classList.remove('busy');
      if (quiet) { resolve(false); return; }
      if (!m.ok) {
        island.flash(m.error && m.error.message ? m.error.message : '操作失败', 'err', 2800, true);
        islandShake();
        sound.play('error');
        haptic('error');
      } else {
        haptic('light');
        armIdle();
      }
      render();
      resolve(!!m.ok);
    };
    sendPending();
  });
}

function sendPending() {
  const p = S.pending;
  if (!p || p.sent || !S.ws || S.ws.readyState !== 1) return;
  try {
    S.ws.send(JSON.stringify({ t: 'act', id: p.aid, aid: p.aid, action: p.action }));
    p.sent = true;
  } catch (e) { /* 等重连后再发 */ }
}

// 屏幕常亮：对局中手机不自动锁屏（锁屏会断开连接）
const wake = (() => {
  let lock = null;
  return {
    async on() {
      if (lock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      try {
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { lock = null; });
      } catch (e) { lock = null; }
    },
    off() { try { if (lock) lock.release(); } catch (e) { /* 忽略 */ } lock = null; },
  };
})();

function onMessage(m) {
  switch (m.t) {
    case 'welcome':
      S.room.seat = m.seat;
      S.info = m.room;
      if (m.view) {
        if (S.screen === 'game' && S.snap && S.round === m.room.round) S.flip = snapshotRects(); // 重连：牌从原位过渡到最新位置
        // 刚开局（从等待页进来，或者再来一局）：播一段发牌动画
        const newRound = !!S.snap && S.round !== m.room.round;
        if ((newRound || S.screen === 'lobby' || S.screen === 'connecting') && m.view.turn.number <= 1 && m.view.turn.plays === 0 && m.view.phase === 'play') S.dealIn = true;
        const fresh = !S.snap || S.snap.view.seq > m.view.seq || (S.info && S.round !== m.room.round);
        if (S.snap && S.round !== m.room.round) { sound.play('card'); sound.play('card', 0.12); disarmIdle(); } // 新的一局：洗牌声
        if (m.view.activePlayer === m.seat && m.view.phase === 'play') armIdle();
        S.round = m.room.round;
        setSnap(m, fresh);
        S.log = (m.log || []).slice();
        S.screen = 'game';
      } else {
        S.snap = null;
        S.screen = 'lobby';
        preloadFaces();
      }
      rememberSeat();
      if (S.justReconnected) { S.justReconnected = false; island.flash('已重新连接', '', 1800, true); }
      sendPending(); // 断线前没确认的动作：用同一个编号重发，服务器只会执行一次
      break;
    case 'update':
      S.flip = snapshotRects();
      S.fxJob = { prev: S.snap, events: m.events };
      S.holdUntil = S.flip ? Date.now() + revealHold(m.events) : 0; // 对方的牌正在亮相：回应面板等它落下再弹
      S.info = m.room;
      setSnap(m, false);
      S.log.push(...m.lines);
      if (S.log.length > 400) S.log.splice(0, S.log.length - 400);
      announce(m.events, m.lines);
      break;
    case 'room': {
      const before = S.info && S.info.players;
      S.info = m.room;
      presenceChanged(before, m.room.players);
      break;
    }
    case 'emote':
      emoteBubble(m.seat, m.e);
      return;
    case 'ack':
      if (S.pending && m.id === S.pending.aid) S.pending.done(m);
      return;
    case 'error':
      island.flash(m.message, 'err');
      break;
    case 'fatal':
      if (S.pending) S.pending.done({ ok: false, error: { message: m.message } }, true);
      if (S.room) store.dropSeat(S.room.id);
      disconnect();
      S.room = null;
      S.fatal = { title: m.code === 'BAD_TOKEN' ? '座位凭证失效了' : '房间不存在或已过期', text: m.code === 'BAD_TOKEN' ? '可能是在别的设备上重新加入过。回到首页重新开一局吧。' : '房间超过 24 小时没人连接就会被清理。回到首页重新开一局吧。' };
      S.screen = 'fatal';
      closeSheet();
      break;
    default:
      return;
  }
  render();
}

function rememberSeat() {
  if (!S.room || !S.info) return;
  const o = S.info.players[1 - S.room.seat];
  store.saveSeat(S.room.id, S.room.seat, S.room.token, { vs: o ? o.name : '', over: !!(S.snap && V().phase === 'gameOver') });
}

// 对手掉线 / 回来：灵动岛提示一下
function presenceChanged(before, after) {
  if (!S.room || S.screen !== 'game' || !before || !after) return;
  const o = 1 - S.room.seat;
  const was = before[o] && before[o].online;
  const now = after[o] && after[o].online;
  const name = after[o] ? after[o].name : '对手';
  if (was && !now) island.flash(`${name} 掉线了，等他回来`, 'err', 2600, true);
  else if (!was && now) {
    const justStarted = S.snap && V().turn.number <= 1 && V().turn.plays === 0; // 刚开局时对方是第一次连上，不是"回来"
    island.flash(justStarted ? `${name} 加入了，开局！` : `${name} 回来了`, '', 2000, true);
    sound.play('pop');
  }
}

/* ═══════════ 快照同步：自动弹出 / 收起面板 ═══════════ */
function setSnap(m, reset) {
  const prev = S.snap;
  if (!prev || prev.view.activePlayer !== m.view.activePlayer || prev.view.turn.number !== m.view.turn.number) S.turnAt = Date.now();
  S.snap = { view: m.view, options: m.options, discardHint: m.discardHint };
  if (reset || !prev) { S.lastIds = null; S.autoKey = ''; }
  const v = m.view;
  const o = m.options;
  // 选目标模式失效就退出
  if (S.target && (!o.canEndTurn || !o.hand.some((h) => h.cardId === S.target.cardId && h.play))) S.target = null;
  if (S.sel != null && (!v.players[me()].hand || !v.players[me()].hand.includes(S.sel))) S.sel = null;
  if (o.respond) {
    const key = `r${o.respond.pendingId}.${v.pending.chain.length}`;
    if (S.autoKey !== key) {
      S.autoKey = key;
      const open = () => {
        if (S.autoKey !== key || !S.snap || !O().respond || (S.sheet && S.sheet.type === 'respond')) return;
        openSheet({ type: 'respond', key, pay: new Set(O().respond.suggested || []) });
        if (navigator.vibrate) navigator.vibrate(12);
      };
      const wait = (S.holdUntil || 0) - Date.now();
      if (wait > 0) setTimeout(open, wait);
      else open();
    }
  } else if (o.discard) {
    const key = `d${v.turn.number}`;
    if (S.autoKey !== key) { S.autoKey = key; openSheet({ type: 'discard', pick: new Set(m.discardHint || []) }); }
  } else if (v.phase === 'gameOver') {
    const key = `o${S.info ? S.info.round : 0}`;
    if (S.autoKey !== key) { S.autoKey = key; setTimeout(() => { if (S.snap && V().phase === 'gameOver') openSheet({ type: 'over' }); }, 900); }
  }
  if (S.sheet && (S.sheet.type === 'respond' && !o.respond || S.sheet.type === 'discard' && !o.discard)) closeSheet();
}

// 把对方的动作和结算结果播报到灵动岛
const QUIET_TYPES = new Set(['turnStart', 'turnEnd', 'awaiting', 'discardRequired', 'deal', 'gameStart', 'draw', 'reshuffle', 'autoEndTurn']);
const OUTCOME_TYPES = new Set(['payment', 'steal', 'swap', 'setStolen', 'canceled', 'justSayNo', 'resign', 'bankrupt', 'liquidated', 'hugeWin']);
function announce(events, lines) {
  const picked = [];
  events.forEach((e, i) => {
    if (QUIET_TYPES.has(e.type) || e.type === 'gameOver') return;
    if (OUTCOME_TYPES.has(e.type) || e.player !== me()) picked.push(lines[i]);
  });
  const over = events.find((e) => e.type === 'gameOver');
  if (over) { island.clear(); island.flash(lines[events.indexOf(over)], '', 3200); return; }
  picked.slice(-3).forEach((t) => island.flash(t));
}

/* ═══════════ 灵动岛 ═══════════ */
const island = (() => {
  const el = $('#island');
  const queue = [];
  let showing = null;
  let timer = 0;
  let lastKey = '';
  function paint(st) {
    const key = JSON.stringify(st);
    if (key === lastKey) return;
    lastKey = key;
    const inner = $('.in', el);
    const body = (st.lead ? st.lead : '') + `<span class="txt">${esc(st.text)}</span>` + (st.dots ? `<span class="dots" aria-hidden="true">${st.dots.map((on) => `<i class="${on ? 'on' : ''}"></i>`).join('')}</span>` : '') + (st.btn ? `<button class="ibtn" data-do="${st.btn.do}">${esc(st.btn.label)}</button>` : '');
    inner.classList.add('hide');
    setTimeout(() => {
      inner.innerHTML = body;
      el.classList.toggle('err', st.tone === 'err');
      const w = inner.offsetWidth + 36;
      const h = Math.max(40, inner.offsetHeight + 18);
      el.style.width = Math.max(126, w) + 'px';
      el.style.height = h + 'px';
      el.style.borderRadius = (h > 44 ? 24 : 22) + 'px';
      inner.classList.remove('hide');
    }, lastKey ? 120 : 0);
  }
  function next() {
    clearTimeout(timer);
    showing = queue.shift() || null;
    if (showing) {
      paint(showing);
      timer = setTimeout(next, showing.ms);
    } else {
      paint(base());
    }
  }
  return {
    refresh() { if (!showing) paint(base()); },
    clear() { queue.length = 0; next(); },
    // urgent：插到最前面并立刻顶掉正在播的普通消息（掉线、重连、操作失败这类要马上看到）
    flash(text, tone, ms, urgent) {
      if (!text) return;
      const item = { text, tone: tone || '', ms: ms || (tone === 'err' ? 2600 : 2200), lead: tone === 'err' ? '<span class="warn"></span>' : '', urgent: !!urgent };
      if (urgent) queue.unshift(item);
      else queue.push(item);
      if (queue.length > 4) queue.splice(4);
      if (!showing || (urgent && !showing.urgent)) next();
    },
  };
})();

function base() {
  const lead = (k) => (k === 'pulse' ? '<span class="pulse"></span>' : k === 'spin' ? '<span class="spin"></span>' : k === 'warn' ? '<span class="warn"></span>' : '');
  if (S.screen === 'home' || S.screen === 'join' || S.screen === 'boot' || S.screen === 'fatal') return { text: 'Monopoly Deal' };
  if (!S.wsOpen) {
    if (S.net === 'offline') return { text: '网络断开了，连上后会自动恢复', lead: lead('warn') };
    if (S.retry > 3) return { text: '连接不上，正在重试', lead: lead('spin'), btn: { label: '立即重试', do: 'reconnect' } };
    return { text: S.everOpen ? '正在重新连接' : '正在连接', lead: lead('spin') };
  }
  if (S.pending && Date.now() - S.pending.t0 > 2500) return { text: '网络有点慢，正在发送', lead: lead('spin') };
  if (S.screen === 'lobby' || !S.snap) return { text: '等待对手加入', lead: lead('pulse') };
  const v = V();
  const i = me();
  const o = opp();
  const oppName = v.players[o].name;
  const oppOnline = S.info && S.info.players[o] && S.info.players[o].online;
  if (S.target) return { text: S.target.prompt, btn: { label: '取消', do: 'cancel-target' } };
  if (v.phase === 'gameOver') {
    const r = v.result;
    return { text: r.winner == null ? '平局' : r.winner === i ? '你赢了' : `${oppName} 赢了`, btn: { label: '查看', do: 'open-over' } };
  }
  if (v.phase === 'respond') {
    if (v.pending.awaiting === i) return { text: '轮到你回应', lead: lead('warn'), btn: { label: '查看', do: 'open-respond' } };
    return { text: oppOnline ? `等 ${oppName} 回应` : `${oppName} 掉线了，等他回来`, lead: lead(oppOnline ? 'pulse' : 'warn') };
  }
  if (v.phase === 'discard') return v.turn.player === i ? { text: `手牌太多，弃掉 ${v.discardNeed} 张`, btn: { label: '弃牌', do: 'open-discard' } } : { text: `${oppName} 在弃牌`, lead: lead('pulse') };
  if (v.turn.player === i) {
    const max = v.rules.playsPerTurn;
    return { text: '你的回合', dots: Array.from({ length: max }, (_, k) => k >= v.turn.plays) };
  }
  if (!oppOnline) return { text: `${oppName} 掉线了，等他回来`, lead: lead('warn') };
  const sec = Math.floor((Date.now() - (S.turnAt || Date.now())) / 1000);
  if (sec >= 15) return { text: `${oppName} 正在思考 ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`, lead: lead('pulse') };
  return { text: `${oppName} 的回合` };
}

/* ═══════════ 牌的飞行动画 ═══════════
 * 每次局面更新前记下桌上每张牌的位置，更新后把移动了的牌从旧位置飞到新位置：
 * 摸牌从牌堆翻着面飞进手牌，出牌从手牌划一道弧线上桌，付款、偷牌在两人之间飞，对方打出的牌从他手里翻开飞出来。
 * 用一张固定定位的替身来飞（不会被横向滚动区裁掉），只动 transform；减少动态效果时整段跳过。 */
const motionOK = () => !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let flights = [];
const track = (a) => { flights.push(a); return a; };
// 正在飞的牌：真身先藏起来，等替身落地再露出。整页重绘会换掉元素，所以按牌号记，重绘后重新藏
const held = new Map();
const cardNode = (id) => $(`#screen [data-card="${id}"]`);
function hold(id) {
  held.set(id, (held.get(id) || 0) + 1);
  const el = cardNode(id);
  if (el) el.style.opacity = '0';
}
function release(id) {
  const n = (held.get(id) || 0) - 1;
  if (n > 0) { held.set(id, n); return null; }
  held.delete(id);
  const el = cardNode(id);
  if (el) el.style.opacity = '';
  return el;
}
function hideHeld() { held.forEach((n, id) => { const el = cardNode(id); if (el) el.style.opacity = '0'; }); }
const easeOut3 = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut3 = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

// 元素的中心点，加上不受旋转影响的宽高（扇形手牌的外接矩形会偏大）
function boxOf(el) {
  if (!el) return null;
  const r = el.getBoundingClientRect();
  if (!r.width) return null;
  return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: el.offsetWidth || r.width, h: el.offsetHeight || r.height, top: r.top, bottom: r.bottom };
}
const deckBox = () => boxOf($('#screen [data-do="deck"] .deckstack .card:last-child') || $('#screen [data-do="deck"] .slot'));
const discardBox = () => boxOf($('#screen [data-do="discard-pile"] .card') || $('#screen [data-do="discard-pile"] .slot'));
// 对方手牌：取那排小牌背最右边一张的位置
function oppHandBox() {
  const el = $('#screen .zone.opp .minis') || $('#screen .zone.opp .who .av');
  const b = boxOf(el);
  if (!b) return null;
  return Object.assign({}, b, { cx: b.cx + b.w / 2 - 8, w: 16, h: 16 / CONFIG.RATIO });
}

function snapshotRects() {
  flights.forEach((a) => { try { a.finish(); } catch (e) { /* 已结束 */ } });
  flights = [];
  if (S.screen !== 'game' || !motionOK()) return null;
  const m = new Map();
  const els = new Map();
  $$('#screen [data-card]').forEach((el) => { const b = boxOf(el); if (b) { m.set(el.dataset.card, b); els.set(el.dataset.card, el); } });
  return { m, els, deck: deckBox(), opp: oppHandBox(), hand: boxOf($('#screen .hand')) };
}

// 沿一条往上鼓的二次贝塞尔曲线飞，途中稍微放大、倾斜，像被手拿起来甩过去。
// anchor 是替身实际摆放的位置（默认就是终点），返回的关键帧都相对它；o.ease 让位置按缓动采样（整段动画用线性时序）。
function arcFrames(from, to, o, anchor) {
  o = o || {};
  anchor = anchor || to;
  const x0 = from.cx - anchor.cx;
  const y0 = from.cy - anchor.cy;
  const x1 = to.cx - anchor.cx;
  const y1 = to.cy - anchor.cy;
  const s0 = from.w / anchor.w;
  const s1 = to.w / anchor.w;
  const dx = x1 - x0;
  const dy = y1 - y0;
  const dist = Math.hypot(dx, dy) || 1;
  let px = -dy / dist;
  let py = dx / dist;
  if (py > 0) { px = -px; py = -py; }
  if (Math.abs(py) < 0.25) px = Math.abs(px) * (Math.sign(innerWidth / 2 - (from.cx + to.cx) / 2) || 1); // 几乎竖直地飞：往屏幕中间那侧鼓
  const lift = (o.lift == null ? 1 : o.lift) * Math.min(80, 18 + dist * 0.16);
  const cx = (x0 + x1) / 2 + px * lift;
  const cy = (y0 + y1) / 2 + py * lift;
  const rot = (o.rot == null ? 1 : o.rot) * Math.max(-9, Math.min(9, dx / 30));
  const pop = o.pop == null ? 0.1 : o.pop;
  const ease = o.ease || ((t) => t);
  const frames = [];
  for (let k = 0; k <= 10; k++) {
    const t = ease(k / 10);
    const u = 1 - t;
    const x = u * u * x0 + 2 * u * t * cx + t * t * x1;
    const y = u * u * y0 + 2 * u * t * cy + t * t * y1;
    const sc = (s0 + (s1 - s0) * t) * (1 + pop * Math.sin(Math.PI * t));
    const f = { offset: k / 10, transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(rot * Math.sin(Math.PI * t)).toFixed(2)}deg) scale(${sc.toFixed(4)})` };
    if (o.fade) f.opacity = k === 10 ? 0.2 : 1;
    frames.push(f);
  }
  return frames;
}

function cleanClone(el) {
  const c = el.cloneNode(true);
  c.classList.remove('fresh', 'sel', 'pick', 'dim', 'can', 'ghost');
  ['data-card', 'data-do', 'id', 'aria-label'].forEach((k) => c.removeAttribute(k));
  ['--r', '--y', 'opacity', 'transform'].forEach((k) => c.style.removeProperty(k));
  return c;
}
function backEl() {
  const t = document.createElement('div');
  t.innerHTML = backHTML();
  return t.firstElementChild;
}
// 替身：flip 时里面是正反两面，先露牌背再翻到正面
function makeGhost(face, at, flip, cls, parent) {
  let g = face;
  if (flip) {
    g = document.createElement('div');
    g.className = 'flip3d';
    const fl = document.createElement('div');
    fl.className = 'flipper';
    fl.append(face, backEl());
    g.appendChild(fl);
  }
  g.classList.add('ghost');
  if (cls) g.classList.add(cls);
  Object.assign(g.style, { left: at.cx - at.w / 2 + 'px', top: at.cy - at.h / 2 + 'px', width: at.w + 'px', height: at.h + 'px' });
  g.style.setProperty('--w', at.w + 'px');
  if (flip) $$('.card', g).forEach((c) => c.style.setProperty('--w', at.w + 'px')); // .card 自己会把 --w 设回桌面卡宽，这里要压住
  (parent || document.body).appendChild(g);
  return g;
}

// 落地：轻轻一弹（用独立的 scale 属性，不打扰元素本身的 transform，比如扇形手牌）
function land(el, k) {
  if (!el || !el.isConnected || !motionOK()) return;
  el.animate([{ scale: String(k || 1.07) }, { scale: '1' }], { duration: 320, easing: EASE_OUT });
}

function fly(el, from, to, o) {
  o = o || {};
  const id = el.dataset.card;
  const g = makeGhost(cleanClone(el), to, o.flip);
  hold(id);
  const dist = Math.hypot(from.cx - to.cx, from.cy - to.cy);
  const timing = { duration: o.dur || Math.round(Math.min(640, 360 + dist * 0.4)), delay: o.delay || 0, easing: 'cubic-bezier(.45, 0, .2, 1)', fill: 'backwards' };
  const a = track(g.animate(arcFrames(from, to, o), timing));
  if (o.flip) track(g.firstChild.animate([{ transform: 'rotateY(180deg)' }, { transform: 'rotateY(180deg)', offset: 0.12 }, { transform: 'rotateY(0deg)', offset: 0.85 }, { transform: 'rotateY(0deg)' }], timing));
  const done = () => {
    if (!g.isConnected) return;
    g.remove();
    const cur = release(id);
    if (o.land) land(cur);
  };
  a.onfinish = done;
  a.oncancel = done;
  return a;
}

function playFlights(prev, skip) {
  if (!prev) return;
  let n = 0;
  let draws = 0;
  let oppIn = 0;
  $$('#screen [data-card]').forEach((el) => {
    if (n >= 24 || (skip && skip.has(el.dataset.card))) return;
    const to = boxOf(el);
    if (!to || to.bottom < 0 || to.top > innerHeight) return;
    let from = prev.m.get(el.dataset.card);
    const o = {};
    if (!from) { // 新出现的牌：自己手里的从牌堆翻着飞来；对方桌上 / 弃牌堆里的从对方手牌翻开飞来
      const inHand = !!el.closest('.hand');
      const src = inHand ? prev.deck : el.closest('.zone.opp') || el.closest('[data-do="discard-pile"]') ? prev.opp : null;
      if (!src) return;
      from = src;
      o.flip = true;
      o.delay = inHand ? 90 * draws++ : 70 * oppIn++;
      o.land = !inHand;
    } else if (Math.abs(from.cx - to.cx) < 1 && Math.abs(from.cy - to.cy) < 1 && Math.abs(from.w - to.w) < 1) {
      return;
    } else if (Math.abs(from.cy - to.cy) < 10 && Math.abs(from.w - to.w) < 2) {
      Object.assign(o, { lift: 0.12, rot: 0, pop: 0, dur: 300 }); // 同一排里挪个位置（手牌重排、银行往后推）：平移过去就好
    } else {
      o.land = !el.closest('.hand');
    }
    fly(el, from, to, o);
    n++;
  });
}

// 开局发牌：自己的手牌一张张从牌堆翻开飞来，对方那边飞几张牌背
function dealIn() {
  if (!motionOK()) return;
  const ids = $$('#screen .hand .card').map((el) => el.dataset.card);
  ids.forEach(hold);
  const wait = Math.max(0, 560 - (performance.now() - (S.enterAt || 0))); // 等各块进场站稳再量位置
  setTimeout(() => {
    const deck = S.screen === 'game' ? deckBox() : null;
    ids.forEach((id, k) => {
      const el = cardNode(id);
      const to = deck && boxOf(el);
      if (to) {
        fly(el, deck, to, { flip: true, delay: k * 120, lift: 0.8 });
        sound.play('card', 0.05 + k * 0.12);
      }
      release(id);
    });
    if (deck) flyBacks(Math.min(5, V().players[opp()].handCount), 60);
  }, wait);
}

// 进了弃牌堆、桌面上已经看不到的牌（被清算 / Huge Win 清掉的地产、被弃的手牌）：从原来的位置一张张飞进弃牌堆
function vanishToDiscard(prev, skip) {
  if (!prev || !prev.els || !S.snap) return;
  const dest = discardBox();
  if (!dest) return;
  const inDiscard = new Set(V().discard.map(String));
  let k = 0;
  prev.els.forEach((el, id) => {
    if (k >= 16 || (skip && skip.has(id)) || cardNode(id) || !inDiscard.has(id)) return;
    const from = prev.m.get(id);
    const g = makeGhost(cleanClone(el), dest, false);
    const fr = arcFrames(from, dest, { lift: 0.7, pop: 0.06 });
    fr[10].opacity = 0.4;
    const a = track(g.animate(fr, { duration: 560, delay: 120 + k * 55, easing: 'cubic-bezier(.45, 0, .2, 1)', fill: 'backwards' }));
    a.onfinish = () => { g.remove(); if (!--vanishing) land(cardNode(V().discardTop), 1.08); };
    a.oncancel = () => { g.remove(); vanishing = Math.max(0, vanishing - 1); };
    vanishing++;
    k++;
  });
}
let vanishing = 0;

// 对方手牌被弃：几张牌背从他手里飞进弃牌堆
function backsToDiscard(n, delay0) {
  if (!motionOK()) return;
  const from = oppHandBox();
  const to = discardBox();
  if (!from || !to) return;
  for (let k = 0; k < Math.min(n, 6); k++) {
    const g = makeGhost(backEl(), to, false);
    const a = track(g.animate(arcFrames(from, to, { lift: 0.6, pop: 0.05 }), { duration: 520, delay: (delay0 || 0) + k * 80, easing: 'cubic-bezier(.45, 0, .2, 1)', fill: 'backwards' }));
    a.onfinish = () => g.remove();
    a.oncancel = () => g.remove();
  }
}

// 对方摸牌：几张牌背从牌堆飞进他的手牌
function flyBacks(n, delay0) {
  if (!motionOK()) return;
  const from = deckBox();
  const to = oppHandBox();
  if (!from || !to) return;
  for (let k = 0; k < Math.min(n, 5); k++) {
    const g = makeGhost(backEl(), from, false);
    const a = track(g.animate(arcFrames(from, to, { lift: 0.5, pop: 0.05, fade: true }, from), { duration: 500, delay: (delay0 || 0) + k * 110, easing: 'cubic-bezier(.45, 0, .2, 1)', fill: 'backwards' }));
    a.onfinish = () => g.remove();
    a.oncancel = () => g.remove();
  }
}

/* ═══════════ 声音：Web Audio 现场合成，不用任何音频文件 ═══════════ */
const sound = (() => {
  let ctx = null;
  let master = null;
  let on = store.get('sound', true);
  function ensure() {
    if (!on) return null;
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.22;
        master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { return null; }
    return ctx;
  }
  function tone(f, t, dur, type, gain, slideTo) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.3, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + dur + 0.03);
  }
  function noise(t, dur, gain, freq, q, type, sweepTo) {
    const len = Math.max(1, Math.ceil(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = type || 'bandpass';
    f.frequency.setValueAtTime(freq || 2000, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    f.Q.value = q || 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start(t);
    src.stop(t + dur + 0.02);
  }
  const SFX = {
    tap: (t) => noise(t, 0.035, 0.1, 3800, 1, 'highpass'),
    card: (t) => noise(t, 0.13, 0.2, 1100, 0.7, 'bandpass', 4200),
    coin: (t) => { tone(1318.5, t, 0.12, 'sine', 0.22); tone(1975.5, t + 0.07, 0.26, 'sine', 0.2); },
    spend: (t) => tone(587.3, t, 0.18, 'triangle', 0.14, 493.9),
    turn: (t) => { tone(783.99, t, 0.18, 'sine', 0.2); tone(1046.5, t + 0.11, 0.32, 'sine', 0.2); },
    set: (t) => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.075, i === 3 ? 0.5 : 0.3, 'triangle', 0.17)),
    alert: (t) => { tone(880, t, 0.1, 'square', 0.05); tone(698.5, t + 0.12, 0.16, 'square', 0.05); },
    stamp: (t) => { tone(150, t, 0.24, 'sine', 0.5, 52); noise(t, 0.09, 0.22, 800, 0.6, 'lowpass'); },
    error: (t) => { tone(233.1, t, 0.11, 'triangle', 0.18); tone(185, t + 0.1, 0.18, 'triangle', 0.18); },
    pop: (t) => tone(660, t, 0.09, 'sine', 0.14, 990),
    swoosh: (t) => noise(t, 0.26, 0.11, 500, 0.9, 'bandpass', 3200),
    tick: (t) => tone(1760, t, 0.05, 'sine', 0.08),
    win: (t) => {
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, t + i * 0.09, i === 4 ? 0.9 : 0.26, 'triangle', 0.2));
      [1046.5, 1318.5, 1568].forEach((f) => tone(f, t + 0.5, 0.9, 'sine', 0.08));
      noise(t + 0.45, 0.6, 0.05, 7000, 0.5, 'highpass');
    },
    defeat: (t) => [392, 349.2, 293.7].forEach((f, i) => tone(f, t + i * 0.15, 0.34, 'sine', 0.14)),
  };
  return {
    play(name, delay) { const c = ensure(); if (c && SFX[name]) { try { SFX[name](c.currentTime + 0.01 + (delay || 0)); } catch (e) { /* 忽略 */ } } },
    unlock() { if (on) ensure(); },
    get on() { return on; },
    toggle() { on = !on; store.set('sound', on); if (on) this.play('pop'); },
  };
})();

/* ═══════════ 触感：安卓用震动；iPhone（iOS 18+）借系统开关控件触发轻触感 ═══════════ */
const haptic = (() => {
  const PATTERN = { light: 8, medium: 15, success: [10, 50, 20], warn: [20, 60, 20], error: [26, 40, 26, 40, 26] };
  let label = null;
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && !navigator.vibrate) {
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.setAttribute('switch', '');
    box.id = 'md-haptic';
    box.tabIndex = -1;
    box.setAttribute('aria-hidden', 'true');
    label = document.createElement('label');
    label.htmlFor = 'md-haptic';
    label.setAttribute('aria-hidden', 'true');
    for (const el of [box, label]) {
      el.style.cssText = 'position:fixed;left:-20px;top:-20px;width:1px;height:1px;opacity:0;pointer-events:none';
      // 这里的 click 是程序触发的，不能冒泡到页面：否则会被当成"点了外面"，刚弹出的表情面板会被立刻关掉
      el.addEventListener('click', (e) => e.stopPropagation());
    }
    document.body.append(box, label);
  }
  return (kind) => {
    try {
      if (navigator.vibrate) navigator.vibrate(PATTERN[kind] || 8);
      else if (label) label.click();
    } catch (e) { /* 不支持就算了 */ }
  };
})();

/* ═══════════ 特效 ═══════════ */
const fxLayer = $('#fx');
const EASE_OUT = 'cubic-bezier(.23, 1, .32, 1)';

function floatText(text, rect, cls) {
  if (!rect) return;
  const el = document.createElement('div');
  el.className = 'float' + (cls ? ' ' + cls : '');
  el.textContent = text;
  el.style.left = rect.left + rect.width / 2 + 'px';
  el.style.top = rect.top - 6 + 'px';
  fxLayer.appendChild(el);
  if (!motionOK()) { setTimeout(() => el.remove(), 1200); return; }
  el.animate([
    { transform: 'translate(-50%, 6px) scale(.8)', opacity: 0 },
    { transform: 'translate(-50%, -14px) scale(1.06)', opacity: 1, offset: 0.22 },
    { transform: 'translate(-50%, -22px) scale(1)', opacity: 1, offset: 0.6 },
    { transform: 'translate(-50%, -44px) scale(1)', opacity: 0 },
  ], { duration: 1200, easing: EASE_OUT }).onfinish = () => el.remove();
}

// 盖章：从天而降砸在屏幕中间，四周的桌面跟着震一下
function stamp(text, tone, quiet) {
  const el = document.createElement('div');
  el.className = 'stamp ' + (tone || 'red');
  el.textContent = text;
  fxLayer.appendChild(el);
  if (!quiet) sound.play('stamp');
  haptic('medium');
  const k = (sc, r, o, off) => ({ transform: `translate(-50%, -50%) scale(${sc}) rotate(${r}deg)`, opacity: o, offset: off });
  el.animate(motionOK()
    ? [k(1.9, -14, 0, 0), k(0.94, -8, 1, 0.28), k(1, -8, 1, 0.4), k(1, -8, 1, 0.82), k(1.04, -8, 0, 1)]
    : [k(1, -8, 0, 0), k(1, -8, 1, 0.1), k(1, -8, 1, 0.85), k(1, -8, 0, 1)], { duration: 1400, easing: EASE_OUT }).onfinish = () => el.remove();
  const game = $('#screen .game');
  if (game && motionOK()) game.animate([{ translate: '0 0' }, { translate: '0 0', offset: 0.26 }, { translate: '0 5px', offset: 0.3 }, { translate: '0 -2px', offset: 0.36 }, { translate: '0 0', offset: 0.42 }, { translate: '0 0' }], { duration: 1400 });
}

// 五彩纸屑：一张全屏画布，粒子自带重力、空气阻力和翻转
const confetti = (() => {
  let canvas = null;
  let g = null;
  let parts = [];
  let raf = 0;
  function size() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function frame() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((q) => q.life < q.max && q.y < innerHeight + 40);
    for (const q of parts) {
      q.life++;
      q.vx *= 0.985;
      q.vy = q.vy * 0.985 + 0.32;
      q.x += q.vx + Math.sin(q.life * q.wob) * 0.6;
      q.y += q.vy;
      q.r += q.vr;
      g.save();
      g.globalAlpha = Math.min(1, (q.max - q.life) / 25);
      g.translate(q.x, q.y);
      g.rotate(q.r);
      g.scale(1, Math.cos(q.life * q.flip));
      g.fillStyle = q.c;
      g.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
      g.restore();
    }
    if (parts.length) raf = requestAnimationFrame(frame);
    else { raf = 0; g.clearRect(0, 0, innerWidth, innerHeight); }
  }
  return (o) => {
    if (!motionOK()) return;
    if (!canvas) {
      canvas = document.createElement('canvas');
      fxLayer.appendChild(canvas);
      g = canvas.getContext('2d');
      addEventListener('resize', size);
    }
    size();
    const colors = o.colors || S.meta.colorKeys.map((c) => COLOR(c).hex).concat('#ffcc00');
    for (let i = 0; i < o.count; i++) {
      const a = ((o.angle == null ? -90 : o.angle) + (Math.random() - 0.5) * (o.spread || 60)) * Math.PI / 180;
      const v = (o.speed || 12) * (0.55 + Math.random() * 0.6);
      parts.push({
        x: o.x, y: o.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
        flip: 0.08 + Math.random() * 0.12, wob: 0.05 + Math.random() * 0.1,
        c: colors[(Math.random() * colors.length) | 0], life: 0, max: 80 + Math.random() * 60,
      });
    }
    if (!raf) raf = requestAnimationFrame(frame);
  };
})();

function countUp(el, a, b) {
  if (!el || !motionOK()) return;
  const t0 = performance.now();
  const step = (now) => {
    if (!el.isConnected) return;
    const k = Math.min(1, (now - t0) / 650);
    el.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - k, 3))) + 'M';
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  el.animate([{ scale: '1' }, { scale: '1.25', offset: 0.3 }, { scale: '1' }], { duration: 520, easing: EASE_OUT });
}

// 轮到自己：手牌依次轻跳一下（用 translate 属性，和扇形的 transform 叠加）

// 一道光从左往右扫过去
function shineOn(el, delay) {
  if (!el || !motionOK()) return;
  const s = document.createElement('span');
  s.className = 'shine';
  s.innerHTML = '<i></i>';
  el.appendChild(s);
  s.firstChild.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(330%)' }], { duration: 820, delay: delay || 0, easing: EASE_OUT, fill: 'backwards' }).onfinish = () => s.remove();
}

function ringBurst(b, color) {
  if (!b || !motionOK()) return;
  const d = Math.max(b.w, b.h) * 1.15;
  for (let k = 0; k < 2; k++) {
    const r = document.createElement('div');
    r.className = 'ring';
    Object.assign(r.style, { width: d + 'px', height: d + 'px', left: b.cx - d / 2 + 'px', top: b.cy - d / 2 + 'px' });
    r.style.setProperty('--c', color);
    fxLayer.appendChild(r);
    r.animate([{ transform: 'scale(.45)', opacity: 0.9 }, { transform: 'scale(1.75)', opacity: 0 }], { duration: 760, delay: k * 160, easing: EASE_OUT, fill: 'backwards' }).onfinish = () => r.remove();
  }
}

// 吃亏的时候分块抖一下
function shakeEl(el) {
  if (!el || !motionOK()) return;
  el.animate([{ translate: '0 0' }, { translate: '-7px 0' }, { translate: '6px 0' }, { translate: '-4px 0' }, { translate: '2px 0' }, { translate: '0 0' }], { duration: 420, easing: 'ease-out' });
}

// 被对方针对：屏幕四周闪一圈红
function vignette() {
  if (!motionOK()) return;
  const v = document.createElement('div');
  v.className = 'vig';
  fxLayer.appendChild(v);
  v.animate([{ opacity: 0 }, { opacity: 1, offset: 0.22 }, { opacity: 0.45, offset: 0.48 }, { opacity: 0.9, offset: 0.64 }, { opacity: 0 }], { duration: 1400, easing: 'ease-out' }).onfinish = () => v.remove();
}

// 付款：一串金币从付款人的银行划弧线飞进收款人的银行
function coinRain(fromP, toP, amount, delay0) {
  if (!motionOK()) return;
  const a = boxOf($(`#screen .bank[data-p="${fromP}"] .pile`));
  const b = boxOf($(`#screen .bank[data-p="${toP}"] .pile`));
  if (!a || !b) return;
  const n = Math.max(3, Math.min(9, Math.round(amount)));
  const anchor = { cx: b.cx, cy: b.cy, w: 18 };
  for (let k = 0; k < n; k++) {
    const c = document.createElement('div');
    c.className = 'coin';
    c.style.left = b.cx + 'px';
    c.style.top = b.cy + 'px';
    fxLayer.appendChild(c);
    const from = { cx: a.cx + (Math.random() - 0.5) * a.w * 0.6, cy: a.cy + (Math.random() - 0.5) * a.h * 0.4, w: 14 };
    const to = { cx: b.cx + (Math.random() - 0.5) * 12, cy: b.cy + (Math.random() - 0.5) * 12, w: 16 };
    const fr = arcFrames(from, to, { lift: 1.3 + Math.random() * 0.6, rot: 0, pop: 0.45 }, anchor);
    fr[0].opacity = 0;
    fr[1].opacity = 1;
    fr[10].opacity = 0.3;
    const an = track(c.animate(fr, { duration: 640 + Math.random() * 120, delay: (delay0 || 0) + k * 60, easing: 'cubic-bezier(.4, 0, .25, 1)', fill: 'backwards' }));
    an.onfinish = () => c.remove();
    an.oncancel = () => c.remove();
    if (k % 3 === 0) sound.play('tick', ((delay0 || 0) + k * 60 + 600) / 1000);
  }
}

/* 行动卡登场：从出牌人那里飞到屏幕中央亮个相（对方的牌先翻面），再落进弃牌堆。
 * 对方针对自己时多停一会儿、四周闪红，回应面板等它落下再弹出。 */
const REVEAL = { oppIn: 440, mineIn: 300, out: 380, hold: 650, holdHit: 900 };
function pickReveal(job) {
  if (!job || !S.snap) return null;
  const e = job.events.filter((x) => x.type === 'actionPlayed' && x.cardId != null).pop();
  if (!e) return null;
  const skip = new Set([String(e.cardId)]);
  (e.doubles || []).forEach((id) => skip.add(String(id)));
  if (V().discardTop != null) skip.add(String(V().discardTop));
  return { e, skip };
}
// 这次更新里对方有牌要"亮相"时，回应面板晚多久再弹
function revealHold(events) {
  if (!motionOK() || !S.room) return 0;
  const i = S.room.seat;
  if (events.some((e) => e.type === 'actionPlayed' && e.player !== i && e.target === i)) return REVEAL.oppIn + REVEAL.holdHit + 120;
  if (events.some((e) => e.type === 'justSayNo' && e.player !== i)) return 650;
  return 0;
}
function revealText(e) {
  const nm = V().players[e.player].name;
  const who = e.player === me() ? '你' : nm;
  switch (e.action) {
    case 'rent': return `${who} 收租 ${e.amount}M${e.doubles && e.doubles.length ? `（翻倍 ×${Math.pow(2, e.doubles.length)}）` : ''}${e.boost > 1 ? `（${NM('hugeWin')} ×${e.boost}）` : ''}`;
    case 'debtCollector': return `${who} 讨债 ${e.amount}M`;
    case 'birthday': return `${who} 过生日，随礼 ${e.amount}M`;
    case 'passGo': return `${who} 打出${AN('passGo')}，再摸 2 张`;
    case 'bankruptcy': return `${who} 打出${AN('bankruptcy')}，要拿走全部银行 ${e.amount}M`;
    case 'liquidation': return `${who} 打出${AN('liquidation')}，清算整套${COLOR(e.color).zh}`;
    case 'hugeWin': return `${who} 打出${AN('hugeWin')}！`;
    default: return `${who} 打出${AN(e.action)}`;
  }
}
function revealCard(r, prev) {
  if (!prev || !motionOK()) return;
  const e = r.e;
  const mine = e.player === me();
  const hit = !mine && e.target === me();
  const from = (mine && prev.m.get(String(e.cardId))) || (mine ? prev.deck : prev.opp);
  const pileEl = $('#screen [data-do="discard-pile"] .card');
  const dest = boxOf(pileEl) || discardBox();
  if (!from || !dest) return;
  const W = Math.min(innerWidth * 0.46, 200) * (mine ? 0.82 : 1);
  const mid = { cx: innerWidth / 2, cy: Math.max(W / CONFIG.RATIO / 2 + 64, innerHeight * 0.42), w: W, h: W / CONFIG.RATIO };
  const tIn = mine ? REVEAL.mineIn : REVEAL.oppIn;
  const holdMs = mine ? 60 : hit ? REVEAL.holdHit : REVEAL.hold;
  const total = tIn + holdMs + REVEAL.out;
  const f1 = tIn / total;
  const f2 = (tIn + holdMs) / total;
  const holder = document.createElement('div');
  holder.innerHTML = cardHTML(e.cardId);
  let dim = null;
  let cap = null;
  if (!mine) {
    dim = document.createElement('div');
    dim.className = 'reveal-dim';
    fxLayer.appendChild(dim);
  }
  const g = makeGhost(cleanClone(holder.firstElementChild), mid, !mine, 'reveal', fxLayer);
  if (!mine) {
    cap = document.createElement('div');
    cap.className = 'reveal-cap' + (hit ? ' alert' : '');
    cap.textContent = revealText(e);
    cap.style.top = Math.min(innerHeight - 60, mid.cy + mid.h / 2 + 16) + 'px';
    fxLayer.appendChild(cap);
  }
  const pileId = pileEl && pileEl.dataset.card;
  if (pileId) hold(pileId);
  const inF = arcFrames(from, mid, { lift: 0.55, pop: 0.08, rot: 0.7, ease: easeOut3 }, mid).map((k) => Object.assign(k, { offset: k.offset * f1 }));
  const outF = arcFrames(mid, dest, { lift: 0.35, pop: 0.03, rot: 0.5, ease: easeInOut3 }, mid).map((k) => Object.assign(k, { offset: f2 + k.offset * (1 - f2) }));
  const holdF = holdMs > 120 ? [{ offset: f1 + (f2 - f1) * 0.5, transform: 'translate(0px, -4px) rotate(0deg) scale(1.025)' }] : [];
  const timing = { duration: total, easing: 'linear' };
  const a = track(g.animate(inF.concat(holdF, outF.slice(1)), timing));
  if (!mine) track(g.firstChild.animate([{ transform: 'rotateY(180deg)', offset: 0 }, { transform: 'rotateY(180deg)', offset: f1 * 0.15 }, { transform: 'rotateY(0deg)', offset: f1 * 0.95 }, { transform: 'rotateY(0deg)' }], timing));
  if (dim) track(dim.animate([{ opacity: 0 }, { opacity: 1, offset: f1 }, { opacity: 1, offset: f2 }, { opacity: 0 }], timing));
  if (cap) track(cap.animate([{ opacity: 0, transform: 'translate(-50%, 10px) scale(.9)' }, { opacity: 0, transform: 'translate(-50%, 10px) scale(.9)', offset: f1 * 0.6 }, { opacity: 1, transform: 'translate(-50%, 0) scale(1)', offset: f1 }, { opacity: 1, transform: 'translate(-50%, 0) scale(1)', offset: f2 }, { opacity: 0, transform: 'translate(-50%, -6px) scale(.96)', offset: Math.min(1, f2 + 0.12) }, { opacity: 0, transform: 'translate(-50%, -6px) scale(.96)' }], timing));
  sound.play('swoosh');
  if (!mine) sound.play('swoosh', (tIn + holdMs) / 1000);
  if (hit) setTimeout(vignette, Math.round(tIn * 0.7));
  const done = () => {
    if (!g.isConnected) return;
    g.remove();
    if (dim) dim.remove();
    if (cap) cap.remove();
    if (pileId) land(release(pileId), 1.1);
  };
  a.onfinish = done;
  a.oncancel = done;
}

// 凑齐一套：整组轻跳 + 扫光 + 彩圈 + 飘字 + 小烟花；进度槽里新亮的那格弹一下
function celebrateSet(p, color) {
  const mine = p === me();
  const zone = mine ? '.zone.me' : '.zone.opp';
  const k = COLOR(color);
  if (mine) { sound.play('set', 0.08); haptic('success'); } else { island.flash(`${V().players[p].name} 凑齐了${k.zh}`); }
  const slot = $(`#screen ${zone} .slots i.on[data-c="${color}"]`);
  if (slot && motionOK()) slot.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.8)', offset: 0.4 }, { transform: 'scale(1)' }], { duration: 520, delay: 200, easing: EASE_OUT });
  const el = $(`#screen ${zone} .set.full[data-color="${color}"] .stack`);
  if (!el || !motionOK()) return;
  el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.1) rotate(-1.5deg)', offset: 0.35 }, { transform: 'scale(1)' }], { duration: 600, easing: EASE_OUT });
  const shine = document.createElement('span');
  shine.className = 'shine';
  shine.innerHTML = '<i></i>';
  el.appendChild(shine);
  shine.firstChild.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(330%)' }], { duration: 780, delay: 120, easing: EASE_OUT, fill: 'backwards' }).onfinish = () => shine.remove();
  const b = boxOf(el);
  ringBurst(b, k.hex);
  if (mine) {
    floatText(`${k.zh}成套！`, el.getBoundingClientRect(), 'gold');
    confetti({ x: b.cx, y: b.cy - b.h * 0.15, count: 32, angle: -90, spread: 120, speed: 9, colors: [k.hex, k.hex, '#ffcc00', '#ffffff'] });
  }
}

function celebrateEnd(e) {
  disarmIdle();
  if (e.winner === me()) {
    sound.play('win', 0.12);
    haptic('success');
    setTimeout(() => stamp('胜利！', 'gold', true), 160);
    setTimeout(() => {
      confetti({ x: innerWidth * 0.12, y: innerHeight * 0.92, count: 80, angle: -62, spread: 32, speed: 19 });
      confetti({ x: innerWidth * 0.88, y: innerHeight * 0.92, count: 80, angle: -118, spread: 32, speed: 19 });
    }, 120);
    setTimeout(() => confetti({ x: innerWidth / 2, y: -10, count: 70, angle: 90, spread: 160, speed: 6 }), 650);
    $$('#screen .zone.me .set.full .stack').forEach((el, k) => setTimeout(() => shineOn(el), 300 + k * 140));
  } else if (e.winner != null) {
    sound.play('defeat', 0.12);
    if (motionOK()) { const z = $('#screen .zone.me'); if (z) z.animate([{ filter: 'saturate(1)' }, { filter: 'saturate(.2)', offset: 0.3 }, { filter: 'saturate(1)' }], { duration: 1800, easing: 'ease-out' }); }
  }
}

/* 表情：从发送人头像旁边弹出一个对话泡，表情自己会动，再冒几颗小的往上飘 */
const EMO_FX = {
  '👍': [{ transform: 'rotate(0)' }, { transform: 'rotate(-18deg) scale(1.15)', offset: 0.35 }, { transform: 'rotate(6deg)', offset: 0.65 }, { transform: 'rotate(0)' }],
  '😂': [{ transform: 'rotate(0)' }, { transform: 'rotate(-14deg)', offset: 0.2 }, { transform: 'rotate(12deg)', offset: 0.4 }, { transform: 'rotate(-10deg)', offset: 0.6 }, { transform: 'rotate(6deg)', offset: 0.8 }, { transform: 'rotate(0)' }],
  '😮': [{ transform: 'scale(1)' }, { transform: 'scale(1.3)', offset: 0.35 }, { transform: 'scale(.95)', offset: 0.7 }, { transform: 'scale(1)' }],
  '😭': [{ transform: 'translateY(0)' }, { transform: 'translateY(3px) scaleY(.92)', offset: 0.25 }, { transform: 'translateY(0)', offset: 0.5 }, { transform: 'translateY(3px) scaleY(.92)', offset: 0.75 }, { transform: 'translateY(0)' }],
  '😤': [{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)', offset: 0.15 }, { transform: 'translateX(4px)', offset: 0.3 }, { transform: 'translateX(-3px)', offset: 0.45 }, { transform: 'translateX(3px)', offset: 0.6 }, { transform: 'translateX(0)' }],
  '🎉': [{ transform: 'rotate(0) scale(1)' }, { transform: 'rotate(-22deg) scale(1.2)', offset: 0.3 }, { transform: 'rotate(10deg)', offset: 0.6 }, { transform: 'rotate(0) scale(1)' }],
};
function emoteBubble(seat, e) {
  if (!S.room || !S.snap || S.screen !== 'game') return;
  const mine = seat === me();
  const av = $(`#screen ${mine ? '.zone.me' : '.zone.opp'} .who .av`);
  if (!av) return;
  const r = av.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'emo' + (mine ? '' : ' down');
  el.innerHTML = `<span>${esc(e)}</span>`;
  fxLayer.appendChild(el);
  const x = Math.max(6, Math.min(innerWidth - el.offsetWidth - 6, r.right - 4));
  const y = mine ? r.top - el.offsetHeight + 2 : r.bottom - 2;
  el.style.left = x + 'px';
  el.style.top = Math.max(4, y) + 'px';
  sound.play('pop');
  if (!mine) haptic('light');
  if (!motionOK()) { setTimeout(() => el.remove(), 1900); return; }
  el.animate([
    { transform: 'scale(.2)', opacity: 0, easing: 'cubic-bezier(.2, .9, .3, 1.2)' },
    { transform: 'scale(1.08)', opacity: 1, offset: 0.12 },
    { transform: 'scale(1)', opacity: 1, offset: 0.2 },
    { transform: 'scale(1)', opacity: 1, offset: 0.84 },
    { transform: `translateY(${mine ? -10 : 8}px) scale(.88)`, opacity: 0 },
  ], { duration: 2300 }).onfinish = () => el.remove();
  if (EMO_FX[e]) el.firstChild.animate(EMO_FX[e], { duration: 760, delay: 220, easing: 'ease-in-out' });
  const b = el.getBoundingClientRect();
  const cx = b.left + b.width / 2;
  const cy = b.top + b.height / 2;
  for (let k = 0; k < 5; k++) {
    const p = document.createElement('div');
    p.className = 'emo-p';
    p.textContent = e;
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    fxLayer.appendChild(p);
    const dx = (Math.random() - 0.5) * 110;
    const dy = -(46 + Math.random() * 70);
    p.animate([
      { transform: 'translate(0, 0) scale(.3)', opacity: 0 },
      { transform: `translate(${dx * 0.35}px, ${dy * 0.35}px) scale(1)`, opacity: 1, offset: 0.3 },
      { transform: `translate(${dx}px, ${dy}px) scale(.7) rotate(${dx / 3}deg)`, opacity: 0 },
    ], { duration: 1100 + Math.random() * 500, delay: 160 + k * 80, easing: 'cubic-bezier(.2, .7, .3, 1)', fill: 'backwards' }).onfinish = () => p.remove();
  }
  if (e === '🎉') confetti({ x: cx, y: cy, count: 22, angle: -90, spread: 140, speed: 7 });
}

// 表情面板：贴着表情按钮弹出来，六个表情依次蹦出
function toggleEmotes() {
  if ($('#pop')) { closeEmotes(); return; }
  const btn = $('#screen [data-do="emotes"]');
  if (!btn) return;
  const b = btn.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.id = 'pop';
  pop.className = 'pop';
  pop.setAttribute('role', 'menu');
  pop.setAttribute('aria-label', '发表情');
  pop.innerHTML = EMOTES.map((e) => `<button type="button" role="menuitem" data-do="emote" data-e="${e}" aria-label="发送 ${e}">${e}</button>`).join('');
  pop.style.bottom = Math.round(innerHeight - b.top + 10) + 'px';
  pop.style.right = Math.max(8, Math.round(innerWidth - b.right)) + 'px';
  document.body.appendChild(pop);
  btn.setAttribute('aria-expanded', 'true');
  if (!motionOK()) return;
  pop.animate([{ transform: 'translateY(10px) scale(.5)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 380, easing: 'cubic-bezier(.34, 1.56, .64, 1)' });
  $$('button', pop).forEach((x, i) => x.animate([{ transform: 'translateY(12px) scale(.3)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, delay: 50 + (EMOTES.length - 1 - i) * 30, easing: 'cubic-bezier(.34, 1.56, .64, 1)', fill: 'backwards' }));
}

function closeEmotes() {
  const btn = $('#screen [data-do="emotes"]');
  if (btn) btn.setAttribute('aria-expanded', 'false');
  const pop = $('#pop');
  if (!pop) return;
  pop.id = '';
  if (!motionOK()) { pop.remove(); return; }
  pop.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(6px) scale(.86)', opacity: 0 }], { duration: 160, easing: EASE_OUT }).onfinish = () => pop.remove();
}

// 发呆提醒：轮到自己 30 秒没动，灵动岛提醒一次
let idleTimer = 0;
function armIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!S.snap || V().phase !== 'play' || V().activePlayer !== me() || S.sheet || S.busy) return;
    island.flash('轮到你了：出牌，或者结束回合');
    islandPulse();
    sound.play('turn');
    haptic('light');
    shineOn($('#screen .dock .main'));
  }, 30000);
}
function disarmIdle() { clearTimeout(idleTimer); }

// 回合台：换内容时滑入；轮到自己时扫一道光、出牌次数格子依次亮起；用掉一次出牌时那一格闪一下
function stageFx() {
  const s = S.stageNow;
  if (!s) return;
  const key = s.key + '|' + s.mode;
  const prevKey = S.stageKey;
  const prevLeft = S.pipLeft;
  S.stageKey = key;
  S.pipLeft = s.pips ? s.pips.filter(Boolean).length : null;
  if (!prevKey || !motionOK()) return;
  if (prevKey !== key) {
    const inn = $('#screen .stage .st-in');
    if (inn) inn.animate([{ transform: 'translateY(14px) scale(.94)', opacity: 0, filter: 'blur(4px)' }, { transform: 'none', opacity: 1, filter: 'blur(0)' }], { duration: 480, easing: EASE_OUT });
    const title = $('#screen .stage .st-title');
    if (title && s.mode !== 'opp') title.animate([{ scale: '1' }, { scale: '1.12', offset: 0.45 }, { scale: '1' }], { duration: 520, delay: 220, easing: EASE_OUT });
    if (s.pips) $$('#screen .stage .pips i').forEach((p, k) => p.animate([{ transform: 'scaleX(.1)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 440, delay: 180 + k * 90, easing: 'cubic-bezier(.34, 1.56, .64, 1)', fill: 'backwards' }));
  } else if (prevLeft != null && S.pipLeft != null && S.pipLeft < prevLeft) {
    const pips = $$('#screen .stage .pips i');
    for (let k = S.pipLeft; k < prevLeft; k++) if (pips[k]) pips[k].animate([{ transform: 'scale(1.5, 1.8)', backgroundColor: s.mode === 'me' ? '#0071e3' : '#6e6e73' }, { transform: 'none' }], { duration: 420, easing: EASE_OUT });
  }
}
// 回合台上"思考中 0:23"这种随时间变的字，每秒只改文字，不重绘整页
function tickStage() {
  const el = $('#st-sub');
  if (!el || !S.snap) return;
  const t = stageSub();
  if (t && el.textContent !== t) el.textContent = t;
}

// 主按钮换了状态（比如"对方回合"→"结束回合"）：弹一下；轮到自己时再扫一道光
function morphMain() {
  const key = S.mainNow;
  const was = S.mainKey;
  S.mainKey = key;
  if (!was || was === key || !motionOK()) return;
  const el = $('#screen .dock .main');
  if (!el) return;
  el.animate([{ transform: 'scale(.9)', opacity: 0.5 }, { transform: 'none', opacity: 1 }], { duration: 440, easing: 'cubic-bezier(.34, 1.56, .64, 1)' });
  if (/^primary\|结束回合/.test(key) && !/^primary\|结束回合/.test(was)) shineOn(el, 180);
}

// 根据这次更新里发生的事：放声音、震动、飘字、亮相和庆祝
function runEffects(job, rects, reveal) {
  const prev = job.prev;
  if (!prev || !S.snap) return;
  const v = V();
  const i = me();
  const o = opp();
  const P0 = prev.view.players;
  const P1 = v.players;
  let t = 0;
  const at = () => { t += 0.06; return t - 0.06; };
  let stamped = false;
  if (reveal && rects) revealCard(reveal, rects);
  for (const e of job.events) {
    switch (e.type) {
      case 'draw':
        if (e.count && e.player === i) { for (let k = 0; k < Math.min(e.count, 5); k++) sound.play('card', at() + k * 0.03); } else if (e.count) flyBacks(e.count);
        break;
      case 'property': case 'steal': case 'swap':
        sound.play('card', at());
        break;
      case 'bank':
        if (e.player === o) sound.play('card', at());
        break;
      case 'building':
        sound.play('set', at());
        setTimeout(() => { const st = $(`#screen .set[data-set="${e.setId}"][data-p="${e.player}"] .stack`); if (st) { shineOn(st, 0); ringBurst(boxOf(st), '#ffcc00'); } }, 420);
        break;
      case 'actionPlayed':
        if (e.player === o && e.target === i) { sound.play('alert', at()); haptic('warn'); } else sound.play('card', at());
        break;
      case 'payment':
        if (e.from !== e.to && (e.paid || e.amount)) coinRain(e.from, e.to, e.paid || e.amount, 120);
        break;
      case 'justSayNo':
        if (!stamped) { stamp(`${NM('justSayNo')}！`, 'red'); stamped = true; }
        break;
      case 'setStolen':
        if (!stamped) { stamp(e.to === i ? '抢到一整套！' : '整套被抢走了', e.to === i ? 'good' : 'red'); stamped = true; }
        if (e.from === i) setTimeout(() => shakeEl($('#screen .zone.me')), 200);
        break;
      case 'canceled':
        sound.play('pop', at());
        break;
      case 'bankrupt':
        if (!stamped) { stamp(e.to === i ? '破产！' : '银行被搬空', e.to === i ? 'good' : 'red'); stamped = true; }
        if (e.amount) coinRain(e.from, e.to, Math.min(12, e.amount), 200);
        if (e.from === i) setTimeout(() => shakeEl($('#screen .zone.me')), 300);
        break;
      case 'liquidated':
        if (!stamped) { stamp('清算！', e.by === i ? 'good' : 'red'); stamped = true; }
        if (e.from === o && e.handCount) backsToDiscard(e.handCount, 260);
        if (e.from === i) { setTimeout(() => shakeEl($('#screen .zone.me')), 300); setTimeout(() => shakeEl($('#screen .handbox')), 380); }
        break;
      case 'hugeWin':
        if (!stamped) { stamp('HUGE WIN', e.by === i ? 'gold' : 'red'); stamped = true; }
        if (e.by === i) {
          haptic('success');
          setTimeout(() => confetti({ x: innerWidth / 2, y: innerHeight * 0.4, count: 70, angle: -90, spread: 150, speed: 12 }), 260);
          setTimeout(() => e.boostColors.forEach((c, n) => { const st = $(`#screen .zone.me .set.full[data-color="${c}"] .stack`); if (st) { setTimeout(() => { ringBurst(boxOf(st), '#ffcc00'); shineOn(st); }, n * 140); } }), 700);
        } else if (e.from === i) {
          vignette();
          setTimeout(() => shakeEl($('#screen .zone.me')), 300);
        }
        break;
      case 'autoEndTurn':
        if (e.player === i) island.flash(`出满 ${e.plays} 张，自动结束回合`);
        break;
      default:
        break;
    }
    if (e.type === 'steal' && e.from === i) setTimeout(() => shakeEl($('#screen .zone.me')), 260);
  }
  // 银行金额变化：飘字 + 数字滚动
  [i, o].forEach((p) => {
    const a = P0[p].bankTotal;
    const b = P1[p].bankTotal;
    if (a === b) return;
    const el = $(`#screen [data-bank="${p}"]`);
    if (!el) return;
    countUp(el, a, b);
    floatText(`${b > a ? '+' : '−'}${Math.abs(b - a)}M`, el.getBoundingClientRect(), b > a ? '' : 'minus');
    if (p === i) sound.play(b > a ? 'coin' : 'spend', at());
  });
  // 新凑齐的颜色
  [i, o].forEach((p) => {
    const before = new Set(P0[p].fullColors);
    P1[p].fullColors.filter((c) => !before.has(c)).forEach((c) => celebrateSet(p, c));
  });
  // 离胜利只差一套
  const need = v.rules.setsToWin;
  if (v.phase !== 'gameOver' && need > 1) {
    [i, o].forEach((p) => {
      if (P1[p].fullColors.length === need - 1 && P0[p].fullColors.length < need - 1) {
        island.flash(p === i ? '再凑一套就赢了！' : `${P1[p].name} 只差一套了，小心`, p === i ? '' : 'err');
      }
    });
  }
  // 轮到自己
  if (v.phase !== 'gameOver' && job.events.some((e) => e.type === 'turnStart' && e.player === i)) {
    sound.play('turn', at() + 0.12);
    haptic('medium');
    islandPulse();
    setTimeout(rippleHand, 380);
    armIdle();
  }
  const over = job.events.find((e) => e.type === 'gameOver');
  if (over) celebrateEnd(over);
}

// 长按任意一张牌：放大看清楚，松手收回（iOS 式的轻点预览）
(() => {
  let timer = 0;
  let x0 = 0;
  let y0 = 0;
  let peek = null;
  let swallow = false;
  function open(card) {
    const r = card.getBoundingClientRect();
    const W = Math.min(innerWidth * 0.72, 320);
    const H = W / CONFIG.RATIO;
    const left = (innerWidth - W) / 2;
    const top = Math.max(60, (innerHeight - H) / 2);
    const dim = document.createElement('div');
    dim.className = 'peek-dim';
    const big = card.cloneNode(true);
    big.classList.remove('sel', 'pick', 'dim', 'fresh', 'can');
    big.classList.add('peek');
    big.removeAttribute('data-do');
    big.removeAttribute('data-card');
    Object.assign(big.style, { left: left + 'px', top: top + 'px', width: W + 'px', height: H + 'px' });
    big.style.setProperty('--w', W + 'px');
    fxLayer.append(dim, big);
    const from = `translate(${r.left - left}px, ${r.top - top}px) scale(${r.width / W})`;
    if (motionOK()) {
      big.animate([{ transform: from }, { transform: 'none' }], { duration: 280, easing: EASE_OUT });
      dim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: EASE_OUT });
    }
    peek = { big, dim, from };
    haptic('medium');
    sound.play('tap');
  }
  function close() {
    const p = peek;
    peek = null;
    if (!motionOK()) { p.big.remove(); p.dim.remove(); return; }
    p.dim.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: EASE_OUT });
    p.big.animate([{ transform: 'none', opacity: 1 }, { transform: p.from, opacity: 0.3 }], { duration: 220, easing: EASE_OUT }).onfinish = () => { p.big.remove(); p.dim.remove(); };
  }
  document.addEventListener('pointerdown', (e) => {
    const card = e.target.closest('#screen .card');
    if (!card || (e.pointerType === 'mouse' && e.button !== 0)) return;
    x0 = e.clientX;
    y0 = e.clientY;
    clearTimeout(timer);
    timer = setTimeout(() => { timer = 0; swallow = true; open(card); }, 430);
  }, { passive: true });
  document.addEventListener('pointermove', (e) => {
    if (timer && (Math.abs(e.clientX - x0) > 8 || Math.abs(e.clientY - y0) > 8)) { clearTimeout(timer); timer = 0; }
  }, { passive: true });
  const end = () => { clearTimeout(timer); timer = 0; if (peek) close(); };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
  document.addEventListener('contextmenu', (e) => { if (e.target.closest('#screen .card')) e.preventDefault(); });
  // 预览之后松手产生的那次点击不算数（触感用的隐藏开关除外）
  document.addEventListener('click', (e) => {
    if (!swallow || e.target.id === 'md-haptic' || e.target.htmlFor === 'md-haptic') return;
    swallow = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);
})();

/* ═══════════ 卡牌 HTML ═══════════ */
function fallback(c) {
  const v = c.value ? `<em>${c.value}M</em>` : '';
  if (c.type === 'money') return `<span class="fb money"><b>${c.value}M</b></span>`;
  if (c.type === 'property') return `<span class="fb"><i style="background:${COLOR(c.color).hex}"></i>${esc(c.zh)}${v}</span>`;
  if (c.type === 'wild' || c.type === 'rent') {
    const bg = c.any ? RAINBOW() : `linear-gradient(90deg,${COLOR(c.colors[0]).hex} 0 50%,${COLOR(c.colors[1]).hex} 50% 100%)`;
    return `<span class="fb"><i style="background:${bg}"></i>${esc(c.zh)}${v}</span>`;
  }
  return `<span class="fb act">${esc(c.zh)}${v}</span>`;
}

// o: { btn, cls, color（所在组颜色，决定双色多功能地产正放还是倒放）, data, style }
function cardHTML(id, o) {
  o = o || {};
  const c = CARD(id);
  const flip = o.color && c.type === 'wild' && !c.any && o.color !== (upOf(c.face) || c.colors[0]);
  const miss = !hasImg(c.face);
  const cls = ['card', flip && 'flip', miss && 'noimg', S.fresh.has(id) && 'fresh', o.cls].filter(Boolean).join(' ');
  const tag = o.btn ? 'button' : 'div';
  const extra = (o.btn ? ' type="button"' : '') + ` data-card="${id}"` + (o.data || '') + (o.style ? ` style="${o.style}"` : '');
  const img = miss ? '' : `<img src="${imgUrl(c.face)}" alt="" loading="lazy" decoding="async" draggable="false">`;
  return `<${tag} class="${cls}" data-face="${c.face}"${extra} aria-label="${esc(c.zh)}">${img}${fallback(c)}</${tag}>`;
}

function backHTML(o) {
  o = o || {};
  const miss = !hasImg('back');
  return `<div class="card back${miss ? ' noimg' : ''}${o.cls ? ' ' + o.cls : ''}" data-face="back"${o.style ? ` style="${o.style}"` : ''} aria-hidden="true">${miss ? '' : `<img src="${imgUrl('back')}" alt="" loading="lazy" decoding="async" draggable="false">`}<span class="fb"></span></div>`;
}

// 卡图加载失败时改用兜底牌面，并记住这张缺图
document.addEventListener('error', (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement)) return;
  const card = img.closest('.card');
  if (!card) return;
  S.missing.add(card.dataset.face);
  card.classList.add('noimg');
  img.remove();
}, true);

let preloaded = false;
let ratioFixed = false;
function useRatio(r) {
  if (ratioFixed || !(r > 0.45 && r < 0.95)) return;
  ratioFixed = true;
  store.set('ratio', r);
  if (Math.abs(r - CONFIG.RATIO) < 0.003) return;
  CONFIG.RATIO = r;
  document.documentElement.style.setProperty('--ratio', String(r));
  layoutHand();
}
function preloadFaces() {
  if (preloaded || !S.meta) return;
  preloaded = true;
  S.meta.faces.forEach((f) => {
    if (fileOf(f.face) == null) return;
    const im = new Image();
    im.decoding = 'async';
    im.onload = () => useRatio(im.naturalWidth / im.naturalHeight);
    im.onerror = () => S.missing.add(f.face);
    im.src = imgUrl(f.face);
  });
}

function cardDesc(c) {
  if (c.type === 'money') return '存进银行，被收钱时用来付款。';
  if (c.type === 'property') { const k = COLOR(c.color); return `${k.zh}地产，${k.size} 张成一套，租金 ${k.rent.join(' / ')}M。`; }
  if (c.type === 'wild') return c.any ? '可以当任意颜色的地产；单独成组时不能收租，也不能拿来付款。' : `可以当${COLOR(c.colors[0]).zh}或${COLOR(c.colors[1]).zh}地产，自己回合里随时换色。`;
  if (c.type === 'rent') return c.any ? '任选一种颜色，向对手收租。' : `按${COLOR(c.colors[0]).zh}或${COLOR(c.colors[1]).zh}向对手收租。`;
  return S.meta.actions[c.action].text + '。';
}

/* ═══════════ 渲染 ═══════════ */
function render() {
  const root = $('#screen');
  const scroll = {};
  $$('[data-key]', root).forEach((el) => { scroll[el.dataset.key] = el.scrollLeft; });
  let html = '';
  switch (S.screen) {
    case 'boot': case 'connecting': html = ''; break;
    case 'home': html = homeHTML(); break;
    case 'join': html = joinHTML(); break;
    case 'lobby': html = lobbyHTML(); break;
    case 'game': html = S.snap ? gameHTML() : ''; break;
    case 'fatal': html = fatalHTML(); break;
    default: html = '';
  }
  const focusId = document.activeElement && document.activeElement.id;
  const caret = focusId && document.activeElement.selectionStart;
  const keepInputs = {};
  $$('input[id]', root).forEach((el) => { keepInputs[el.id] = el.value; });
  root.innerHTML = html;
  // 换页时各块依次上浮进场；同一页里重绘时把"已经过了多久"带上，动画接着播而不是重来
  if (S.screen !== S.lastScreen) { S.lastScreen = S.screen; S.enterAt = performance.now(); }
  const first = root.firstElementChild;
  if (first && motionOK()) {
    first.classList.add('enter');
    first.style.setProperty('--enter-t', Math.round(S.enterAt - performance.now()) + 'ms');
  }
  Object.keys(keepInputs).forEach((k) => { const el = $('#' + k); if (el && document.activeElement !== el) el.value = keepInputs[k]; });
  if (focusId) { const el = $('#' + focusId); if (el) { el.focus(); if (el.setSelectionRange && caret != null) el.setSelectionRange(caret, caret); } }
  $$('[data-key]', root).forEach((el) => { if (scroll[el.dataset.key] != null) el.scrollLeft = scroll[el.dataset.key]; });
  if (S.screen === 'game' && S.snap) {
    hideHeld();
    layoutHand();
    selFx();
    stageFx();
    morphMain();
    if (S.dealIn) { S.dealIn = false; dealIn(); }
  }
  if (S.screen === 'game' || S.screen === 'lobby') wake.on();
  const job = S.fxJob;
  const prev = S.flip;
  S.fxJob = null;
  S.flip = null;
  const reveal = job && prev ? pickReveal(job) : null; // 行动卡由"亮相"动画负责，不走普通飞行
  if (prev) { playFlights(prev, reveal && reveal.skip); vanishToDiscard(prev, reveal && reveal.skip); }
  if (job) runEffects(job, prev, reveal);
  document.title = (S.snap && S.screen === 'game' && V().phase !== 'gameOver' && V().activePlayer === me() ? '轮到你了 - ' : '') + 'Monopoly Deal 双人对战';
  renderSheet();
  island.refresh();
}

function slotsHTML(p) {

  return `<span class="slots" role="img" aria-label="已凑齐 ${Math.min(full.length, need)} / ${need} 套">${s}</span>`;

function bankHTML(p) {
  const P = V().players[p];
  const shown = P.bank.slice(-5);
  const pile = shown.length
    ? `<div class="pile" style="--k:${shown.length - 1}">${shown.map((id, i) => cardHTML(id, { style: `--i:${i}` })).join('')}</div>`

function setHTML(set, p) {
  const t = S.target;
  const ids = set.cards.concat(set.house != null ? [set.house] : [], set.hotel != null ? [set.hotel] : []);
  let cls = 'set' + (set.full ? ' full' : '');
  if (t && t.by === 'set') cls += t.valid.has(set.id) && t.owner === p ? ' pick' : ' dim';
  if (t && t.by === 'card' && !(t.owner === p && ids.some((id) => t.valid.has(id)))) cls += ' dim';
  const cardCls = (id) => (t && t.by === 'card' && t.owner === p && t.valid.has(id) ? 'pick' : '');
  const k = COLOR(set.color);
  const boost = V().players[p].boost;
  const boosted = !!(boost && set.full && boost.colors.includes(set.color));
  if (boosted) cls += ' boost';
  const label = set.full ? `<b>${set.rent}M</b>${boosted ? `<span class="x4">×${boost.mult}</span>` : ''}` : `${set.cards.length}/${set.size}`;
  const aria = `${p === me() ? '我的' : '对方的'}${k.zh}，${set.cards.length}/${set.size}${set.full ? '，已成套' : ''}${boosted ? `，下次收租 ×${boost.mult}` : ''}`;
  return `<button type="button" class="${cls}" data-do="set" data-set="${set.id}" data-p="${p}" data-color="${set.color}" style="--n:${ids.length};--c:${k.hex};--ct:${inkOn(k.hex)}" aria-label="${esc(aria)}">

  const minis = mine ? '' : `<span class="minis" aria-hidden="true">${Array.from({ length: Math.min(P.handCount, 8) }, () => backHTML()).join('')}</span><span class="cnt num">${P.handCount} 张</span>`;
  const sc = S.info && S.info.score;
  const wins = sc && (sc[0] || sc[1]) ? `<span class="wins" aria-label="本房间赢了 ${sc[p]} 局">${sc[p]} 胜</span>` : '';
  const dot = mine ? '' : `<i class="dot${online ? '' : ' off'}" title="${online ? '在线' : '离线'}"></i>`;
  return `<div class="who">${avHTML(p, dot)}<span class="nm">${esc(mine ? P.name + '（我）' : P.name)}</span>${slotsHTML(p)}${wins}<span class="grow"></span>${minis}</div>`;
}

function handHTML() {
  const v = V();
  const hand = v.players[me()].hand || [];
  if (!hand.length) return '<div class="handbox"><div class="hand" data-key="hand"><span class="hand-empty">手里没有牌</span></div></div>';
  const o = O();
  const t = S.target;
  const lim = v.rules.handLimit;
  const over = hand.length > lim;
  return `<div class="handbox"><div class="hand" data-key="hand">${hand.map((id) => {
    const h = o.hand.find((x) => x.cardId === id);
    let cls = (S.sel === id ? 'sel ' : '') + (h && (h.play || h.bank) ? 'can' : '');
    if (t) cls = 'dim';
    return cardHTML(id, { btn: true, cls, data: ' data-do="hand"' });
  }).join('')}</div><span class="hcount${over ? ' over' : ''}">${hand.length} 张${over ? ` · 上限 ${lim}` : ''}</span></div>`;
}

// 牌堆：叠两三张牌背，看起来有厚度
function deckHTML(n) {
  if (!n) return '<span class="slot"></span>';
  return `<span class="deckstack">${Array.from({ length: Math.min(3, n) }, () => backHTML()).join('')}</span>`;
}

/* ── 回合台：轮到谁、还能出几张、第几回合 ── */
function stageSub() {
  const v = V();
  if (v.phase !== 'play') return null;
  const left = v.turn.playsLeft;
  if (v.turn.player === me()) return left ? `还能出 ${left} 张` : '出牌次数用完，结束回合吧';
  const o = opp();
  if (S.info && S.info.players[o] && !S.info.players[o].online) return '对方掉线了，等他回来';
  const sec = Math.floor((Date.now() - (S.turnAt || Date.now())) / 1000);
  if (sec >= 15) return `思考中 ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  return left ? `还能出 ${left} 张` : '准备结束回合';
}

function stageInfo() {
  const v = V();
  const i = me();
  const o = opp();
  const P = v.players;
  const round = `第 ${v.turn.number} 回合`;
  if (v.phase === 'gameOver') {
    const w = v.result.winner;
    const sc = S.info && S.info.score;
    return { key: 'over', mode: w === i ? 'win' : 'opp', who: w, title: w == null ? '平局' : w === i ? '你赢了' : `${P[o].name} 赢了`, round: `共 ${v.result.turn} 回合`, sub: sc ? `本房间战绩 ${sc[i]} : ${sc[o]}` : '点这里看对局记录' };
  }
  if (v.phase === 'respond') {
    const pd = v.pending;
    const mine = pd.awaiting === i;
    const what = `${actionName(pd)}${pd.amount ? ` ${pd.amount}M` : ''}`;
    return { key: `r${pd.id}.${pd.chain.length}`, mode: mine ? 'alert' : 'opp', who: pd.awaiting, title: mine ? '轮到你回应' : `等 ${P[o].name} 回应`, round, sub: pd.chain.length ? `${what} · 反对 ×${pd.chain.length}` : what };
  }
  if (v.phase === 'discard') {
    const mine = v.turn.player === i;
    return { key: `d${v.turn.number}`, mode: mine ? 'alert' : 'opp', who: v.turn.player, title: mine ? '手牌太多了' : `${P[o].name} 在弃牌`, round, sub: `要弃掉 ${v.discardNeed} 张` };
  }
  const mine = v.turn.player === i;
  return { key: `t${v.turn.number}`, mode: mine ? 'me' : 'opp', who: v.turn.player, title: mine ? '你的回合' : `${P[o].name} 的回合`, round, pips: Array.from({ length: v.rules.playsPerTurn }, (_, k) => k < v.turn.playsLeft), sub: stageSub() };
}

function stageHTML() {
  const s = stageInfo();
  S.stageNow = s;
  const pips = s.pips ? `<span class="pips" aria-hidden="true">${s.pips.map((on) => `<i class="${on ? 'on' : ''}"></i>`).join('')}</span>` : '';
  return `<button type="button" class="stage" data-do="log" data-mode="${s.mode}" aria-label="${esc(s.title)}。点开看对局记录">
    <span class="st-in"><span class="st-round">${esc(s.round)}</span><span class="st-title">${s.who != null ? avHTML(s.who) : ''}<span>${esc(s.title)}</span></span>${pips}${s.sub ? `<span class="st-sub" id="st-sub">${esc(s.sub)}</span>` : ''}</span>
  </button>`;
}

function gameHTML() {
  const v = V();
  const ids = new Set();
  v.players.forEach((P) => {
    (P.hand || []).forEach((x) => ids.add(x));
    P.bank.forEach((x) => ids.add(x));
